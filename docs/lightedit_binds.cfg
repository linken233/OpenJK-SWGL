// Light edit binds. Proposed file: the game never runs it.
// Use: ledit_writebinds, then exec lightedit_binds.cfg
// Keypad keys: the default JKA config leaves them free. Edit the keys to suit.
// Enter and leave the mode, save.
bind KP_PLUS "lightedit"
bind KP_INS "ledit_save"
// Undo and redo (Ctrl+Z and Ctrl+Y work without a bind).
bind KP_LEFTARROW "ledit_undo"
bind KP_RIGHTARROW "ledit_redo"
// Selection: delete, deselect, go to, numeric menu.
bind KP_DEL "ledit_delete"
bind KP_5 "ledit_deselect"
bind KP_END "ledit_goto"
bind KP_MINUS "ledit_menu"
// Grid, snap and x-ray.
bind KP_HOME "ledit_grid_next"
bind KP_UPARROW "ledit_snap_toggle"
bind KP_PGUP "ledit_xray_toggle"
// Labels: 0 none, 1 aimed and selected, 2 all near. Show: 0 none, 1 editable, 2 + emissive, 3 + dynamic.
bind KP_DOWNARROW "toggle ledit_label 0 1 2 0"
bind KP_PGDN "toggle ledit_show 0 1 2 3 0"
// Sun: it comes from the direction you look.
bind KP_SLASH "ledit_sun_here"
// Property cycling (the JKA defaults).
bind [ "invprev"
bind ] "invnext"
// Wheel: tool value (the JKA defaults).
bind MWHEELUP "weapnext"
bind MWHEELDOWN "weapprev"
