d. Swearing revenge and abandoning the order, Cade became a Bounty Hunter. After Krayt took in interest in the Skywalker, Krayt sought to turn him to the dark side. After many inner and physical struggles, Cade struck down Krayt, and set out to find a place where he and his loved ones could be left alone in peace."},{"b":7,"c":"GA_GA_GUARD","f":"GA","n":"Galactic Alliance Guard","v":"Galactic Alliance Guard","p":"generic","e":"","t":"generic legends era_legacy non_sensitive","w":"Galactic Alliance Guard, a GA special forces unit under Caedus; no extra faction.","bio":"The Galactic Alliance Guard, or GAG, was an organization created by the chief of state Cal Omas in 40 ABY. It served as a special operations and counter-terrorism specialized police force placed under the command of Colonel Jacen Solo, who used these resources to fit his agenda and overthrow Cal Omas. When Jacen Solo became the Sith Lord Darth Caedus, these troops stayed under his command until his demise by the hands of his own sister, Jaina Solo."},{"b":7,"c":"GA_HOHASS","f":"GA","n":"Hohass Ekwesh","v":"Hohass Ekwesh","p":"hohass ekwesh","e":"NR","t":"named legends era_new_republic male non_sensitive","w":"Thakwaash pilot in the New Republic\u0027s Wraith Squadron (bio, Wookieepedia); NR is a genuine membership.","bio":"Hohass Ekwesh was male Thakwaash from Thakwaa, pilot for the New Republic in the Wraith Squadron. Also named  Runt , he followed an intense pilot training to be a part of Wedge Antilles  squadron. His skills were soon to be seen as Warlord Zsinj declared war on the New Republic, and Runt took part in multiple battles against Zsinj forces, earning many scars such as severe burns, which could still be healed thanks to his time in a bacta tank allowing him to participate in the final battle against Zsinj s forces. After that, Runt noticeably took part in a rescue mission to save Mulus Cheems on Ryvester, and a sabotage mission to on the imperial Mulvar Sensor Station. Runt died during a mission against the Yuuzhan Vong in 29 ABY. The mission had for objective to steal a weapon from the Vong to prevent its use against the Galactic Alliance, but, pursued by Vong warriors, Runt fought them to save his friend, Estoric Sandskimmer. During the battle, Runt got bitten by an amphistaff, which poisoned him gravely. He then asked his friend, Piggy, to kill him, so he would not suffer from the poison."},{"b":7,"c":"GA_KAM","f":"GA","n":"Kam Solusar","v":"Kam Solusar","p":"kam solusar","e":"JO GE","t":"named legends era_imperial era_new_republic era_legacy male dark_jedi redeemed","w":"Kam Solusar was a Dark Jedi under Vader and the Emperor (GE), later redeemed and a Jedi Knight in the NJO (JO), per bio.","bio":"Kam Solusar was a Human male Dark Jedi during the Galactic Civil War and Jedi Knight under the New Republic Era. Solusar spent years hiding from Vader s Dark Jedi, until he got captured and tortured, after what, his spirit broke and he became a Dark Jedi himself, part of the Dark Side Elite. Kam met Luke Skywalker for the first time in 10 ABY. Luke managed with difficulty to turn Solusar to the Light Side, after what he became a general of the New Republic Defense Forces. Kam managed to sabotage the reborn Emperor s flagship, and after the clone of Palpatine was defeated, Kam Luke parted ways but were reunited in 11 ABY on Yavin IV, when Luke established the Jedi Praxeum. There, he married Tionne, another Jedi, after which he even presided Luke and Mara Jade s wedding. During the Yuuzhan Vong invasion, Kam and Tionne took the responsibility to guard Jedi students of the academy and protect them against the invaders during the war. After the conflict ended, Kam suggested to Luke that the Jedi Academy should be moved to Ossus, to which Luke agreed. During the Second Galactic Civil war, Kam was severely wounded by GAG snipers while he and his wife were protecting the Academy s students. After the war, Kam and Tionne helped move all of the Jedi from Ossus to Shedu Maad."},{"b":7,"c":"GA_LENSI","f":"GA","n":"Lensi","v":"Lensi","p":"lensi","e":"NR","t":"named legends era_new_republic era_legacy male non_sensitive","w":"Duros pilot in Rogue Squadron for the New Republic before serving the GA (Wookieepedia: Lensi, Rogue Squadron); NR is a genuine membership.","bio":"Lensi was a male Duros who fought during the Yuuzhan Vong invasion and the Second Galactic Civil War. He lost his homeworld, Duro, during is youth due to the Yuuzhan Vong s aggressive tactics and  soon found a place in the Wedge Antilles  Rogue Squadron. Lensi then served as a pilot for the New Republic, then the Galactic Alliance against the Vong. Lensi left the squadron when, thinking he and his squadron were going to save his world, Duros, he learnt that it was just a feint mission and that Duros would be left in the state it was. During the Second Galactic Civil War, when Corellia seceded from the Galactic Alliance and Wedge Antilles returned to his native world, Lensi rejoined Rogue Squadron and became the Leader of the squadron. Rogue Squadron was sent to Centerpoint Station, a Confederation controlled space station able to induce supernovas in stars, to capture it. Lensi was shot down above the station by Wedge Antilles, sealing his death."},{"b":7,"c":"GA_SHADO","f":"GA","n":"Shado Vao","v":"Shado Vao","p":"shado vao","e":"JO","t":"named legends era_legacy male non_sensitive","w":"Twi\u0027lek Jedi Master of the New Jedi Order (bio), so JO is a genuine membership.","bio":"Shado Vao was a Twi\u0027lek male Jedi Master who served the New Jedi Order during the Sith-Imperial War and Second Imperial Civil War. During his time with the order, Shado trained Kol Skywalker, the father of Cade Skywalker, and he himself developed a close friendship with Cade. Shado worked closely with Cade as Cade developed a plan to assassinate the Sith Lord Darth Krayt, assisting Cade is reaching the Temple of the Sith on Coruscant. Cade would go on to defeat Krayt, and the remnants of the One Sith retreated into unknown space."},{"b":7,"c":"GA_STREEN","f":"GA","n":"Streen","v":"Streen","p":"streen","e":"JO","t":"named legends era_new_republic male jedi","w":"Trained as a Jedi at the Jedi Praxeum and became a Jedi Knight (bio), so JO is a genuine membership.","bio":"Streen was a Human male Jedi Master native to Bespin. As a Force sensitive individual but not trained in the ways of the Force, Streen constantly felt other peoples  emotions around him, prompting him to live a solitary life. He was discovered in 11 ABY by Luke Skywalker, who offered Streen to teach him how to control his powers if he followed Luke to Yavin IV s Jedi Praxeum, which Streen accepted. He trained in the Jedi way on Yavin and soon became a Jedi Knight. When the spirit of Exar Kun came back and attacked the Jedi Academy, Streen was possessed by the evil of the ancient Sith and attempted to kill an unconscious Luke Skywalker while out of his mind, but was stopped in extremis by Kirana Ti. Despite the fact that he was not directly responsible of this, he lost the confidence of many students of the Academy. He and his fellow Jedi still managed to destroy Exar Kun s spirit once and for all later. After this, Streen participated in the defense of the Jedi Academy from an imperial assault, which was successfully repelled and got promoted to Jedi Knight. In 16 ABY, Streen was temporary made head of the Jedi Academy, shortly after being made a Jedi Master, while Luke Skywalker went away, alone, to meditate and rejuvenate his link to the Force. Streen was also present during the Yuuzhan Vong invasion, where he served during a few missions, noticeably the Battle of Yuuzhan tar."},{"b":7,"c":"GA_TAHIRI","f":"GA","n":"Tahiri Veila","v":"Tahiri Veila","p":"tahiri veila","e":"JO SO","t":"named legends era_new_republic era_legacy female jedi fallen_jedi redeemed","w":"[corrigé] Trained at the Jedi Praxeum (JO) and was a Yuuzhan Vong Joiner in the Dark Nest Crisis (YV), both substantial parts of her story per bio.","bio":"Tahiri Veila was a Force sensitive Human female born in 13 ABY on Tatooine. Tahiri was orphaned when she was three years old, during a Tusken raid. Sliven, the leader of the Tusken tribe, adopted her. Six years later, her Force sensitivity led Jedi Master Tionne to her, who brought her to Luke Skywalker s Jedi Praxeum on Yavin IV. There, she learnt to use the Force and the path of the Jedi. During the Yuuzhan Vong invasion, she fought alongside other Jedi to repel the invader s attack, only to be almost completely shaped by the Vong, although she was saved in extremis by Anakin Solo. During the Dark Nest Crisis, she became a Joiner of the Kilik s Colony. Tahiri was exiled to Dagobah for some time by Luke Skywalker. During the Second Galactic Civil War, she turned to the Dark Side and became Darth Caedus  apprentice. At the end of the war, she redeemed herself to the Light Side and let herself be captured by the Jedi and revealed important informations to them. She returned to the Jedi Order after a brief Bounty Hunter career that she picked for a new life."},{"b":7,"c":"GA_TIONNE","f":"GA","n":"Tionne Solusar","v":"Tionne Solusar","p":"tionne solusar","e":"JO","t":"named legends era_new_republic era_legacy female jedi","w":"Jedi Master and the Order\u0027s chief historian and archivist (bio); JO is a genuine membership.","bio":"Tionne Solusar was a Near-Human female Jedi Master who helped preserve the legacy of the Jedi Order during the tumultuous years following the Galactic Civil War. Born on the planet Rindao, Tionne was one of Luke Skywalker\u0027s earliest students at the Jedi Praxeum on Yavin IV. Gifted in music and history, she became the Order\u0027s chief historian and archivist, traveling the galaxy to recover lost artifacts and knowledge about the Jedi. Her dedication to education and preservation made her a vital figure in rebuilding the Jedi after the fall of the Empire. Tionne played a key role during the Yuuzhan Vong War, mentoring young Jedi and safeguarding the Order\u0027s teachings amid the chaos. She later married fellow Jedi Master Kam Solusar, and together they continued to train and guide future generations of Force users."},{"b":7,"c":"GA_TRA","f":"GA","n":"T\u0027ra Saa","v":"T\u0027ra Saa","p":"t\u0027ra saa","e":"JO","t":"named canon legends era_prequel jedi","w":"Wookieepedia: Jedi Master of the Republic era who trained Mace Windu (canon 2024 novel); Legends version is a Neti Jedi Master. Bio is empty, so the GA assignment looks inconsistent with her Jedi identity.","bio":""},{"b":7,"c":"GE_2NDSISTER","f":"GE","n":"Second Sister","v":"Second Sister","p":"trilla suduri","e":"JO","t":"named canon era_imperial female fallen_jedi","w":"[corrigé] Former Jedi padawan turned Inquisitor; GE is her only major affiliation, so no extra faction.","bio":"The Second Sister was a Human Female Inquisitor who served the Galactic Empire in the early years of its reign. Formally known as Trilla Suduri, Padawan to Cera Junda, Trilla survived the initial purge and was in hiding with her master. After being captured and tortured, Trilla fell to the dark side, becoming the Second Sister. Knowing of Eno Cordova\u0027s Holocron, Trilla used Jedi Padawan Cal Kestis in an effort to retrieve the holocron for her. While initially successful, Cal tracked down the holocron to Fortress Inquisitorius and the two engaged in a brutal duel. Failing to defeat Kestis, Vader appeared and executed her for her failure."},{"b":7,"c":"GE_3RDSISTER","f":"GE","n":"Third Sister","v":"Third Sister","p":"reva sevander","e":"","t":"named canon era_imperial female fallen_jedi","w":"Former Jedi who joined the Inquisitorius; GE is her main affiliation, so no extra faction.","bio":"Reva, or the Third Sister, was a Human female inquisitor who served the Galactic Empire during the first decade of the Empire\u0027s reign. Surviving Darth Vader\u0027s assault on the Jedi Temple, Reva Sevander eventually came into service of the Empire as an Inquisitor, being dubbed as the Third Sister. Reva\u0027s obsession with hunting down Kenobi often put her at odds with her fellow Inquisitors, until her efforts to capture Kenobi were inadvertently thwarted by the Grand Inquisitor. After stabbing the Grand Inquisitor out of anger, Reva continued her hunt for Kenobi, supposedly earning the favor of Darth Vader and briefly earning her the title of Grand Inquisitor. After failing to capture Kenobi on Jabiim, Reva was stabbed and left for dead by Darth Vader. After overhearing a transmission left by Bail Organa about Darth Vader\u0027s children, Reva returned to Tatooine to kill Luke Skywalker, but after cornering the boy, couldn\u0027t bring herself to commit to the act. Reva discarded her saber in the sands of Tatooine and went off to pursue her own destiny."},{"b":7,"c":"GE_5THBROTHER","f":"GE","n":"Fifth Brother","v":"Fifth Brother","p":"fifth brother","e":"","t":"named canon era_imperial male fallen_jedi","w":"Unnamed former Jedi Inquisitor under Vader; real name unknown, no extra faction.","bio":"The Fifth Brother was a male of an unknown species who worked as an Inquisitor under Darth Vader during the Galactic Civil War. Once a former Jedi, the Fifth Brother was spared from Order 66 and came into the service of Darth Vader sometime before the Galactic Civil War. Tasked with hunting Jedi, the Fifth Brother often went against the Jedi Kanan Jarrus, Ezra Brother, and Ahsoka Tano. On Malachor, during a brief duel, Maul struck down the Fifth Brother after he was disarmed by Ahsoka with a swift strike to the gut."},{"b":7,"c":"GE_7THSISTER","f":"GE","n":"Seventh Sister","v":"Seventh Sister","p":"seventh sister","e":"","t":"named canon era_imperial female fallen_jedi","w":"Unnamed Mirialan former Jedi Inquisitor under Vader; real name unknown, no extra faction.","bio":"The Seventh Sister was a Mirialan female Inquisitor during the Galactic Civil War. A former Jedi, the Seventh Sister was spared from Order 66 and came into the service of Darth Vader sometime before the Galactic Civil War. Tasked with hunting Jedi, the Seventh Sister often went against the Jedi Kanan Jarrus, Ezra Bridger, and Ahsoka Tano. On Malachor, she was killed after a brief duel with Ezra and Maul, the latter whom goaded Ezra into killing her. After Ezra hesitated, Maul finished off the Inquisitor, much to her terror. "},{"b":7,"c":"GE_8THBROTHER","f":"GE","n":"Eighth Brother","v":"Eighth Brother","p":"eighth brother","e":"","t":"named canon era_imperial male fallen_jedi","w":"Unnamed Terrelian former Jedi Inquisitor under Vader; real name unknown, no extra faction.","bio":"The Eighth Brother was a Terrelian Jango Jumper Male Inquisitor during the Galactic Civil War. A former Jedi, the Eighth Brother was spared from Order 66 and came into the service of Darth Vader sometime before the Galactic Civil War. Tasked with hunting down the former Sith Apprentice, Maul, whom he eventually tracked to the Sith Temple on Malachor. During a duel against Kanan Jarrus, Ahsoka Tano, and Maul, his lightsaber was damaged. He attempted to escape, using his weapon to fly away, but it was destroyed, causing him to fall to his death."},{"b":7,"c":"GE_9THSISTER","f":"GE","n":"Ninth Sister","v":"Ninth Sister","p":"masana tide","e":"","t":"named canon era_imperial female fallen_jedi","w":"Masana Tide, former Jedi Knight turned Inquisitor (bio); Jedi phase is pre-story, so no extra faction.","bio":"The Ninth Sister was a Dowutan female who served the Inquisitorious during the first ten years of the Empire\u0027s reign. Once the Jedi Knight Masana Tide, Tide survived Order 66 but was captured and tortured to the point of becoming a member of the Empire\u0027s Inquisitorious. Working with the Second Sister, the Ninth Sister hunted down Cal Kestis initially on the scrap world of Bracca. However, after Kestis escaped, the Ninth Sister ultimately tracked down Kestis on Kashyyyk. Confronting the Padawan at the top of the Origin Tree, the Ninth Sister was ultimately defeated by Kestis, who severed her hand and sent her plummenting to the surface of Kashyyyk. However, she survived the encounter and five years later confronted Kestis on Coruscant, as Kestis was working briefly with Saw Gerrera\u0027s Partisans. The two engaged in a final duel which saw to Kestis ultimately decapitating her, ending her life."},{"b":7,"c":"GE_ADALRIC","f":"GE","n":"Adalric Cessius Brandl","v":"Adalric Cessius Brandl","p":"adalric cessius brandl","e":"","t":"named legends era_imperial era_new_republic male force_user","w":"Rogue former Inquisitor who later led the Protectorate against the Remnant and NR (bio). Identity and media are from memory and not verified, so treat as uncertain. No extra faction.","bio":"Adalric Cessius Brandl was a Human male who served as a member of the Empire\u0027s Inquisitorious during the Empire\u0027s reign prior to the Galactic Civil War. Around five years prior to the Battle of Yavin, Adalric was considered the only known Inquisitor to go rogue, seemingly with no warning. However, Adalric was relentlessly hunted by the Empire until he ultimately faked his own death. It was rumored after Emperor Palpatine\u0027s death that Adalric formed his own group called the Protectorate, that recruited skilled former Imperials and other individuals to fight against both the Imperial Remnant and the New Republic."},{"b":7,"c":"GE_ARDEN","f":"GE","n":"Arden Lyn","v":"Arden Lyn","p":"arden lyn","e":"","t":"named legends era_imperial female dark_jedi","w":"Dark Jedi from the Legions of Lattow who served as an Emperor\u0027s Hand (bio); no extra faction. Media tag is uncertain.","bio":"Arden Lyn was a Human female Dark Jedi who served as an Emperor\u0027s Hand during the Galactic Civil War. Born thousands of years prior to the Battle of Yavin, Arden was a Padawan of the Jedi Order before she and a number of other Padawans joined the Legions of Lattow, falling to the dark side. However, during the conflict between the legion and the Jedi, Arden was placed in a force trance, keeping herself alive for thousands of years up until the years prior to the start of the Galactic Civil War. Recruited as an Emperor\u0027s Hand, Arden served Palpatine as she and a number of other bounty hunters trained in Teras Kasi attempted to hunt down the Rebels responsible for the destruction of the first Death Star, but ultimately failed, having had her alterior motives discovered by Mara Jade, forcing Lyn to go into hiding. Some years after the Battle of Endor, Arden was tracked down and murdered by the rebirthed Emperor Palpatine."},{"b":7,"c":"GE_ATAT_PILOT","f":"GE","n":"AT-AT Pilot","v":"AT-AT Pilot","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Imperial AT-AT walker pilot; no extra faction.","bio":"AT-AT Pilots were Imperial combat drivers specialized in operating the Empire\u0027s AT-AT walkers. Operating in groups of two, they operated the walker\u0027s driving and firing controls, and were overseen by a commander who also occupied the walkers cockpit."},{"b":7,"c":"GE_ATST_PILOT","f":"GE","n":"AT-ST Pilot","v":"AT-ST Pilot","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Imperial AT-ST walker pilot; no extra faction.","bio":"AT-ST Pilots were Imperial combat drivers specialized in operating the Empire\u0027s AT-ST walkers. Operating in groups of two, they operated the walker\u0027s driving and firing controls."},{"b":7,"c":"GE_CARNOR","f":"GE","n":"Carnor Jax","v":"Carnor Jax","p":"carnor jax","e":"IR SO","t":"named legends era_new_republic male sith","w":"Post-Endor Imperial warlord and Sith apprentice of Lumiya who declared himself Dark Lord (bio), so IR and SO fit. Legends character from memory.","bio":"Carnor Jax was a Human warlord of the fractured post-Endor Empire, rising from the Emperor’s Royal Guard to become an ambitious Sith apprentice under Lumiya. Trained as one of the Empire’s elite on Yinchorr, he excelled in martial combat and discipline, though his true loyalty was always to his own ascent. After the Emperor’s death, Jax maneuvered through the chaos of Imperial politics, forging alliances with figures like Sarcev Quest. His most consequential act was sabotaging Palpatine’s final clone bodies, ensuring the Emperor’s ultimate demise and clearing a path for Jax to claim power.  With the Imperial Ruling Council backing him, Jax declared himself the new Dark Lord of the Sith and de facto Emperor, ruling from Ord Cantrell and commanding a revitalized Crimson Empire. However, his purge of the Royal Guard left one survivor, Kir Kanos. Jax’s reign ended where his training began: in the Squall arena on Yinchorr. In a brutal duel, Kanos struck him down, ending Jax’s bid for the throne and leaving Lumiya without an apprentice for decades."},{"b":7,"c":"GE_CROSSHAIR","f":"GE","n":"Crosshair","v":"Crosshair","p":"crosshair","e":"","t":"named canon era_prequel era_imperial male non_sensitive","w":"Clone of the 501st whose chip was altered to serve the Empire (Bad Batch); GE is his main affiliation, so no extra faction.","bio":"After the execution of Order 66, Crosshair was the only clone partially affected by the Order, and under the orders of Admiral Tarkin, his bio-chip\u0027s frequency was increased to change his behavior completely. Crosshair led a small team of conscripted soldiers and was obsessed with tracking down his former squad and a female clone known as Omega. Crosshair\u0027s behavior was changed to that of a ruthless commander, willing to execute anyone, ally and enemy alike, to achieve the objective. After narroowly escaping death on Kamino, despite no longer being under the influence of his chip, Crosshair elected to remain with the Empire."},{"b":7,"c":"GE_DAALA","f":"GE","n":"Natasi Daala","v":"Natasi Daala","p":"natasi daala","e":"NR","t":"named legends era_new_republic era_imperial female non_sensitive","w":"Imperial officer who became Chief of State of the Galactic Federation of Free Alliances (bio), a New Republic-era government, so NR is proposed. Mapping is from bio and memory, not verified on Wookieepedia.","bio":"Natasi Daala was a Human female who served the Galactic Empire and later as Chief of State of the Galactic Federation of Free Alliances. As Wilhuff Tarkin\u0027s protege, Daala rised quickly through the ranks of the empire. Sent to the Maw Installation to oversee the design of superweapons for the Imperial Armada, Daala was unaware of the major events across the galaxy. Years after the Battle of Endor, Daala was informed of Tarkin\u0027s and Palpatine\u0027s demise. Years later, Daala became Chief of State of the Galactic Federation of Free Alliances, with a strong anti-Jedi sentiment, and was responsible for Luke\u0027s exile."},{"b":8,"c":"GE_DARKTROOPER0","f":"GE","n":"Phase 0 Dark Trooper","v":"Phase 0 Dark Trooper","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Legends Phase 0 unit (modified stormtroopers, Dark Forces II era). Imperial only, no extra faction. Not checked on Wookieepedia.","bio":"The Phase 0 Dark Trooper was a variant of Stormtrooper that served as the predecessor of the later Dark Troopers during the Galactic Civil War. Unlike the later Dark Troopers, the Phase 0 were stormtroopers modified with cybernetic enhancements to make them more formidable in battle. The Dark Troopers saw use during the heightened Galactic Civil War after the Death Star was destroyed, and continued to be used on the frontlines after the Dark Trooper project was destroyed by Kyle Katarn, including during X1\u0027s campaign."},{"b":8,"c":"GE_DARKTROOPER1","f":"GE","n":"Phase I Dark Trooper","v":"Phase I Dark Trooper","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Legends Dark Trooper Project unit, Phase I guard force. Imperial only. Not checked on Wookieepedia.","bio":"The Phase I Dark Trooper was the first and initial stage of the Dark Trooper Project introduced by Rom Mohc during the Galactic Civil War. Unlike the Phase II and beyond, the Phase I never saw combat, instead most units were assigned to guard important imperial installations."},{"b":8,"c":"GE_DARKTROOPER2","f":"GE","n":"Phase II Dark Trooper","v":"Phase II Dark Trooper","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Legends Dark Trooper Project unit, Phase II frontline force. Imperial only. Not checked on Wookieepedia.","bio":"The Phase II Dark Trooper was the second and main stage of the Dark Trooper Project introduced by Rom Mohc during the Galactic Civil War. Extremely effective against Rebel forces, a small squad of Dark Troopers had the capability of annihilating a Rebel base. After Rom Mohc\u0027s death, most Dark Troopers were pulled back from the front lines and were used solely for special operations missions."},{"b":8,"c":"GE_DARKTROOPER3","f":"GE","n":"Phase III Dark Trooper","v":"Phase III Dark Trooper","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Legends Dark Trooper Project unit, Phase III elite force. Imperial only. Not checked on Wookieepedia.","bio":"The Phase III Dark Trooper was the third and final stage of the Dark Trooper Project introduced by Rom Mohc during the Galactic Civil War. As the most advanced version of the Dark Trooper, the Phase III contained highly advanced weaponry and armor, capable of going toe to toe against groups of soldiers with little effort, and even posing a significant amount of resistance to Lightsaber strikes. After Rom Mohc\u0027s death, most Dark Troopers were back from the front lines and were used for special operations missions or guarding locations of a very high importance, such as Palpatine\u0027s palace on Coruscant."},{"b":8,"c":"GE_DEATHTROOPER","f":"GE","n":"Death Trooper","v":"Death Trooper","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Death Trooper appears in Rogue One as Imperial special forces. Imperial only, no extra faction.","bio":"Death Troopers were an elite variant of the Galactic Empire\u0027s Stormtroopers, and served as bodyguards to important Imperial officers and members of the Tarkin Initiative. They wore black suits of armor and their helmets scrambled verbal communications. They were trained in unarmed combat, heavy weapons, and sniping. Specializing in commando missions, Death Troopers were experts at covering their tracks, leaving little evidence of their missions."},{"b":8,"c":"GE_ELITE","f":"GE","n":"Elite Squad Trooper","v":"Elite Squad Trooper","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Elite Squad of Crosshair in The Bad Batch. Imperial only, no extra faction.","bio":"The Elite Squad was a group of recruited soldiers that came into being shortly after the Empire\u0027s formation. Conscripted from various locations, the squad was placed under the command of former Clone Force 99 member Crosshair. The squad assisted Crosshair in locating the other members of the Bad Batch as well as Omega. On Tipoca City shortly before its destruction, Crosshair offered his former squadmates a chance to rejoin the Empire. However, his squad prepared to execute the Bad Batch. Crosshair instead shot and executed each squad member, and the Elite Squad was no more."},{"b":8,"c":"GE_EMPEROR_PALPATINE","f":"GE","n":"Emperor Palpatine","v":"Emperor Palpatine|Emperor Palpatine|Emperor Palpatine (Senate)|Darth Sidious (Sith Apprentice)|Emperor Palpatine (Clone)","p":"sheev palpatine","e":"REP ROT SE","t":"named canon era_prequel era_imperial sith male","w":"[corrigé] Palpatine is Darth Sidious, Sith Master (SO) and Rule of Two master (ROT), and Supreme Chancellor of the Republic (REP) in Episodes I-III. Variants Senate and Sith Apprentice confirm the Republic and Sith roles.","bio":"Emperor Palpatine was a Human male Dark Lord of the Sith during the Galactic Civil War. After the fall of the Jedi Order, Palpatine declared himself Emperor, ruling the galaxy for over twenty years. Disappointed with Vader\u0027s limits, Palpatine sought to replace Vader with someone more powerful, Vader\u0027s own son, Luke Skywalker. After Luke resisted, Palpatine attempted to kill Luke. Vader, unable to watch his son die, picked up the Emperor and threw him over a railing into the Death Star\u0027s reactor, where he perished."},{"b":8,"c":"GE_ENGINEER","f":"GE","n":"Imperial Engineer","v":"Imperial Engineer","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Imperial Engineer infantry support unit from Battlefront games. Imperial only. Canon status from memory, not verified.","bio":"Where Stormtroopers are trained in marksmanship and engagement with the enemy, the Imperial Engineer prepares the ground that they walk on for warfare. The Imperial Engineer, also known as Sapper, is an infantry support unit that performs military engineering tasks that gives the Imperial Army an advantage on the battlefront. Various military engineering tasks include such as; planting mines, carving trenches, vehicle repair or extraction, and construction/demolition. The Imperial Engineers were trained as well in military formation and basic marksmanship, making them an auxiliary unit, though should not be relied as an actual infantry."},{"b":8,"c":"GE_GALEN_IMP","f":"GE","n":"Galen Marek","v":"Galen Marek|Galen Marek (Heavy Training Gear)|Galen Marek (Light Training Gear)|Galen Marek (Early Training Gear)","p":"galen marek","e":"SO REB","t":"named legends era_imperial dark_jedi redeemed male","w":"Starkiller, Vader\u0027s secret apprentice (SO) in The Force Unleashed. Freed rebels and his crest became the Rebel Alliance flag (REB). Legends.","bio":"Starkiller was a Human male Dark Jedi prior to the Galactic Civil War. Taken on by Vader as his secret apprentice, Starkiller was sent out to hunt down any Jedi that survived Order 66. After being betrayed by Vader at the request of Emperor Palpatine, Starkiller was sent out by Vader to create an alliance of rebels. However, this was a ruse. After being betrayed by Vader again, Starkiller freed the rebels, sacrificing himself so they could escape. The surviving senators officially established the Rebel Alliance, using Starkiller\u0027s family crest as their flag."},{"b":8,"c":"GE_GRAND_INQUISITOR","f":"GE","n":"Grand Inquisitor","v":"Grand Inquisitor|Grand Inquisitor (Jedi Temple Guard)","p":"grand inquisitor","e":"JO","t":"named canon era_imperial fallen_jedi force_user male","w":"[corrigé] Pau\u0027an former Jedi Temple Guard turned Inquisitor in Rebels. His real name is not given in canon and was not searched. Empire only, no significant extra membership.","bio":"The Grand Inquisitor was a Pau\u0027an male Inquisitor during the Galactic Civil War. A former Jedi Temple Guard, the Inquisitor came into the service of Darth Vader sometime before the Galactic Civil War. Tasked with hunting Jedi, the Inquisitor hounded the Lothal Rebels, often battling Jedi Padawan Kanan Jarrus. Aboard Tarkin\u0027s Star Destroyer, the Inquisitor and Kanan engaged in a duel, with Kanan as the victor. Stating that there were some things more frightening than death, the Inquisitor fell into the destroyer\u0027s reactor, killing himself."},{"b":8,"c":"GE_GREEJATUS","f":"GE","n":"Janus Greejatus","v":"Janus Greejatus","p":"janus greejatus","e":"","t":"named canon era_imperial male non_sensitive","w":"Palpatine\u0027s advisor and Imperial Ruling Council member, per Star Wars Databank (https://starwars.com/databank/janus-greejatus). Fandom notes he led the Imperial Department of Redesign (GE). No extra faction.","bio":"Janus Greejatus was a Human male who served as one of Emperor Palpatine\u0027s advisors during his rule over the Empire. Working as Palpatine\u0027s advisor after his election to Supreme Chancellor, Greejatus was regarded as one of Palpatine\u0027s closest advisors. During the climax of the Galactic Civil War, Greejatus along with Sim Aloo and other advisors joined Palpatine aboard the second Death Star. During the finale of the Battle of Endor, the Deathstar was destroyed, killing Greejatus and countless other imperial personnel on board."},{"b":8,"c":"GE_GROUND_CREW","f":"GE","n":"Imperial Ground Crewman","v":"Imperial Ground Crewman","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Imperial deck technician and ground crew unit. Imperial only, no extra faction.","bio":"The Ground Crewman is an Imperial deck technician personnel that is tasked in maintenance of Imperial vehicles after combat or voyage/patrol. Be it land, air or spacecraft. Once a pilot brings their Ties or AT-STs for maintenance, the Deck Technician brings in the Imperial craft by giving signs with his two illuminated traffic wands, guiding the Pilot the analog way into the maintenance hangar. Once in the hangar, the Ground Crewman gets to work on the craft. Checking for loose bolts or parts, jammed or faulty engines, weapons systems for overheat, cockpit for controls, etc. Once maintenance deemed the craft to be worthy of smooth operation and of no peril to the pilot, the craft would be rearmed and escorted by the crew outside of the hangar. Given the all clear to the pilot."},{"b":8,"c":"GE_HEMLOCK","f":"GE","n":"Doctor Royce Hemlock","v":"Doctor Royce Hemlock","p":"royce hemlock","e":"","t":"named canon era_imperial male non_sensitive","w":"Royce Hemlock, Chief Scientist of the Advanced Science Division in The Bad Batch (Databank: https://starwars.com/databank/dr-royce-hemlock). Brief Republic Science Corps service, dismissed, so no REP.","bio":"Royce Hemlock was a Male Human doctor and scientist that served with both the Galactic Republic and the Galactic Empire. Hemlock originally served as a member of the Republic\u0027s Science Corps, but was dismissed due to unorthodox experiments. After the Rise of the Empire, Hemlock was commissioned as the Chief Scientist of the Advanced Science Division, working primarily on perfecting the cloning of Force-Users. During this time, Hemlock also secretly conditioned several clones to serve as his personal assassins. In order to bolster his efforts, Hemlock sought to enlist of the help of Kaminoan Cloner Nala Se, but Se refused. Initially frustrated, Hemlock learned that a female Clone named Omega could be used as leverage over her and immediately began efforts to find Clone Force 99. Hemlock soon came into possession of the Clone Trooper Crosshair and proceeded to torture him for information, but to no avail. After surviving an attack by Clone Force 99 and Saw Gerrera\u0027s Prtisans, Hemlock obtained information from an ally of Clone Force 99 as to their location and managed to capture Omega. However, a prison break foiled Hemlock\u0027s plans and after a short exchange of fire with Crosshair and Omega, Hemlock was killed."},{"b":8,"c":"GE_ID_9","f":"GE","n":"ID-9 Seeker Droid","v":"ID-9 Seeker Droid","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"ID-9 Seeker Droid, Imperial spy droid. Imperial only. Media not verified.","bio":"ID-9 Seeker Droids were spy droids used by a number of the Empire\u0027s special forces, including the Seventh Sister. ID-9 droids were capable of mimicking the sounds of other droids, and were equipped with shock prods and a small concealed blaster for moderate defense. Its later model, the ID-10 would later be used by Iden Versio, the commander of Inferno Squad."},{"b":8,"c":"GE_IDEN","f":"GE","n":"Iden Versio","v":"Iden Versio","p":"iden versio","e":"REB","t":"named canon era_imperial female non_sensitive","w":"Iden Versio led Inferno Squad (GE) and defected to the Rebel Alliance after Endor (REB), per bio. Battlefront II origin from memory.","bio":"Iden Versio was a Human female who served the Galactic Empire and led Inferno Squad during the Galactic Civil War. As the commander of Inferno Squad, Iden led fellow agents Del Meeko and Gideon Hask on special ops missions unsuited for the common Imperial Military. At the conclusion of the Battle of Endor, Iden witnessed the destruction of the second Death Star, and worked with her father, Admiral Garrick Versio, to enact the beginning phases of Operation: Cinder. After learning of her homeworld\u0027s impending destruction, Iden lost faith in the Empire and defected to the Rebel Alliance."},{"b":8,"c":"GE_IMP_COR_GUARD","f":"GE","n":"Coruscant Guard","v":"Coruscant Guard","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Imperial Coruscant Guard stormtroopers. Imperial only, no extra faction.","bio":"The Imperial Coruscant Guard were an elite division of the Galactic Empire\u0027s stormtroopers tasked with policing the Imperial capital world of Coruscant. Originally made up of former Clone Troopers of the Galactic Republic Coruscant Guard, the Imperial Coruscant Guard gradually phased out the use of Clones for conscripted soldiers, similar to the remainder of the Imperial military."},{"b":8,"c":"GE_IMPGUNNER","f":"GE","n":"Imperial Gunner","v":"Imperial Gunner","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Imperial turbolaser gunner crew. Imperial only.","bio":"Imperial Gunners were individuals who handled all turbolaser defenses for imperial installations, space stations, and star destroyers, protecting them from rebel attacks during the Galactic Civil War."},{"b":8,"c":"GE_IMPOFFICER","f":"GE","n":"Imperial Officer","v":"Imperial Officer|Imperial Officer (Black)|Imperial Officer (ISB)|Imperial Officer (Grey)|Imperial Officer (Olive, Poncho)|Imperial Officer (Black, Poncho)|Imperial Officer (ISB, Poncho)|Imperial Officer (Olive, Coat)|Imperial Officer (Black, Coat)|Imperial Officer (ISB, Coat)","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Imperial officer, multiple variants. Imperial only.","bio":"Imperial Officers were individuals who held a position of authority and responsibility in the military forces of the Galactic Empire. When the Empire succeeded the Old Republic after the end of the Clone Wars, those officers were formed to lead the stormtroopers, the troopers of the new Galactic Empire."},{"b":8,"c":"GE_IMPOFFICER_F","f":"GE","n":"Imperial Officer (Female, Olive)","v":"Imperial Officer (Female, Olive)|Imperial Officer (Female, Black)|Imperial Officer (Female, ISB)","p":"generic","e":"","t":"generic canon era_imperial female non_sensitive","w":"Generic female Imperial officer, multiple variants. Imperial only.","bio":"Imperial Officers were individuals who held a position of authority and responsibility in the military forces of the Galactic Empire. When the Empire succeeded the Old Republic after the end of the Clone Wars, those officers were formed to lead the stormtroopers, the troopers of the new Galactic Empire."},{"b":8,"c":"GE_INTERROGATOR","f":"GE","n":"Interrogator Droid","v":"Interrogator Droid","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"IT-0 Interrogator Droid, Imperial torture droid. Imperial only.","bio":"The IT-0 Interrgator Droid was a type of droid used by the Galactic Empire to interrogate and torture their prisoners of interest. The droid lacked any type of sentience, and would continue to torture its victim non-stop until commanded by its handler to stop."},{"b":8,"c":"GE_ISB_AGENT","f":"GE","n":"ISB Agent","v":"ISB Agent|ISB Agent","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Imperial Security Bureau agent unit. Imperial only.","bio":"ISB Agents were elite agents of the Imperial Security Buraeu, highly trained in weapon use, leadership, and interrogation tactics. Prior to the Death Star\u0027s destruction, the ISB Agents were rarely seen on the battlefield, with them being dispatched on special assignments. After the Death Star was destroyed, the ISB agents were dispatched more frequently as they worked tirelessly to weed out growing Rebellions from Imperial-occupied worlds."},{"b":8,"c":"GE_KALLUS","f":"GE","n":"Alexsandr Kallus","v":"Alexsandr Kallus","p":"alexsandr kallus","e":"REB","t":"named canon era_imperial male non_sensitive","w":"Alexsandr Kallus, ISB agent who became Rebel spy Fulcrum and officially joined the Rebellion (REB), per bio. Canon from Rebels.","bio":"Alexsandr Kallus was a Human male Imperial Agent turned Rebel Spy the Galactic Civil War. As a member of the Imperial Security Bureau, Kallus was tasked with hunting the Lothal Rebels, a task which he often failed in. After purusing the Ghost crew for over a year, Kallus and Garazeb Orrelios were trapped on the frozen moon Bahryn, where they developed an unlikely kinship. Questioning the Empire, Kallus began to work undercover as Fulcrum, an embedded Rebel spy. After being exposed by Thrawn, Kallus officially joined the Rebellion."},{"b":8,"c":"GE_KANOS","f":"GE","n":"Kir Kanos","v":"Kir Kanos","p":"kir kanos","e":"","t":"named legends era_imperial male non_sensitive","w":"Royal Guard member who fought Lemmet Tauk to the death for Palpatine. Canon status from memory, not verified. Imperial only.","bio":"Kir Kanos was a Male Human who served as a member of the Royal Guard of the Galactic Empire during and after the Galactic Civil War. Kanos was originally a Stormtrooper, but due to his exemplary performance, he was selected for Royal Guard candidact. On the planet Yinchorr, Kanos trained with a small group of other elite recruits, among them Carnor Jax who would come to be his rival at the academy. Years of training saw the number of candidates reduced down to only four and Kanos was paired with one of the other recruits named Lemmet Tauk. After a period of training together, Kanos and Tauk appeared before Emperor Palpatine who then instructed the two men to fight to the death. Kanos was victorious and earned his place as an official Royal Guard alongisde Jax who had similarly defeated his partner. After the Battle of Endor and the death of the Emperor, Kanos left the Empire and wandered on his own for several years. When Palpatine returned sometime later, Kanos returned and became one of his Royal Guards once again. When Palpatine was ultimately defeated, however, Kanos learned that his old rival Carnor Jax was partially to blame for his demise. Outraged, Kanos swore that Jax would die for his betrayl. Soon after learning of Jax\u0027s betrayl, an army of Stormtroopers arrived on Yinchorr and began to eliminate all of the remaining Royal Guards, save for Kanos who managed to escape due to the sacrifice of fellow Guard Kile Hannad. Kanos brought the fight to the so-called Crimson Empire and relentlessly sought opportunities to slay Jax. Finally, Kanos managed to lure Jax to the Royal Guard Academy on Yinchorr and in a final and fierce duel, slew the traitor. However, Kanos was still branded a fugitive by the Empire and, to avoid capture, adopted the identity of Kenix Kil, a bounty hunter. After a series of exploits, Kanos and Mirith Sinn, a New Republic agent, worked together to overthrow a pretender to the Imperial Throne, but the alliance was short-lived and Kanos returned to his life as Kenix Kil. Soon after, however, the bounty hunter Boba Fett tracked Kanos down and convinced him to go to the homeworld of a faction known as the Restored Empire. Realizing the Restored Empire was a sham, Kanos played along with their requests before finally leaving for Coruscant where he was immediately surrounded by Republic Security. Kanos requested an audience with Mirith Sinn who had become Chief of Security for the Imperial Palace, however, the guards arrested him and placed him in prison. Sinn visited Kanos and Sinn brought Kanos to Leia Organa Solo and Luke Skywalker, informing them that the leader of the Reformed Empire planned to attack the New Republic. Kanos would shortly after defend members of the Imperial Remnant and the New Republic during treaty negotiations, slaying the leader of the Restored Empire, though at a great cost. Kanos was badly wounded and Mirith Sinn decided to take him to the D\u0027Astan system. After recovering for a short time, Kanos left to forge a new life out in the galaxy, apart from the Empire."},{"b":8,"c":"GE_KARBIN","f":"GE","n":"Commander Karbin","v":"Commander Karbin","p":"karbin","e":"REP","t":"named legends era_prequel era_imperial male non_sensitive","w":"Mon Calamari Republic Commander of the Clone Wars (REP) who later became a cyborg experiment under Cylo (GE). Canon status from memory, not verified.","bio":"Karbin was a Mon Calamari-Cyborg male who served as a Commander during the Clone Wars and later experimented on by Doctor Cylo at some point during the Galactic Civil War. Sustaining heavy injuries during the war, Karbin was salvaged and spent nearly two decades on life support, during which he was rebuilt with cybernetic enhancements inspired by General Grievous. Karbin, along with the remaining experiments, were killed by Darth Vader."},{"b":8,"c":"GE_KASHYYYK_TROOPER","f":"GE","n":"Kashyyyk Trooper","v":"Kashyyyk Trooper","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Stormtroopers from the second invasion of Kashyyyk. Imperial only.","bio":"Kashyyyk Troopers were stormtroopers who were deployed during the second invasion of Kashyyyk early on in the Empire\u0027s reign. Led by Darth Vader, the Troopers were tasked with wiping out the local Wookiee resistance while Vader carried out his own mission, to hunt down the Jedi survivor Kento Marek."},{"b":8,"c":"GE_KHEEV","f":"GE","n":"Zarien Kheev","v":"Zarien Kheev","p":"zarien kheev","e":"","t":"named legends era_imperial male non_sensitive","w":"Zabrak slave trader working for the Empire on Mustafar. Imperial only. Canon status from memory, not verified.","bio":"Zarien Kheev was a Zabrak male who worked with the Empire as a slave trader during the construction of the first Death Star. A sadistic man, Kheev was tasked with overseeing a production facility on Mustafar which mined mirkanite, which was to be used for the Death Star\u0027s turbolasers. However, his facility and other plans were foiled by his former slave, Rianna Saren, who had escaped his clutches at some point prior. On Danuta, after the Death Star plans were stolen by Kyle Katarn, Kheev came face to face with Saren one last time, and after a brutal fight, Kheev was killed."},{"b":8,"c":"GE_KREEL","f":"GE","n":"Sergeant Kreel","v":"Sergeant Kreel|Sergeant Kreel","p":"kreel","e":"","t":"named legends era_imperial male non_sensitive","w":"Sergeant Kreel of Task Force 99, Imperial stormtrooper and Vader loyalist. Imperial only. Canon status from memory, not verified.","bio":"Kreel was a Human male who served as the leader of Task Force 99 during the Galactic Civil War. Initially an undercover Stormtrooper working in the employ of Grakkus the Hutt as his gamemaster. Finding himself at odds with Luke Skywalker multiple times, would obsessively hunt Skywalker with his own lightsaber which was said that its original owner died with the weapon in their hand. Kreel was fiercely loyal to the Empire and Vader, vowing that if his squad had outlived their usefulness, he would kill them all himself before taking his own life."},{"b":8,"c":"GE_KRENNIC","f":"GE","n":"Director Orson Krennic","v":"Director Orson Krennic","p":"orson krennic","e":"","t":"named canon era_imperial male non_sensitive","w":"Director of the Advanced Weapons Research division in Rogue One. Imperial only, no extra faction.","bio":"Orson Krennic was a Human male Imperial Commander and Director of the Advanced Weapons Research division of the Imperial Military during the Galactic Civil War. Obsessed with excelling his rival, Wilhuff Tarkin, Krennic personally oversaw the security of the Deathstar. When Galen Erso revealed the Deathstar\u0027s existence, Krennic was reprimanded and lost control of the Deathstar to Tarkin. On Scarif, Krennic was killed shortly after the Deathstar plans were transmitted, by the very weapon he helped create."},{"b":8,"c":"GE_LYSTE","f":"GE","n":"Yogar Lyste","v":"Yogar Lyste","p":"yogar lyste","e":"","t":"named canon era_imperial male non_sensitive","w":"Imperial officer on Lothal in Rebels. Imperial only, no extra faction.","bio":"Yogar Lyste was a Human male Imperial Officer during the Galactic Civil War. Stationed on the planet Lothal, Lyste\u0027s operations were often the targets of the Lothal Rebels led by Kanan Jarrus, which led to three Hammerhead Corvettes being stolen. When Grand Admiral Thrawn began his investigation into the Rebels, Lyste was promoted to Lieutenant and made acting captain of an Imperial Light Cruiser. During Thrawn\u0027s investigation into the Rebel Spy, Fulcrum, Lyste was framed by his former colleague, Agent Kallus."},{"b":8,"c":"GE_MOHC","f":"GE","n":"General Rohm Mohc","v":"General Rohm Mohc|General Rohm Mohc","p":"rom mohc","e":"","t":"named legends era_imperial male non_sensitive","w":"Creator of the Dark Trooper Project in Dark Forces II. Imperial only. Legends.","bio":"Rom Mohc was a Human male General in the Galactic Empire during the Galactic Civil War. The creator of the Dark Trooper Project, Mohc received authorization from Palpatine to work on the project after the Battle of Yavin. The Dark Troopers were initially successful, gaining the approval of even Darth Vader himself. Hired by the Rebel Alliance, Kyle Katarn managed to discover the Dark Trooper project and was able to shut it down, killing Mohc in the process. All remaining Dark Troopers in the field were relegated to guarding important Imperial locations, such as the Imperial Palace on Coruscant."},{"b":8,"c":"GE_MUDTROOPER","f":"GE","n":"Mudtrooper","v":"Mudtrooper","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Mudtrooper armor from Solo. Imperial only.","bio":"Mud Troopers were stormtroopers specialized to operate in muddy environments such as Mimban. During his brief tour with the Empire, Han Solo wore such armor until escaping with Tobias Beckett and his crew."},{"b":8,"c":"GE_NANDA","f":"GE","n":"Nanda","v":"Nanda","p":"nanda","e":"","t":"named canon era_imperial female non_sensitive","w":"Imperial ensign and Vader\u0027s aide in Brian Wood\u0027s Star Wars comics (Wookieepedia mirror: https://starwars.archivum.wiki/article/Nanda_(female)). Imperial only.","bio":"Nanda was a Human female ensign who worked as Darth Vader\u0027s aide after the Battle of Yavin to help locate and punish every person Vader believed to be respnsible for the infiltration of the Rebel Agent Kell Bircher. After completing her mission, Nanda was promoted to Lieutenant Commander, but was severely traumatized by her brief time under Vader, claiming to see him everywhere she went."},{"b":8,"c":"GE_NARKINA_OFFICER","f":"GE","n":"Narkina V Officer","v":"Narkina V Officer","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Narkina 5 prison guards in Andor (Wookieepedia mirror: https://starwars.fandom.com/wiki/Narkina_5_(episode)). Imperial only.","bio":"The Officers of the Narkina V prison complex were responsible for guarding the thousands of prisoners interred there. The guards were critically understaffed and were outnumbered by the prisoners manyfold regularly. They often wore a black shirt and pair of pants with a black officer\u0027s cap and a pair of black boots. Additionally, their uniforms had silver stripes running down the outside of the arm to distinguish them from Officers of the Stormtrooper Corps. Most notably the boots they wore were insulated, providing them immunity from the electrified floors of the facility should the matter arise to activate them."},{"b":8,"c":"GE_NOVATROOPER","f":"GE","n":"Nova Trooper","v":"Nova Trooper","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Stormtrooper honor guards. Imperial only.","bio":"Novatroopers were stormtrooper honor guards assigned to historically significant locations to the Galactic Empire, such as Palpatine\u0027s homeworld of Naboo. Though considered better trained and equipped than normal stormtroopers, Novatroopers rarely participated in the Galactic Civil War, and thus were hardly seen."},{"b":8,"c":"GE_OFFICER","f":"GE","n":"Imperial Officer","v":"Imperial Officer","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Imperial officer. Imperial only.","bio":"Straight from the rigorous Imperial Acadamies scattered throughout the Empire, the Imperial Officers are high-class soldiers who are trained to lead the Emperor\u0027s legions, and are instilled with total loyalty to Palpatine and his ideology. While the Imperial Academies taught youth military traditions and zealous devotion to the Empire, these Academies were breeding grounds for hyper ruthless and ambitious men and women. Survival of the fittest. Whether assassinating their own Imperials to gain their higher rank, or facing the Rebellion 1,000 to 1, not even certain death will stop the Imperial Officer from gaining the Emperor\u0027s favor."},{"b":8,"c":"GE_PELLAEON","f":"GE","n":"Gilad Pellaeon","v":"Gilad Pellaeon","p":"gilad pellaeon","e":"","t":"named canon era_imperial male non_sensitive","w":"Admiral serving under Thrawn during the Empire. Imperial only, no extra faction. Canon status from memory.","bio":"Gilad Pellaeon was a Human male who served the Galactic Empire as an admiral in the years prior to the Galactic Civil War. Pellaeon assisted Thrawn with his occupation of Lothal, but was unable to come to Thrawn\u0027s aid as the arrival of Ezra Bridger\u0027s group of Purrgil destroyed a number of Star Destroyers in orbit, which later came for Thrawn and dragged his Star Destroyer into hyperspace."},{"b":8,"c":"GE_PURGE","f":"GE","n":"Purge Trooper","v":"Purge Trooper|Purge Trooper (Batons)|Purge Trooper Commander|Purge Trooper","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Purge Troopers hunting Jedi. Imperial only.","bio":"Purge Troopers were elite Stormtroopers that were most prominent in the early years of the Galactic Empire\u0027s reign trained for the sole purpose of hunting down Jedi. Purge Troopers specialized in a wide variety of weapons, including Electrostaffs, blasters, and shock mines, making them a threat against any Jedi that dared to cross their path."},{"b":8,"c":"GE_REBUS","f":"GE","n":"Moff Rebus","v":"Moff Rebus","p":"rebus","e":"","t":"named legends era_imperial male non_sensitive","w":"Moff who designed Dark Trooper weaponry in Dark Forces II. Imperial only. Legends.","bio":"Rebus was a Human male Moff who worked with Rom Mohc as the initial designer of the Dark Trooper\u0027s weaponry for the Galactic Civil War. During his mission to destroy the Dark Trooper project, Kyle Katarn was tasked with locating Rebus within a sewer network on the planet Anoat. Rebus was ultimately captured and during interrogation gave up information about the Dark Trooper project which helped Katarn succeed in his mission."},{"b":8,"c":"GE_ROYAL","f":"GE","n":"Royal Guard","v":"Royal Guard","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Imperial Royal Guard of Palpatine. Imperial only.","bio":"Imperial Royal Guards were the personal bodyguards and assassins of Emperor Palpatine during the Clone Wars and Galactic Civil War. Armed with force pikes and clad in crimson robes, the Royal Guard were silent, imposing, and deadly. Those who proved themselves to be the most promising of the Imperial military were selected for duty as a Royal Guard and had to fulfill stringent requirements based on size, strength, intelligence, and loyalty to the Emperor."},{"b":8,"c":"GE_SANDTROOPER","f":"GE","n":"Sand Trooper","v":"Sand Trooper","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Desert-adapted stormtroopers. Imperial only.","bio":"Sand Troopers were specialized Stormtroopers that were equipped to operate on desert worlds. Their armor contained a cooling system and sand filter to protect the trooper against the harsh elements."},{"b":8,"c":"GE_SAXON","f":"GE","n":"Gar Saxon","v":"Gar Saxon","p":"gar saxon","e":"MANDO","t":"named canon era_imperial male non_sensitive","w":"Mandalorian Supercommando and Governor of Mandalore for the Empire, formerly with Maul\u0027s Shadow Collective (Rebels). Mandalorian membership (MANDO) is significant before he joined the Empire.","bio":"Gar Saxon was a Human male Mandalorian and Supercommando who served the Galactic Empire in the years prior to the Galactic Civil War. Once a member of Maul\u0027s Shadow Collective, Saxon and multiple other Mandalorians found work in the Empire\u0027s ranks, with Saxon assuming Governorship of Mandalore and leader of the Imperial Supercommandos. Finding himself at odds with Phoenix Squadron, Saxon ultimately attempted to bring all Mandalorians under the control of the Empire or eradicate them if necessary. Hunting down Clan Wren, Sabine Wren ultimately confronted the Mandalorian with the legendary Darksaber. After a vicious fight where Saxon utilized the Darksaber against Sabine, and Sabine using Ezra Bridger\u0027s saber, Sabine ultimately emerged as the victor but chose to spare his life. Angered at the defiance of the Mandalorian custom, Saxon attempted to kill Sabine while her back was turned, but was shot and killed by Ursa Wren, Sabine\u0027s mother."},{"b":8,"c":"GE_SCOUT","f":"GE","n":"Scout Trooper","v":"Scout Trooper","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Scout Trooper speeder and marksman unit. Imperial only.","bio":"Imperial Scout Troopers were specialized ground forces for the Galactic Empire during the Galactic Civil War. Often riding speeder bikes, Scout Troopers were often sent to planets to guard important installations for the Empire, and were trained as excellent marksmen."},{"b":8,"c":"GE_SCREED","f":"GE","n":"Terrinald Screed","v":"Terrinald Screed","p":"terrinald screed","e":"REP","t":"named legends era_prequel era_imperial male non_sensitive","w":"Admiral who served as Republic Captain at Anaxes (REP) and Imperial Naval Intelligence later. Wookieepedia mirror: https://starwars.fandom.com/wiki/Terrinald_Screed. Canon status not verified.","bio":"Screed was a Human male admiral who served the Galactic Empire in the years following the Clone Wars. Screed was known as a ruthless tactician, defeating the Iska Pirates, a feat remarkable enough to become a required strategy learned in academies across the galaxy. At some point prior to the Liberation of Kashyyyk, Screed was killed by another band of pirates."},{"b":8,"c":"GE_SEA","f":"GE","n":"Seatrooper","v":"Seatrooper","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Seatrooper amphibious stormtroopers. Imperial only.","bio":"The Aquatic Assault Stormtroopers, also known as Seatroopers, were a specilialized branch of Stormtroopers specifically trained for warfare on planets fully enveloped by the ocean. As the Emperor\u0027s reach expanded, the Imperial War Machine found itself in warfare with amphibious inhabitants. With the Scubatroopers of the bygone Galactic Republic were slowly phased out, the Imperial Academies sought to replenish the Empire\u0027s maritime forces with new human recruits. Most notably, these infantry were deployed on Mon Calamari, Tibrin and Manaan."},{"b":8,"c":"GE_SENTINEL","f":"GE","n":"Imperial Senate Sentinel","v":"Imperial Senate Sentinel","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Imperial Senate Guard sentinels fought by Galen Marek in The Force Unleashed. Imperial only.","bio":"The Imperial Senate Guard was a highly trained recruit from the Imperial Senate Guard charged with protecting the Jedi Temple on Coruscant. Though specially trained to combat Jedi, many were encountered by Darth Vader\u0027s Apprentice, Galen Marek, who dispatched most or all of them with relative ease."},{"b":8,"c":"GE_SHADOW","f":"GE","n":"Shadow Trooper","v":"Shadow Trooper","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Shadow Stormtroopers with cloaking armor. Imperial only.","bio":"Shadow Stormtroopers, or Blackhole Troopers, were specialized Stormtroopers that wore armor which contained a cloaking device, allowing them to ambush their enemies without them realizing until it was too late."},{"b":8,"c":"GE_SHADOW_GUARD","f":"GE","n":"Shadow Guard","v":"Shadow Guard","p":"generic","e":"","t":"generic legends era_imperial dark_jedi","w":"Dark Jedi security guards hired by the Empire before the Civil War. Imperial only. Legends.","bio":"Shadow Guards were Dark Jedi assigned by the Empire to provide security or hunt down Jedi in the years prior to the Galactic Civil War. While trained to combat most enemies, their training in the dark side of the Force was limited."},{"b":8,"c":"GE_SHOCK","f":"GE","n":"Shock Trooper","v":"Shock Trooper","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Shock Troopers with heavy armor. Imperial only.","bio":"Imperial Shocktroopers were specialized ground forces for the Galactic Empire during the Galactic Civil War. Equipped with heavy armor and heavy blasters, Shocktroopers were often the first line of offense for invading imperial forces, gunning down resistance."},{"b":8,"c":"GE_SHORETROOPER","f":"GE","n":"Shoretrooper","v":"Shoretrooper","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Coastal stormtroopers on Scarif in Rogue One. Imperial only.","bio":"Shoretroopers, otherwise known as Coastal Defender Stormtroopers or Coastal Guards, were stormtroopers that were specialized and equipped for combat in tropical environments. Most notably, Shoretroopers were stationed on Scarif and engaged the Rebel forces while Jyn Erso, Cassian Andor, and K-2SO attempted to retrieve the Deathstar plans."},{"b":8,"c":"GE_SHUTTLE_PILOT","f":"GE","n":"Imperial Shuttle Pilot","v":"Imperial Shuttle Pilot","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Imperial shuttle pilots. Imperial only.","bio":"Just like the Imperial Gunners, Shuttle Pilots were initially trained to be Tie Pilots. But due to failing to pass the Tie Pilot program, or at the very least being incapable as combat pilots, they were reassigned to be pilots of non-combat role craft, such as the Lambda Class Shuttle or the Sentinel Class Shuttle."},{"b":9,"c":"GE_SIM","f":"GE","n":"Sim Aloo","v":"Sim Aloo","p":"sim aloo","e":"","t":"named canon era_imperial male non_sensitive","w":"Adviser to Palpatine killed at Endor per bio. No extra faction.","bio":"Sim Aloo was a Human male who served as an adviser to Emperor Palpatine during the reign of the Galactic Empire. During the Battle of Endor, Sim, along with the Emperor\u0027s other advisers were killed when the 2nd Death Star was destroyed."},{"b":9,"c":"GE_SNOWTROOPER","f":"GE","n":"Snowtrooper","v":"Snowtrooper|Snowtrooper","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Imperial snowtrooper unit. No extra faction.","bio":"Imperial Snowtrooper were specialized ground forces for the Galactic Empire during the Galactic Civil War. Equipped with special armor, Snowtroopers were trained and equipped to fight in freezing cold environments."},{"b":9,"c":"GE_STORMCOMMANDO","f":"GE","n":"Stormcommando","v":"Stormcommando","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic elite Imperial stormtrooper unit. No extra faction.","bio":"Storm Commandos were elite stormtroopers equipped and trained to carry out special operations missions for the Galactic Empire. As a result of their special assignments, Storm Commandos were givin the latest weaponry and were built ships used exclusively by them, such as Escort Carriers."},{"b":9,"c":"GE_STORMTROOPER","f":"GE","n":"Stormtrooper","v":"Stormtrooper|Stormtrooper","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Imperial stormtrooper. No extra faction.","bio":"Imperial Stormtroopers were the elite ground forces for the Galactic Empire prior to and during the Galactic Civil War. Equipped with E-11 Blaster Rifles, Stormtroopers represented the order the Empire promised, and would carry out the orders of their leaders and keep order whereever they were assigned."},{"b":9,"c":"GE_SUPERCOMMANDO","f":"GE","n":"Supercommando","v":"Supercommando","p":"generic","e":"MANDO","t":"generic canon era_imperial non_sensitive","w":"Mandalorians who swore allegiance to the Empire under Gar Saxon (bio), so Mandalorian membership applies.","bio":"Imperial Supercommandos were Mandalorians who swore allegiance to the Empire during the Empire\u0027s reign. Led by Gar Saxon, the Supercommandos were tasked with wiping out other Mandalorian clans that refused to bow down to the Empire or accomplish high-priority missions considered unsuited for the typical Imperial military."},{"b":9,"c":"GE_SWAMP","f":"GE","n":"Swamptrooper","v":"Swamptrooper","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Imperial swamptrooper. No extra faction.","bio":"Imperial Swamptroopers were specialized ground forces for the Galactic Empire during the Galactic Civil War. Equipped with camouflaged armor to hide and protect them in dangerous swamp environments, Swamptroopers would use their environment to their advantage, surrounding and gunning down the enemy before they knew what hit them."},{"b":9,"c":"GE_TARKIN","f":"GE","n":"Grand Moff Tarkin","v":"Grand Moff Tarkin","p":"wilhuff tarkin","e":"REP","t":"named canon era_prequel era_imperial male non_sensitive","w":"Served the Republic during the Clone Wars (bio: assisting Even Piell) before becoming a Grand Moff. Based on bio and own knowledge; Wookieepedia fetch returned HTTP 402.","bio":"Grand Moff Wilhuff Tarkin was a Human male Grand Moff during the Galactic Civil War. A cold, ruthless man, Tarkin once served the Republic, assisting Jedi Master Even Piell\u0027s mission to find the Nexus Route hyperlane during the Clone Wars. After the fall of the Republic, Tarkin was made the Empire\u0027s first Grand Moff, regional Governor of the Outer Rim, and later commander of the Death Star. During the Battle of Yavin, Tarkin was killed along with countless other personnel when the Death Star was destroyed."},{"b":9,"c":"GE_TECHNICIAN","f":"GE","n":"Imperial Technician","v":"Imperial Technician","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Imperial technician/engineer. No extra faction.","bio":"Imperial Technicians were individuals who handled all mechanical and engineering needs of the Galactic Empire."},{"b":9,"c":"GE_THRAWN","f":"GE","n":"Grand Admiral Thrawn","v":"Grand Admiral Thrawn","p":"mitth\u0027raw\u0027nuruodo","e":"","t":"named canon era_imperial male non_sensitive","w":"Chiss Grand Admiral, canon via Star Wars Rebels and Thrawn novels. Already GE; no other faction.","bio":"Grand Admiral Thrawn was a Chiss male Grand Admiral of the Empire during the Galactic Civil War. A genius tactician, Thrawn was widely considered a very valuable asset to the Empire for his ruthless, yet patient approaches. Often coming at odds with the fledgling Rebel Alliance, Thrawn was successful at tracking down the Rebel\u0027s base on Atollon, and helped fortify the Empire\u0027s occupation on Lothal. Thrawn was eventually defeated by Ezra Bridger, who summoned a group of Purrgils to drag them into hyperspace. Years later, Ahsoka Tano resolved to track down Thrawn, leading her to Corvus."},{"b":9,"c":"GE_TIE_PILOT","f":"GE","n":"TIE Pilot","v":"TIE Pilot|TIE Pilot|TIE Pilot|TIE Pilot|TIE Pilot","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic TIE pilot. No extra faction.","bio":"Imperial Pilots were individuals who piloted all imperial starfighters for the Galactic Empire during the Galactic Civil War. Piloting the famous TIE Fighters, Bombers, or Interceptors, Pilots patrolled the skies of Imperial worlds, keeping them safe from the Rebels."},{"b":9,"c":"GE_TRITON","f":"GE","n":"Triton Squad Trooper","v":"Triton Squad Trooper","p":"generic","e":"REP","t":"generic canon era_imperial non_sensitive","w":"501st Legion clone platoon; clones were Grand Army of the Republic troopers in the Clone Wars, so REP applies.","bio":"Triton Squad was a Clone platoon of the 501st Legion that served directly under Darth Vader during the second invasion of Kashyyyk during the early years of the Empire\u0027s reign. Like the Kashyyyk troopers, Triton Squad was tasked with wiping out the Wookiee resistance while Vader hunted down the rogue Jedi, Kento Marek."},{"b":9,"c":"GE_VADER","f":"GE","n":"Darth Vader","v":"Darth Vader|Darth Vader|Darth Vader|Darth Vader (Dark Spirit)","p":"anakin skywalker","e":"REP JO ROT","t":"named canon era_prequel era_imperial fallen_jedi sith redeemed male","w":"[corrigé] Anakin was a Jedi Knight and Republic general in the prequels (JO, REP) and Palpatine\u0027s Sith apprentice as Vader (SO).","bio":"Darth Vader was a Human male Sith Lord during the Galactic Civil War. Once the Jedi Knight, Anakin Skywalker, Vader was maimed and burned alive on the planet Mustafar. Kept alive by his life-support suit, Vader served the Emperor for twenty years. After learning he had a son, Luke Skywalker, Vader sought to turn him to the dark side so they could overthrow the Emperor. Instead, Luke attempted to redeem Vader back to the light. Unable to watch Palpatine kill his son, Vader, now Anakin, sacrificed himself for his son, killing the Emperor and himself."},{"b":9,"c":"GE_VEERS","f":"GE","n":"General Maximillian Veers","v":"General Maximillian Veers","p":"maximilian veers","e":"","t":"named canon era_imperial male non_sensitive","w":"Imperial general at Hoth per bio. No extra faction.","bio":"General Maximilian Veers was a Human male general of the Empire during the Galactic Civil War. Veers was famous for his leadership at the assault on Hoth, during which he led a squadron of AT-AT walkers across the planet\u0027s icy surface and personally destroyed the shield generator powering the Rebel base\u0027s deflector shield. His actions allowed the Imperials to invade the base. The general survived the battle and went on to be known as a glorified veteran of Hoth."},{"b":9,"c":"GE_YSANNE","f":"GE","n":"Ysanne Isard","v":"Ysanne Isard","p":"ysanne isard","e":"IR","t":"named legends era_new_republic female non_sensitive","w":"Director of Imperial Intelligence and post-Endor ruler; led the Imperial remnant against the New Republic (IR). Legends. Based on bio and own knowledge; Wookieepedia fetch returned HTTP 402.","bio":"Ysanne Isard was a Human female who served as the Director of Imperial Intelligence during the Galactic Civil War and briefly as the Empire\u0027s ruler after the Battle of Endor. Holding Coruscant after Endor made Isard a target for the New Republic, and in an effort to destroy the Republic, developed the Krytos Virus, which successfully killed much of Coruscant\u0027s alien population. During Thrawn\u0027s campaign against the New Republic, Isard remained in hiding until the rebirthed Emperor Palpatine contacted her. Vowing to steal back her flagship, the Lusankya, however after much political manuevering with her and her clone, Isard was shot dead by agent Iella Wessiri."},{"b":9,"c":"GE_YULAREN_IMP","f":"GE","n":"Colonel Yularen","v":"Colonel Yularen","p":"wullf yularen","e":"REP","t":"named canon era_prequel era_imperial male non_sensitive","w":"Republic admiral in the Clone Wars before joining the ISB as a colonel (REP).","bio":"After the rise of the Galactic Empire, Yularen stepped down from his position as Admiral and took up a position as a Colonel within the ISB. During the Battle of Yavin, Yularen was aboard the Death Star as the station was destroyed, resulting in the end of his life and countless other Imperial personnel."},{"b":9,"c":"GE_ZAHRA","f":"GE","n":"Ellian Zahra","v":"Ellian Zahra|Ellian Zahra","p":"ellian zahra","e":"","t":"named legends era_imperial female non_sensitive","w":"Imperial Navy commander hunting the Rebel leadership after Hoth. Legends. Identification and media unverified (Wookieepedia fetch returned HTTP 402). No extra faction.","bio":"Ellian Zahra was a Human female imperial officer who served the Galactic Empire as a commander in the Imperial Navy during the Galactic Civil War. Following the Battle of Hoth, Zahra was tasked with hunting down the Rebel leadership, which put her at odds against Leia Organa, causing her to form an obsession with killing her."},{"b":9,"c":"HC_BARTENDER","f":"HC","n":"Baldarek","v":"Baldarek","p":"baldarek","e":"","t":"named legends era_new_republic male non_sensitive","w":"Bartender in Reelo Baruk\u0027s bar (Jedi Knight II). Already HC via Reelo; no other faction. Identity from bio; not verified on Wookieepedia.","bio":"Balderek was a Chiss male Bartender who worked in Reelo Baruk\u0027s Bar during the Empire Reborn conflict. After making his way to Nar Shaddaa, Kyle stopped in the cantina and questioned Baldarek on Reelo\u0027s whereabouts. Baldarek instead set up a trap for Katarn, where many of Reelo\u0027s thugs attacked the Jedi, but all were defeated or killed. After pacifying the bar, Katarn threatened Baldarek and demanded Reelo\u0027s whereabouts once again, which Baldarek revealed. Baldarek later found work in a Hutt Crimelord\u0027s stronghold on Nar Kreeta, where he met but didn\u0027t interact with Jaden Korr."},{"b":9,"c":"HC_BIB_FORTUNA","f":"HC","n":"Bib Fortuna","v":"Bib Fortuna","p":"bib fortuna","e":"","t":"named canon era_imperial male non_sensitive","w":"Jabba\u0027s majordomo on Tatooine per bio. HC covers this; no extra faction.","bio":"Bib Fortuna was a Twi\u0027lek male who served as Jabba the Hutt\u0027s majordomo and chief of staff throughout the Hutt\u0027s reign over Tatooine. As Jabba\u0027s majordomo, Bib was responsible for handling all day-to-day operations that took place inside his master\u0027s palace, including greeting guests of Jabba as they entered. During the Galactic Civil War, Bib greeted C-3P0 and R2-D2 when they came with a message to Jabba from Luke Skywalker, and later on Luke himself. Bib survived the incident at the Sarlacc Pit and took over Jabba\u0027s operations on Tatooine. Years later, Bib was killed by Boba Fett, who took Jabba\u0027s former throne for himself."},{"b":9,"c":"HC_EV9D9","f":"HC","n":"EV-9D9","v":"EV-9D9","p":"ev-9d9","e":"","t":"named canon era_imperial non_sensitive","w":"Protocol droid in Jabba\u0027s service, later at Chalmun\u0027s Cantina (Book of Boba Fett). No extra faction.","bio":"EV-9D9 was a MerenData EV-series Protocol Droid who came into the service of Jabba the Hutt at some point during the Galactic Civil War. Initially a peaceful droid, EV-9D9 was acquired by Jabba who put her in charge of all droids that came into his service. A defect in her programming caused her to enjoy inflicting harm on other droids, which Jabba took full advantage of. After Jabba\u0027s death, EV-9D9 came into employment at Chalmun\u0027s Cantina, where she informed the Mandalorian Din Djarin that the Bounty Hunter\u0027s Guild no longer operated on Tatooine."},{"b":9,"c":"HC_EVAZAN","f":"HC","n":"Dr. Cornelius Evazan","v":"Dr. Cornelius Evazan","p":"cornelius evazan","e":"CRIM","t":"named canon era_imperial male non_sensitive","w":"[corrigé] Bio: personal doctor of the Crimson Dawn leader, so CD applies.","bio":"Cornelius Evazan was a Male Human from the planet Alsakan. Early in his career, Evazan was a cosmetic surgeon before some sort of madness drove him to begin experimenting on his patients, often with disasterous results. For these acts of cruelty, Evazan received a bounty on his head and would later be disfigured by a bounty hunter attempting to kill him. It was during this incident that he met the Aqualish Ponda Baba, who saved him from the bounty hunter. The two formed a partnership worked for the Crimson Dawn, Evazan as the personal doctor of the Crimson Dawn\u0027s leader and Baba as his assistant. The two would eventually flee from the Crimson Dawn, but would later be captured and imprisoned. After some time, the two managed to escape and eventually wound up on Tatooine where Baba lost his arm to Ben Kenobi\u0027s Lightsaber. Fearing for his life, Evazan broke into a biofarm on Thannt and stole a creature that allowed him to disguise himself as an alien named Lopset Yas. However, Yas was soon imprisoned by the Empire. In a strange turn of events, Yas and Doctor Aphra met and the two escaped Imperial custody together. After defeating a bounty hunter and an assassin droid named 0-0-0 together, Evazan betrayed Aphra and used a bomb implanted in the assassin droid to force her to stay near it at all times, lest she be killed. In order to ensure her death, Evazan disguised himself as Princess Leia Organa and contracted bounty hunters to kill her. However, the plan went wrong when Aphra managed to convince the bounty hunters to arrest Evazan and Baba, resulting in their incarceration. After escaping from Imperial prison once again, Evazan massacred a group of intelligence informants on Obroa-Skai and used their body parts as well as the limbs of other victims to create hideous creatures of his own."},{"b":9,"c":"HC_GAMORREAN","f":"HC","n":"Gamorrean","v":"Gamorrean","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Gamorrean guard species. No extra faction.","bio":"Gamorreans were a porcine humanoid species hailing from the planet Gamorr. Known for their great strength and brutality, Gamorreans were highly favored bodyguards of many Hutt crimelords. Despite their great strength, Gamorreans were remarkably unintelligent, but were loyal, yet stubborn."},{"b":9,"c":"HC_GARINDAN","f":"HC","n":"Garindan","v":"Garindan","p":"garindan","e":"","t":"named canon era_imperial male non_sensitive","w":"Kubaz informant who sold the Empire information on Luke and the droids (A New Hope). Single-scene role, so no extra faction.","bio":"Garindan was a male Kubaz informat who provided information to the Galactic Empire on the whereabouts of Luke Skywalker, Ben Kenobi, C-3P0, and R2-D2."},{"b":9,"c":"HC_GEEZUM","f":"HC","n":"Geezum","v":"Geezum","p":"geezum","e":"","t":"named canon era_imperial male non_sensitive","w":"Member of Jabba\u0027s court per bio. No extra faction.","bio":"Geezum was a Snivvian male who was a member of the Jabba the Hutt\u0027s court during the Galactic Civil War."},{"b":9,"c":"HC_GRAN","f":"HC","n":"Gran","v":"Gran|Gran (Alternate)","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Gran species seen in Jabba\u0027s court. No extra faction.","bio":"Gran were a humanoid species hailing from the planet Malastare, and were easily identifiable by their three eyes, goat-like snouts, and antennae."},{"b":9,"c":"HC_JABBA","f":"HC","n":"Jabba the Hutt","v":"Jabba the Hutt","p":"jabba desilijic tiure","e":"","t":"named canon era_prequel era_imperial male non_sensitive","w":"Hutt crime lord of Tatooine per bio. HC covers this; no extra faction.","bio":"Jabba The Hutt, also known as Jabba Desilijic Tiure, was a Hutt gangster and crimelord throughout galactic history. Jabba was an influential figure on Tatooine, controlling the bulk of illegal goods, piracy, and slavery. During the Clone Wars, Jabba\u0027s power and influence over the Outer Rim\u0027s hyperlanes was sought after by both the Republic and Confederacy of Independent Systems. During the Galactic Civil War, Jabba was delivered Han Solo, a smuggler he had employed. During a daring rescue mission, Jabba was strangled to death by Princess Leia."},{"b":9,"c":"HC_MALAKILI","f":"HC","n":"Malakili","v":"Malakili","p":"malakili","e":"","t":"named canon era_imperial male non_sensitive","w":"Jabba\u0027s rancor keeper, later Freetown worker under Cobb Va
