fend strategic places et thermal detonators to get rid of groups of enemies."},{"b":13,"c":"REB_MISTER_BONES","f":"REB","n":"Mister Bones","v":"Mister Bones","p":"mister bones","e":"NR","t":"named canon era_new_republic non_sensitive","w":"Temmin Wexley\u0027s bodyguard droid who worked on New Republic missions, so NR. Identity from bio and knowledge.","bio":"Mister Bones was a heavily modified B1-series Battle Droid who participated in the Battle of Jakku during the finale of the Galactic Civil War. Constructed by Temmin Wexley prior to the Battle of Endor, Bones served as Temmin\u0027s personal bodyguard, assisting him in a number of missions for the New Republic. During the Battle of Jakku, Bones worked with Temmin\u0027s mother and briefly joined forces with Grand Admiral Sloane and Brentin to stop Councilor Gallius Rax from destroying Jakku and both factions. After reuniting with Temmin and saving him from a squad of Stormtroopers, Bones was accidentally destroyed by friendly fire by a pair of A-Wings."},{"b":13,"c":"REB_MONMOTHMA","f":"REB","n":"Mon Mothma","v":"Mon Mothma|Mon Mothma (Early Rebellion)","p":"mon mothma","e":"REP NR","t":"named canon era_prequel era_imperial female non_sensitive","w":"[corrigé] First Chancellor of the New Republic, so NR. Bio says Human but she is Mon Calamari, body corrected to alien.","bio":"Mon Mothma was a Human female who served as leader of the Rebellion during the Galactic Civil War. After the fall of the Republic, Mon Mothma, along with Bail Organa and Ahsoka Tano, helped to organize an alliance of Rebels against the Galactic Empire. By the Battle of Endor, Mon Mothma was the sole leader of the Rebels, helping to organize the assault on the second Death Star. After the Galactic Civil War ended, Mon Mothma was elected the first Chancellor of the New Republic."},{"b":13,"c":"REB_MORGAN","f":"REB","n":"Morgan Katarn","v":"Morgan Katarn","p":"morgan katarn","e":"","t":"named legends era_imperial force_user male","w":"Force-sensitive but never joined the Jedi Order; no extra faction. Legends.","bio":"Morgan Katarn was a Human male who served the Rebellion during the Galactic Civil War. A Force Sensitive, Morgan never joined the Jedi Order, often using his Force powers to entertain his younger sister until he accidently caused the death of a bully. Sometime after fathering Kyle Katarn and sending him to the Imperial Academy, Morgan learned of the existence of the Valley of the Jedi. Shortly after being entrusted with Qu Rahn\u0027s lightsaber, Morgan was captured by Jerec, who killed him after learning of the Valley. "},{"b":13,"c":"REB_NIEN","f":"REB","n":"Nien Nunb","v":"Nien Nunb","p":"nien nunb","e":"RES","t":"named canon era_imperial era_sequel male non_sensitive","w":"Lieutenant Commander in the Resistance in the sequel era, so RES.","bio":"Nien Nunb was a Sullustan male pilot during the Galactic Civil War and First Order-Resistance Conflict. Originally a smuggler under the employ of Rebellion, by the Battle of Endor, Nien officially joined the Rebellion, serving as Lando Calrissian\u0027s co-pilot aboard the Millenium Falcon during the Battle of Endor. Thirty years later, Nien was a Lieutenant Commander in the Resistance, and was one of seven X-Wing pilots that survived the Assault on Starkiller Base."},{"b":13,"c":"REB_PORKINS","f":"REB","n":"Jek Porkins","v":"Jek Porkins","p":"jek porkins","e":"","t":"named canon era_imperial male non_sensitive","w":"Red Six at Yavin; no extra faction.","bio":"Jek Porkins was a Human male pilot for the Rebellion during the Galactic Civil War. During the Battle of Yavin, Porkins flew an X-wing as part of Red Squadron, under the callsign Red Six. During the battle, Porkins\u0027s craft began to malfunction, causing him to be killed by turbolaser fire."},{"b":13,"c":"REB_PRISONER","f":"REB","n":"Prisoner","v":"Prisoner","p":"generic","e":"","t":"generic canon non_sensitive","w":"Generic prisoner label; no faction.","bio":"Prisoners, often held by Imperial or Hutt forces, were often the primary targets of interest during rescue missions by the New Republic or New Jedi Order."},{"b":13,"c":"REB_PROXY","f":"REB","n":"PROXY","v":"PROXY","p":"proxy","e":"","t":"named legends era_imperial non_sensitive","w":"Holodroid companion of Galen Marek (Force Unleashed, Legends); no extra faction.","bio":"PROXY was a prototype holodroid who served as Galen Marek\u0027s companion in the years prior to the Galactic Civil War. Designed by Darth Vader, PROXY\u0027s primary programming forced him to attempt to routinely kill Marek on multiple occasions, utilizing simulated modules depicting Jedi and Sith from the past. Despite this, PROXY remained loyal and maintained a friendship with Galen. After Galen\u0027s death and his programming to kill Galen was erased, PROXY remained in service to the new Rebel Alliance."},{"b":13,"c":"REB_R2D2","f":"REB","n":"R2-D2","v":"R2-D2|R2-D2 (Sail Barge)","p":"r2-d2","e":"REP RES","t":"named canon era_prequel era_imperial era_sequel non_sensitive","w":"Served the Republic as Anakin\u0027s astromech in the Clone Wars (REP) and was with the Resistance in the sequel era (RES).","bio":"R2-D2 was an Astromech Droid during the Naboo Crisis, Clone Wars, Galactic Civil War, and First Order-Resistance Conflict. Originally serving aboard Queen Padm  Amidala\u0027s vessel, R2\u0027s heroism allowed her vessel to break the Trade Federation\u0027s blockade over Naboo. Since then, R2 took part in a number of battles, serving as Anakin Skywalker\u0027s astromech from during the Clone Wars. After the fall of the Republic, R2 assisted the Rebellion, coming into the ownership of Luke Skywalker, and helped him blow up the Death Star."},{"b":13,"c":"REB_R3PO","f":"REB","n":"R-3PO","v":"R-3PO","p":"r-3po","e":"","t":"named legends era_imperial non_sensitive","w":"Protocol droid detecting spies at Echo Base; no extra faction.","bio":"R-3PO was a Protocol Droid who served in the Rebel Alliance during the Galactic Civil War, and was present in Echo Base while the Alliance was based on Hoth. R-3PO\u0027s primary duty was to detect imperial spies posing in the Alliance\u0027s ranks."},{"b":13,"c":"REB_RAHN","f":"REB","n":"Qu Rahn","v":"Qu Rahn","p":"qu rahn","e":"JO","t":"named legends era_prequel era_imperial jedi male","w":"Jedi Master of the late Republic, so JO. Dark Forces character (Legends).","bio":"Qu Rahn was a Human male Jedi Master who served the Jedi Order during the final years of the Galactic Republic. Surviving Order 66, Rahn evaded the empire\u0027s inquisitors, eventually learning about the Valley of the Jedi from Yoda. Seeking out Morgan Katarn, Rahn informed Morgan about the Valley and instructed him to pass on this knowledge to his son, Kyle, leaving his lightsaber in his possession. Rahn would go on to be captured and later executed by Jerec, and his spirit went on to guide Kyle on his journey to the Valley."},{"b":13,"c":"REB_RAYMUS","f":"REB","n":"Raymus Antilles","v":"Raymus Antilles","p":"raymus antilles","e":"","t":"named canon era_prequel era_imperial male non_sensitive","w":"Captain of the Tantive IV in the Rebellion; no extra faction.","bio":"Raymus Antilles was a Male Human from Alderaan. Antilles was trained in diplomacy from an early age and proved himself to be a capable and astute pilot, earning him a commission as the captain of Bail Organa\u0027s transport ship, the Tantive III. During the Jedi Purge, Antilles helped the Jedi Masters Yoda and Obi-Wan Kenobi escape the Empire and after Darth Vader\u0027s defeat on Mustafar at the hands of Obi-Wan, he was given charge of R2-D2 and C-3PO. Antilles would later captain the Tantive IV and help conduct missions for the Rebel Alliance, including a daring evacuation of the planet Raada and more mild ventures like delivering food to Wobani and medical supplies to Chal Hudda. Antilles was present at the Battle of Scarif and managed to successfully get the Death Star plans to Princess Leia and escape to Tatooine. However, the Tantive IV was followed by Darth Vader\u0027s Star Destroyer and the ship was soon boarded by Imperial forces. Antilles and his men bravely sacrificed themselves to give R2-D2 and C-3PO enough time to escape the ship with the Death Star plans with Antilles himself dying at Vader\u0027s hand."},{"b":13,"c":"REB_REBEL","f":"REB","n":"Rebel Trooper","v":"Rebel Trooper|Rebel Trooper|Rebel Trooper|Rebel Trooper","p":"generic","e":"","t":"generic canon non_sensitive","w":"Generic Rebel Trooper; no extra faction.","bio":"Rebel Troopers were the front-line soldiers of the Rebel Alliance in their war against the Galactic Empire. Initially formed from loosely connected resistance cells, the leadership of Mon Mothma saw them become an impressively armed and trained galaxy-spanning infantry."},{"b":13,"c":"REB_REBEL_INFILTRATOR","f":"REB","n":"Rebel Infiltrator","v":"Rebel Infiltrator","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Generic Rebel infiltrator unit; no extra faction.","bio":"Rebel Infiltrators were specialized soldiers in the Rebel Alliance trained by Beri Tulon and used by Brenn Tantor to hijack Imperial Vehicles, including AT-ATs, and use them effectively against the Empire."},{"b":13,"c":"REB_REBEL_MARINE","f":"REB","n":"Rebel Spec Force Marine","v":"Rebel Spec Force Marine","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Generic Rebel SpecForce marine; no extra faction.","bio":"Alliance Special Forces, or the Rebel SpecForce, were a division of elite soldiers that reported directly to Alliance High Command during the Galactic Civil War. Rebel Soldiers who distinguished themselves by bravery, skill, and dedication to the cause were selected to become members. Such notable units included Renegade Squadron and Han Solo\u0027s Strike Team on Endor."},{"b":13,"c":"REB_REBEL_PILOT","f":"REB","n":"Rebel Pilot","v":"Rebel Pilot|Blue Squadron Pilot|Rebel Pilot|Rebel Pilot|Rebel Pilot","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Rebel pilot; no extra faction.","bio":"Rebel pilots were backbone of the Rebellion\u0027s air and space force. While they were the most skilled fighters when it came to piloting any type of starfighter or bomber, they were also equipped to face situations in which their ship couldn\u0027t protect them. A light blaster pistol to fight against potential enemy infantry, bacta and ammunition tanks to augment their chances of survivability and a fusion cutter to repair their vehicle, had they been hit during a battle."},{"b":13,"c":"REB_REBEL_SPEC","f":"REB","n":"Rebel Spec Force Soldier","v":"Rebel Spec Force Soldier","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Generic Rebel SpecForce soldier; no extra faction.","bio":"Alliance Special Forces, or the Rebel SpecForce, were a division of elite soldiers that reported directly to Alliance High Command during the Galactic Civil War. Rebel Soldiers who distinguished themselves by bravery, skill, and dedication to the cause were selected to become members. Such notable units included Renegade Squadron and Han Solo\u0027s Strike Team on Endor."},{"b":13,"c":"REB_REX_REBEL","f":"REB","n":"Rex","v":"Rex|Rex","p":"rex","e":"REP","t":"named canon era_prequel era_imperial male non_sensitive","w":"Clone Captain of the Republic army in the Clone Wars, so REP. Identity from knowledge.","bio":"During the Empire\u0027s reign, Captain Rex, along with Commanders Wolffe and Gregor settled on an old AT-TE walker on the planet Seelos. Wanting nothing to do with the Empire, Rex was eventually persuaded to join Hera\u0027s Phoenix cell and continued working with the Rebellion up through the Battle of Endor as a member of Han Solo\u0027s strike team."},{"b":13,"c":"REB_SABINE","f":"REB","n":"Sabine Wren","v":"Sabine Wren|Sabine Wren","p":"sabine wren","e":"MANDO BH","t":"named canon era_imperial female non_sensitive","w":"Mandalorian of Clan Wren, briefly a bounty hunter. Identity from bio and knowledge.","bio":"Sabine Wren was a Human female rebel and Mandalorian during the Galactic Civil War. Born to Clan Wren under House Vizsla, Sabine was sent to the Imperial Academy, where she became disillusioned with the Empire and left, becoming a Bounty Hunter until she joined the Lothal Rebels led by Hera Syndulla and Kanan Jarrus. Known to her new family as a weapons expert, Sabine often brought an artistic side to her cell, painting her room aboard the Ghost, her armor, and the many explosions she often caused."},{"b":13,"c":"REB_SAW","f":"REB","n":"Saw Gerrera","v":"Saw Gerrera","p":"saw gerrera","e":"","t":"named canon era_prequel era_imperial male non_sensitive","w":"Led the Partisans, an extremist cell, not Alliance membership; no extra faction.","bio":"Saw Gerrera was a Human male who led the extremist Rebel cell known as the partisans during the reign of the Galactic Empire. Born on Onderon, Saw helped to lead the Onderon rebels during the Clone Wars against the Confederacy. After the death of his sister, Steela, and the rise of the Empire, Saw led his own band of rebels against the Empire, sabotaging multiple operations in the most destructive ways possible, caring little for the innocent lives impacted by his methods. By the time the first Deathstar finished construction, Saw and his partisans established a base on Jedha, working to sabotage the Empire\u0027s efforts on the world. Saw took the defected pilot Bodhi Rook prisoner after bringing him a message from Galen Erso, and after being tracked down by Jyn Erso and Cassian Andor, the Deathstar fired its weapon at the world. Tired from the fighting, Saw urged Jyn to leave and as she and the rest of the future Rogue One crew escaped, Saw stared at the shockwave caused by the Deathstar, and allowed it to take him."},{"b":13,"c":"REB_SHARA","f":"REB","n":"Shara","v":"Shara","p":"shara","e":"","t":"named legends era_imperial female non_sensitive","w":"Grey Squadron pilot in Legends; no extra faction.","bio":"Shara was a Human female who fought alongside the Rebellion during the Galactic Civil War. Brought into Grey Squadron by Rahm Kota, Shara worked closely with X2 during the battle of Yavin IV, and later the Battle of Vjun and Battle of Mustafar, where X2 confronted his brother, X1. Both were indicted into the New Republic at some point after its formation."},{"b":13,"c":"REB_SHRIV","f":"REB","n":"Shriv Suurgav","v":"Shriv Suurgav","p":"shriv suurgav","e":"","t":"named legends era_imperial era_new_republic male non_sensitive","w":"Duro pilot of Danger Squadron; no extra faction. Canon status not verified.","bio":"Shriv Suurgav was a male Duro during the Galactic Civil War and New Republic eras. Shriv fought for the Rebellion during the former era as a pilot and soldier, participating in the liberation of Sullust and battle of Endor, where he took part in the battle as the leader of Danger Squadron. After the Galactic Civil War, Shriv took part in many other missions until the First Order-Resistance conflict."},{"b":13,"c":"REB_SMUGGLER","f":"REB","n":"Rebel Smuggler","v":"Rebel Smuggler","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Generic Rebel smuggler unit; no extra faction.","bio":"Rebel smugglers were versatile infantrymen of the Rebellion equipped with various tools. Smugglers used a powerful shotgun efficient enough to get rid of close quarter enemy personnel, detonating packs to blow heavy targets up, a fusion cutter to repair damaged material quickly and bacta and ammunition tanks to refill their brothers in arms ammunitions and heal their wounds."},{"b":13,"c":"REB_STARKILLER_REBEL","f":"REB","n":"Starkiller","v":"Starkiller|Starkiller (TIE Flight Suit)|Starkiller (Dream Robes)|Starkiller (Arena)|Starkiller (Jedi Armor)|Starkiller (Experimental Jedi Robes)","p":"galen marek","e":"GE","t":"named legends era_imperial sith male","w":"Clone of Galen Marek, identity keyed to Galen Marek. Vader\u0027s apprentice in Imperial service, so GE. Force Unleashed (Legends).","bio":"Starkiller was a Clone of Galen Marek that was bred during the Galactic Civil War. After Galen Marek\u0027s death, Darth Vader sought to create a perfect apprentice. As the first promising clone, Starkiller was tested by Vader to see if he was to be a suitable candidate, however, he was unable to strike down a training droid programmed to simulate Juno Eclipse. Desiring to find her, Starkiller went rogue and went on the hunt for Juno. His journey led to him rescuing Rahm Kota from Cato Neimoidia and leading an assault on Kamino, where he was at last united with Juno."},{"b":13,"c":"REB_TEN","f":"REB","n":"Ten Numb","v":"Ten Numb","p":"ten numb","e":"","t":"named legends era_imperial male non_sensitive","w":"Sullustan Blue Leader at Endor, Legends; no extra faction.","bio":"Ten Numb was a male Sullustan rebel pilot who took part in the battle Endor as a Blue Squadron member. After the battle, Ten was promoted to Blue Leader, as the former leader died during the battle. Some time after this famous event, Ten took part in a mission alongside Luke Skywalker and other members of Rogue Squadron. After he and the rest of the team were separated, Ten was captured by an Imperial remnant General, Weir. He died shortly after his capture during a torture session."},{"b":13,"c":"REB_TERPFEN","f":"REB","n":"Terpfen","v":"Terpfen","p":"terpfen","e":"","t":"named legends era_imperial male non_sensitive","w":"Mon Calamari mechanic; Imperial brainwashing is not membership, so no extra faction.","bio":"Terpfen was a Mon Calamari Male who served as Admiral Gial Ackbar\u0027s personal ship mechanic. Initially brainwashed by the Galactic Empire as a sleeper agent, Terpfen sabotaged a number of alliance craft in an effort to weaken their military strength. When his brainwashing came to light, Ackbar spoke up on Terpfens behalf and granted him a full pardon."},{"b":13,"c":"REB_TORYN","f":"REB","n":"Toryn Farr","v":"Toryn Farr","p":"toryn farr","e":"","t":"named legends era_imperial female non_sensitive","w":"Communications officer at Echo Base; no extra faction.","bio":"Toryn Farr was a Female Human Rebel Alliance Officer from Chandrila who served during the Galactic Civil War. Farr served primarily in communications and joined the Rebellion at an early age. Her first notable station was at Echo Base and during the Imperial attack on the hidden Rebel base, Farr coordinated defenses and evacuation efforts and kept the Ion Cannon operators apraised so that they could provide adequate covering fire for the escaping transports. Farr worked diligently to help save as many Rebels as possible, waiting until the last transport ship was scheduled to leave to finally escape from Hoth."},{"b":13,"c":"REB_VANGUARD","f":"REB","n":"Rebel Vanguard","v":"Rebel Vanguard|Rebel Vanguard","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Generic Rebel vanguard unit; no extra faction.","bio":"Rebel vanguards were the heavy footmen of the rebellion, using their rocket launchers to take armored targets down and mines to trap strategic places of the battlefield. They were equipped with a blaster pistol to repel enemy infantry when needed and thermal detonators effective against groups of enemies."},{"b":13,"c":"REB_WEDGE","f":"REB","n":"Wedge Antilles","v":"Wedge Antilles","p":"wedge antilles","e":"NR","t":"named canon era_imperial era_new_republic male non_sensitive","w":"Rebel pilot who continued into the New Republic era, so NR. Identity from film knowledge.","bio":"Wedge Antilles was a human male rebel pilot during the Galactic Civil War and New Republic era, born in 21 BBY. Wedge Antilles was famous for participating in the Battle of Yavin and surviving, founding shortly after the Rogue Squadron with his brother in arms and friend Luke Skywalker. One of the most skilled pilots of his time, Wedge went through the Galactic Civil War, participating in the Battle of Hoth, Endor, and many others until after the Yuuzhan Vong invasion, at which time Wedge decided to retire to take care of his family."},{"b":14,"c":"REB_WOOKIEE_REBEL","f":"REB","n":"Wookiee Warrior","v":"Wookiee Warrior","p":"generic","e":"REP","t":"generic canon era_prequel era_imperial non_sensitive","w":"Generic Wookiee warrior from Kashyyyk; Wookiees fought for the Republic in the Clone Wars (Revenge of the Sith) as well as in the Rebellion, so REP added. No Wookieepedia lookup needed.","bio":"Wookiee Warriors were powerful and feared warriors originating from Kashyyyk. While their only claws were enough to inspire respect to their enemies, they were often seen fighting with Ryyk blades and Bowcasters."},{"b":14,"c":"REB_ZEB","f":"REB","n":"Garazeb Orrelios","v":"Garazeb Orrelios","p":"garazeb orrelios","e":"","t":"named canon era_imperial male non_sensitive","w":"Lasat rebel from the Lothal Rebels with Hera Syndulla and Kanan Jarrus (Star Wars Rebels); REB is the entry faction. No other code fits (Lasan Honor Guard is not a code).","bio":"Garazeb Orrelios was a Lasat male rebel and former Captain of the Lasan Honor Guard during the Galactic Civil War. One of the few Lasat to survive the devastation of his homeworld from the Galactic Empire, Zeb developed a deep hatred toward the Empire, eventually joining the Lothal Rebels led by Hera Syndulla and Kanan Jarrus."},{"b":14,"c":"REP_187TH","f":"REP","n":"187th Clone Trooper","v":"187th Clone Trooper","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Clone regiment of the Grand Army of the Republic under Mace Windu; single affiliation, no extra faction.","bio":"The 187th Legion, is amongst the many Clone Battle Regiments that served in the Grand Army of the Republic during the Clone Wars. Led by the High Jedi General Mace Windu, the Legion has fought the Separatist Menace on countless theaters riddled throughout the galaxy. 4 weeks after the start of the conflict, the Legion was dispatched to Dantooine in order eliminate the Droid Army\u0027s staging ground against General Kenobi\u0027s siege of Muunilinst."},{"b":14,"c":"REP_212TH","f":"REP","n":"212th Clone Trooper","v":"212th Clone Trooper|212th Airborne Trooper|212th Airborne Trooper|212th Clone Sniper","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"212th Attack Battalion under Obi-Wan Kenobi and Cody; single affiliation, no extra faction.","bio":"The 212th Attack Battalion was a division of clones who served under Jedi Master Obi-Wan Kenobi and Clone Commander Cody. The 212th most notably fought in the battles of Christophsis, Teth, Ryloth, Geonosis, Umbara, Anaxes, and Utapau."},{"b":14,"c":"REP_21ST","f":"REP","n":"21st Clone Trooper","v":"21st Clone Trooper","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"21st Nova Corps under Ki-Adi-Mundi and Bacara; single affiliation, no extra faction.","bio":"The 21st Nova Corps, also known as Galactic Marines, were a division of clones who served under Jedi Master Ki-Adi-Mundi and Clone Commander Bacara during the Clone Wars. The 21st most notably fought in the battles of Rhen Var, Aargonar, and Mygeeto."},{"b":14,"c":"REP_327TH","f":"REP","n":"327th Clone Trooper","v":"327th Clone Trooper","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"327th Star Corps under Bly and Aayla Secura; single affiliation, no extra faction.","bio":"One of the most active regiments in the conflict, the 327th Star Corps were in action since the very first clash with the Droid Army on the open plains of Geonosis, all the way to the treacherous jungles of Felucia in the Outer Rim Sieges. During the first year of the conflict, the 327th Star Corps\u0027 fleet was ambushed over the planet Quell. If it weren\u0027t for Skywalker\u0027s intervention, it would have been the demise of General Secura, Commander Bly and the Corps as whole. But they have narrowly escaped and retreated with their lives, to fight another day."},{"b":14,"c":"REP_332ND","f":"REP","n":"332nd Clone Trooper","v":"332nd Clone Trooper","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"332nd Legion of clones with Anakin and Ahsoka; they remained Republic clones, no extra faction.","bio":"The 332nd Legion was a sub-division of the 501st Legion consisting of veteran Clone Troopers that fought alongside Anakin Skywalker and Ahsoka Tano during the Clone Wars. When Ahsoka returned to lead a siege on Mandalore, many Clone forces painted their helmets to match Ahsoka\u0027s facial tattoos and skin color. After the outbreak of Order 66, the Clones turned on Ahsoka, and all perished when the Venator Star Destroyer crashed into a moon, faking Ahsoka and Captain Rex\u0027s deaths."},{"b":14,"c":"REP_41ST","f":"REP","n":"41st Clone Trooper","v":"41st Clone Trooper|41st Clone Trooper|41st Scout Trooper","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"41st Elite Corps under Luminara Unduli and Barriss Offee; single affiliation, no extra faction.","bio":"The 41st Elite Corps were a division of clones who served under Jedi Master Luminara Unduli, Jedi Padawan Barriss Offee, and Clone Commander Gree during the Clone Wars, as well as briefly under Jedi Grand Master Yoda during the Battle of Kashyyyk. The 41st most notably fought in the battles of Geonosis, Rodia, Coruscant, and Kashyyyk."},{"b":14,"c":"REP_442ND","f":"REP","n":"442nd Clone Trooper","v":"442nd Clone Trooper","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"442nd Siege Battalion; single affiliation, no extra faction.","bio":"The 442nd Siege Battalion were a division of clones within the Grand Army of the Republic. By the end of the war, the 442nd was stationed on Cato Neimoidia."},{"b":14,"c":"REP_501ST","f":"REP","n":"501st Clone Trooper","v":"501st Clone Trooper|501st ARC Trooper|501st Clone Assassin|501st Jet Trooper","p":"generic","e":"GE","t":"generic canon era_prequel era_imperial non_sensitive","w":"501st became Vader\u0027s Fist, the Imperial stormtrooper battalion after Order 66, so GE added.","bio":"The 501st Legion was an elite unit of clone troopers in the Grand Army of the Republic, under the command of Anakin Skywalker. During the Jedi Purge, the 501st Legion accompanied the newly anointed Darth Vader to the Jedi Temple after Order 66 was issued. After the Purge was complete, the 501st Legion was redubbed as Vader\u0027s Fist, Vader\u0027s personal battalion of Stormtroopers."},{"b":14,"c":"REP_91ST","f":"REP","n":"91st Clone Trooper","v":"91st Clone Trooper|91st Clone Trooper","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"91st Mobile Reconnaissance Corps under Windu and Adi Gallia; single affiliation, no extra faction.","bio":"The 91st Mobile Reconnaissance Corps were a division of clones who served under Jedi Masters Mace Windu, Adi Gallia, Stass Allie, and Clone Commanders Ponds and Neyo during the Clone Wars. The 91st most notably fought in the battles of Ryloth, Malastare, Patitite Pattuna, and Saleucami."},{"b":14,"c":"REP_AANG","f":"REP","n":"Senator Aang","v":"Senator Aang","p":"aang","e":"","t":"named canon era_prequel male non_sensitive","w":"Roonan senator in the Republic Senate (Military Oversight Committee). Wookieepedia-derived mirror (BreezeWiki Aang) consulted. No extra faction.","bio":"Senator Aang was a Roonan male Senator during the Clone Wars. During the war, Aang was member of the Military Oversight Committee and was persuaded by Senator Padm  Amidala to vote in favor of reducing the amount being spent on the Grand Army of the Republic. Despite his vote however, the Senate voted to provide funding for another five million clone troopers to be made for the army."},{"b":14,"c":"REP_AAYLA","f":"REP","n":"Aayla Secura","v":"Aayla Secura","p":"aayla secura","e":"JO","t":"named canon era_prequel jedi female","w":"Twi\u0027lek Jedi Knight and general of the Clone Wars; Jedi Order membership is significant, so JO added.","bio":"Aayla Secura was a Twi\u0027lek female Jedi Knight during the Clone Wars. A general that worked closely with Clone Commander Bly, Aayla led and took part in a large number of battles during the Clone Wars including Quell, Maridun, Coruscant, and Felucia. At the end of the Clone Wars, Aayla was stationed on Felucia, when suddenly her own soldiers, including Commander Bly, shot her in the back, executing Order 66 on Darth Sidious\u0027s command."},{"b":14,"c":"REP_ADI","f":"REP","n":"Adi Gallia","v":"Adi Gallia|Adi Gallia (General)","p":"adi gallia","e":"JO","t":"named canon era_prequel jedi female","w":"Tholothian Jedi Master and member of the Jedi High Council; JO added.","bio":"Adi Gallia was a Tholothian female Jedi Master and member of the Jedi High Council during the Clone Wars. A General in the Clone Wars, Adi Gallia fought in a number of battles, including rescuing Eeth Koth from General Grievous. Near the war\u0027s end, Adi Gallia went with Obi-wan Kenobi to the planet Florrum to help search for Darth Maul and Savage Opress. Engaging the two Nightbrothers in a duel, Adi Gallia was killed by Savage after being impaled with his horns, and was then swiftly stabbed in the back, ending her life."},{"b":14,"c":"REP_AGEN","f":"REP","n":"Agen Kolar","v":"Agen Kolar","p":"agen kolar","e":"JO","t":"named canon era_prequel jedi male","w":"Zabrak Jedi Master and Council member killed by Palpatine in Revenge of the Sith; JO added.","bio":"Agen Kolar was a Zabrak male Jedi Master and member of the Jedi High Council during the Clone Wars. Eeth Koth\u0027s replacement on the Council, Agen Kolar was well known in the order as a gifted swordsman and participated in the First Battle of Geonosis, and was part of many concurrent Council discussions. Agen accompanied Mace Windu to arrest Palpatine, then known to be the Sith Lord Darth Sidious. After the duel began, Agen was the first casualty, stabbed through the torso by the Sith Lord almost immediately."},{"b":14,"c":"REP_AHSOKA","f":"REP","n":"Ahsoka Tano (Siege of Mandalore)","v":"Ahsoka Tano (Siege of Mandalore)|Ahsoka Tano (Young)|Ahsoka Tano (Padawan)|Ahsoka Tano","p":"ahsoka tano","e":"JO REB","t":"named canon era_prequel era_imperial jedi female","w":"Togruta Padawan of Anakin who left the Order and later fought with the Rebels (Star Wars Rebels); JO and REB added.","bio":"Ahsoka Tano was a Togruta female Jedi Padawan during the Clone Wars. Assigned as Anakin Skywalker\u0027s padawan, Ahsoka joined with her master on many battles, the two growing very close as the war progressed. Near the end of the war, Ahsoka was framed for bombing the temple by her former friend, Barriss Offee. Saddened by the distrust of the Council, Ahsoka left the Jedi Order. After the Rebellion began to manifest in the galaxy, Ahsoka assisted the Rebels in fighting the Empire, and later Darth Vader, her former Master."},{"b":14,"c":"REP_ALDERAAN","f":"REP","n":"Alderaan Guard","v":"Alderaan Guard","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Alderaan guard unit; single affiliation, no extra faction. The bio (scientists) does not match the guard role, so the tag is taken from the entry name.","bio":"Many Alderaanians found work in the sciences in an effort to continue the advancement of their homeworld."},{"b":14,"c":"REP_ANAKIN","f":"REP","n":"Anakin Skywalker","v":"Anakin Skywalker|Lord Vader|Anakin Skywalker (General)|Anakin Skywalker (Mid-War)|Anakin Skywalker (Nelvaan)|Anakin Skywalker (Commander)|Anakin Skywalker (Padawan)|Anakin Skywalker (Child)|Anakin Skywalker (Redeemed)|Anakin Skywalker (Redeemed)","p":"anakin skywalker","e":"JO GE ROT","t":"named canon era_prequel era_imperial jedi sith fallen_jedi redeemed male","w":"[corrigé] Jedi Knight and Council member who became Darth Vader, Sidious\u0027s apprentice in the Empire and later redeemed in Return of the Jedi; JO, GE and SO added.","bio":"Anakin Skywalker was a Human male Jedi Knight and member of the Jedi High Council during the Clone Wars. The Chosen One, prophesized to destroy the Sith and bring balance to the Force, Anakin was a struggling, yet promising Jedi, held back by his emotional connections to those he cared about. After the Clone Wars broke out, Anakin fought in many battles, earning the title The Hero with No Fear. Plagued by visions of his wife Padm  dying, Anakin fell to the dark side, hoping to prevent her death, thus becoming the feared Sith Lord, Darth Vader."},{"b":14,"c":"REP_APPO","f":"REP","n":"Commander Appo","v":"Commander Appo|Sergeant Appo","p":"appo","e":"GE","t":"named canon era_prequel era_imperial male non_sensitive","w":"Clone Commander of the 501st, which became Vader\u0027s Fist in the Empire; GE added. Bio describes his Imperial-era assault on the Jedi Temple.","bio":"Appo was a Clone Commander who served with Anakin Skywalker and the 501st Legion during and after the Clone Wars. During the Umbara Campaign, Appo served as a Sergeant, but by the end of the war, had been promoted to Commander. After the outbreak of Order 66, Appo, alongside the newly christened Darth Vader, led an assault on the Jedi Temple, which saw to near-extermination of the Jedi Order. When Bail Organa arrived at the temple, Appo and several of his troops halted the Senator from progressing further, until the Jedi Padawan Zett Jukkasa arrived and was able to injure Appo and strike down several Clones before being shot down."},{"b":14,"c":"REP_AQUA","f":"REP","n":"Clone SCUBA Trooper","v":"Clone SCUBA Trooper","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Entry named Clone SCUBA Trooper, but the bio describes Aquatic Battle Droids (apparent mismatch). Tagged as a clone unit from the entry name; no extra faction.","bio":"Aquatic Battle Droids were a specially manufactured battle droid designed to work in underwater environments. Droids of this type were famously used during the Battle of Kamino and also the Battle of Mon Cala."},{"b":14,"c":"REP_ARABAROTTA","f":"REP","n":"Ara Barotta","v":"Ara Barotta","p":"ara barotta","e":"JO","t":"named era_prequel jedi female","w":"Twi\u0027lek Padawan of Jedi Master Mavra Zane in the final Republic years (bio only). Wookieepedia search found no Ara Barotta; the only Ara found was from Star Wars Visions, which does not match. Canon status unverified. JO added as a Padawan of the Order.","bio":"Ara Barotta was a Twi\u0027lek female Jedi Padawan who served the Jedi Order during the final years of the Galactic Republic. Assigned to Jedi Master Mavra Zane, Barotta and a number of other students travelled to Kashyyyk in order to complete their training in the ways of the Force. Barotta would go on to help Zane and her fellow students deliver information about an impending attack on the Core Worlds to the High Council. At the end of their quest, Zane knighted her students, including Ara herself."},{"b":14,"c":"REP_ARC","f":"REP","n":"ARC Trooper","v":"ARC Trooper|ARC Trooper","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Advanced Recon Commando trooper, an elite clone variant; single affiliation, no extra faction.","bio":"Advanced Recon Commando Troopers or ARC Troopers were an elite variant of Clone Trooper in the Grand Army of the Republic during the Clone Wars, and often served as leaders or received challenging assignments not suitable for less specialized clones. They were given their own unique armor set, which differed greatly from the standard issue kit given to Clone Troopers, being equipped with more components. During the early days of the Clone Wars, this kit served as an experimental version of the Phase II clone trooper armor."},{"b":14,"c":"REP_ARC_HAVOC","f":"REP","n":"Havoc","v":"Havoc","p":"havoc","e":"","t":"named canon era_prequel male non_sensitive","w":"ARC trooper of Rancor Battalion who died at the Battle of Kamino; single affiliation, no extra faction.","bio":"Havoc was an Advanced Recon Commando and part of Rancor Battalion during the Clone Wars. Alongside Colt, Havoc was stationed on Kamino and oversaw the training of a number of clone cadets. During the Battle of Kamino, Havoc was killed after telling 99 to leave the battlefield."},{"b":14,"c":"REP_ASHARAD","f":"REP","n":"A\u0027sharad Hett","v":"A\u0027sharad Hett","p":"a\u0027sharad hett","e":"JO DKGE","t":"named legends era_prequel era_legacy jedi sith fallen_jedi male","w":"Tatooine-born Jedi Master who became a bounty hunter and then Darth Krayt, founder of Darth Krayt\u0027s Empire (Legacy comics); JO and DKGE added. Identity is from the bio plus Star Wars knowledge; no lookup done.","bio":"A\u0027sharad Hett was a Human male Jedi Master during the final years of the Galactic Republic. Born on Tatooine, living among the Tusken Raiders, Hett was discovered by Ki-Adi-Mundi and brought to the Jedi Temple at a young age. Hett was able to survive the Clone Wars and Order 66, but sought to wage his own war against the Empire. After losing a duel against Obi-Wan Kenobi, Hett was exiled from Tatooine and became a Bounty Hunter. Eventually a mission brought him to Korriban where he fell to the dark side and became the Sith Lord, Darth Krayt."},{"b":14,"c":"REP_ASK","f":"REP","n":"Ask Aak","v":"Ask Aak","p":"ask aak","e":"","t":"named canon era_prequel male non_sensitive","w":"Gran senator of Malastare in Palpatine\u0027s inner circle (Attack of the Clones, Revenge of the Sith). Wookieepedia-derived Archivum entry consulted; Republic Senate only, no extra faction.","bio":"Senator Ask Aak was a Gran male who served as Senator of Malastare prior to and during the Clone Wars. Ask, who was part of the inner circle of Supreme Chancellor Palpatine, was a proponent of military action against the Confederacy of Independent Systems."},{"b":14,"c":"REP_BACARA","f":"REP","n":"Commander Bacara","v":"Commander Bacara","p":"bacara","e":"","t":"named canon era_prequel male non_sensitive","w":"Clone Commander of the 21st Nova Corps; single affiliation, no extra faction.","bio":"Commander Bacara was a Clone Commander who led the 21st Nova Corps and the Galactic Marines during the Clone Wars. Often serving alongside Ki-Adi-Mundi, at the end of the war, Bacara and Ki-Adi-Mundi were tasked with attack Mygeeto. During a charge, Bacara received the command to execute Order 66. He and his squad then opened fire on Mundi, killing him."},{"b":14,"c":"REP_BAIL_ORGANA","f":"REP","n":"Bail Organa","v":"Bail Organa","p":"bail organa","e":"REB","t":"named canon era_prequel era_imperial male non_sensitive","w":"Senator of Alderaan and founding member of the Rebellion who funded it secretly; REB added.","bio":"Bail Organa was a Human male who served as Senator of Alderaan during the Clone Wars. A close friend to the Jedi Order, Bail worked with the Jedi a number of times during the war, aiding on relief missions and other humanitarian efforts. After the Clone Wars ended and Padm \u0027s twins were born, Bail volunteered to adopt the infant Leia and raise her. As one of the founding members of the Rebellion, Bail secretly assisted the Rebels with funds and supplies. Bail was killed after the Death Star fired on Alderaan."},{"b":14,"c":"REP_BARRISS","f":"REP","n":"Barriss Offee","v":"Barriss Offee","p":"barriss offee","e":"JO","t":"named canon era_prequel jedi fallen_jedi female","w":"Mirialan Padawan of Luminara Unduli who bombed the Jedi Temple; JO added for her Padawan membership.","bio":"Barriss Offee was a Mirialan Jedi Padawan during the Clone Wars. Along with her master, Luminara Unduli, Barriss fought in numerous battles during the Clone Wars, eventually forming a close friendship with Ahsoka Tano. As the Clone Wars continued, Barriss grew more disillusioned with the Jedi\u0027s role in the war, and eventually bombed the Jedi Temple, framing her best friend Ahsoka for her crimes. Barriss was later found out and captured by Anakin Skywalker, who forced her to plead her guilt, much to Ahsoka\u0027s horror."},{"b":14,"c":"REP_BB_OMEGA","f":"REP","n":"Omega","v":"Omega","p":"omega","e":"","t":"named canon era_prequel era_imperial female non_sensitive","w":"Enhanced clone of Jango Fett who joined Clone Force 99 (The Bad Batch). Bad Batch affiliations not verified by lookup, so no extra faction.","bio":"Omega was an enhanced female clone of Jango Fett who joined Clone Force 99 in the aftermath of the Clone Wars. Created on Kamino as an enhanced, unaltered replication of Jango Fett’s genetic template, she was one of only two pure clones of Fett, the other being Boba Fett. Originally serving as a medical assistant to Chief Scientist Nala Se in Tipoca City, Omega lived a sheltered early life observing the development and behavior of the clone troopers. After the execution of Order 66 and the Republic’s fall, she encountered Clone Force 99 and formed an immediate bond with them. When the Empire began evaluating and decommissioning the clone program, Omega chose to escape Kamino with the Bad Batch, rejecting the Empire’s authority. Omega was the target of several bounty hunters, later becoming a test subject for Emperor Palpatine\u0027s experiment Project Necromancer. However, she was able to escape Mount Tantiss and helped Crosshair rejoin the Bad Batch. After stopping Doctor Hemlock\u0027s experiment, Omega and the rest of the Bad Batch lived peacefully on Pabu. Omega later chose to join the Rebellion as a pilot."},{"b":14,"c":"REP_BD_REPUBLIC","f":"REP","n":"Reprogrammed Battle Droid","v":"Reprogrammed Battle Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Battle droids reprogrammed by R2-D2 for a Republic strike team; single affiliation, no extra faction.","bio":"Three Battle Droids were captured and reprogrammed by R2-D2 to pilot a small Republic strike team to infiltrate the Citadel Prison on Lotho Minor to rescue Jedi Master Even Piell. During the rescue, all three droids were destroyed."},{"b":14,"c":"REP_BD_TRAINING","f":"REP","n":"Training Battle Droid","v":"Training Battle Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Training battle droid for clone cadets; single affiliation, no extra faction.","bio":"Training Battle Droids were designed to simulate actual Battle Droids to Clone Cadets. Their chassis had target marks painted on, displaying a Battle Droid\u0027s many weak points."},{"b":14,"c":"REP_BENE","f":"REP","n":"Bene","v":"Bene","p":"bene","e":"JO","t":"named era_prequel jedi female","w":"Human Padawan slain by Darth Vader during Operation Knightfall; JO added. Canon status unverified and no lookup done.","bio":"Bene was a Human female Jedi Padawan who served in the Jedi Order during the final years of the Galactic Republic. During the night of Operation: Knightfall, Bene and fellow Padawan Whie Malreaux sparred together in the Room of a Thousand Fountains, until being confronted by the newly christened Darth Vader. Bene, along with Whie and Jedi Battlemaster Cin Drallig faced off against the Sith Lord. However, none of them were a match for Skywalker, and all three were slain."},{"b":14,"c":"REP_BIBBLE","f":"REP","n":"Sio Bibble","v":"Sio Bibble","p":"sio bibble","e":"","t":"named canon era_prequel male non_sensitive","w":"Governor of Naboo during the Clone Wars and the early Empire; government post, no code faction, so no extra faction.","bio":"Sio Bibble was a Human male who served as Governor of Naboo during the final years of the Galactic Republic. Elected during King Veruna\u0027s reign, Bibble continued to serve the people as Governor during the Invasion of Naboo and later the Clone Wars. After the Empire\u0027s formation, Bibble stepped down from his position as the Empire elected a Moff to take his place."},{"b":14,"c":"REP_BLITZ","f":"REP","n":"Blitz","v":"Blitz","p":"blitz","e":"","t":"named canon era_prequel male non_sensitive","w":"ARC trooper of Rancor Battalion, one of the survivors of the Battle of Kamino; single affiliation, no extra faction.","bio":"Blitz was an Advanced Recon Commando and part of Rancor Battalion during the Clone Wars. Alongside Colt, Blitz was stationed on Kamino and oversaw the training of a number of clone cadets. Blitz was one of the few surviving ARC troopers that fought in the Battle of Kamino."},{"b":14,"c":"REP_BLOUNT","f":"REP","n":"Senator Blount","v":"Senator Blount","p":"blount","e":"","t":"named era_prequel male non_sensitive","w":"Bio says Aqualish Republic senator. The only Star Wars Blount found on Wookieepedia mirrors was a human Rebel lieutenant (Return of the Jedi), which does not match, so the identity and canon status are unverified. No extra faction.","bio":"Senator Blount was an Aqualish male Senator during the Clone Wars."},{"b":14,"c":"REP_BLY","f":"REP","n":"Commander Bly","v":"Commander Bly","p":"bly","e":"","t":"named canon era_prequel male non_sensitive","w":"Clone Commander of the 327th Star Corps who executed Order 66 on Aayla Secura; no extra faction verified.","bio":"Commander Bly was a Clone Commander who led the 327th Star Corps, and served under Jedi General Aayla Secura during the Clone Wars. During the Battle of Felucia, Bly and Secura were tasked with tracking down Separatist Council member Shu Mai, when Bly was commanded by Palpatine to execute Order 66, Bly and his squad opened fire on Secura, killing her."},{"b":14,"c":"REP_BOIL","f":"REP","n":"Boil","v":"Boil","p":"boil","e":"","t":"named canon era_prequel male non_sensitive","w":"Clone trooper of the 212th and Ghost Company; single affiliation, no extra faction.","bio":"Boil was a Clone Trooper of the 212th Attack Battalion and member of Ghost Company during the Clone Wars. Boil, along with Waxer, took part in the Battle of Ryloth, where he met a young Twi\u0027lek girl, Numa. Later on in the war, Boil and Waxer took part in the Second Battle of Geonosis, tasked with rescuing Obi-wan Kenobi from his crashed LAAT Gunship."},{"b":14,"c":"REP_BOLLA","f":"REP","n":"Bolla Ropal","v":"Bolla Ropal","p":"bolla ropal","e":"JO","t":"named canon era_prequel jedi male","w":"Rodian Jedi Master and keeper of the Kyber memory crystal; JO added. Wookieepedia-derived Archivum entry and Star Wars Databank consulted.","bio":"Bolla Ropal was a Rodian male Jedi Master who acted as keeper of the Kyber Memory Crystal during the Clone Wars. As keeper of the Kyber Memory Crystal, Ropal was responsible for a list of Force Sensitive children across the galaxy. Drawing the attention of Darth Sidious, Sidious hired Cad Bane to fetch him the list. After stealing a holocron and capturing Ropal, Cad Bane tortured Ropal to open the holocron, which Ropal refused. Bane overdid the torture and ultimately tortured Ropal to death."},{"b":14,"c":"REP_BOSS","f":"REP","n":"Boss","v":"Boss","p":"boss","e":"","t":"named canon era_prequel male non_sensitive","w":"Clone Commando leader of Delta Squad; single affiliation, no extra faction.","bio":"Boss was a Clone Commando and leader of Delta Squad during the Clone Wars. As a Commando, Boss, along with Delta Squad, was tasked with more specialized missions unfit for other Clone Troopers. Responsible for leading his squad through Geonosis, the Republic Assault Cruiser Prosecutor, and on Kachirho. At the expense of Sev, Delta Squad was able to clear the way for a Republic invasion of Kashyyyk."},{"b":14,"c":"REP_BREHA","f":"REP","n":"Breha","v":"Breha","p":"breha organa","e":"REB","t":"named canon era_prequel era_imperial female non_sensitive","w":"[corrigé] Queen of Alderaan and adoptive mother of Leia; royalty rather than a code faction member, so no extra faction.","bio":"Breha Organa was a human female who ascended to and served as Queen, as well as minister for education, for the planet Alderaan during the Clone Wars and the early stages of the Galactic Civil War. At the end of the Clone Wars, she and her husband, Senator Bail Organa, adopted the newborn Leia, the daughter of Anakin Skywalker and Padm  Amidala. She continued to rule Alderaan until she eventually died with Bail Organa after the Death Star destroyed Alderaan as punishment for Leia s treachery to the Empire."},{"b":14,"c":"REP_BRIC","f":"REP","n":"Bric","v":"Bric","p":"bric","e":"BH","t":"named canon era_prequel male non_sensitive","w":"Siniteen bounty hunter hired by the Republic to train clone cadets on Kamino; BH added. Wookieepedia-derived Archivum and BreezeWiki mirrors consulted.","bio":"Bric was a Sinteen male bounty hunter who, along with his partner El-les, was hired by the Galactic Republic to train clone cadets during the Clone Wars."},{"b":14,"c":"REP_BRUTE","f":"REP","n":"Jedi Brute","v":"Jedi Brute","p":"generic","e":"JO","t":"generic canon era_prequel non_sensitive","w":"Temple Security Force brute guarding the Jedi Temple; JO added.","bio":"Jedi Brutes were a sect of the Temple Security Force that were easily distinctive by tall, physically imposing bodies, and their use of a double-bladed lightsaber. Brutes were often the first line of defense against rioters and troublemakers, protecting important locations within the Jedi Temple."},{"b":14,"c":"REP_BULTAR","f":"REP","n":"Bultar Swan","v":"Bultar Swan","p":"bultar swan","e":"JO","t":"named era_prequel jedi female","w":"Human Jedi Knight killed at the Kessel conclave under Darth Vader; JO added. Wookieepedia-derived mirrors (Archivum Jastus Farr and Koffi Arana pages, Purge summary) consulted. Canon status unverified.","bio":"Bultar Swan was a Human female Jedi Knight prior to, during, and shortly after the Clone Wars. Prior to the Clone Wars, Swan was one of the 200 Jedi sent to Geonosis to rescue Obi-Wan Kenobi, Anakin Skywalker, and Padm  Amidala. Swan survived the first battle and continued to fight in the war. After Order 66 was issued, Swan was killed during the Conclave on Kessel, a trap designed to kill the Sith Lord, Darth Vader. After refusing to kill Vader, Swan was killed by fellow Jedi Koffi Arana, who sought to kill Vader."},{"b":14,"c":"REP_BURTONI","f":"REP","n":"Halle Burtoni","v":"Halle Burtoni","p":"halle burtoni","e":"","t":"named canon era_prequel female non_sensitive","w":"Kaminoan senator who pushed for clone production; Star Wars Databank and Archivum consulted. Government post, no extra faction.","bio":"Senator Halle Burtoni was a Kaminoan female who served as Senator of Kamino during the Clone Wars. During the Clone Wars, Burtoni pushed for the Senate to approve the production of five million new Clone Troopers"},{"b":14,"c":"REP_BUZZ","f":"REP","n":"Buzz","v":"Buzz","p":"buzz","e":"","t":"named canon era_prequel male non_sensitive","w":"Clone trooper of the 41st Elite Corps under Luminara Unduli; single affiliation, no extra faction.","bio":"Buzz was a Clone Trooper of the 41st Elite Corps and served under Jedi master Luminara Unduli during the Clone Wars. Taking part in the Second Battle of Geonosis, Buzz was killed during a follow-up mission with Luminara Unduli as they were searching for Separatist Council member, Poggle the Lesser."},{"b":14,"c":"REP_CHUCHI","f":"REP","n":"Riyo Chuchi","v":"Riyo Chuchi","p":"riyo chuchi","e":"","t":"named canon era_prequel era_imperial female non_sensitive","w":"Pantoran senator who negotiated peace with the Talz and later allied with Bail Organa; Databank and Archivum consulted. No code faction for her Clone Underground ties, so no extra faction.","bio":"Senator Chuchi was a Pantoran female who served as Senator of Pantora during the Clone Wars. During a mission to Orto Plutonia, Chi Cho, chairman of Pantora, declared war on the native Talz, but was killed shortly after. Chuchi was able to negotiate peace between the two peoples before returning to her senatorial duties."},{"b":14,"c":"REP_CIN","f":"REP","n":"Cin Drallig","v":"Cin Drallig","p":"cin drallig","e":"JO","t":"named canon era_prequel jedi male","w":"Jedi Master and head of the Jedi Temple Guards; JO added.","bio":"Cin Drallig was a Human male Jedi Master and head of the Jedi Temple Guards during the Clone Wars. A master swordsman, Cin Drallig taught many students in the ways of Lightsaber combat, earning the nickname \u0027\u0027The Troll\u0027\u0027 by the younger students. During the night of Order 66, Cin Drallig, along with Padawans Whie Malreaux and Bene, were struck down by the newly anointed Darth Vader, a brief battle Obi-Wan Kenobi witnessed over the security recordings taken from that fateful night."},{"b":14,"c":"REP_CLONE","f":"REP","n":"Clone Trooper","v":"Clone Trooper|Clone Trooper (Phase I)","p":"generic","e":"GE","t":"generic canon era_prequel era_imperial non_sensitive","w":"Generic clone trooper who became the first Stormtroopers under the Empire after Order 66; GE added as a significant later affiliation.","bio":"Clone Troopers were highly trained soldiers in the Grand Army of the Republic. Bred from the genetic template of Jango Fett and sent to fight against the Confederacy of Independent Systems, the Clones represented a new generation of soldier. But secretly, each Clone was born with a special control chip that, when activated, forced them to do one thing, execute Order 66 and murder any Jedi they served under. After Order 66 was issued, Clone Troopers became the first generation of Stormtroopers."},{"b":14,"c":"REP_CLONE_BLAZE","f":"REP","n":"Clone Blaze Trooper","v":"Clone Blaze Trooper","p":"generic","e":"","t":"generic era_prequel non_sensitive","w":"Clone Blaze Trooper, a bulkier Jet Trooper variant; canon status not verified and no lookup done. Single affiliation, no extra faction.","bio":"A frontline close-combat infantry support unit, The Clone Blaze Trooper was a bulkier version of the Jet Trooper, was designed mostly to charge head on and tear through enemy lines to clear a path for Republic forces to advance forth. As battlefields do tend to accumulate debris, leading to armors being insnaired, the Clone Blaze Trooper \"blazes\" through the clutter, clearing the way. Utilized also as a counter to B2 the \"Grapplers\", they are excellent for close quarters combat. Thus were very effective against Jedi during order 66."},{"b":14,"c":"REP_CLONE_CIVILIAN","f":"REP","n":"Clone Civilian","v":"Clone Civilian","p":"generic","e":"","t":"generic era_prequel non_sensitive","w":"Clone civilian training at Tipoca City on Kamino; canon status not verified and no lookup done. Single affiliation, no extra faction.","bio":"Clone Civilians were clones who were undergoing training at Tipoca City on Kamino. While not utterly defenseless, civilians were not as combat-ready as their trooper counterparts. Each clone had to perfect their craft based on their intended designation at birth, and only when they were ready, would they be permitted to join their brothers out on the battlefield."},{"b":15,"c":"REP_CLONE_COMMANDO","f":"REP","n":"Clone Commando","v":"Clone Commando","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Generic Clone Commando unit per bio (Republic Commando, Delta Squad); no extra faction.","bio":"Clone Commandos were specialized clones who were trained for the sole purpose of performing special ops missions not suited for any other clone. While Commandos typically worked in squads, they had to be able to perform just as efficiently by themselves. As a result of this necessity, Commandos wore very heavy armor and utilized a DC-17m Interchangeable Weapon System."},{"b":15,"c":"REP_CLONE_PILOT","f":"REP","n":"Clone Pilot","v":"Clone Pilot|Clone Pilot","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Generic clone pilot corps (LAAT, ARC-170) per bio; no extra faction.","bio":"From the LAAT that roared and soared through the Geonosian skies, to the ARC 170 that rushed to the defense of the galactic capitol, the Clone Pilots brought air support whilst bringing Republic forces in or out of the frontline and gained superiority for both in space and air. In the later stages of the war, the phase 2 armor came into place. Some have adopted the enclosed armor to insure survivability in the vacuum of space, though this has came at the cost of mobility in the cockpit. Others were given a far less enclosed variant of the armor for better mobility. The Pilot Unit was originally bred to be regular infantry, but due to having particularly good reflexes and spatial awareness, were spotted early and brought into pilot training."},{"b":15,"c":"REP_CODY","f":"REP","n":"Commander Cody","v":"Commander Cody","p":"cc-2224","e":"GE","t":"named canon era_prequel male non_sensitive","w":"Commander Cody (CC-2224) of the 212th; executed Order 66 on Utapau, then served the Galactic Empire. Imperial service from general knowledge, not checked on Wookieepedia.","bio":"Commander Cody was a Clone Commander of the 212th Attack Battalion during the Clone Wars. Often serving under Obi-wan Kenobi, the two developed a mutual trust and camaraderie as they fought alongside one another. At the Battle of Utapau, Cody was commanded to execute Order 66 by the newly declared Emperor Palpatine, without hesitation, he ordered his men to fire at his former general."},{"b":15,"c":"REP_COLEMAN","f":"REP","n":"Coleman Trebor","v":"Coleman Trebor","p":"coleman trebor","e":"JO","t":"named canon era_prequel jedi male","w":"Vurk Jedi Master and High Council member per bio, so Jedi Order membership (JO).","bio":"Coleman Trebor was a Vurk male Jedi Master and member of the Jedi High Council prior to the Clone Wars. One of the 200 Jedi sent to Geonosis to rescue Anakin Skywalker, Padm  Amidala, and Obi-wan Kenobi, Coleman attempted to engage Count Dooku on the balcony of the Petranaki Arena, but was immediately shot by Jango Fett multiple times before falling to his death."},{"b":15,"c":"REP_COLT","f":"REP","n":"Colt","v":"Colt","p":"colt","e":"","t":"named canon era_prequel male non_sensitive","w":"Commander of Rancor Battalion and Kamino trainer per bio; no extra faction. Identity from bio only, not searched.","bio":"Colt was an Advanced Recon Commando and Commander of Rancor Battalion during the Clone Wars. While stationed on Kamino, Colt oversaw the training of a number of clone cadets until the Battle of Kamino, where he was stabbed in the chest by Ventress."},{"b":15,"c":"REP_CONCORKILL","f":"REP","n":"Senator Concorkill","v":"Senator Concorkill","p":"sweitt concorkill","e":"","t":"named canon era_prequel male non_sensitive","w":"Vurk Senator of Sembla (Wookieepedia). Delegation of 2,000 is not a faction code, so no extra faction.","bio":"Senator Sweitt Concorkill was a Vurk male who served as Senator of Sembla during the Clone Wars."},{"b":15,"c":"REP_COR_GUARD","f":"REP","n":"Coruscant Guard","v":"Coruscant Guard","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Generic Coruscant Guard clone division per bio; no extra faction.","bio":"The Coruscant Guard were a division of clones whose sole role in the war was to guard the Republic capital world of Coruscant. While the war raged on, the Guard would see to the protection and security of many Republic installations, including prisons, laboratories, and even the Senate Tower."},{"b":15,"c":"REP_COR_UNDER_POL","f":"REP","n":"Coruscant Underworld Police","v":"Coruscant Underworld Police","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Generic Coruscant Underworld Police per bio; no extra faction.","bio":"The Coruscant Underworld Police were police officers of the Coruscant Security Force who were responsible for patrolling the lower levels of Coruscant to prevent or assess crimes in progress or after. Underworld police were notoriously hardened in comparison with the sleek Guardian police droids that maintained law and order in the upper reaches of the Galactic City. Coruscant police patrolled in police speeders and also utilized the patrol transport when needed."},{"b":15,"c":"REP_CROSSHAIR","f":"REP","n":"Crosshair","v":"Crosshair","p":"crosshair","e":"GE","t":"named canon era_prequel era_imperial male non_sensitive","w":"Bio says he stayed with the Empire after Order 66 under Tarkin, so Galactic Empire (GE).","bio":"After the execution of Order 66, Crosshair was the only clone partially affected by the Order, and under the orders of Admiral Tarkin, his bio-chip\u0027s frequency was increased to change his behavior completely. Crosshair led a small team of conscripted soldiers and was obsessed with tracking down his former squad and a female clone known as Omega. Crosshair\u0027s behavior was changed to that of a ruthless commander, willing to execute anyone, ally and enemy alike, to achieve the objective. After narroowly escaping death on Kamino, despite no longer being under the influence of his chip, Crosshair elected to remain with the Empire."},{"b":15,"c":"REP_CUSTOM","f":"REP","n":"Custom Clone Trooper","v":"Custom Clone Trooper","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Generic customised clone trooper per bio; no extra faction.","bio":"During the course of the Clone Wars, many clones took it upon themselves to express their individuality and would customize their armor to their personal liking."},{"b":15,"c":"REP_DENAL","f":"REP","n":"Denal","v":"Denal","p":"denal","e":"","t":"named canon era_prequel male non_sensitive","w":"501st Torrent Company trooper per bio; killed by Cad Bane. No extra faction.","bio":"Denal was a Clone Trooper of the 501st Legion\u0027s Torrent Company under Captain Rex during the Clone Wars. Denal took part in a number of \tmissions, going to Skytop Station to rescue R2-D2, and the Battle of Devaron. Denal was killed by Cad Bane, who used Denal\u0027s armor to fake his death and leave his ship, until he was discovered to be an imposter by his Duros blood."},{"b":15,"c":"REP_DEPA","f":"REP","n":"Depa Billaba","v":"Depa Billaba|Depa Billaba","p":"depa billaba","e":"JO","t":"named canon era_prequel jedi female","w":"Human Jedi Master and High Council member per bio, so Jedi Order membership (JO).","bio":"Depa Billaba was a Human female Jedi Master and member of the Jedi High Council during the Naboo Crisis and Clone Wars. During the Naboo Crisis, Billaba was present while the young Anakin Skywalker was tested by the Council, and later attended Qui-Gon Jinn\u0027s funeral. During the Clone Wars, Billaba took on a Padawan, Caleb Dume. At the Battle of Kaller, Order 66 was issued. Billaba ordered Caleb to run, and she would be right behind him. Her sacrifice allowed Caleb to survive Order 66 and later join the Rebellion, as Kanan Jarrus."},{"b":15,"c":"REP_DESERT_CLONE","f":"REP","n":"Desert Clone Trooper","v":"Desert Clone Trooper","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Generic desert-trained clone trooper per bio; no extra faction.","bio":"Desert Clone Troopers were a special type of Clone Trooper, trained and equipped for combat in desert environments."},{"b":15,"c":"REP_DOGMA","f":"REP","n":"Dogma","v":"Dogma|Dogma (Phase I)","p":"dogma","e":"","t":"named canon era_prequel male non_sensitive","w":"501st Legion trooper under Pong Krell on Umbara per bio; no extra faction.","bio":"Dogma was a Clone Trooper of the 501st Legion who served under the command of Jedi general Pong Krell during the Clone Wars. During the Republic\u0027s Campaign on Umbara, Dogma served alongside Pong Krell, despite the latter\u0027s distaste for clones. When Krell turned against the Republic, Dogma attempted to stop his brothers but yielded and was imprisoned. Eventually, Dogma executed Pong Krell to prevent him from revealing Republic secrets. Dogma was later put into Republic custody."},{"b":15,"c":"REP_DOOM","f":"REP","n":"Commander Doom","v":"Commander Doom","p":"doom","e":"","t":"named canon era_prequel male non_sensitive","w":"Clone Commander at Ringo Vinda per bio; no extra faction. Identity from bio only, not searched.","bio":"Commander Doom was a Clone Commander who served under Jedi Generals Tiplee and Tiplar during the Clone Wars. At the Battle of Ringo Vinda, Doom and his men fought against the CIS on a space station that orbited the planet. During the battle, Tiplar was murdered by Tup, whose pre-mature activation of Order 66 cost the Republic the battle."},{"b":15,"c":"REP_DRAA","f":"REP","n":"Draa","v":"Draa","p":"draa","e":"","t":"named canon era_prequel non_sensitive","w":"41st Elite Corps trooper under Luminara Unduli per bio; no extra faction.","bio":"Draa was a Clone Trooper of the 41st Elite Corps and served under Jedi master Luminara Unduli during the Clone Wars. Taking part in the Second Battle of Geonosis, Draa took part in the attack on the primary droid foundry, distracting the Separatist forces, allowing Padawans Ahsoka Tano and Barriss Offee to destroy the factory\u0027s main reactor, thus winning the battle."},{"b":15,"c":"REP_ECHO","f":"REP","n":"Echo","v":"Echo|Echo|Echo (Phase I)","p":"echo","e":"","t":"named canon era_prequel male non_sensitive","w":"ARC trooper per bio. Later captured and rebuilt by Separatists, which was not membership; no extra faction.","bio":"Echo was a Clone Advanced Recon Commando Trooper of the 501st Legion\u0027s Torrent Company under Captain Rex during the Clone Wars. After the Rishi Station incident, Echo and Fives were given a place in the 501st Legion, and after the Battle of Kamino, were made ARC Troopers. During the Battle of Lola Sayu, Echo attempted to defend their escape shuttle from being destroyed, but the shuttle was destroyed, and while Echo survived, his rebuilding by the Separatists years later forced Echo to reveal Republic strategies, until he was rescued by Rex."},{"b":15,"c":"REP_EETH","f":"REP","n":"Eeth Koth","v":"Eeth Koth","p":"eeth koth","e":"JO","t":"named canon era_prequel jedi male","w":"Zabrak Jedi Master and High Council member per bio, so Jedi Order membership (JO).","bio":"Eeth Koth was a Zabrak male Jedi Master and member of the Jedi High Council during the Naboo Crisis and Clone Wars. During the Naboo Crisis, Eeth Koth was present when the young Anakin Skywalker was being tested. During the Clone Wars, Eeth Koth participated in the Battle of Geonosis and Saleucami. By the end of the war, Eeth would left the Jedi Order, deciding to raise a family. Years after the fall of the Republic, Eeth and his family were tracked down by Darth Vader, who slew Eeth and took Eeth\u0027s child to be trained as an Inquisitor."},{"b":15,"c":"REP_EL_LES","f":"REP","n":"El-les","v":"El-les","p":"el-les","e":"BH","t":"named canon era_prequel male non_sensitive","w":"Arcona bounty hunter hired by the Republic per bio and Wookieepedia (El-Les); bounty hunter variant gives BH.","bio":"El-Les was an Arcona male bounty hunter who, along with his partner Bric, was hired by the Galactic Republic to train clone cadets during the Clone Wars."},{"b":15,"c":"REP_EVEN","f":"REP","n":"Even Piell","v":"Even Piell|Even Piell","p":"even piell","e":"JO","t":"named canon era_prequel jedi male","w":"Lannik Jedi Master and High Council member per bio, so Jedi Order membership (JO).","bio":"Even Piell was a Lannik male Jedi Master and member of the Jedi High Council during the Clone Wars. Tasked with investigating shortcuts into Separatist space during the Clone Wars, Piell discovered the Nexus Route, a hyperlane route that allowed access to Republic and Separatist homeworlds. Captured and imprisoned on Lola Sayu, Piell was eventually rescued by Anakin Skywalker, Obi-wan Kenobi, and Ahsoka Tano. Piell was later mauled by an Anooba. Dying, he gave his half of the Nexus Route coordinates to Ahsoka."},{"b":15,"c":"REP_FALON","f":"REP","n":"Falon Grey","v":"Falon Grey","p":"falon grey","e":"JO","t":"named legends era_prequel jedi male","w":"Jedi Knight per Wookieepedia (Legends, non-canon), so Jedi Order membership (JO). Medium from search: Battlefront only.","bio":"Falon Grey was a Human male Jedi Knight who participated in the Clone Wars. Prior to the war, Falon Grey was severely injured, so Rahm Kota took Falon to the Kaminoans for medical attention. While they healed him, they also took a sample of his DNA without permission, and with them created two force sensitive clone troopers, X1 and X2. After the Clone Wars ended and the Order 66 was executed, Falon went into hiding as a farmer on Dantooine. There he was later tracked down and fatally injured by X1. Falon passed away after healing X2\u0027s wounds, and X2 later went on to defeat X1."},{"b":15,"c":"REP_FERRODA","f":"REP","n":"Ferroda","v":"Ferroda","p":"ferroda","e":"JO","t":"named legends era_prequel jedi male","w":"Pantoran Jedi Master and GAR general per Wookieepedia (Legends, non-canon), so Jedi Order membership (JO).","bio":"Ferroda was a Pantoran male Jedi Master who fought for the Republic during the Clone Wars. Initially overseeing a training center on Tatooine, where he became acquainted with the clones X1 and X2, Ferroda was eventually called to Cato Neimoidia under the command of Jedi High Council Member Plo Koon. After Order 66 was executed, Ferroda was confronted by X2 after taking out most of the clones formerly under his command, and in a brutal fight, X2 succeeded in executing his Jedi General. X2 came to regret his decision and wanted nothing to do with the Empire."},{"b":15,"c":"REP_FERUS","f":"REP","n":"Ferus Olin","v":"Ferus Olin","p":"ferus olin","e":"JO REB","t":"named legends era_prequel era_imperial jedi male","w":"Former Padawan who left the Order before the Clone Wars and later retrained. Wookieepedia (Legends): founded a rebel resistance on Bellassa after Order 66, so Jedi Order (JO) and Rebel Alliance (REB).","bio":"Ferus Olin was a Human male former Jedi that served the Jedi Order and later left during the final years of the Galactic Republic. Often clashing with fellow Padawan, Anakin Skywalker, Ferus took a strict adherance to the Jedi\u0027s rules and protocol, and was considered highly mature. After resigning from the Jedi Order prior to the Clone Wars, Ferus found a life of his own, and later retrained himself in the ways of the Force after the Empire rose to power. Ferus accepted a mission from Kenobi to watch over Princess Leia Organa, but the year after Alderaan\u0027s destruction, Ferus would engage Darth Vader, during which he was slain."},{"b":15,"c":"REP_FIL","f":"REP","n":"Commander Fil","v":"Commander Fil","p":"fil","e":"","t":"named canon era_prequel male non_sensitive","w":"Clone Commander under Nahdar Vebb per bio; no extra faction.","bio":"Commander Fil was a Clone Commander who served under Jedi General Nahdar Vebb during the Clone Wars. In a mission to recapture Nute Gunray on the Third Moon of Vassek inside General Grievous\u0027s castle, Fil was killed after Grievous released his pet roggwart, which slammed the commander into the ground, killing him."},{"b":15,"c":"REP_FIVES","f":"REP","n":"Fives","v":"Fives|Fives (Phase I)","p":"fives","e":"","t":"named canon era_prequel male non_sensitive","w":"ARC trooper of the 501st per bio; shot by Commander Fox. No extra faction.","bio":"Fives was a Clone Advanced Recon Command Trooper of the 501st Legion\u0027s Torrent Company under Captain Rex during the Clone Wars. After the Rishi Station incident, Echo and Fives were given a place in the 501st Legion, and after the Battle of Kamino, were made ARC Troopers. After Tup\u0027s malfunction during the Battle of Ringo Vinda, Fives investigated the cause and uncovered the Sith\u0027s plot to kill the Jedi. On the run, Fives attempted to explain his discovery to Rex and Anakin, but was shot dead by Commander Fox, keeping Order 66 secret."},{"b":15,"c":"REP_FIXER","f":"REP","n":"Fixer","v":"Fixer","p":"fixer","e":"","t":"named canon era_prequel non_sensitive","w":"Delta Squad Clone Commando and expert slicer per bio; no extra faction.","bio":"Fixer was a Clone Commando and Expert Slicer of Delta Squad during the Clone Wars. As a Commando, Fixer, along with Delta Squad, was tasked with more specialized missions unfit for other Clones. Following Boss\u0027s lead on Geonosis, the Republic Assault Cruiser Prosecutor, and Kachirho, the squad was able to clear the way for a full Republic invasion of Kashyyyk, at the expense of Sev."},{"b":15,"c":"REP_FORDO","f":"REP","n":"Captain Fordo","v":"Captain Fordo|Captain Fordo (Phase I)","p":"fordo","e":"","t":"named canon era_prequel male non_sensitive","w":"ARC Clone Captain per bio; no extra faction.","bio":"Fordo was a Clone Captain who served during the Clone Wars. Early in the war, Fordo was an ARC Trooper, who headed the rescue for Jedi Master Ki-Adi-Mundi, Shaak Ti, and Aayla Secura after their encounter with General Grievous. Fordo and his men attempted to take out the general, but to no avail. During the Battle of Coruscant, Fordo fought bravely against the Separatist forces, within the republic\u0027s capital."},{"b":15,"c":"REP_FOX","f":"REP","n":"Commander Fox","v":"Commander Fox","p":"fox","e":"GE","t":"named canon era_prequel era_imperial male non_sensitive","w":"Commander Fox (CC-1010), Coruscant Guard commander. Per Wookieepedia he remained head of the Coruscant Guard under the Empire until Vader executed him, so Galactic Empire (GE).","bio":"Commander Fox was a Clone Commander who led the Coruscant Guard, a special division of clone troopers who kept the peace on Coruscant during the Clone Wars. Stationed on Coruscant all throughout the Clone Wars, near the end of the war, Fox was charged with pursuing rogue clone trooper Fives, cornering the trooper and then shooting him when Fives pulled a blaster on him."},{"b":15,"c":"REP_GLYNN","f":"REP","n":"Glynn-Beti","v":"Glynn-Beti","p":"glynn-beti","e":"JO","t":"named legends era_prequel jedi female","w":"Bothan Jedi Master per Wookieepedia (Legends, non-canon), so Jedi Order membership (JO). Medium not verified.","bio":"Glynn-Beti was a Bothan female Jedi Master who served the Jedi Order during the Clone Wars. Glynn served the order on multiple fronts, helping in the Conquest of Raxus Prime where Dooku was attempting to locate a Force Harvester for the Dark Reaper project, and furthermore assisted in an evacuation of Cloud City during the war."},{"b":15,"c":"REP_GREE","f":"REP","n":"Commander Gree","v":"Commander Gree|Commander Gree (Phase I)","p":"gree","e":"","t":"named canon era_prequel male non_sensitive","w":"Commander of the 41st Elite Corps under Luminara Unduli per bio; no extra faction.","bio":"Commander Gree was a Clone Commander who led the 41st Elite Corps during the Clone Wars, and served under Jedi Master Luminara Unduli. During the Clone Wars, Gree participated in a number of battles, including the Second Battle of Geonosis. Near the end of the war at the Battle of Kashyyyk, Gree accompanied Luminara Unduli and Grand Master Yoda to the Wookiee homeworld. After Order 66 was issued, Gree, along with another clone trooper, attempted to kill the Grand Master, but both were instead decapitated."},{"b":15,"c":"REP_GREGOR","f":"REP","n":"Gregor","v":"Gregor","p":"gregor","e":"","t":"named canon era_prequel male non_sensitive","w":"Clone Commando captain of Foxtrot Group, Clone Wars S5 Missing in Action (Wookieepedia, via search). Only trained replacement troops under the Empire; no extra faction.","bio":"Gregor was a Clone Commando and Captain during the Clone Wars. During the Battle of Sarrish, Gregor crash-landed on Abafar, where he suffered from amnesia. Taken in by Borkus to work in his diner, Gregor worked as a dishwasher until he was discovered by Colonel Meebur Gascon. His memories returned, Gregor assisted Gascon and D-squad to board a cargo shuttle, sacrificing himself so the droids could escape. The explosion caused Gregor to go partially crazy, and by the Galactic Civil War, lived on an AT-TE with Wolffe and Rex."},{"b":15,"c":"REP_GROHTO","f":"REP","n":"Grohto","v":"Grohto","p":"grohto","e":"JO","t":"named legends era_prequel jedi male","w":"Ishi Tib Jedi Master per Wookieepedia (Legends, non-canon), first seen in The Clone Wars: The Sith Hunters, so Jedi Order membership (JO).","bio":"Born on Tibrin in the final decades of the Republic. Grohto, like many Force Sensitives in their youth, was submitted to the Jedi Order. Where he would be trained to wield his gift and be raised a guardian of peace and justice of the Republic. Like many of his kin in the Order, he was thrust into a very divisive and destructive conflict that would devour countless of beings throughout the galaxy and spell doom for the Jedi, the Clone Wars. During the war, a massacre was committed by an old foe that would bring to his fellow Jedi Master, Obi Wan Kenobi, total and utter disbelief. Maul has returned. And alongside his brother, Savage Opress, causing havoc to lure Kenobi. Grohto was assigned, along Master Kenobi, Jun Fan and Solok, to hunt down and bring these murderers to justice. A report has led Master Grohto to Orto Norwe. Grohto would never return."},{"b":15,"c":"REP_GUNNER","f":"REP","n":"Clone Gunner","v":"Clone Gunner","p":"generic","e":"GE","t":"generic canon era_imperial non_sensitive","w":"Imperial turbolaser gunners per bio, who served the Galactic Empire, so GE.","bio":"Imperial Gunners were individuals who handled all turbolaser defenses for imperial installations, space stations, and star destroyers, protecting them from rebel attacks during the Galactic Civil War."},{"b":15,"c":"REP_HALSEY","f":"REP","n":"Halsey","v":"Halsey","p":"halsey","e":"JO","t":"named canon era_prequel jedi male","w":"Roonan Jedi Master per bio and Wookieepedia (Halsey, canon), so Jedi Order membership (JO).","bio":"Halsey was a Roonan male Jedi Master during the Clone Wars. At least one year into the war, Halsey, along with his Padawan, Knox, were dispatched to the Temple of Eedit on the planet Devaron to defend it against a Separatist invasion. During the battle, the Nightbrother Savage Opress, being tested by Count Dooku, carved a path of destruction throughout the battle. Halsey and Knox attempted to defeat Savage Opress, but ultimately their efforts failed, as both were killed after a brief, but vicious duel."},{"b":15,"c":"REP_HANDMAIDEN","f":"REP","n":"Handmaiden","v":"Handmaiden","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Naboo Handmaidens (royal aides, guards and decoys) per bio; no extra faction.","bio":"Handmaidens were a group of young women chosen as aides to the Queen of the planet Naboo. Responsible for assisting the Queen with everyday tasks, they also served as her bodyguards and those chosen to join the entourage often closely resembled the current queen, allowing them to function as decoys should the need arise. The tradition of using handmaidens as protection and security for royal leaders originated generations prior to the Naboo Crisis, during more uncertain times."},{"b":15,"c":"REP_HARDCASE","f":"REP","n":"Hardcase","v":"Hardcase|Hardcase (Phase I)","p":"hardcase","e":"","t":"named canon era_prequel male non_sensitive","w":"501st trooper under Pong Krell on Umbara per bio; no extra faction.","bio":"Hardcase was a Clone Trooper of the 501st Legion who served under Jedi general Pong Krell during the Clone Wars. During the Battle of Umbara, Hardcase, along with Jesse and Fives, disobeyed orders from Krell and attacked a Separatist supply ship. So Jesse and Fives could escape, Hardcase sacrificed himself by destroying the ship\u0027s reactor."},{"b":15,"c":"REP_HOUND","f":"REP","n":"Sergeant Hound","v":"Sergeant Hound","p":"hound","e":"","t":"named canon era_prequel male non_sensitive","w":"ARF scout trooper sergeant of the Coruscant Guard (Wookieepedia Hound, via search); no extra faction.","bio":"Hound was an Advanced Recon Force Trooper who served in the Coruscant Guard under Commander Fox during the Clone Wars."},{"b":15,"c":"REP_HUNTER","f":"REP","n":"Hunter","v":"Hunter","p":"hunter","e":"","t":"named canon era_prequel male non_sensitive","w":"Bad Batch leader per bio. Later mercenary work is not membership in a listed faction; no extra faction.","bio":"Hunter was a Human male Clo
