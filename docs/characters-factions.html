<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWGL Characters</title>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#efede8; --text:#1d1c1a; --muted:#6b6862;
  --border:#dcd8d0; --accent:#b8860b; --accent-soft:#f3e6c4; --link:#7a5a00;
  --ok:#2f7d4f; --warn:#a15c00; --bad:#a83232; --chip:#ebe8e1;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214; --surface:#1b1b1f; --surface-2:#232328; --text:#ecebe7; --muted:#9d9a93;
    --border:#2f2f35; --accent:#e0b443; --accent-soft:#3a3120; --link:#f0c95e;
    --ok:#5fbf86; --warn:#e3a14b; --bad:#e07070; --chip:#2a2a30;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#121214; --surface:#1b1b1f; --surface-2:#232328; --text:#ecebe7; --muted:#9d9a93;
  --border:#2f2f35; --accent:#e0b443; --accent-soft:#3a3120; --link:#f0c95e;
  --ok:#5fbf86; --warn:#e3a14b; --bad:#e07070; --chip:#2a2a30;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--link)}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
.bar{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:20px;height:56px}
.brand{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;white-space:nowrap}
.brand span{color:var(--accent)}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);white-space:nowrap;font-weight:500}
nav a:hover{background:var(--surface-2);color:var(--text)}
nav a.active{background:var(--accent-soft);color:var(--text)}
@media (max-width:560px){.brand{display:none}.bar{gap:8px}nav a{padding:8px 9px}}
.theme{margin-left:auto;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:19px;margin:36px 0 12px}
h3{font-size:16px;margin:0 0 8px}
.lede{color:var(--muted);max-width:760px;margin:0 0 24px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.stat .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:13px}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.alert{border-left:4px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin:4px 0}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;margin:2px 3px 2px 0;white-space:nowrap}
.chip.fac{background:var(--accent-soft);font-weight:600}
.chip.add{background:transparent;border:1px dashed var(--accent);font-weight:600}
.chip small{color:var(--muted);margin-left:4px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;min-width:26px;text-align:center;border-radius:6px;padding:0 6px;font-weight:600;font-size:13px}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
select,input[type=search]{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font:inherit}
input[type=search]{min-width:220px;flex:1}
.btn{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}
.btn:disabled{opacity:.4;cursor:default}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:14px}
.note{background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:0 0 16px;color:var(--text)}
.char{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin:0 0 10px;box-shadow:var(--shadow)}
.char summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.char summary::-webkit-details-marker{display:none}
.char .nm{font-weight:600}
.char .cd{color:var(--muted)}
.char .fx{text-align:right}
.char .body{padding:0 16px 14px;border-top:1px solid var(--border)}
.char dl{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;margin:12px 0 0}
.char dt{color:var(--muted);font-size:13px}
.char dd{margin:0}
@media (max-width:600px){.char dl{grid-template-columns:1fr}.char dt{margin-top:6px}}
.flag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-left:6px}
.flag.fix{color:var(--ok)} .flag.unv{color:var(--warn)}
.empty{color:var(--muted);padding:24px;text-align:center}
.dup td:first-child{font-weight:600}
footer{color:var(--muted);font-size:13px;text-align:center;padding:24px 16px}
</style>
</head>

<script>
const DATA = [{"b":1,"c":"ASE_AJUNTA","f":"ASE","n":"Ajunta Pall","v":"Ajunta Pall","p":"ajunta pall","e":"JO","t":"named legends era_ancient fallen_jedi sith male","w":"Former Jedi Master before turning Dark Lord of the Sith; Jedi membership was a significant part of his story (bio).","bio":"Ajunta Pall was a human Jedi Master and one of the first recorded Dark Jedi in galactic history.  After ascending the ranks of the Jedi his thirst for knowledge remained unquenched, and Pall began to study the long-forgotten practice of alchemy, hoping - and succeeding - to master the creation and alteration of life itself.  Exiled by the Jedi for fear of his obsessive search for greater control over life and The Force, Pall fled to Korriban, far outside of Republic-occupied space.  There he encountered the Sith Pureblood, and upon killing their leader was named the first Dark Lord of the Sith.  The Kissai, a monastic caste of Sith Pureblood, believed Pall to be a reincarnation of their god and worshiped him as such.  How Pall died has been lost to history, but thousands of years later during his quest for the Star Forge Revan laid his soul to rest and finally allowed him to become one with The Force."},{"b":1,"c":"ASE_ANDEDDU","f":"ASE","n":"Darth Andeddu","v":"Darth Andeddu","p":"andeddu","e":"","t":"named legends era_ancient sith male","w":"Sith Lord of the Old Sith Empire; bio mentions no other faction.","bio":"Darth Andeddu was a near-human Sith Lord who reigned so far in the distant past that even knowledge of his true species has been lost to time.  He is speculated to be the first Sith Lord to bear the \"Darth\" title, as well as discovering the Force can be used to move one\u0027s consciousness to a new host body, effectively conquering death.  His paranoia of losing this power led him to seal his body in a temple guarded by cultists in his service.  His body was disturbed by Darth Wyyrlok III, who had sought out Andeddu\u0027s power in hopes of saving Darth Krayt\u0027s life from the Yuuzhan Vong.  After a duel between the two Sith Andeddu\u0027s soul was destroyed by the superior warrior\u0027s power, who then laid him to rest for the true final time."},{"b":1,"c":"ASE_DRAMATH","f":"ASE","n":"Lord Dramath","v":"Lord Dramath","p":"dramath","e":"","t":"named legends era_ancient sith male","w":"Pureblood Sith Lord ruling Medriaas; bio mentions no other faction.","bio":"Dramath was a male Sith Pureblood, and a Lord in the Old Sith Empire.  He ruled over the planet Medriaas in the years leading up to the Great Hyperspace War.  Unlike many Sith, Dramath had no grand ambitions of power or influence, content to live his hedonistic lifestyle of food, drink, and intimate company.  The lattermost point would turn out to be his downfall, as growing up in a broken household would lead one of his bastard children to strike him down and go on to become one of the greatest evils the galaxy ever knew."},{"b":1,"c":"ASE_FREEDON","f":"ASE","n":"Freedon Nadd","v":"Freedon Nadd","p":"freedon nadd","e":"","t":"named legends era_ancient fallen_jedi sith male","w":"Jedi prodigy only briefly before turning; short Jedi phase is not a significant membership, then Sith King of Onderon.","bio":"Freedon Nadd was a Human male Sith Lord who reigned as King of Onderon in the centuries prior to Exar Kun\u0027s fall to the dark side. Once a Jedi prodigy, Freedon\u0027s lust for power ultimately caused him to strike down his master and seek out Naga Sadow on Yavin IV. After learning all he could from Sadow, Freedon also killed him. Seeking a world for himself, Freedon took control of the planet Onderon, reigning as king for over a hundred years before he passed away. Freedon Nadd\u0027s spirit was later entombed on Dxun, corrupting Exar Kun to the dark side of the Force, and was later destroyed on Yavin IV by Kun himself."},{"b":1,"c":"ASE_KALLIG","f":"ASE","n":"Aloysuis Kallig","v":"Aloysuis Kallig","p":"aloysuis kallig","e":"","t":"named legends era_ancient sith male","w":"Old Sith Lord; bio mentions no other faction.","bio":"Aloysuis Kallig was a male Sith Lord of the old Sith Empire. Like many ancient Sith, his name was all but forgotten, only mentioned briefly in the writings of Tulak Hord, his rival. Assassinated,  Kallig would roam Dromund Kaas for millenia until servants of Vitiate built the Dark Temple over his tomb, which he later created his own kingdom out of. During the Cold War, he met his descendent, the future Darth Nox, and helped guide them, allowing his bloodline to be restored to greatness once again."},{"b":1,"c":"ASE_KISSAI","f":"ASE","n":"Kissai","v":"Kissai","p":"generic","e":"","t":"generic legends era_ancient sith","w":"Sith subspecies forming the Kissai people, not an individual; no other faction.","bio":"The Kissai was a subspecies of the Sith species that were brought into the Ancient Sith Empire in the millenia prior to the Great Hyperspace War. Though originally from Korriban, the species emigrated to the world of Ziost until their exile back to Korriban, where they were forced into the Sith Empire. By the end of the Great Hyperspace War, the Kissai were largely considered extinct, though no official confirmations were ever made."},{"b":1,"c":"ASE_LUDO","f":"ASE","n":"Ludo Kressh","v":"Ludo Kressh","p":"ludo kressh","e":"","t":"named legends era_ancient sith male","w":"Sith Lord of the Ancient Sith Empire; bio mentions no other faction.","bio":"Ludo Kressh was a Sith Male Sith Lord who ruled the Sith Empire for a brief time. Kressh was obsessed with maintaining Sith tradition. He often clashed with his hated rival, Naga Sadow, about how to rule the Sith Empire. After discovering Sadow had fooled the Sith into war, Kressh attacked his base, then faked his death. Eventually, after Sadow was nearly defeated at the end of the war, Kressh resurfaced attacking Sadow. Sadow outwitted and killed Kressh ending their rivalry and maintaining the title of Dark Lord."},{"b":1,"c":"ASE_RAGNOS","f":"ASE","n":"Marka Ragnos","v":"Marka Ragnos|Marka Ragnos (Spirit)","p":"marka ragnos","e":"","t":"named legends era_ancient sith male","w":"Hybrid Sith ruler of the first Sith Empire; no other faction.","bio":"Marka Ragnos was a hybrid Sith-Human Male Sith Lord who ruled the first Sith Empire in 5100 BBY. He earned the title Dark Lord after defeating the Sith Lord Simus. He ruled the Sith Empire for a hundred years with an iron fist. After 100 years, Ragnos ultimately passed away of old age with his death marking the end of a golden age for the Sith Empire. However, even in death he continued to  train new Sith and plot his return. His resurrection was later prevented by Jaden Korr in 14 ABY, who trapped his spirit in his tomb."},{"b":1,"c":"ASE_SADOW","f":"ASE","n":"Naga Sadow","v":"Naga Sadow","p":"naga sadow","e":"","t":"named legends era_ancient sith male","w":"Hybrid Sith Dark Lord leading the Great Hyperspace War; no other faction.","bio":"Naga Sadow was a Hybrid Sith-human male Dark Lord of the Sith prior to and during the Great Hyperspace War in 5000 BBY. After Marka Ragnos\u0027 death, Sadow solidified his position of power. Soon after, two explorers ventured to Korriban. He deceived them into believing that they could trust him and utilized them for knowledge of hyperspace routes to bring conflict to the galaxy. After a few victories against the Republic, Naga Sadow inevitably failed and fled to Yavin IV, where he dwelled and later died at the hands of Freedon Nadd in 4400 BBY."},{"b":1,"c":"ASE_TENEBRAE","f":"ASE","n":"Tenebrae","v":"Tenebrae","p":"tenebrae","e":"","t":"named legends era_ancient sith male","w":"Pureblood Sith Lord, later Vitiate/Valkorion; no other faction in bio.","bio":"Tenebrae was a male Sith Pureblood who, fed by the hatred and despair stoked by his abusive and deceit-filled upbringing, became one of the most powerful Sith Lords in history.  By age ten he had amassed a body count of thousands, ultimately drawing the ire of his father, Lord Dramath.  Tenebrae killed his father and, after the Great Hyperspace War, lured all the remaining Sith Lords to his home planet, where he orchestrated a great and terrible ritual to absorb all the life essence in the system.  This left his competition as well as his homeworld little more than empty husks, their considerable life force having fed into him, and made him nearly immortal."},{"b":1,"c":"ASE_TULAK","f":"ASE","n":"Tulak Hord","v":"Tulak Hord","p":"tulak hord","e":"","t":"named legends era_ancient sith male","w":"Early Sith Lord commanding Sith armies; no other faction.","bio":"Tulak Hord was a male Sith Lord that ruled during the early Sith  Empire. He commanded great armies and possessed a mastery of the  Dark Side of the Force and lightsaber combat which left him almost nearly unrivaled. Later on in his life, Tulak Hord met Ortan Cela, who would then become his apprentice. Hord taught Cela a great deal about the Sith, but in the end that was his downfall. Tulak Hord died at the hands of his own apprentice. Hord\u0027s loyal followers eventually created a tomb for him to rest on Korriban."},{"b":1,"c":"BH_4LOM","f":"BH","n":"4-LOM","v":"4-LOM","p":"4-lom","e":"","t":"named canon era_imperial non_sensitive","w":"Protocol droid turned bounty hunter in the Empire Strikes Back hunt for the Falcon; hired only for that job.","bio":"4-LOM was a LOM-series protocol droid turned Bounty Hunter and was active during the Galactic Civil War. Sometime after the Battle of Hoth, 4-LOM, along with a number of other bounty hunters, answered a call from Darth Vader to hunt down the Millenium Falcon. 4-LOM failed in this bounty, losing it to rival hunter Boba Fett."},{"b":1,"c":"BH_AURRA","f":"BH","n":"Aurra Sing","v":"Aurra Sing|Aurra Sing (Jedi Hunter)","p":"aurra sing","e":"","t":"named canon era_prequel female non_sensitive","w":"Hunter who worked with Boba Fett and Cad Bane on jobs; not a member of any faction.","bio":"Aurra Sing was a Near-human Bounty Hunter active prior to and during the Clone Wars. During the war, Sing teamed up with Boba Fett in his efforts to exact his revenge on Mace Windu for killing his father, Jango Fett. Additionally, she took part in a number of other jobs for Ziro the Hutt and Cad Bane, working as either an assassin or back-up for their respective jobs. Years later, Aurra would be killed by Tobias Beckett at some point during the reign of the Galactic Empire, who pushed her off a cliff to her death."},{"b":1,"c":"BH_BOBA","f":"BH","n":"Boba Fett","v":"Boba Fett|Boba Fett (Young)|Boba Fett (Child)|Boba Fett (Hunter)|Boba Fett (Panna)|Boba Fett (Resurfaced)","p":"boba fett","e":"MANDO","t":"named canon era_prequel era_imperial era_new_republic male non_sensitive","w":"Mandalorian clone and bounty hunter; Mandalorian identity is central in The Mandalorian and his armor storyline.","bio":"Boba Fett was a Human male Bounty Hunter and clone of Jango Fett. The first clone, Boba was raised by Jango as his own son. After witnessing his father\u0027s murder, Boba swore revenge and spent the Clone Wars attempting to kill Mace Windu. During the Galactic Civil War, Fett was often hired by the Empire, notably Darth Vader, while searching for the smuggler Han Solo. Above the Pit of Carkoon, Boba was thrown in the Sarlacc pit after a blind Han Solo accidently struck his jetpack. Boba eventually escaped from the pit and years later recovered his armor from Din Djarin. Boba would later lay claim as Daimyo of Tatooine."},{"b":1,"c":"BH_BOSSK","f":"BH","n":"Bossk","v":"Bossk","p":"bossk","e":"","t":"named canon era_prequel era_imperial male non_sensitive","w":"Trandoshan hunter hired on jobs for the Empire and others; no sustained membership.","bio":"Bossk was a Trandoshan Bounty Hunter active during the Clone Wars and Galactic Civil War. During the Clone Wars, Dengar, along with Boba Fett, Asajj Ventress, Dengar, and other bounty hunters, was hired by Otua Blank to escort special cargo on a subtram. Dengar however, was knocked off during the battle, but survived and received his pay. During the Galactic Civil War, Bossk was hired alongside a number of other hunters to capture the Millenium Falcon, but lost the bounty to Boba Fett."},{"b":1,"c":"BH_BOUSHH","f":"BH","n":"Boushh","v":"Boushh","p":"boushh","e":"","t":"named canon era_imperial male non_sensitive","w":"Ubese hunter known from Return of the Jedi, impersonated by Leia; no faction.","bio":"Boushh was an Ubese male Bounty Hunter active during the Galactic Civil War. Following his little-known demise at the hands of the Black Sun crime syndicate, Princess Leia Organa impersonated him in order to infiltrate Jabba\u0027s Palace and free Han Solo."},{"b":1,"c":"BH_C21","f":"BH","n":"C-21 Highsinger","v":"C-21 Highsinger","p":"c-21 highsinger","e":"CRIM","t":"named legends era_prequel era_imperial non_sensitive","w":"Droid hunter in Krayt\u0027s Claw, a criminal syndicate, during the Clone Wars.","bio":"C-21 Highsinger was a Droid Bounty Hunter that was active during the Clone Wars. During the war, Highsinger was a part of Krayt\u0027s Claw, which contained other hunters which also included Boba Fett, Bossk, Dengar, Latts Razzi, and Oked. During the Galactic Civil War, Highsinger was one of many bounty hunters hired by Darth Vader to return Doctor Aphra to him."},{"b":1,"c":"BH_CAD","f":"BH","n":"Cad Bane","v":"Cad Bane","p":"cad bane","e":"CIS CRIM","t":"named canon era_prequel era_imperial male non_sensitive","w":"Hired by the Confederacy to lead battles in the Clone Wars and later worked for the Pyke Syndicate, a crime syndicate.","bio":"Cad Bane was a Duros male Bounty Hunter active during the Clone Wars. Considered to be the best bounty hunter in the galaxy after Jango Fett\u0027s death, Cad was often hired by the Confederacy of Independent Systems during the Clone Wars, taking charge of a number of separatist battles, using his wits and skill in fighting Jedi to his advantage. Cad Bane was still active after the rise of the Galactic Empire, attempting to capture Omega, a member of Clone Force 99. After the fall of the Galactic Empire, Bane was employed by the Pyke Syndicate to keep the spice trade flowing through Tatooine, until he was confronted and killed by Boba Fett."},{"b":1,"c":"BH_CALO","f":"BH","n":"Calo Nord","v":"Calo Nord","p":"calo nord","e":"","t":"named legends era_old_republic male non_sensitive","w":"Bounty hunter hired by Malak for a single job; no lasting membership.","bio":"Calo Nord was a Human male Bounty Hunter active during the Jedi Civil War. Sold into slavery at a young age, Calo killed his slavemasters and then tracked down his parents, killing them too. By the Jedi Civil War, Calo was on Taris when the Sith bombarded the planet, Calo and Davik Kang confronted the amnesiac Revan, but was trapped underneath debris. After escaping Taris, Calo was hired by Malak to hunt down Bastila Shan and Revan, eventually tracking them to Tatooine, where he was killed by the former Sith Lord."},{"b":1,"c":"BH_CATO","f":"BH","n":"Cato Parasitti","v":"Cato Parasitti","p":"cato parasitti","e":"CRIM","t":"named canon era_prequel female non_sensitive","w":"Clawdite infiltrator working with Cad Bane on the Holocron Heist; worked for a criminal employer.","bio":"Cato Parasitti was a Clawdite female Bounty Hunter who worked with Cad Bane during the Holocron Heist incident during the Clone Wars. Tasked by Bane to guide him to the Holocron vault, Cato took on the image of deceased Jedi Ord Eniscence, and worked with Bane within the Jedi Temple Archives. After being confronted by Jocasta Nu, Cato knocked her out and took her form instead. Though the heist was a success, Cato was ultimately discovered by Ahsoka Tano and was incarcerated, but not before informing the Jedi of Bane\u0027s next target, Bolla Ropal."},{"b":1,"c":"BH_CRADOSSK","f":"BH","n":"Cradossk","v":"Cradossk","p":"cradossk","e":"","t":"named legends era_imperial male non_sensitive","w":"Led the Bounty Hunter\u0027s Guild, which is covered by the BH tag, no other faction.","bio":"Cradossk was a Trandoshan male Bounty Hunter who led the Bounty Hunter\u0027s Guild during the Clone Wars up until the early years of the Galactic Civil War. Once a legendary bounty hunter, Cradossk took on contracts with his son, Bossk. However, as time went on, his relationship with his son began to dwindle. A year after the first Death Star was destroyed, Cradossk grew tired of Bossk\u0027s rebellious ways to hunting and attempted to kill him with help of the bounty hunter Zuckuss. However, Zuckuss betrayed Cradossk and allowed Bossk to murder and devour his father, which helped begin the Bounty Hunter Wars."},{"b":1,"c":"BH_DENGAR","f":"BH","n":"Dengar","v":"Dengar","p":"dengar","e":"","t":"named canon era_prequel era_imperial male non_sensitive","w":"Hired hunter who appeared in Clone Wars and Empire Strikes Back; not a member of a faction.","bio":"Dengar was a Human male bounty hunter active during the Clone Wars and Galactic Civil War. During the Clone Wars, Dengar, along with Boba Fett, Asajj Ventress, and other bounty hunters, was hired by Otua Blank to escort some special cargo on a subtram. Dengar however, was knocked off during the battle, but survived and received his pay. During the Galactic Civil War, Dengar was hired alongside a number of other hunters to capture the Millenium Falcon."},{"b":1,"c":"BH_EMBO","f":"BH","n":"Embo","v":"Embo","p":"embo","e":"","t":"named canon era_prequel male non_sensitive","w":"Kyuzo hunter in the Clone Wars, freelancing; no faction.","bio":"Embo was a Kyuzo male Bounty Hunter active during the Clone Wars. He carried a bowcaster and wore a large-rimmed circular hat, which he used as a weapon or a shield. He was renowned as one of the most skilled bounty hunters of his time, at one point managing to match the Jedi Anakin Skywalker. He also owned a pet anooba named Marrok and a saucer-shaped starship called the Guillotine."},{"b":1,"c":"BH_FENNEC","f":"BH","n":"Fennec Shand","v":"Fennec Shand","p":"fennec shand","e":"","t":"named canon era_new_republic female non_sensitive","w":"Sharpshooter hunter who worked with Boba Fett; freelance with no faction membership.","bio":"Fennec Shand was a Human female Bounty Hunter who was active in the galaxy following the Clone Wars and the years following the end of the Galactic Civil War. Over the course of her bounty hunting career, Fennec gained a reputation as both a lone wolf and an expert sharpshooter, supposedly never missing a shot. Years after the Galactic Civil War, the Mandalorian Din Djarin and an upcoming bounty hunter Toro Calican. Though the pair was successful in capturing Shand, Toro shot and mortally wounded Shand. Shand\u0027s life was saved by Boba Fett, and the pair travelled to Tython to retrieve Boba\u0027s armor from Djarin. After recovering Fett\u0027s armor and rescuing the Mandalorian foundling Grogu from Moff Gideon, Shand accompanied Boba back to Tatooine and assisted him in taking over as Daimyo of Tatooine."},{"b":1,"c":"BH_GEREVICK","f":"BH","n":"Gerevick","v":"Gerevick","p":"gerevick","e":"","t":"named legends era_old_republic male non_sensitive","w":"Dantooine salvager and hunter in KOTOR II; no faction.","bio":"Gerevick was a Near-Human male Bounty Hunter who lived as a salvager and bounty hunter on Dantooine during the Dark Wars. Often with a high opinion of himself, Gerevick made a reputation for himself as being very narcissistic and violent. During Meetra Surik\u0027s quest to locate the Jedi Master Vrook Lamar, Gerevick confronted Surik and her companions within the Jedi Enclave\u0027s sublevel in hopes of claiming the bounty on Surik\u0027s head. After a brief battle, Gerevick and his accomplices were killed"},{"b":1,"c":"BH_GREEDO","f":"BH","n":"Greedo","v":"Greedo","p":"greedo","e":"HC","t":"named canon era_prequel era_imperial male non_sensitive","w":"Rodian hunter employed by Jabba the Hutt, the Hutt Cartel; no other faction.","bio":"Greedo was a Rodian male Bounty Hunter active during the Clone Wars and Galactic Civil War. During the Clone Wars, Greedo was employed to Jabba the Hutt as one of his bounty hunters. He was hired by the Trade Federation to kidnap Chairman Papanoida\u0027s daughters, and while the daughters were rescued, Greedo slipped away. During the Galactic Civil War, Greedo tracked down Han Solo to the Mos Eisley cantina, where he was shot dead by the smuggler."},{"b":1,"c":"BH_GREEF","f":"BH","n":"Greef Karga","v":"Greef Karga","p":"greef karga","e":"","t":"named canon era_new_republic male non_sensitive","w":"Led the Bounty Hunter\u0027s Guild and later governed Nevarro; no faction beyond BH.","bio":"Greef Karga was a Human male who led the Bounty Hunter\u0027s Guild during the early years of the New Republic. Tasked with handing out bounty pucks to fellow hunters, Greef acted as the liason between the client and hunter. After learning that bounty hunter Din Djarin betrayed the client who tasked him with retrieving the former Jedi youngling Grogu, Greef teamed with the other hunters on Nevarro to take down Djarin. After some time passed, Greef lured back Djarin after the Empire laid claim to Nevarro, intending to double-cross him, but having a change of heart after Grogu saved his life. Greef devoted his time to lead the people of Nevarro to eradicate the Empire from the planet, working with Din Djarin and New Republic Marshall Cara Dune. By the time Boba Fett\u0027s rule over Tatooine was seemingly unchallenged, Greef became High Magistrate of Nevarro."},{"b":1,"c":"BH_HANHARR","f":"BH","n":"Hanharr","v":"Hanharr","p":"hanharr","e":"","t":"named legends era_old_republic male non_sensitive","w":"Wookiee hunter in KOTOR II; works alone; no faction.","bio":"Hanharr was a Wookiee male who operated out of Nar Shaddaa during and after the years of the Jedi Civil War. Once Czerka Corporation arrived on Kashyyyk, Hanharr regarded Czerka\u0027s strength and refused to allow his tribe to be enslaved. Driven mad by his freedom within the Shadowlands, Hanharr murdered his entire village. Though captured by Czerka, Hanharr was able to break free and murdered his captives, eventually the ship he was trapped on reaching Nar Shaddaa. Driven to further insanity by swearing a life-debt to Mira, Hanharr obsessed with killing her, ultimately getting his chance within Visquis\u0027s stronghold. However, Hanharr was defeated by Mira who left him for dead. However, Hanharr was saved by Darth Traya, who healed the worst of his wounds, and cursing Hanharr with another debt. Promising Hanharr an end to his life-debt if he killed Mira, Hanharr later reunited with Mira on Malachor V. After a final duel against her, Hanharr lost, and pleaded to Mira to end his life. Mira ultimately granted his request and slew him."},{"b":1,"c":"BH_HARDEEN","f":"BH","n":"Rako Hardeen","v":"Rako Hardeen","p":"rako hardeen","e":"","t":"named canon era_prequel male non_sensitive","w":"Hunter whose identity the Jedi used as a disguise for Obi-Wan; not a faction member.","bio":"Rako Hardeen was a Human male Bounty Hunter active during the Clone Wars. Hired to assassinate Obi-wan Kenobi, Hardeen succeeded and met with his employers, revealed to be the Jedi Order. Using Rako\u0027s voiceprint and likeness, the Order was able to disguise Obi-wan Kenobi as Rako Hardeen, and prevent the Chancellor from being kidnapped."},{"b":1,"c":"BH_IG11","f":"BH","n":"IG-11","v":"IG-11","p":"ig-11","e":"","t":"named canon era_new_republic non_sensitive","w":"Assassin droid who later became ally to Din Djarin; no faction membership.","bio":"IG-11 was an IG-series assassin droid who was active during the early years of the New Republic. Hired by a mysterious client, IG-11 and the Mandalorian Din Djarin stormed an encampment to obtain a valuable asset, which turned out to be a child. Though destroyed by Djarin, IG-11\u0027s remains were recovered by the Ugnaught Kuill, who repaired and reprogrammed the droid to nurse and protect. On Nevarro, IG-11 utilized his built-in self destruct mechanism to annihilate a platoon of Stormtroopers threataning to harm Djarin and his companions."},{"b":1,"c":"BH_IG88","f":"BH","n":"IG-88","v":"IG-88|IG-88|IG-88","p":"ig-88","e":"","t":"named canon era_imperial non_sensitive","w":"Droid hunter in Empire Strikes Back; hired only for that job.","bio":"IG-88 was a droid Bounty Hunter active during the Galactic Civil War. Sometime after the Battle of Hoth, IG-88, along with a number of other bounty hunters, answered a call sent out by Darth Vader, who sought the Millenium Falcon\u0027s capture. However, IG-88\u0027s rival, Boba Fett, succeeded in capturing the ship."},{"b":1,"c":"BH_JANGO","f":"BH","n":"Jango Fett","v":"Jango Fett","p":"jango fett","e":"MANDO","t":"named canon era_prequel male non_sensitive","w":"Mandalorian bounty hunter and clone template; Mandalorian identity central to his story.","bio":"Jango Fett was a Human male Mandalorian Bounty Hunter prior to the Clone Wars. Hired by Count Dooku was the template for the Clone Army, Jango accepted the offer, on condition he would get the first clone for himself, unmodified. Prior to the Clone Wars, Fett was hired by the Separatists to assassinate Senator Padm� Amidala. On Geonosis, in the Petranaki Arena, Jango was killed after attempting to kill Mace Windu, who decapitated him, ending his life."},{"b":1,"c":"BH_JARIAH","f":"BH","n":"Jariah Syn","v":"Jariah Syn","p":"jariah syn","e":"","t":"named legends era_legacy male non_sensitive","w":"Bounty hunter in Cade Skywalker\u0027s crew; no faction.","bio":"Jariah Syn was a Human male Bounty Hunter who was active during Darth Krayt\u0027s reign as Dark Lord of the Sith. Working with Cade Skywalker, who at first unknowing to him was a former Jedi, Syn along with Cade\u0027s other crew were used as pawns in an effort to turn Cade to the dark side. Though the revelation that Cade was a Jedi threw off Jariah, Jariah decided to continue working with Cade against Krayt\u0027s Empire."},{"b":1,"c":"BH_JODO","f":"BH","n":"Jodo Kast","v":"Jodo Kast","p":"jodo kast","e":"","t":"named legends era_imperial male non_sensitive","w":"[corrigé] Former Rebellion member before turning to bounty hunting; Rebel membership fits the bio.","bio":"Jodo Kast was a Human male bounty hunter who was active during the final years of the Galactic Civil War. Once a former member of the Rebellion, Jodo took on bounty hunting after accidentally killing the Mandalorian Feskitt Bobb. Taking up the fallen Mandalorian\u0027s armor, Jodo painted the armor to resemble Boba Fett, and often pretended to be him. However, his trickery was short-lived, as a year after the second Death Star was destroyed, the real Boba Fett tracked down Jodo who mocked him for stealing his identity. After a vicious firefight between the two, Fett emerged victorious, rigging Kast\u0027s jetpack to detonate."},{"b":1,"c":"BH_KRRSANTAN","f":"BH","n":"Krrsantan","v":"Krrsantan","p":"krrsantan","e":"HC","t":"named canon era_imperial era_new_republic male non_sensitive","w":"Wookiee hunter hired by Jabba the Hutt; Hutt Cartel employment is a significant part of his story.","bio":"Krrsantan was a Wookiee male Bounty Hunter who was active during the reign of the Galactic Empire and the years following. Forced to flee Kashyyyk and shunned by his own people, Krrsantan made a living as a gladitorial fighter and later Bounty Hunter after being hired by Jabba the Hutt to track down Obi-Wan Kenobi, who was stopping Jabba\u0027s water tax from being enforced. After the fall of the Galactic Empire, Krrsantan was hired to kill Boba Fett, who had laid claim as Daimyo of Tatooine. After his attempt failed and he was shunned by his employers, Krrsantan worked alongside Boba Fett to defend Mos Espa against the Pyke Syndicate."},{"b":1,"c":"BH_LATTS","f":"BH","n":"Latts Razzi","v":"Latts Razzi","p":"latts razzi","e":"CRIM","t":"named canon era_prequel female non_sensitive","w":"Theelin hunter with Krayt\u0027s Claw, a criminal syndicate, and later the Razzi Syndicate.","bio":"Latts Razzi was Theelin female bounty hunter active during and after the Clone Wars, primarily working with the syndicate Krayt\u0027s Claw. She participated in various high-stakes missions, including a job on Quarzite involving Asajj Ventress and later helped rescue the Jedi Quinlan Vos. Known for her martial arts prowess and grappling boa, Razzi played pivotal roles in combat against Kage Warriors and Separatist forces. Though often pragmatic and profit-driven, she occasionally showed a degree of loyalty to her team. After the war, she formed the Razzi Syndicate, which competed with the Pyke Syndicate and clashed with Crimson Dawn. Despite her ambitious rise, her fate became uncertain in the Imperial Era, with former allies like Boba Fett noting she had mysteriously disappeared."},{"b":1,"c":"BH_MONTROSS","f":"BH","n":"Montross","v":"Montross","p":"montross","e":"MANDO","t":"named legends era_prequel male non_sensitive","w":"Former Mandalorian who betrayed Jaster Mereel during the Mandalorian Civil War before becoming a hunter.","bio":"Montross was a Human Male Bounty Hunter and former Mandalorian that was active in the decades prior to the Naboo Crisis. During the Mandalorian Civil War, Montross betrayed Jaster Mereel and left him to die, wishing the title of Mandalore for himself. However, thanks to Jango Fett, the true story was told and Montross was immediately banished. Years later, Montross and Jango were invited to compete for the head of Komari Vosa, which put him and Fett at odds against each other. On Kohlma, Montross and Jango fought one last time and Montross was defeated. Montross was then torn to shreds by Bando Gora followers."},{"b":1,"c":"BH_SEERAA","f":"BH","n":"Seer\u0027aa","v":"Seer\u0027aa","p":"seer\u0027aa","e":"CRIM","t":"named legends era_old_republic female non_sensitive","w":"Twi\u0027lek assassin working for the criminal Goto on Nar Shaddaa.","bio":"Seer\u0027aa was a Twi\u0027lek female Assassin, who along with her sister, Teer\u0027aa, worked as Assassins for the crime lord Goto during the Dark Wars. When Meetra Surik arrived on Nar Shaddaa, all hunters were forbidden from directly confronting Surik. After Surik left for the Jekk\u0027Jekk Tarr, the sisters confronted Atton Rand in one of the cantinas, but were defeated but survived the encounter. The sisters later confronted Surik aboard the Visionary, and both were slain."},{"b":1,"c":"BH_SHAHAN","f":"BH","n":"Shahan Alama","v":"Shahan Alama","p":"shahan alama","e":"","t":"named canon era_prequel male non_sensitive","w":"Weequay hunter who worked alongside Cad Bane during the Senate crisis; no faction.","bio":"Shahan Alama was a Weequay male Bounty Hunter who worked alongside Cad Bane during the Senate Hostage Crisis during the Clone Wars. While patrolling the halls of the Senate building, Alama noticed that another Bounty Hunter droid, IG-86 had been neutralized. Alama corrected deduced that the Jedi that took the droid out was unarmed."},{"b":1,"c":"BH_SKAHTUL","f":"BH","n":"Skahtul","v":"Skahtul","p":"skahtul","e":"","t":"named legends era_imperial female non_sensitive","w":"Barabel hunter hired once by Black Sun; no sustained membership.","bio":"Skahtul was a Barabel female Bounty Hunter who was active during the Galactic Civil War. Hired by Black Sun to capture Luke Skywalker, Skahtul was ultimately successful in capturing him, holding him captive in a base on Kothlis, attempting to gather as many credits as possible between Prince Xizor, who wanted Skywalker dead, and Darth Vader, who wanted him alive. In the confusion, Skywalker was able to escape the compound with the help of Lando Calrissian."},{"b":1,"c":"BH_SKORR","f":"BH","n":"Skorr","v":"Skorr","p":"skorr","e":"","t":"named legends era_imperial male non_sensitive","w":"Humanoid hunter hired to kill Han Solo; no faction.","bio":"Skorr was a Humanoid male Bounty Hunter who was active during the Galactic Civil War. Some time after the first Death Star was destroyed, Skorr located his target, Han Solo, on the world of Ord Mantell. During a vicious fight between him and Solo, Skorr was unable to accurately shoot Solo due to an intervention by Luke Skywalker, who used the force to throw off Skorr\u0027s aim. The distraction allowed Solo to tackle him off a small cliff. However, in his desperation to kill Han, Skorr fired immediately after retrieving his weapon, inadvertently shooting himself and causing his death. The encounter with Skorr caused Han to rethink his allegiance to the Rebellion, ultimately causing him to decide to leave while the Rebellion was settled in Echo Base."},{"b":1,"c":"BH_SNOOVA","f":"BH","n":"Snoova","v":"Snoova","p":"snoova","e":"GE","t":"named legends era_imperial male non_sensitive","w":"Wookiee hunter working for the Galactic Empire with impunity from the government.","bio":"Snoova was a Wookiee male Bounty Hunter active during the Galactic Civil War. Deemed as a madclaw by his people, Snoova escaped Kashyyyk and became a bounty hunter working for the Galactic Empire, gaining impunity from the galactic government. Chewbacca disguised himself as Snoova to sneak past customs in Imperial City."},{"b":1,"c":"BH_SUGI","f":"BH","n":"Sugi","v":"Sugi","p":"sugi","e":"","t":"named canon era_prequel female non_sensitive","w":"Zabrak hunter who helped Obi-Wan and Anakin against pirates; a freelance hunter.","bio":"Sugi was a female Zabrak bounty hunter who worked during the Clone Wars. She grew strong through years of hunting bounties, with an equally strong sense of honor, and was bound by honor when making choices while out hunting her targets. During the war, Sugi and her band of fellow hunters defended a group of nysillin farmers against Hondo Ohnoka and his pirates alongside Obi-Wan Kenobi and Anakin Skywalker. She would later run into Darth Maul on Nal Hutta, who bested her in combat."},{"b":1,"c":"BH_TEERAA","f":"BH","n":"Teer\u0027aa","v":"Teer\u0027aa","p":"teer\u0027aa","e":"CRIM","t":"named legends era_old_republic female non_sensitive","w":"Twi\u0027lek assassin working for the criminal Goto on Nar Shaddaa.","bio":"Teer\u0027aa was a Twi\u0027lek female Assassin, who along with her sister, Seer\u0027aa, worked as Assassins for the crime lord Goto during the Dark Wars. When Meetra Surik arrived on Nar Shaddaa, all hunters were forbidden from directly confronting Surik. After Surik left for the Jekk\u0027Jekk Tarr, the sisters confronted Atton Rand in one of the cantinas, but were defeated but survived the encounter. The sisters later confronted Surik aboard the Visionary, and both were slain."},{"b":1,"c":"BH_TODO","f":"BH","n":"Todo 360","v":"Todo 360","p":"todo 360","e":"","t":"named canon era_prequel era_imperial non_sensitive","w":"Service droid owned by Cad Bane; not a member of a faction.","bio":"Todo 360 was a techno-service droid owned by Cad Bane over the course of the Clone Wars. While looked down upon by Bane, Todo always assisted Bane without hesitation, including assisting him stealing a holocron from the Jedi Temple, and Ziro the Hutt\u0027s release. Todo continued to serve Bane after the rise of the Galactic Empire, assisting Bane in capturing Omega, a member of Clone Force 99."},{"b":1,"c":"BH_UPRISING_HUNTER","f":"BH","n":"Uprising Bounty Hunter","v":"Uprising Bounty Hunter","p":"generic","e":"","t":"generic canon era_new_republic non_sensitive","w":"Unnamed hunter from the New Republic\u0027s formation; generic unit.","bio":"A Bounty Hunter that was active during the period of the New Republic\u0027s formation."},{"b":1,"c":"BH_ZAM","f":"BH","n":"Zam Wesell","v":"Zam Wesell","p":"zam wesell","e":"","t":"named canon era_prequel female non_sensitive","w":"Clawdite assassin hired for the Naboo senator killing; no faction membership.","bio":"Zam Wesell was a Clawdite female Bounty Hunter active prior to the Clone Wars. Working with Jango Fett to assassinate Senator Padm� Amidala, Zam sent a droid with a vial of deadly Kouhuns. After her attempted failed, she led the Jedi Anakin Skywalker and Obi-wan Kenobi on a dangerous chase through Coruscant. After capturing her at the Outlander Club, Zam was interrogated by the Jedi, but before she could reveal anything, she was killed by Jango, shot with a toxic dart."},{"b":1,"c":"BH_ZUCKUSS","f":"BH","n":"Zuckuss","v":"Zuckuss","p":"zuckuss","e":"","t":"named canon era_imperial male non_sensitive","w":"Gand hunter hired by Vader for the Falcon; hired only for that job.","bio":"Zuckuss was Gand male Bounty Hunter active during the Galactic Civil War. Sometime after the Battle of Hoth, Zuckuss, along with a number of other Bounty Hunters, was hired by Darth Vader to hunt down and capture the Millenium Falcon. Zuckuss lost the bounty to rival hunter Boba Fett."},{"b":1,"c":"BOS_EXAR","f":"BoS","n":"Exar Kun","v":"Exar Kun","p":"exar kun","e":"JO","t":"named legends era_ancient fallen_jedi sith male","w":"Human Jedi Knight who fell to the dark side during the Old Sith Wars, founder of the Brotherhood of the Sith.","bio":"Exar Kun was a Human male Sith Lord during the Old Sith Wars. As a Jedi, Exar Kun believed himself immune to the dark side, increasing his knowledge of the Force to rival even the strongest Jedi of that time. It was not long until Kun fell to the dark side, and with Ulic Qel-Droma as his apprentice. It did not last, as Ulic betrayed his Master, and forced Kun to sacrifice the many Massassi he enslaved to keep his spirit alive. Kun\u0027s spirit was destroyed millenia later by Luke Skywalker\u0027s new Jedi Order."},{"b":1,"c":"BOS_ULIC","f":"BoS","n":"Ulic Qel-Droma","v":"Ulic Qel-Droma","p":"ulic qel-droma","e":"JO","t":"named legends era_ancient fallen_jedi sith male","w":"Jedi Knight turned Sith Lord during the Great Sith War, co-founder of the Brotherhood of the Sith.","bio":"Ulic Qel-Droma was a Human male Jedi Knight, and Sith Lord during the Great Sith War, and Old Sith Wars. Once a promising Jedi, Qel-Droma was forced to the dark side after being injected with a Sith poison. After a long duel with Exar Kun, the duel was considered a stalemate, with Ulic and Kun joining forces, creating the Brotherhood of the Sith. It would not last long however, as Ulic\u0027s time as a Sith was short lived, after murdering his brother Cay and being cut off from the Force, Ulic exiled himself to Rhen Var, where he eventually passed away."},{"b":2,"c":"BS_BLACKSUN","f":"BS","n":"Black Sun Mercenary","v":"Black Sun Mercenary","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Generic Black Sun mercenary unit from the bio; no extra faction.","bio":"Black Sun was a powerful crime syndicate active throughout galactic history. Considered one of the most powerful crime syndicates in the galaxy for its time, Black Sun dealt in any and all illegal activities, including slave trafficking, smuggling, and piracy."},{"b":2,"c":"BS_GURI","f":"BS","n":"Guri","v":"Guri","p":"guri","e":"","t":"named legends era_imperial non_sensitive","w":"Assassin droid and lieutenant of Prince Xizor (Shadows of the Empire, Legends); no other faction.","bio":"Guri was a feminine-programmed droid who served as Xizor\u0027s top lieutent in the Black Sun criminal organization. Working closely with Xizor, Guri often attended to the running of Black Sun, with many wrongly assuming her to be the leader. Additionally, Guri served Xizor as an assassin droid, dispatching many of his enemies. After Xizor\u0027s death, Guri developed a desire to begin a new life, undergoing a reprogramming to eliminate her assassination programming."},{"b":2,"c":"BS_IG86","f":"BS","n":"IG-86","v":"IG-86","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"IG-86 assassin droid model; bio lists Hutts and Black Sun as users, which is already covered by the faction.","bio":"IG-86 assassin droids were a model of assassin droid popularly used during the Clone Wars. Though occasionally used by the Confederacy of Independent Systems, the more frequent users consisted of Hutt crime lords and the Black Sun Crime Syndicate."},{"b":2,"c":"BS_KRIX","f":"BS","n":"Krix Swiftshadow","v":"Krix Swiftshadow","p":"krix","e":"BH","t":"named canon era_prequel male non_sensitive","w":"Trandoshan pilot of Garnac\u0027s Hunting Guild, a hunting outfit; BH proposed for that role. Mismatch check done via Wookieepedia mirrors.","bio":"Krix was a Trandoshan male hunter and pilot who was active during the Clone Wars. Krix was responsible for piloting the freighter for Garnac\u0027s Hunting Guild, which was responsible for transporting sentient individuals across the galaxy to be hunted on the moon of Wasskah."},{"b":2,"c":"BS_MIGHELLA","f":"BS","n":"Mighella","v":"Mighella","p":"mighella","e":"NS","t":"named legends era_prequel female force_user","w":"Human Nightsister who served Alexi Garyn as bodyguard and enforcer; NS proposed for her tradition. Legends per archivum mirror of Wookieepedia.","bio":"Mighella was a Human female Nightsister who served as a bodyguard and enforcer of the leader of Black Sun, Alexi Garyn. During Darth Maul\u0027s mission to cripple Black Sun, he eventually came to blows with Mighella. After a vicious duel, Mighella was outmatched by Darth Maul, and in her last moments, recognized Maul for what he was, a Sith Lord."},{"b":2,"c":"BS_VIGOMORN","f":"BS","n":"Vigo Morn","v":"Vigo Morn","p":"vigo morn","e":"","t":"named legends era_prequel male non_sensitive","w":"Mon Calamari Vigo overseeing Black Sun on Dac; killed by Darth Maul. Legends; no other faction.","bio":"Morn was a Mon Calamari Male Vigo of Black Sun who oversaw Black Sun\u0027s operations on Dac in the years prior to the Naboo Crisis. Morn was murdered by Darth Maul in an attempt to drive the other Black Sun Vigos together so they could be slaughtered."},{"b":2,"c":"BS_XIZOR","f":"BS","n":"Prince Xizor","v":"Prince Xizor","p":"prince xizor","e":"","t":"named legends era_imperial male non_sensitive","w":"[corrigé] Falleen head of Black Sun who worked with the Empire and gained Palpatine\u0027s favor; GE proposed as a significant ally.","bio":"Prince Xizor was a Falleen male Prince and leader of the Black Sun Crime Syndicate around the time of the Galactic Civil War. Considered one of the most influental crime lords during the Empire\u0027s reign, Xizor made his way into the upper echelons of the Empire, gaining the favor of Emperor Palpatine and Darth Vader, but primarily working toward his own agendas. At some point after the Battle of Hoth, Xizor, despite orders from Vader to not fire on Luke Skywalker\u0027s vessel, opened fire on the Millenium Falcon. Vader immediately commanded his forces to destroy Xizor\u0027s skyhook, presumably killing him and ending his reign."},{"b":2,"c":"CD_DRYDEN","f":"CD","n":"Dryden Vos","v":"Dryden Vos","p":"dryden vos","e":"","t":"named canon era_imperial male non_sensitive","w":"Public leader of Crimson Dawn (Solo); already in CD and no other significant faction.","bio":"Dryden Vos was a near-human male who publicly led the Crimson Dawn gang during and the years following the Clone Wars. During the creation of the Shadow Collective by Maul and Savage Opress, Dryden at some point swore allegiance to Maul\u0027s collective. Within the first decade of the Empire\u0027s reign, Vos flaunted his vast wealth and often threw lavish parties aboard his yacht, the First Light. Vos hired Tobias Beckett to steal coaxium from the Empire, however, his effrots were thwarted by Enfys Nest and her gang. Distraught by the news, Vos prepared to kill Beckett along with Han Solo and Chewbacca, until Solo suggested stealing coaxium from Kessel, which Vos deemed to be a near-impossible task. After Solo succeeded in the heist, Vos was ultimately betrayed after Nest informed Solo, Qi\u0027ra, Chewbacca, and Beckett her gang\u0027s real intentions. Vos was slain by Qi\u0027ra, his top lieutnant after a brutal fight between him and Han Solo."},{"b":2,"c":"CD_HYLOBON","f":"CD","n":"Hylobon Enforcer","v":"Hylobon Enforcer","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Personal guard of Crimson Dawn leader Dryden Vos; no extra faction.","bio":"Hylobon Enforcers were the personal guard of Crimson Dawn leader Dryden Vos."},{"b":2,"c":"CD_MAUL","f":"CD","n":"Maul","v":"Maul|Maul (Reborn)|Maul (Crime Lord)|Maul (Old Master)","p":"maul","e":"ROT DW MANDO","t":"named canon era_prequel male sith","w":"[corrigé] Sith Lord who led the Shadow Collective, took the Darksaber and became Mandalorian leader; SO and MANDO proposed.","bio":"Considered dead by the galaxy, Maul made his home on Lotho Minor, and over the course of ten years, slowly grew insane due to his use of the dark side to keep himself alive. After being rescued by his brother Savage Opress, Maul was rebirthed by Mother Talzin. Seeking revenge on Obi-Wan Kenobi, Maul formed himself a criminal empire, losing it only a few years before the Battle of Yavin. Seeking out Kenobi on Tatooine, Maul faced off against his enemy one final time, as after a very brief duel, Maul was struck down. Dying, Maul proclaimed that the one that Kenobi was protecting would avenge them both."},{"b":2,"c":"CD_PYKE","f":"CD","n":"Pyke Syndicate Member","v":"Pyke Syndicate Member|Pyke Syndicate Member|Pyke Syndicate Bounty Hunter","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Pyke Syndicate spice trafficker; the Pyke Syndicate is not one of the listed codes, so no extra faction.","bio":"The Pyke Syndicate were a criminal organization who specialized in Spice Trafficking and operated in the galaxy from the Naboo Crisis up until several years after the Galactic Civil War. Operating primarily from Obah Diah, the Pykes worked with the Spice Cartel and later the Shadow Collective to distribute their products across the galaxy. Years after the Galactic Civil War, the Pykes attempted to lay claim to Tatooine in order to secure their spice trade routes. However, their efforts were foiled by Boba Fett, who laid claim as the Daimyo of Tatooine."},{"b":2,"c":"CD_REN","f":"CD","n":"Ren","v":"Ren","p":"ren","e":"","t":"named canon era_sequel force_user fallen_jedi male","w":"[corrigé] Ren is the Knights of Ren title of Ben Solo (Kylo Ren); FO proposed as First Order member for the sequel trilogy. Bio mixes sources.","bio":"Ren was a Human male who served as leader of the Knights of Ren during the later decades of the New Republic\u0027s reign. During his time as leader of the Knights of Ren, Ren sought to induct other members into the group, eventually encountering the Jedi Padawan Ben Solo. After Ben Solo destroyed Luke Skywalker\u0027s temple, Solo sought out Ren for assistance, eventually joining the Knights. After being confronted by former members of Luke\u0027s order, Tai and Voe, Ren attempted to kill the Jedi, including Ben, who was reluctant to strike down his former friends. Eventually Solo, giving into the dark side at last, struck down Ren."},{"b":2,"c":"CD_SAVAGE","f":"CD","n":"Savage Opress","v":"Savage Opress","p":"savage opress","e":"NS","t":"named canon era_prequel force_user male","w":"Dathomirian Nightbrother who joined Maul\u0027s Shadow Collective; NS proposed for the Nightbrother tradition.","bio":"Savage Opress was a Dathomirian Zabrak male Nightbrother during the Clone Wars. Tested by Asajj to become Dooku\u0027s assassin, Savage instead broke free of the Nightsisters and went out to search for his brother, Darth Maul. After locating Maul and restoring him to sanity, Savage assisted Maul in creating the criminal organization the Shadow Collective. When Sidious arrived on Mandalore, Savage, along with Maul, engaged Sidious in a vicious duel. Savage was no match for the Dark Lord, and after a brief duel, was killed."},{"b":2,"c":"CD_SHADOW_COLLECTIVE","f":"CD","n":"Shadow Collective Member","v":"Shadow Collective Member|Shadow Collective Member","p":"generic","e":"HC BS","t":"generic canon era_prequel non_sensitive","w":"Shadow Collective member; the alliance drew on the Hutt clans and Black Sun per the bio, so HC and BS proposed.","bio":"After Maul defeated Pre Viszla, and took the Darksaber for himself, many Mandalorians swore allegience to their new leader. With none to challenge him, Maul began the workings of a new criminal syndicate known as the Shadow Collective, consisting of an alliance between the Hutt clans, Pyke Syndicate, and Black Sun. The Shadow Collective was later re-organized into Crimson Dawn around the early years of the Galactic Empire\u0027s reign."},{"b":2,"c":"CIS_AERIAL","f":"CIS","n":"Aerial Battle Droid","v":"Aerial Battle Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Aerial battle droid model; no extra faction.","bio":"Aerial Battle Droids were a specially manufactured battle droid whose sole purpose was to engage the forces of the Republic from the skies. Though not always effective in ground combat situations, aerial droids were often deployed during ship battles, using their small frame to board the opposing vessel and sabotage the interior systems, or even capture the ship for their own use."},{"b":2,"c":"CIS_AQUA","f":"CIS","n":"Aquatic Battle Droid","v":"Aquatic Battle Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Aquatic battle droid model; no extra faction.","bio":"Aquatic Battle Droids were a specially manufactured battle droid designed to work in underwater environments. Droids of this type were famously used during the Battle of Kamino and also the Battle of Mon Cala."},{"b":2,"c":"CIS_ARGYUS","f":"CIS","n":"Captain Argyus","v":"Captain Argyus","p":"faro argyus","e":"REP","t":"named canon era_prequel male non_sensitive","w":"Senate Commandos captain who was secretly a Separatist double agent; REP proposed for his cover service in the Republic. Canon status uncertain.","bio":"Faro Argyus was a Human male captain who served with the elite Senate Commandos during the Clone Wars. After Nute Gunray\u0027s successful capture early in the war, Argyus and a group of Senate Commandos were stationed aboard Luminara\u0027s vessel, the Tranquility. Little did the Republic forces know that Argyus was a double agent for the Separatists, and on Ventress\u0027s signal, broke Gunray out of prison. After successfully escaping the Tranquility with Gunray and picking up Ventress, Argyus was stabbed and killed by Ventress, who took the credit of Gunray\u0027s rescue for her own."},{"b":2,"c":"CIS_ASERIES","f":"CIS","n":"A-Series Assassin Droid","v":"A-Series Assassin Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"A-Series assassin droid model; no extra faction.","bio":"The A-Series assassin droid was a model of battle droid used by the Separatist Alliance during the Clone Wars. Though classified as assassins, the droids often fought in teams, relying on brute force rather than stealth to take out enemy targets."},{"b":2,"c":"CIS_ASSASSIN_BD","f":"CIS","n":"Assassin Battle Droid","v":"Assassin Battle Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Assassin battle droid model; no extra faction.","bio":"The Assassin Battle Droid was a special battle droid manufactured and designed to use long-range sniper rifles with high accuracy and efficiency."},{"b":2,"c":"CIS_BARON","f":"CIS","n":"Baron Battle Droid","v":"Baron Battle Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Baron battle droid model; no extra faction.","bio":"Baron Battle Droids were a special Battle Droid manufactured with light missile launchers in order to effectively target and neutralize the Republic\u0027s LAAT gunships."},{"b":2,"c":"CIS_BATTLE_DROID","f":"CIS","n":"Battle Droid","v":"Battle Droid|Battle Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Standard battle droid; the Trade Federation and CIS use are already covered by the faction.","bio":"Battle Droids were manufactured by Baktoid Combat Automata and Baktoid Armor Workshop. They saw extensive service during the Trade Federation\u0027s invasion of Naboo and the Clone Wars. Following the defeat of the Confederacy of Independent Systems, the Separatist Droid Army was deactivated by the Galactic Empire."},{"b":2,"c":"CIS_BUZZ","f":"CIS","n":"Buzz Droid","v":"Buzz Droid","p":"buzz droid","e":"","t":"named canon era_prequel non_sensitive","w":"Name mismatch: bio describes clone trooper Buzz of the 41st Elite Corps (REP, Second Battle of Geonosis), not the Pistoeka sabotage droid. Left unchanged, no extra faction. Needs manual review.","bio":"Buzz was a Clone Trooper of the 41st Elite Corps and served under Jedi master Luminara Unduli during the Clone Wars. Taking part in the Second Battle of Geonosis, Buzz was killed during a follow-up mission with Luminara Unduli as they were searching for Separatist Council member, Poggle the Lesser."},{"b":2,"c":"CIS_COMMANDO_DROID","f":"CIS","n":"Commando Droid","v":"Commando Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Commando droid model; no extra faction.","bio":"Commando Droids were advanced battle droids used by the Confederacy of Independent Systems during the Clone Wars. They were created as an improvement over standard battle droids and had greater agility and computer processing power. Their lithe body structure allowed them to don Phase I clone trooper armor. Commando droids were able to alter their voices in order to imitate others. However, these improvements came at price of a heavy production cost, limiting their use on the battlefield."},{"b":2,"c":"CIS_CORTOSIS_DROID","f":"CIS","n":"Cortosis Assassin Droid","v":"Cortosis Assassin Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Trade Federation cortosis assassin droid model; no extra faction.","bio":"Cortosis Assassin Droids were droid units utilized by the Trade Federation during the Invasion of Naboo. During their efforts to locate Queen Amidala, Obi-Wan Kenobi fought a number of them during the conflict."},{"b":2,"c":"CIS_CYDON","f":"CIS","n":"Cydon Prax","v":"Cydon Prax","p":"cydon prax","e":"BH","t":"named canon era_prequel male non_sensitive","w":"Chistori bounty hunter hired by the Separatists; BH proposed for the bounty hunter role.","bio":"Cydon Prax was a Chistori male bounty hunter who was employed by the Separatist Alliance during the first year of the Clone Wars. Responsible for locating the long-forgetten Sith artifact the Force Harvester, Cydon worked with Count Dooku in testing it on Alaris Prime on the local Wookiee population. Satisfied with the results, Count Dooku transported the harvester to Thule to reactivate the Dark Reaper. During the Battle of Thule, Cydon engaged Anakin Skywalker in each other\u0027s personal tanks. After a vicious battle between the two, Cydon was ultimately killed, and the Dark Reaper was destroyed soon after."},{"b":2,"c":"CIS_DOOKU","f":"CIS","n":"Count Dooku","v":"Count Dooku|Count Dooku (Dark Ritual)|Count Dooku (Jedi Master)","p":"count dooku","e":"JO ROT","t":"named canon era_prequel male sith fallen_jedi","w":"[corrigé] Former Jedi Master who became Darth Tyranus, Sidious\u0027s apprentice; JO and SO proposed for his long Jedi and Sith careers.","bio":"Count Dooku was a Human male Sith Lord and head of the Confederacy of Independent Systems during the Clone Wars. Once a Jedi Master, Dooku become disillusioned with the Jedi Order, and left the Order becoming one of the Lost Twenty. After being taken on as Darth Sidious\u0027s apprentice, Dooku took on the name Darth Tyranus. After the Clone Wars broke out, Dooku led the CIS against the Republic. In a fateful duel aboard the Invisible Hand, Dooku was killed by Anakin Skywalker at Palpatine\u0027s request, much to his own horror."},{"b":2,"c":"CIS_DROID_HUNTER","f":"CIS","n":"EG-5 Jedi Hunter","v":"EG-5 Jedi Hunter","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"EG-5 Jedi Hunter droid model; no extra faction.","bio":"The EG-5 Jedi Hunter droid was a deadly droid created by Count Dooku during the Clone Wars. Its sole purpose was to eliminate Jedi."},{"b":2,"c":"CIS_DROIDEKA","f":"CIS","n":"Droideka","v":"Droideka","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Droideka droid model; no extra faction.","bio":"Droidekas were manufactured by the Colicoids on Colla IV. They were capable of transforming between a curled ball that could move at high speeds, or a three legged stance to fire at a target under the protection of its shield generator. These fearsome droids were used during the battle of Naboo and throughout the Clone Wars."},{"b":2,"c":"CIS_DURGE","f":"CIS","n":"Durge","v":"Durge","p":"durge","e":"BH","t":"named canon era_prequel male non_sensitive","w":"Gen\u0027Dai bounty hunter recruited by Dooku; BH proposed for his bounty hunter role.","bio":"Durge was a Gen\u0027Dai male Bounty Hunter during the Clone Wars. With a burning hatred for Mandalorians, Durge was recruited into the CIS by Dooku, tempted to kill the clones of Mandalorian Jango Fett. Given the rank of commander, Durge was charged with several key missions for Dooku, and led droid forces into combat on more than one occasion. Near the end of the war, Durge was killed by Anakin Skywalker, who Force pushed him into a star, ending his 2,000 year old life."},{"b":2,"c":"CIS_E4","f":"CIS","n":"E4 Baron Droid","v":"E4 Baron Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"E4 Baron droid model from the Naboo invasion; no extra faction.","bio":"E4 Baron Droids were a type of battle droid utilized by the Trade Federation during the Invasion of Naboo. Several were encountered and destroyed by Obi-Wan Kenobi."},{"b":2,"c":"CIS_ENGINEER","f":"CIS","n":"Battle Droid Engineer","v":"Battle Droid Engineer","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Name mismatch: bio describes the Imperial Engineer (Sapper), not a battle droid engineer. No extra faction proposed to avoid confusion. Needs manual review.","bio":"Where Stormtroopers are trained in marksmanship and engagement with the enemy, the Imperial Engineer prepares the ground that they walk on for warfare. The Imperial Engineer, also known as Sapper, is an infantry support unit that performs military engineering tasks that gives the Imperial Army an advantage on the battlefront. Various military engineering tasks include such as; planting mines, carving trenches, vehicle repair or extraction, and construction/demolition. The Imperial Engineers were trained as well in military formation and basic marksmanship, making them an auxiliary unit, though should not be relied as an actual infantry."},{"b":2,"c":"CIS_FIREFIGHTER","f":"CIS","n":"Firefighter Battle Droid","v":"Firefighter Battle Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Firefighter battle droid model; no extra faction.","bio":"Firefighter Battle Droids were a special battle droid manufactured solely for combatting fires aboard the Separatist Capital Ships and occupied cities."},{"b":2,"c":"CIS_FLAME","f":"CIS","n":"Flame Battle Droid","v":"Flame Battle Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Flame battle droid model; no extra faction.","bio":"Flame Battle Droids were a special battle droid manufactured with small flamethrowers, making them highly effective at burning down vegetation, cities, and even the unfortunate Clone Trooper."},{"b":2,"c":"CIS_GEO_ELITE","f":"CIS","n":"Geonosian Elite","v":"Geonosian Elite","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Geonosian elite warrior unit; no extra faction.","bio":"Geonosian Elites were dedicated warriors to the Geonosian people. Aside from their heavy armor, elites were known to also utilize a beam weapon, which was powered by their own bodily fluids. Elites were considered a significant threat to Clone Troopers and even Clone Commandos."},{"b":2,"c":"CIS_GEONOSIAN","f":"CIS","n":"Geonosian","v":"Geonosian","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Geonosian species entry; no extra faction.","bio":"Geonosians were a winged, insectoid species hailing from the planet Geonosis. Among the galaxy, Geonosians were well-known for their engineering skills, and prior to the Clone Wars, created new droid units for the Confederacy of Independent Systems. Each hive of Geonosians was led by a queen, who laid eggs and gave orders to the public leaders of Geonosis."},{"b":2,"c":"CIS_GOSSAM","f":"CIS","n":"Gossam Commando","v":"Gossam Commando","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Gossam Commando bodyguard unit of Shu Mai, drawn from the Commerce Guild security forces; no extra faction. Wookieepedia mirror checked.","bio":"Gossam Commandos were a soldier group utilized by the Separatist Alliance and commissioned by Separatist leader Shu Mai during the Clone Wars."},{"b":2,"c":"CIS_GRAPPLE","f":"CIS","n":"Grappler Droid","v":"Grappler Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Grappler battle droid model; no extra faction.","bio":"Grappler Battle Droids were a special battle droid manufactured with enhanced strength to make them highly deadly at melee combat. A super battle droid variation was in use by the end of the Clone Wars, and was capable at shattering Clone armor, and could even pose a threat to any Jedi."},{"b":2,"c":"CIS_GRENADIER","f":"CIS","n":"Battle Droid Grenadier","v":"Battle Droid Grenadier","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Grenadier battle droid model; no extra faction.","bio":"Grenadier Battle Droids were a special battle droid manufactured to use thermal detonators with great efficiency."},{"b":2,"c":"CIS_GRIEVOUS","f":"CIS","n":"General Grievous","v":"General Grievous|General Grievous (Four Arms)|N-K Necrosis|Qymaen Jai Sheelal","p":"general grievous","e":"","t":"named canon era_prequel male non_sensitive","w":"Kaleesh general of the CIS and Jedi hunter; Qymaen Jai Sheelal and N-K Necrosis are his earlier identities. No extra faction.","bio":"General Grievous was a Kaleesh male General of the Confederacy of Independent Systems during the Clone Wars. A Jedi Hunter, Grievous slaughtered a number of Jedi, obsessed with taking their Lightsabers as trophies. During the Clone Wars, Grievous led many campaigns against the Republic, often putting him at odds with Obi-Wan Kenobi. At the end of the Clone Wars, Grievous and Kenobi fought one last time on the planet Utapau. On his secret landing platform, Grievous was killed, bringing an end to the Clone Wars."},{"b":2,"c":"CIS_GUNRAY","f":"CIS","n":"Nute Gunray","v":"Nute Gunray|Nute Gunray (Separatist Council)","p":"nute gunray","e":"","t":"named canon era_prequel male non_sensitive","w":"Neimoidian Viceroy of the Trade Federation and Separatist Council member; already CIS, no extra faction.","bio":"Nute Gunray was a Neimoidian male Viceroy of the Trade Federation during the Naboo Crisis and Clone Wars. Used as Sidious\u0027s puppet, Gunray was ordered by the Sith Lord to invade Naboo, which Sidious used to get him elected as Supreme Chancellor. Immediately joining the CIS before the outbreak of the Clone Wars, Gunray attempted to bring many worlds into the CIS. At the end of the war, Gunray, along with the Separatist Council, was sent to Mustafar, where he and the Council was later killed by the newly anointed Darth Vader."},{"b":2,"c":"CIS_HEAVY","f":"CIS","n":"Heavy Battle Droid","v":"Heavy Battle Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Name mismatch: bio describes Mandalorians, not a heavy battle droid. No extra faction. Needs manual review.","bio":"Mandalorians were a culture of elite, highly trained warriors spanning all throughout galactic history. The Mandalorian culture revolved around seeking honor and glory through war and other conflicts. Many Mandalorians took up mercenary work, often working as bounty hunters which often caused their clients to pay a high price. While the Mandalorians were often split into multiple clans, at times fighting each other, the Mandalorian\u0027s sole ruler was known as Mandalore."},{"b":2,"c":"CIS_LUSHROS","f":"CIS","n":"Lushros Dofine","v":"Lushros Dofine","p":"lushros dofine","e":"","t":"named canon era_prequel male non_sensitive","w":"Neimoidian captain of General Grievous\u0027s flagship; already CIS, no extra faction.","bio":"Lushros Dofine was a Neimoidian male who captained General Grievous\u0027s flagship The Invisible Hand during the Clone Wars. During the Battle of Coruscant, Lushros commanded the ship as it was slowly being destroyed by Republic forces. As the fate of the Invisible Hand was sealed, Lushros along with the majority of surviving Separatists aboard the ship abandoned ship using an escape pod. However, Lushros\u0027s pod was caught in tubrolaser fire, and the pod was destroyed, killing Lushros instantly."},{"b":2,"c":"CIS_MAGNA_GUARD","f":"CIS","n":"Magnaguard","v":"Magnaguard","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Magnaguard droid model used as Grievous\u0027s bodyguards; no extra faction.","bio":"MagnaGuards were a type of battle droid created by Holowan Mechanicals. They were a favorite of General Grievous, who used them as his bodyguards during the Clone Wars. MagnaGuards were equipped with electrostaffs that could be used against Jedi lightsabers. They were worthy competitors even to the most skilled jedi, and the droids had the ability to fight even with the loss of their limbs or head."},{"b":2,"c":"CIS_MARINE","f":"CIS","n":"Battle Droid Marine","v":"Battle Droid Marine","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Marine battle droid model; no extra faction.","bio":"Marine Battle Droids were a special battle droid manufactured to specialize in capital ship infiltration and sabotage. Whether working alone or in groups, the Marine Battle Droid would be dispatched during ship battles to infiltrate the target Republic Capital Ship and sabotage it from within, causing chaos onboard and limiting the defensive ability of the ship in the ongoing battle."},{"b":2,"c":"CIS_MARK3_BD","f":"CIS","n":"Mark III Battle Droid","v":"Mark III Battle Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Mark III battle droid model; no extra faction.","bio":"The Battle Droid Mark III was the most advanced variation of the standard B1 Battle Droid. Though the unit participated in a number of battles, they were not heavily manufactured, and thus were rarely seen during the Clone Wars."},{"b":2,"c":"CIS_MORALO","f":"CIS","n":"Moralo Eval","v":"Moralo Eval","p":"moralo eval","e":"","t":"named canon era_prequel male non_sensitive","w":"Phindian mastermind who plotted to kidnap Palpatine; worked with bounty hunters but was not part of their faction. No extra faction.","bio":"Moralo Eval was a Phindian male who worked with the Separatist Alliance during the Clone Wars. Considered a genius, though a sociopath as well, Eval was contacted by Count Dooku to orchestrate a plan to kidnap Chancellor Palpatine. After escaping Republic custody with the help of Cad Bane and Obi-Wan Kenobi, disguised as Rako Hardeen, Eval tested Bane, Kenobi, and a team of other bounty hunters in his obstacle course known as The Box. After the test was complete, Eval enacted his plans, and though efforts to kidnap the Chancellor at first seemed successful, Kenobi led the Jedi tasked with protecting the Chancellor to Eval\u0027s location, successfully apprehending him."},{"b":2,"c":"CIS_NEIMOIDIAN_AIDE","f":"CIS","n":"Neimoidian Aide","v":"Neimoidian Aide","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Neimoidian aide to Trade Federation officials; no extra faction.","bio":"Neimoidians were a humanoid species native to the planet of Neimoidia. They had smooth, noseless faces, mottled green-gray skin, and large red-orange eyes. In the final years of the Galactic Republic, they ran the Trade Federation, a vast consortium of business interests. As such, they ended up joining the Confederacy of Independent Systems and helped start the Clone Wars."},{"b":2,"c":"CIS_NEIMOIDIAN_GUARD","f":"CIS","n":"Neimoidian Guard","v":"Neimoidian Guard|Neimoidian Security Guard","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Neimoidian Separatist guard unit; no extra faction.","bio":"Neimoidian Guards were a Separatist military unit created by the Separatist Council of the Confederacy of Independent Systems to provide important officials with sentient guards when it was too risky to use droids that were vulnerable to deactivation. At least two were on Mustafar guarding the Separatist Council, but were killed by Darth Vader."},{"b":2,"c":"CIS_NIMBUS","f":"CIS","n":"Nimbus Commando","v":"Nimbus Commando","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Elite guard of Alto Stratus; no extra faction. Canon status uncertain.","bio":"The Nimbus Commands were the elite guards of the Jabiimi Separatist leader Alto Stratus during the Clone Wars. They were considered equal to the Republic\u0027s Clone Commandos in terms of skill."},{"b":2,"c":"CIS_PLASMA","f":"CIS","n":"Plasma Battle Droid","v":"Plasma Battle Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Plasma battle droid model; no extra faction.","bio":"The Plasma Battle Droid was a special battle droid manufactured and designed to use a plasma launcher during combat."},{"b":3,"c":"CIS_POGGLE","f":"CIS","n":"Poggle the Lesser","v":"Poggle the Lesser","p":"poggle the lesser","e":"","t":"named canon era_prequel male non_sensitive","w":"Geonosian Archduke commanding Separatist forces; Separatist council only, no extra faction. Identified from bio, not checked on Wookieepedia.","bio":"Poggle the Lesser was a Geonosian male during served as Archduke of Geonosis during the Clone Wars. While the public face of Geonosis, Poggle commanded Separatist Forces during the first and second battles of Geonosis, the latter in which he was captured and brought into Republic custody. After escaping custody after being recruited to assist with the Ultimate Weapon battlestation, Poggle, along with the Separatist Council, was relocated to the planet Mustafar, where he and the rest were killed by Darth Vader."},{"b":3,"c":"CIS_ROCKET_BD","f":"CIS","n":"Rocket Battle Droid","v":"Rocket Battle Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Generic Separatist rocket battle droid unit.","bio":"The Rocket Battle Droid was a special battle droid manufactured and designed to use rocket launchers with great efficiency."},{"b":3,"c":"CIS_RUNE","f":"CIS","n":"Rune Haako","v":"Rune Haako","p":"rune haako","e":"","t":"named canon era_prequel male non_sensitive","w":"Nute Gunray\u0027s right-hand man; Separatist council only.","bio":"Rune Haako was a Neimoidian male lieutenant and right hand man of Nute Gunray during the Naboo Crisis and the Clone Wars. As Nute Gunray\u0027s right hand man, Rune assisted Gunray in the Naboo Crisis and later joined alongside him with the CIS. At the end of the Clone Wars, Rune, along with the remaining Separatist Council, was sent to Mustafar. When Darth Vader arrived to kill the Council, Rune begged the new Sith Lord for mercy, but was struck down."},{"b":3,"c":"CIS_SAAM","f":"CIS","n":"Gume Saam","v":"Gume Saam","p":"gume saam","e":"","t":"named canon era_prequel male non_sensitive","w":"Techno Union senator in the Separatist cause; no extra faction.","bio":"Senator Saam was an Ishi Tib male who served as Senator of the Techno Union during the Clone Wars. Interested in furthering the goals of the Confederacy of Independant Systems, Saam did everything he could to keep the war going to maximize profits for the Techno Union. When the Separatist Senate voted to open peace talks with the Republic, Saam suggested Coruscant be attacked with force so the peace talks would never happen and the banks would be de-regulated."},{"b":3,"c":"CIS_SBD","f":"CIS","n":"Super Battle Droid","v":"Super Battle Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Generic Separatist super battle droid unit.","bio":"Super Battle Droids were an advanced battle droid used by the Confederacy of Independent Systems during the Clone Wars. Super battle droids were much stronger than their predecessors, and had thick armor casing. Some were equipped with a cannon arm that could fire homing rockets. Having been developed before the onslaught of the Clone Wars, the first batch of Super Battle Droids were put into operation on Geonosis, during the battle that started the conflict."},{"b":3,"c":"CIS_SEP_MERC","f":"CIS","n":"Separatist Mercenary","v":"Separatist Mercenary","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Generic mercenary hired by the Separatists; no fixed faction.","bio":"Certain individuals found work with the Separatist Alliance during the Clone Wars, taking on jobs from various leaders to further the goals of the Confederacy."},{"b":3,"c":"CIS_SEVRANCE","f":"CIS","n":"Sev\u0027rance Tann","v":"Sev\u0027rance Tann","p":"sev\u0027rance tann","e":"","t":"named legends era_prequel female non_sensitive","w":"Chiss Supreme Commander of the Confederacy and leader of Dooku\u0027s Dark Acolytes; no extra code. Canon status not verified on Wookieepedia.","bio":"Sev\u0027rance Tann was a Chiss female who served as a general and later Supreme Commander in the Confederacy military during the Clone Wars. Born on Csillia, Sev\u0027rance and her lover Vandalor left Chiss space and wound up in the service of Count Dooku as leader of the Dark Acolytes. Over t
