tle for Rhen Var, where he played a key role in defeating Sith forces. After the war, Kaedan joined the Jedi High Council during the Cold War and took part in pivotal moments, including opposing a controversial mission to capture the Sith Emperor and later distrusting the defector Lord Scourge, despite the Council forming an uneasy alliance with him. Kaedan\u0027s life came to a heroic end during the Battle for Ilum, where he led Republic forces against the Empire’s crystal mining operations and was ultimately killed in a targeted Sith operation."},{"b":20,"c":"TOR_KAEVEE","f":"TOR","n":"Kaevee","v":"Kaevee","p":"kaevee","e":"","t":"named legends era_old_republic jedi female","w":"Young Padawan who hid on Dantooine; no significant membership beyond the Jedi trainee role.","bio":"Kaevee was a human female Jedi Padawan who narrowly escaped the Sith Empire during their attack on Dantooine.  Our of fear and desperation, she hid within the old Jedi Temple and communed with the dangerous creatures living underground to protect her as well as the knowledge within.  She lived there with her \"pets\", believing it to be her duty to protect the enclave in case the Sith come searching for it.  Eventually Meetra Surik\u0027s kind words convinced her to leave and continue her life out of hiding."},{"b":20,"c":"TOR_KAO","f":"TOR","n":"Kao Cen Darach","v":"Kao Cen Darach","p":"kao cen darach","e":"JO","t":"named legends era_old_republic jedi male","w":"Battlemaster of the Jedi Order before the Great Galactic War; Zabrak.","bio":"Kao Cen Darach was a Zabrak male Jedi Master who served the Jedi Order as Battlemaster in the years leading up to the Great Galactic War. Stationed above Korriban, Kao and his Padawan, Satele Shan were escorting smuggler Nico Okarr to questioning when the Sith Empire emerged from hyperspace and launched an attack on the space station. Within the hangar holding Nico Okarr\u0027s ship, Kao and Satele engaged in a brutal fight against Darth Vindican and Darth Malgus. Allowing Satele to escape with Nico and Jace Malcom, Kao took on the two Sith Lords, mortally wounding Vindican in the process. However, Kao was struck down by Malgus shortly after."},{"b":20,"c":"TOR_KAVAR","f":"TOR","n":"Kavar","v":"Kavar","p":"kavar","e":"JO","t":"named legends era_old_republic jedi male","w":"Jedi Master on the Jedi High Council during the Mandalorian Wars.","bio":"Kavar was a Human male Jedi Master who sat on the Jedi High Council during the Mandalorian Wars and Jedi Civil War. After the conclusion of the Jedi Civil War and the rise of the Sith Triumverate, Kavar went into hiding, acting as an advisor to Queen Talia, the ruler of Onderon. As tensions between Talia and General Vaklu grew, Kavar came back into contact with his old friend, Meetra Surik, who was previously exiled from the Jedi Order. Working with Surik, the two managed to defend the Iziz Royal Palace from Vaklu\u0027s forces. On Dantooine after Surik was successful in locating the other Jedi Masters present at her exile, Kavar along with Vrook Lamar and Zez-Kai Ell were killed by Darth Traya, his life and Force energies drained."},{"b":20,"c":"TOR_KIRA","f":"TOR","n":"Kira Carsen","v":"Kira Carsen|Kira Carsen","p":"kira carsen","e":"JO","t":"named legends era_old_republic jedi female","w":"Jedi Knight who fought alongside the Hero of Tython against the Sith Emperor.","bio":"Kira Carsen was a Human female Jedi Knight who fought alongside the Hero of Tython during the Cold War and Second Great Galactic War. Born on Korriban, Kira was chosen by the Sith Emperor Vitiate as one of his many children. Though escaping the Sith, Kira was still held by Vitiate, but she was able to break his hold over her after a brief duel against the Jedi Knight known as the Hero of Tython. After Darth Angral\u0027s defeat, Kira continued to work with the Hero of Tython during their quest to stop the Sith Emperor from killing every living thing in the galaxy. Kira partnered with the former Sith Lord Scourge after the Eternal Empire rose to power."},{"b":20,"c":"TOR_KOTOR_Jedi","f":"TOR","n":"Old Republic Jedi","v":"Old Republic Jedi","p":"generic","e":"JO","t":"generic legends era_old_republic jedi","w":"Generic Jedi of the Old Republic; Jedi Order membership.","bio":"Jedi were a group of Force sensitives that practiced the Light Side of the Force and acted as peacekeepers for the Republic for thousands of years. Despite their command over the Force, the Jedi refused to take direct control of any situation, electing to only intervene when absolutely necessary. This drew controversy from the Republic\u0027s citizens, as the Jedi would take commanding roles during wartime, despite their supposed pacifism."},{"b":20,"c":"TOR_LEEHA","f":"TOR","n":"Leeha Narezz","v":"Leeha Narezz","p":"leeha narezz","e":"JO","t":"named legends era_old_republic jedi female","w":"Jedi Knight of the Jedi Order during the Cold War; Nautolan.","bio":"Leeha Narezz was a Nautolan female Jedi Knight who served the Jedi Order during the Cold War. Leeha, along with the Hero of Tython, Tol Braga, and Warren Sedoru infiltrated the Sith Emperor Vitiate\u0027s Space Station in an attempt to capture the Dark Lord. Instead, Vitiate took control of the Jedi\u0027s minds, including Leeha, and turning them into slaves of his will. Confronted by the saved Hero of Tython, Leeha engaged the Hero in a duel, until she was defeated, and was able to break free of the Emperor\u0027s control."},{"b":20,"c":"TOR_MEETRA","f":"TOR","n":"Meetra Surik","v":"Meetra Surik","p":"meetra surik","e":"JO","t":"named legends era_old_republic jedi female","w":"Jedi Exile who later rebuilt the Jedi Council; Jedi Order membership.","bio":"The Jedi Exile, also known as Meetra Surik, was a Jedi Knight during the Mandalorian Wars, and Exiled Jedi during the Dark Wars. Cut off from the Force and later having it restored, Surik was responsible for ending the threat of the Sith Triumverate and building a new Jedi Council. After defeating Darth Traya and the Sith Triumverate, Surik went out to search for Revan. Surik joined Revan and Lord Scourge on a mission to destroy the Sith Emperor Vitiate, but was killed by Scourge after the latter experienced a vision of another Jedi striking the Emperor down."},{"b":20,"c":"TOR_MICAL","f":"TOR","n":"Mical","v":"Mical|Mical (Jedi)","p":"mical","e":"JO","t":"named legends era_old_republic jedi male","w":"Trained by Surik and rebuilt the Jedi Order; earlier worked as a Republic spy.","bio":"Mical was a Human male who worked as a Republic Spy during the Dark Wars. Found to be Force Sensitive at an early age, Mical was taken to the Jedi Enclave on Dantooine for training at some point prior to the Mandalorian Wars. Wanting Meetra Surik as his teacher, Mical\u0027s chances were scrapped after Meetra went off to fight in the war, forcing Mical to leave the Jedi Order. Taking on work for the Republic, Mical worked as an agent with the Republic until reuniting with Meetra Surik within the ruined Jedi Enclave. Trained in the ways of the Force by Meetra, Mical devoted himself to rebuilding the Jedi Order after Darth Traya\u0027s defeat."},{"b":20,"c":"TOR_MIRA","f":"TOR","n":"Mira","v":"Mira|Mira (Jedi)","p":"mira","e":"BH JO","t":"named legends era_old_republic jedi female","w":"Nar Shaddaa bounty hunter who trained as a Jedi under Surik and helped form the New Jedi Council.","bio":"Mira was a Human female Bounty Hunter and follower of Meetra Surik during the Dark Wars. A successful bounty hunter on Nar Shaddaa, Mira was often hunted herself by the Wookiee Hanharr after saving his life years prior. After Surik arrived on the planet, searching for Jedi Master Zez-Kai Ell, Mira joined with Surik, eventually being trained by Surik in the ways of the Jedi. After Surik left to track down Revan, Mira helped establish the New Jedi Council."},{"b":20,"c":"TOR_MISSION","f":"TOR","n":"Mission Vao","v":"Mission Vao","p":"mission vao","e":"","t":"named legends era_old_republic female non_sensitive","w":"[corrigé] Follower of the amnesiac Revan during the Jedi Civil War; Revanite-aligned. Twi\u0027lek.","bio":"Mission Vao was a Twi\u0027lek female who served as one of the amnesiac Revan\u0027s followers during the Jedi Civil War. Orphaned at a young age, and raised by her older brother Griff, Mission eventually met her best friend Zaalbar, and the duo eventually met up with the amnesiac Revan. After the Jedi Civil War ended, Mission and Zaalbar parted ways with Revan, and created a small import/export business."},{"b":20,"c":"TOR_NADIA","f":"TOR","n":"Nadia Grell","v":"Nadia Grell","p":"nadia grell","e":"JO","t":"named legends era_old_republic jedi female","w":"Sarkai Jedi Knight who took over her father\u0027s seat as representative of her world.","bio":"Nadia Grell was a female Sarkai and daughter of Sarkai\u0027s senator, Tobas Grell.  Being force sensitive Nadia was seen as a freak by her people, among whom force sensitivity is exceedingly rare.  Her father was able to find a Jedi willing to train her, but was ultimately assassinated.  Nadia finished her training as a Jedi Knight and eventually took her father\u0027s place as the representative of her world."},{"b":20,"c":"TOR_NOMEN","f":"TOR","n":"Nomen Karr","v":"Nomen Karr","p":"nomen karr","e":"JO","t":"named legends era_old_republic jedi male","w":"Jedi Master who worked undercover as Retrost against the Sith Empire.","bio":"Nomen Karr was a Human male Jedi Master who was active during the Great Galactic War and Cold War. After the Sith Empire returned to the galaxy, Nomen Karr worked undercover behind enemy lines, adopting the name Retrost. Though successful in multiple endeavors against the Sith, Nomen ultimately found himself as the nemesis of Darth Baras after Nomen discovered spies planted by Baras within the Republic. Discovering Jaesa Willsaam, Nomen took her under his wing as he sought to use Jaesa\u0027s unique talent to discern the true nature of any individual, a power he found himself obsessing over. During his campaign to expose Baras\u0027s spies, Baras took on an apprentice who was tasked with executing Baras\u0027s spies at risk of being exposed. Confronting the apprentice on Nal Hutta, Nomen engaged the apprentice but found himself tapping into the dark side, unsuccessfully trying to defeat the warrior. After his defeat, Jaesa confronted the warrior and ultimately was corrupted to the dark side. Ordered to kill her former master, Karr pleaded with Jaesa to renounce the dark side, before being struck down."},{"b":20,"c":"TOR_NOMI","f":"TOR","n":"Nomi Sunrider","v":"Nomi Sunrider","p":"nomi sunrider","e":"JO","t":"named legends era_ancient jedi female","w":"Grand Master of the Jedi Order after the Great Sith War.","bio":"Nomi Sunrider was Grand Master of the Jedi Order after the Great Sith War. Before climbing the ranks of the order to Grand Master, Nomi Sunrider was born Nomi Da-Boda, and attained the surname Sunrider after marrying her husband Andur Sunrider. Nomi was responsible for bringing a complete end to the Great Sith War, cutting the fallen Jedi Ulic Qel-Droma off from the Force permanently. She gave birth to a daughter, Vima Sunrider."},{"b":20,"c":"TOR_ORGUS","f":"TOR","n":"Orgus Din","v":"Orgus Din","p":"orgus din","e":"JO","t":"named legends era_old_republic jedi male","w":"Jedi Master on the Jedi High Council during the Cold War.","bio":"Orgus Din was a Human male Jedi Master who served on the Jedi High Council during the Cold War. During his time as a Jedi Master, Orgus took on multiple Padawans, including a Jedi that would later be known as the Hero of Tython. Noticing the skill the Jedi possessed, Orgus and the Jedi worked together to neutralize a threat to the Jedi Order on Tython, his former Padawan Bengel Morr. After Bengel\u0027s threat was resolved, Orgus worked with the Knight to stop the Sith Lord Darth Angral from utilizing experimental Republic superweapons. After Orgus went to confront Angral aboard his flasgship, Orgus was struck down by Angral."},{"b":20,"c":"TOR_REP_CREW","f":"TOR","n":"Republic Crewman","v":"Republic Crewman","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Republic Navy crewman; Republic membership already covered by TOR.","bio":"Making up the backbone of the Old Republic\u0027s Navy, crewmen worked onboard spacefaring vessels monitoring and operating the various systems needed to keep the massive machines running smoothly."},{"b":20,"c":"TOR_REP_PILOT","f":"TOR","n":"Republic Pilot","v":"Republic Pilot","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Republic pilot; Republic membership already covered by TOR.","bio":"In the days of the Old Republic Pilots were tasked with the responsibility of moving Republic machines from place to place, be it starfighters in high-octane dogfights or shuttles for civilian and troop transport."},{"b":20,"c":"TOR_REP_TROOPER","f":"TOR","n":"Republic Trooper","v":"Republic Trooper|Republic Underworld Trooper","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Heavily armored Republic trooper; Republic membership already covered by TOR.","bio":"By the time of Great Galactic War, a majority of the Republic Military had taken to wearing heavy armor to offer themselves protection against the Resurgent Sith Empire and other threats to the Galactic Republic. Like the soldiers who came before, the troopers were trained in a wide variety of weapons including blasters, grenades, and vibroblades, with some even specializing in combat medicine and personal shield generators."},{"b":20,"c":"TOR_RISHA","f":"TOR","n":"Risha Drayen","v":"Risha Drayen","p":"risha drayen","e":"CRIM","t":"named legends era_old_republic female non_sensitive","w":"Smuggler and petty criminal who plotted to seize the Dubrillion throne.","bio":"Risha Drayen was a Human female smuggler and petty criminal who worked alongside the Smuggler known as the Voidhound during the Cold War and subsequent conflicts. Born as the daughter of Nok Drayen, Risha learned a variety of skills under her father\u0027s tutelege. Near the conclusion of the Cold War, Risha partnered with professional con artist Skavak and later the smuggler who would later be known as the Voidhound. Working with the smuggler to locate the Drayen crown to make herself queen of Dubrillion. Though successful in locating her father and the crown, Risha began to set up plans to take the Dubrillion throne. However, after the rise of the Eternal Empire, Dubrillion was sacked, making her claims for the crown fruitless."},{"b":20,"c":"TOR_RUSK","f":"TOR","n":"Fideltin Rusk","v":"Fideltin Rusk","p":"fideltin rusk","e":"","t":"named legends era_old_republic male non_sensitive","w":"Republic soldier; Republic membership already covered by TOR. Chagrian.","bio":"Fideltin Rusk was a Chagrian male who served as a soldier for the Old Republic.  Initially raised among a community of pacifists, Rusk enlisted in the military at the earliest opportunity.  He quickly gained acclaim with his superiors due to his impressive combat capabilities and drive to protect others."},{"b":20,"c":"TOR_SATELE","f":"TOR","n":"Satele Shan","v":"Satele Shan|Satele Shan (Exile)","p":"satele shan","e":"JO","t":"named legends era_old_republic jedi female","w":"Grand Master of the Jedi Order during the Great Galactic War.","bio":"Satele Shan was Grand Master of the Jedi Order during the Great Galactic War, and a descendent of Revan and Bastila Shan. After the Sacking of Coruscant, Satele was responsible for relocating the fractured Jedi Order to their homeworld of Tython. As the War dragged on, Satele was responsible for a number of major political moves, such as allying with the resurgent Sith Empire against the Revanites and the former Sith Emperor Vitiate. When the Eternal Empire rose to power, she went into self-exile on the planet of Odessen."},{"b":20,"c":"TOR_SCOURGE","f":"TOR","n":"Lord Scourge","v":"Lord Scourge","p":"lord scourge","e":"RSE JO","t":"named legends era_old_republic sith male","w":"[corrigé] Emperor\u0027s Wrath and personal executioner of Vitiate, serving the Eternal Empire.","bio":"Lord Scourge was a Sith male Sith Lord who served as the Emperor\u0027s Wrath during the Cold War and Galactic War. Allying with Revan and Meetra Surik against the Sith Emperor, Vitiate, Scourge received a vision of another Jedi striking down the Emperor. After killing Surik, Scourge was granted immortality by the Emperor and would  serve as his personal executioner. Centuries later, Scourge would meet the Jedi known as the Hero of Tython, and helped them in their mission to strike down the Emperor before he could destroy the galaxy."},{"b":20,"c":"TOR_SKOHANI","f":"TOR","n":"Skohani Ren","v":"Skohani Ren","p":"skohani ren","e":"JO","t":"named legends era_old_republic jedi male","w":"Togruta Jedi Master stationed on Alderaan during the Cold War.","bio":"Skohani Ren was a Togruta male Jedi Master during the Galactic Cold War.  Stationed on Alderaan, he enlisted the help of a good-natured passerby to free a noble of House Organa from being joined to the hivemind of the nearby Killik - a species of intelligent ant-like bipedals that had occupied the area."},{"b":20,"c":"TOR_SOLDIER","f":"TOR","n":"Republic Soldier (Male)","v":"Republic Soldier (Male)|Republic Soldier (Female)|Telos Guard","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Republic soldier; Republic membership already covered by TOR.","bio":"Republic Soldiers were the military force of the Galactic Republic prior to the Great Galactic War. They were tasked with keeping the peace on Republic-occupied worlds as well as keeping their citizens safe from danger. Soldiers were trained in a wide variety of weapons including blasters, grenades, and vibroblades."},{"b":20,"c":"TOR_T3M4","f":"TOR","n":"T3-M4","v":"T3-M4","p":"t3-m4","e":"","t":"named legends era_old_republic non_sensitive","w":"[corrigé] Astromech of Revan\u0027s followers, later Surik\u0027s; Revanite-aligned droid.","bio":"T3-M4 was an astromech droid who served as one of the amnesiac Revan\u0027s followers during the Jedi Civil War, and as one of Meetra Surik\u0027s followers during the Dark Wars. Constructed on Taris originally for Tarisian Crime Lord Davik Kang, T3 was instead brought under the ownership of the amnesiac Revan and assisted him in his mission to destroy the Star Forge. Years later, T3 was owned by the Jedi Exile, Meetra Surik, and assisted Surik in destroying the Sith Triumverate. T3 was destroyed while assisting Revan and Surik in their mission to destroy the Sith Emperor Vitiate."},{"b":20,"c":"TOR_T7O1","f":"TOR","n":"T7-O1","v":"T7-O1","p":"t7-o1","e":"JO","t":"named legends era_old_republic non_sensitive","w":"Astromech recon droid working for the Jedi Order on Tython.","bio":"T7-O1 was a T7-series astromech droid active during the Great Galactic War and subsequent conflicts. Passed from master to master throughout his life, T7 grew a strong personality, having never received a memory wipe. Participating in the Sacking of Coruscant and later a recon droid for the Jedi Order on Tython, T7 found himself working alongside the Jedi who would become the Hero of Tython, working with them to stop Darth Angral and later the Sith Emperor Vitiate. After the Eternal Empire rose to power, T7 worked with Sith Lord Lana Beniko to rescue the future Alliance Commander from their carbonite prison."},{"b":20,"c":"TOR_T7SERIES","f":"TOR","n":"T7-series Astromech","v":"T7-series Astromech","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Generic T7 astromech droid series; no faction membership.","bio":"Dependable and resourceful by design, the T7 series of Astromech droids was the model of choice during the Great Galactic War.  Shortly before the aforementioned conflict breaking out, combat-capable modifications were produced on Nar Shaddaa, elevating the plucky little helper droids to veritable combatants on their own merits."},{"b":20,"c":"TOR_TALIA","f":"TOR","n":"Queen Talia","v":"Queen Talia","p":"talia","e":"","t":"named legends era_old_republic female non_sensitive","w":"Queen of Onderon; a Republic-aligned monarch, not a Republic member.","bio":"Queen Talia was Queen of Onderon during the Mandalorian Wars, Jedi Civil War, and Dark Wars. A direct descendant of Sith Lord Freedon Nadd, Talia was a full Republic patriot, and during her rule, opened trade with the Republic, giving resources and supplies in exchange for citizens of Onderon to gain full Republic citizenship. This caused unrest on her world, and later, civil war, with the usurpers led by her cousin, General Vaklu. With Meetra Surik\u0027s and Master Kavar\u0027s help, the war ended, and Queen Talia\u0027s reign over Onderon continued."},{"b":20,"c":"TOR_TEMPLE_SECURITY","f":"TOR","n":"Temple Security Force","v":"Temple Security Force","p":"generic","e":"JO","t":"generic legends era_old_republic era_prequel non_sensitive","w":"Police force serving the Jedi Temple on Coruscant and fighting alongside the Jedi.","bio":"The Temple Security Force is the security police that patrols and keeps the peace in the halls of the Jedi Temple and the Temple\u0027s District on Coruscant. The police body was comprised of non-Force Sensitive police officers and soldiers, and former Jedi who failed to pass the Jedi Initiate Trials yet wanted to still serve the Jedi Order. From The Sacking of Coruscant in 3,653 BBY to Operation: Knightfall in 19 BBY, they fought side by side and bled with the Jedi trying to repel the enemy from their sanctuary, yet ultimately were perished and defeated. During the formation of the Galactic Empire, survivors of Knightfall fled underground and formed the resistance movement known as \"Whiplash\". Ever so loyal to the Jedi, they sought the remaining members of the Order be found and given passage off-world. Wishing to undermine the tyrannical rule of Palpatine, Whiplash also sought to take off Coruscant his political dissidents and politicians who signed the \"Petition 2,000\". The movement\u0027s goal were non-violent, but would later get involved in open conflicts. Most notably the battle in the Imperial Security Beauru. Years after the purge, members of Whiplash have joined the Rebel Alliance in their aim to take down the imperial regime and bring justice the Jedi Knights, and so they did."},{"b":20,"c":"TOR_TERENA","f":"TOR","n":"Terena Adare","v":"Terena Adare","p":"terena adare","e":"","t":"named legends era_old_republic female non_sensitive","w":"Agricultural administrator and leader of the Dantooine colonists; no faction membership.","bio":"Terena Adare was a human female living on Dantooine and serving as its agricultural administrator during the Jedi Civil War.  After the razing of the Jedi Enclave and surrounding area, Adare asserted herself as the leader of the surviving colonists.  Adare helped them along the long and arduous path of rebuilding their lives, using the spacious and defensible Matale Estate as the seat of their new government."},{"b":20,"c":"TOR_TOR_PROTOCOL","f":"TOR","n":"Protocol Droid","v":"Protocol Droid","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Generic protocol droid; no faction membership.","bio":"Even dating back to the days of the Old Republic, protocol droids were invaluable members of the team for facilities and starships that were controlled by complex computer systems and/or interacted with diverse alien species regularly."},{"b":20,"c":"TOR_TOR_UTILITY","f":"TOR","n":"R-8009 Utility Droid","v":"R-8009 Utility Droid","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Generic R-8009 utility droid; no faction membership.","bio":"The R-8009 Utility Droid was a model of droid manufactured by Serv-O-Droid Inc. during the days of the Old Republic.  They were unique in the sense that they could interface directly with other machines, allowing it to receive and carry out orders indirectly.  This combined with its gentle repulsors in place of wheels or legs allowed it to move smoothly and quietly around its environment, making it an unobtrusive and charming addition to any workforce or domicile."},{"b":20,"c":"TOR_TRASK","f":"TOR","n":"Trask Ulgo","v":"Trask Ulgo","p":"trask ulgo","e":"","t":"named legends era_old_republic male non_sensitive","w":"[corrigé] Soldier of the Endar Spire who served Revan\u0027s squad and died aiding him; Revanite-aligned.","bio":"Trask Ulgo was a Human male soldier who served aboard the Endar Spire near the end of the Jedi Civil War. After the Endar Spire came under attack by the Sith above Taris, Trask rushed to wake his squadmate, the amnesiac Revan, in order to find Bastila and defend her. Though the pair were successful in taking out multiple Sith Troopers, they were unable to find Bastila. Coming face to face with Darth Bandon, Trask sacrificed himself to allow Revan to escape. Trask\u0027s sacrifice would not be in vain as Revan went on to defeat Darth Malak and avenge Trask\u0027s death."},{"b":20,"c":"TOR_VANDAR","f":"TOR","n":"Vandar Tokare","v":"Vandar Tokare","p":"vandar tokare","e":"JO","t":"named legends era_old_republic jedi male","w":"Jedi Master on the High Council and head of the Dantooine Enclave Council.","bio":"Vandar Tokare was a Jedi Master, member of the Jedi High Council, and Head of the Dantooine Enclave Council during the Mandalorian Wars and Jedi Civil War. When the amnesiac Revan returned to Dantooine to train to become a Jedi, Vandar was among one of many Masters that assisted in re-training the former Sith Lord. After the Star Forge was destroyed, Vandar declared Revan as the Prodigal Knight, and reinstated his rank as a Jedi Knight. Vandar was killed during the Conclave of Katarr by Darth Nihilus."},{"b":20,"c":"TOR_VASH","f":"TOR","n":"Lonna Vash","v":"Lonna Vash","p":"lonna vash","e":"JO","t":"named legends era_old_republic jedi female","w":"Jedi Master on the Jedi High Council during the Mandalorian Wars.","bio":"Lonna Vash was a Human female Jedi Master who sat on the Jedi High Council during the Mandalorian Wars and Jedi Civil War. After the conclusion of the Jedi Civil War and the rise of the Sith Triumverate, Vash exiled herself to Korriban and took up residence in the remnants of the old Sith Academy. However, her exile was short-lived, as during the Dark Wars, Darth Sion and a contigent of Sith Assassins arrived on the world and ultimately captured her. Lonna was then tortured by Darth Sion and shortly after Meetra Surik\u0027s arrival on Korriban, executed Vash, leaving her corpse in a pool of blood for Surik to later discover."},{"b":20,"c":"TOR_VISAS","f":"TOR","n":"Visas Marr","v":"Visas Marr","p":"visas marr","e":"JO DRSE","t":"named legends era_old_republic redeemed female","w":"[corrigé] Sith apprentice of Nihilus who later became a Jedi Knight under Surik; Miraluka.","bio":"Visas Marr was a Miraluka female Sith Apprentice and Jedi Knight during the Dark Wars. The sole survivor of Nihilus\u0027s devastation on Katarr, Visas was taken on as Nihilus\u0027s apprentice after awakening on Nihilus\u0027s flagship, the Ravager. During the Dark Wars, Nihilus sent Visas to hunt down Meetra Surik. After a brief duel, Visas was defeated and taken on by Surik as an apprentice. Together, with the new Mandalore\u0027s help, they were able to strike Nihilus down. After Surik left to track down Revan, Visas assisted in rebuilding the Jedi Order."},{"b":20,"c":"TOR_VROOK","f":"TOR","n":"Vrook Lamar","v":"Vrook Lamar|Vrook Lamar (Exile)","p":"vrook lamar","e":"JO","t":"named legends era_old_republic jedi male","w":"Jedi Master on the High Council and Dantooine Enclave Council.","bio":"Vrook Lamar was a Human male Jedi Master, member of the Jedi High Council, and member of the Dantooine Enclave Council during the Mandalorian Wars, Jedi Civil War, and the Dark Wars. When Revan returned to Dantooine to train to become a Jedi, Vrook, albeit reluctantly, assisted in re-training the former Sith Lord. After the Jedi Civil War, Vrook did not go to the Conclave of Katarr and instead assisted the new Dantooine government. Vrook was killed by Darth Traya during a meeting in the ruined Jedi Enclave, his life and Force energy completely drained."},{"b":20,"c":"TOR_ZAALBAR","f":"TOR","n":"Zaalbar","v":"Zaalbar","p":"zaalbar","e":"","t":"named legends era_old_republic male non_sensitive","w":"[corrigé] Wookiee follower of Revan during the Jedi Civil War; Revanite-aligned.","bio":"Zaalbar was a Wookiee male who served as one of the amnesiac Revan\u0027s followers during the Jedi Civil War. Banished from his homeworld of Kashyyyk and deemed as a mad-claw, Zaalbar eventually met his best friend Mission Vao on the planet Taris, and eventually met up with the amnesiac Revan. With Revan\u0027s help, Zaalbar was named Chieftain by his father, Freyyr, and was forgiven for his past crimes. Eventually, Mission and Zaalbar parted ways with Revan, and created a small import/export business."},{"b":20,"c":"TOR_ZEZ_KAI","f":"TOR","n":"Zez-Kai Ell","v":"Zez-Kai Ell","p":"zez-kai ell","e":"JO","t":"named legends era_old_republic jedi male","w":"Jedi Master on the High Council during the Mandalorian Wars.","bio":"Zez-Kai Ell was a human male Jedi Master serving on the Jedi High Council during the Mandalorian Wars.  He was one of the Masters who exiled Meetra Surik from the Jedi Order.  During the First Jedi Purge he went into hiding on Nar Shaddaa, where he meditated on his choices as a Jedi Master and his faith began to falter.  He was ultimately killed by Darth Traya, his life force drained along with that of two of his fellow Jedi Council members."},{"b":20,"c":"TOR_ZHAR","f":"TOR","n":"Zhar Lestin","v":"Zhar Lestin","p":"zhar lestin","e":"JO","t":"named legends era_old_republic jedi male","w":"Jedi Master and Dantooine Enclave Council member; Twi\u0027lek.","bio":"Zhar Lestin was a Twi\u0027lek male Jedi Master and member of the Dantooine Enclave Council during the Mandalorian Wars and Jedi Civil War. When the amnesiac Revan returned to Dantooine to train to become a Jedi, Zhar oversaw Revan\u0027s re-training and after Revan\u0027s initial training was complete, promoted him to the rank of Padawan. After the Jedi Civil War ended, Zhar was killed at the Conclave of Katarr by Darth Nihilus."},{"b":20,"c":"UFU_ABELOTH","f":"UFU","n":"Abeloth","v":"Abeloth","p":"abeloth","e":"","t":"named legends era_new_republic force_user female","w":"Force entity; no faction membership.","bio":"Abeloth was a female Force entity who lived throughout Galactic History. Born and known by the Mortis Gods as The Servant, she eventually came to be known as the Mother, keeping the peace between the warring siblings Son and the Daughter. However, unlike the other Mortis Gods, the Mother was still mortal. Wishing to live by any means, the Mother drank from the Font of Power and bathed in the Pool of Knowledge, granting her immortality, but also corrupting her into a twisted entity known as Abeloth. Originally kept imprisoned by the Son and Daughter, after the deaths of the Mortis Gods, Abeloth was freed after Jacen Solo\u0027s fall to the dark side, unintentionally freeing her after the destruction of Centerpoint Station. Causing chaos in the galaxy, including being elected as Chief of State using one of her many avatars, Abeloth was eventually hunted down by Luke Skywalker and Darth Krayt, who within the realm of Beyond Shadows, were able to slay her. However, the two didn\u0027t believe Abeloth was truly gone, and Luke went out to locate the dagger used to slay the Mortis Gods decades prior to ensure that if Abeloth ever returned, they had a way to kill her permanently."},{"b":20,"c":"UFU_BAYLAN","f":"UFU","n":"Baylan Skoll","v":"Baylan Skoll","p":"baylan skoll","e":"JO REP","t":"named canon era_prequel era_new_republic fallen_jedi male","w":"Clone Wars Jedi Knight (JO, REP service) who later became a mercenary Dark Jedi. Ahsoka series also cited.","bio":"Baylan Skoll was a Male Human who served as a Jedi Knight during the Clone Wars and later became a Mercenary during the time of the New Republic. Baylan was once a Jedi Knight during the last years of the Galactic Republic, serving on the front lines of the Clone Wars. After surviving the Jedi Purge, Baylan discovered that Anakin Skywalker was actually the Sith Lord Darth Vader and realized that he had perpetrated the massacre at the Jedi Temple, even afterward bearing a deep hatred for the Chosen One. Baylan resurfaced during the first years of the New Republic and posed as a Jedi along with his apprentice Hati in order to gain access to a Republic ship that was carrying Morgan Elsbeth, an ally of their employer, the Grand Admiral Thrawn. Having rescued Elsbeth, Skoll departed for the planet Seatos where Elsbeth used a map that Hati had retrieved from Lothal to discover a pathway to another galaxy. Sometime later, Skoll and his apprentice were ordered to kill Ahsoka Tano and Sabine Wren and pursued them to Seatos. After battling Tano for control of the map to the second galaxy and throwing her from a cliff, Skoll managed to convince Wren to hand over the mapping mechanism. With the mechanism in hand, Skoll and his allies jumped to hyperspace and arrived in the new galaxy. Skoll and the others landed on the planet Peridea where they rendezvoused with Thrawn. After receiving orders to hunt down and kill Ezra Bridger and Wren, Skoll and Hati went in pursuit of them. However, on the journey, Skoll commanded his apprentice to go on without him and take her place in Thrawn\u0027s Empire. With a simple nod the two parted and Skoll turned and left. Sometime later, Tano arrived on the planet and engaged Skoll in a short duel before Tano stole his speeder and fled. Skoll, however, chose to continue his search for they mysterious power that called to him. Even as Thrawn left Peridea with his forces, Skoll merely gazed toward a distant light atop a statue of the Father."},{"b":20,"c":"UFU_DAGAN","f":"UFU","n":"Dagan Gera","v":"Dagan Gera","p":"dagan gera","e":"HR JO","t":"named canon era_imperial fallen_jedi male","w":"[corrigé] High Republic Jedi Knight who fell and led the Bedlam Raiders criminal gang on Koboh. Wookieepedia mirror: archivum.wiki/article/dagan_gera.","bio":"Dagan Gera was a Humanoid male former Jedi Knight of the High Republic era who led the Bedlam Raiders gang during the reign of the Empire. Once a renowned Jedi Knight of the High Republic era, Dagan was a renowned explorer for the Jedi Order as the Jedi sought to expand and created training outposts on various worlds. Taking an interest in Koboh\u0027s moon Tanalorr, Gera\u0027s request was initially approved. However, during the Nihil conflict, Tanalorr came under attack by the Nihil marauders, and Tanalorr was abandoned by the order, ordering all compasses allowing safe travel to be destroyed. Enraged by the Council\u0027s decision, Gera fell to the dark side and violently attempted to take back a compass for himself from his former friend, Khri, which resulted in the loss of his right arm. Within the Forest Array on Koboh, Dagan was imprisoned within a bacta tank and kept in stasis for hundreds of years until being reawakened by the Jedi Knight, Cal Kestis. Betraying Kestis and working with the Gen\u0027Dai Rayvis, Gera led the Bedlam Raiders as he attempted to locate the remaining compass leading to Tanalorr, coming at odds with Kestis who wanted to use Tanalorr as a safe haven for hunted Jedi. After a long campaign, Kestis and Gera confronted each other within Santari Khri\u0027s observatory. Using powerful force illusions to trick Kestis, the two engaged in a brutal duel, with Kestis initially being wounded. However, Kestis used his own illusions against him, disguising himself as Santari Khri. Successfully distracting the former Jedi, Kestis managed to strike down Gera."},{"b":20,"c":"UFU_FELUCIAN","f":"UFU","n":"Felucian Shaman","v":"Felucian Shaman","p":"generic","e":"","t":"generic legends era_imperial force_user","w":"Felucian tribal shaman; no formal faction membership.","bio":"During the rule of the Empire, Jedi Master Shaak Ti made her home on Felucia, training the local Jungle Felucians in the ways of the Force and helping steer the planet towards the light. However, after Shaak Ti\u0027s death, Felucia quickly became corrupted, with Shaak Ti\u0027s apprentice Maris Brood assuming leadership over the tribe, and turning the planet into a violent place that the Empire struggled to keep a hold of."},{"b":20,"c":"UFU_KUELLER","f":"UFU","n":"Kueller","v":"Kueller","p":"kueller","e":"","t":"named legends era_new_republic dark_jedi male","w":"Dark Jedi who led a rebellion on Almania and attacked the New Republic. Wookieepedia mirror: archivum.wiki/article/kueller_(general).","bio":"Kueller was a Human male Dark Jedi who was active at some point during the early years of the New Republic. Originally a member of Luke Skywalker\u0027s New Jedi Order as Dolph. While a student, Dolph\u0027s homeworld of Almania was laid to waste by the Je\u0027har, the ruling government, which resulted in the deaths of many of the planet\u0027s citizens, including Dolph\u0027s parents. The sudden loss caused Dolph to leave the academy and turn to the dark side, adopting the name Kueller. Kueller returned to his homeworld and organized a rebellion against the Je\u0027har, destroying the government and its sympathizers. Turning his attention on the New Republic, Kueller attempted revenge against Luke Skywalker after sabotaging much of the New Republic fleet. Though able to best Luke in combat, Kueller was ultimately killed by Leia Organa Solo, who with the help of Han Solo and Mara Jade with a Ysalamari, cut Kuelller\u0027s connection to the Force and fatally shot him."},{"b":20,"c":"UFU_MARIS","f":"UFU","n":"Maris Brood","v":"Maris Brood","p":"maris brood","e":"JO","t":"named legends era_imperial fallen_jedi female","w":"[corrigé] Zabrak Padawan who fell to the dark side and led the violent Felucian tribe; no faction membership.","bio":"Maris Brood was a Zabrak female Jedi Padawan who resided on Felucia along with Jedi Master Shaak Ti during the reign of the Empire prior to the Galactic Civil War. Surviving the initial purge, Maris found herself on Felucia after an attempt to hunt down Darth Vader after her master disappeared. When Vader\u0027s apprentice, Galen Marek, arrived on Felucia to hunt down Shaak Ti, Maris was ordered by Ti to retreat into hiding while she confronted the sith apprentice. After Shaak Ti\u0027s death, Maris fell to the dark side, and Felucia itself grew more violent as a result. Capturing Bail Organa, who had arrived on Felucia to ask Shaak Ti to rescue his daughter, Leia, Maris was eventually confronted by her master\u0027s killer. Defeated by Marek, Marek considered killing her but ultimately chose to spare her life, allowing Maris to retreat into hiding. The decision drew some criticism from Organa to Marek, who told the senator that she would carry the memories of what she did forever, and she would never be truly free."},{"b":20,"c":"UFU_MAULKILLER","f":"UFU","n":"Maulkiller","v":"Maulkiller","p":"maulkiller","e":"","t":"named legends era_imperial force_user male","w":"Failed hybrid clone of Galen Marek and Darth Maul made in Vader\u0027s project; not a faction member.","bio":"As Darth Vader continued his efforts to clone his late apprentice, Galen Marek, a hybrid-clone combining the DNA of Marek and the former Sith Lord Darth Maul, was created. Though appearing promising alone by his intimidating look, the clone, known as Maulkiller, met the same fate as the multiple other clones that came before and grew insane from the memories of his original donor, and was discarded."},{"b":20,"c":"UFU_SAHAR","f":"UFU","n":"Sa\u0027har Kateen","v":"Sa\u0027har Kateen","p":"sa\u0027har kateen","e":"JO","t":"named legends era_old_republic fallen_jedi female","w":"Twi\u0027lek former Jedi Padawan who turned away from the Order and her master. Jedi training only.","bio":"Sa\u0027har Kateen was a Twi\u0027lek female former Jedi Padawan who was active at some point during the Third Galactic War. Chosen by her master, Denolm Orr between herself and her brother, Ri\u0027kan, due to the latter\u0027s considered weak connection to the Force, Sa\u0027har was trained in the ways of the Jedi. During a mission to the planet Elom to locate and destroy a holocron created by the ancient Sith Lord Darth Nul, Sa\u0027har and her master came under attack by the renegade Sith Lord, Darth Malgus. In an unsuccessful attempt to defeat him, Sa\u0027har learned about Denolm\u0027s false decision, and ultimately turned her back on her master, allowing him to be struck down by Malgus. Escaping Darth Nul\u0027s temple and later locating the holocron after Malgus\u0027s capture by the Alliance Commander, Sa\u0027har later tracked down the Mandalorian clan The Hidden Chain and was reunited with her brother, who was an enforcer for Heta Kol. Though Heta and Sa\u0027har worked together, Sa\u0027har later came to realize her mistake and worked with the Alliance Commander to retrieve Darth Nul\u0027s holocron."},{"b":20,"c":"UFU_SHIN","f":"UFU","n":"Shin Hati","v":"Shin Hati","p":"shin hati","e":"","t":"named canon era_new_republic dark_jedi female","w":"Apprentice of Baylan Skoll and Force-using mercenary; no formal faction membership.","bio":"Shin Hati was a Female Human Force-User and Mercenary operating during the time of the New Republic. Early in her life, Hati was recognized as powerful in the force by Baylan Skoll who took her on as his apprentice sometime before the Galactic Civil War. Years after the end of the Galactic Civil War, Hati and Skoll would sneak aboard the New Republic ship Vesper and break Morgan Elsbeth out of detainment. After freeing Elsbeth, Hati and her allies retrieved a star map on the planet Arcana. Skoll then sent her to the planet Lothal to locate Sabine Wren and the star map she possessed. Hati briefly fought with Wren before stabbing her in the chest and fleeing from the planet. Hati later reunited with Skoll and Elsbeth on the planet Seatos where Elsbeth was able to use the map to discover a hyperspace route to another galaxy. Subsequently, Elsbeth commanded Hati to go to Corellia and assist Marrok with the preparations for the journey. However, Ahsoka Tano and Hera Syndulla soon arrived on the planet and hunted Marrok down. Hati briefly fought Tano and Syndulla but was forced to retreat with Marrok to Seatos. However, Tano and Wren pursued Hati to the planet and enaged her ship and a small squadron of her allies in a dogfight in the space above the world. Hati was unable to kill the two, however, and pursued them onto the planet\u0027s surface. Along with Marrok, Hati chased Tano and Wren before attacking them in the forest. Marrok was quickly killed by Tano but Hati nearly managed to overpower Wren before she was once again forced to retreat. After discovering that Skoll was locked in combat with Tano, Hati attempted to intervene but was knocked unconcious by Tano. After awakening, Hati accompanied Skoll, who had managed to capture Wren, to their ship where they jumped to hyperspace along with their allies. Arriving on the planet Peridea, Hati and Skoll met with Thrawn who let Wren leave according to a deal she had made with Skoll. However, Thrawn had other intentions and ordered the two to track Wren across the planet. While in pursuit of Wren, Skoll told Hati to go on without him and take her place within Thrawn\u0027s new Empire. With a nod, the two parted ways and Hati raced after Wren and Ezra Bridger. Along with a band of bandits, Hati attacked Bridger and Wren. The battle was fierce and no one side could gain the upper hand until Night Trooper reinforcements arrived and turned the battle in Hati\u0027s favor. However, the arrival of Ahsoka Tano tipped the scales and Hati soon found herself overwhelmed. Suddenly, the Night Troopers retreated and Hati realized that Thrawn had bretrayed her even as his Star Destroyer moved to leave the planet. Alone and outmatched, Tano urged Hati to surrender, however, she instead fled alone to some unknown place on the planet\u0027s surface, eventually locating the bandits, and igniting her lightsaber in a display of power to them."},{"b":20,"c":"YV_CHAZRACH","f":"YV","n":"Chazrach ","v":"Chazrach ","p":"generic","e":"","t":"generic legends era_new_republic non_sensitive","w":"Yuuzhan Vong slave species; YV membership already covered.","bio":"The Chazrach were a slave species to the Yuuzhan Vong born and bred to do nothing but serve the Yuuzhan Vong. Given their millenia of sub-servience, the species devolved into a near-mindless, completely expendable force, unable to act as their own being, controlled by an organic device found at the top of their heads. Without the Vong to order them, the Chazrach were quick to turn feral, attacking anything and anyone without hesitation."},{"b":21,"c":"YV_NOM","f":"YV","n":"Nom Anor","v":"Nom Anor","p":"nom anor","e":"","t":"named legends era_new_republic male non_sensitive","w":"Yuuzhan Vong scout and operative in the New Jedi Order (Legends). Brief alliance with Jedi and rogue Vong at the end is a temporary partnership, not membership. Wookieepedia unavailable (HTTP 402); based on BIO and Legends knowledge.","bio":"Nom Anor was a Yuuzhan Vong Male who was active during the Yuuzhan Vong War. Prior to the outbreak of the war, Nom was tasked with scouting the galacy prior to the Vong invasion, creating conflicts and gathering information. As the war progressed, Nom was disgraced by the Vong people and would later team up with a coalition of Jedi Knights and rogue Yuuzhan Vong to find Zonama Sekot. Disillusioned and feeling his future was uncertain, Nom committed suicide within a disintegrating ship high above Coruscant\u0027s atmosphere."},{"b":21,"c":"YV_PRIESTESS","f":"YV","n":"Vong Priestess","v":"Vong Priestess","p":"generic","e":"","t":"generic legends era_new_republic female non_sensitive","w":"Generic Yuuzhan Vong priestess of the Yun-Harla sect, trained in deception per BIO. No other faction. Wookieepedia unavailable (HTTP 402); media tag from Legends knowledge.","bio":"Certain Vong were devoted to Yun-Harla, the trickster goddess. Pristesses in this sect were trained in the art of deception for the good of the Yuuzhan Vong."},{"b":21,"c":"YV_TSAVONG","f":"YV","n":"Tsavong Lah","v":"Tsavong Lah","p":"tsavong lah","e":"","t":"named legends era_new_republic male non_sensitive","w":"Warmaster of the Yuuzhan Vong (Legends, New Jedi Order); BIO gives no other faction. Wookieepedia unavailable (HTTP 402).","bio":"Tsavong Lah was a Vong male who served as Warmaster in the Yuuzhan Vong army during the Yuuzhan Vong War. Lah gained a reputation for being a total fanatic for the Vong, and was considered incredibly reckless, allowing his forces to march to their deaths to allow him to pursue a personal vendetta. Due to Lah\u0027s recklessness, the Vong military suffered heavy casualties and was commanded to not lead any assaults until their forces could be replenished, which allowed the New Republic to rebolster their own defenses. On Ebaw 9, Lah faced his rival, Jaina Solo in a vicious duel, during which he was slain."},{"b":21,"c":"YV_YUUZHAN_VONG","f":"YV","n":"Yuuzhan Vong","v":"Yuuzhan Vong","p":"generic","e":"","t":"generic legends era_new_republic non_sensitive","w":"Species-level entry for the Yuuzhan Vong; no individual identity. Role soldier reflects the warfare context. No extra faction, since the species is the faction itself.","bio":"The Yuuzhan Vong were an extra-galactic sentient species hailing from the planet Yuuzhan\u0027tar. The Yuuzhan Vong were a species that despised mechanical technology, and all tech they used was strictly organic, though genetically engineered. They respected pain and self-harm, grafting their organs as a sign of strength. The Yuuzhan Vong were also highly resistant to the Force and attacks from it, and their presence could not be sensed by any Jedi."},{"b":21,"c":"ZC_DEFILER","f":"ZC","n":"Defiler","v":"Defiler","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Generic Zann Consortium operative unit per BIO (kidnapping, racketeering). No other faction. Wookieepedia unavailable (HTTP 402); media tag uncertain.","bio":"Defilers were special units utilized by the Zann Consortium to lay down the initial seeds of corruption on select planets. They were responsible for organizing kidnapping, racketeering, and other operations on enemy worlds that the Consortium did not control."},{"b":21,"c":"ZC_SILRI","f":"ZC","n":"Silri","v":"Silri","p":"silri","e":"NS","t":"named legends era_imperial force_user female","w":"Human female Nightsister who served the Zann Consortium per BIO. She is a genuine Nightsister of Dathomir and her loyalty to her sisters is central, so NS is added. Wookieepedia unavailable (HTTP 402); media tag uncertain.","bio":"Silri was a Human female Nightsister who served the Zann Consortium during the Galactic Civil War. Imprisoned on Dathomir along with many of her sisters, Silri was later freed by Tyber Zann who persuaded her to discover the purpose of a Sith holocron that he had stolen from Jabba the Hutt. Despite her working with Zann, Silri\u0027s first loyalty was to her sisters, a connection Zann would exploit in order for her to do his bidding. After Zann and Urai Fen were successful in infiltrating the Emperor\u0027s vault on the Eclipse, Silri ultimately discovered the use of the artifact and used it to locate a Sith army frozen in carbonite, vowing to teach Tyber Zann the true meaning of power."},{"b":21,"c":"ZC_TYBER","f":"ZC","n":"Tyber Zann","v":"Tyber Zann","p":"tyber zann","e":"","t":"named legends era_imperial male non_sensitive","w":"Leader of the Zann Consortium per BIO. No other faction. Wookieepedia unavailable (HTTP 402); media tag uncertain.","bio":"Tyber Zann was a Human male who led the Zann Consortium during the Galactic Civil War. Over the years since the Death Star\u0027s destruction, Zann attempted to gain access to the Eclipse, a Super Star Destroyer capable of annihilating planets similarly to the Death Star, in addition to this learning the purpose of a Sith holocron he had stolen from Jabba. During his campaign across the galaxy, Zann became notorious in the criminal underworld as a crime lord to be feared. Ultimately, Zann\u0027s campaign to gain access to the Emperor\u0027s vaults aboard the Eclipse were successful. However, the Zann Consortium was said to have disbanded approximately seven years after the Battle of Endor."},{"b":21,"c":"ZC_URAI","f":"ZC","n":"Urai Fen","v":"Urai Fen","p":"urai fen","e":"","t":"named legends era_imperial male non_sensitive","w":"Talortai second-in-command of the Zann Consortium per BIO. No other faction. Wookieepedia unavailable (HTTP 402); media tag uncertain.","bio":"Urai Fen was a Talortai male who served as second-in-command of the Zann Consortium during the Galactic Civil War. During Tyber Zann\u0027s imprisonment on Kessel, Urai was responsible for keeping the Consortium hidden from the galaxy until Tyber himself was ready to strike. Working with his friend, the pair worked together to discover the purpose of a Sith holocron stolen from Jabba the Hutt, in addition to gaining access to Emperor Palpatine\u0027s vaults aboard the Super Star Destroyer Eclipse."},{"b":21,"c":"ZC_ZANN_DEKA","f":"ZC","n":"MK II Droideka","v":"MK II Droideka","p":"generic","e":"","t":"generic legends era_prequel era_imperial non_sensitive","w":"Generic MK II Droideka unit, built at a Hypori factory during the Clone Wars and later reactivated by the Zann Consortium. BIO does not tie the factory to the CIS and the unit had little significant role, so no extra faction. Wookieepedia unavailable (HTTP 402); media tag omitted as unknown.","bio":"During the Clone Wars, a factory located on Hypori was responsible for manufacturing a new generation of Droidekas which were classified as the Mark II. However, the droids were developed too late in the conflict and did not play a significant role in the conflict. Decades later during Tyber Zann\u0027s campaign across the galaxy, Zann and Urai Fen reactivated the factory and were able to utilize the droids in the Consortium\u0027s infantry."}];

const isFix = r => /^\[(corrigé|ajouté)\]/.test(r.w||"");
const isUnv = r => /unverified|not verified|uncertain|could not|non vérifié|best guess/i.test(r.w||"");
const extras = r => (r.e||"").split(/\s+/).filter(Boolean);
const tags = r => (r.t||"").split(/\s+/).filter(Boolean);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lots = [...new Set(DATA.map(r=>r.b))].sort((a,b)=>a-b);
const pad = n => String(n).padStart(2,"0");

function facChip(c){return `<span class="chip fac" title="${esc(fname(c))}">${esc(c.toUpperCase())}</span>`}
function addChip(c){return `<span class="chip add" title="${esc(fname(c))}">+${esc(c.toUpperCase())}</span>`}

function dups(){
  const m = {};
  DATA.forEach(r=>{ const p=(r.p||"").trim().toLowerCase(); if(!p||p==="generic") return; (m[p]=m[p]||[]).push(r); });
  return Object.entries(m).filter(([,v])=>v.length>1 && new Set(v.map(x=>x.f)).size>1)
    .sort((a,b)=>b[1].length-a[1].length || a[0].localeCompare(b[0]));
}

function home(){
  const named = DATA.filter(r=>tags(r).includes("named")).length;
  const withExtra = DATA.filter(r=>extras(r).length).length;
  const fixed = DATA.filter(isFix).length;
  const D = dups();
  const tc = {}; DATA.forEach(r=>tags(r).forEach(t=>tc[t]=(tc[t]||0)+1));
  const axes = [
    ["Type",["named","generic"]],["Canon",["canon","legends","noncanon"]],
    ["Ère",["era_ancient","era_old_republic","era_high_republic","era_prequel","era_imperial","era_new_republic","era_sequel","era_legacy"]],
    ["Force",["jedi","sith","dark_jedi","force_user","fallen_jedi","redeemed","non_sensitive"]],
    ["Genre",["male","female"]]
  ];
  return `
  <h1>Personnages de SWGL</h1>
  <p class="lede">Analyse des entrées de <code>SWGL_Characters.pk3</code> : doublons entre factions, personnages qui devraient appartenir à plusieurs factions, et une proposition de tags. Chaque entrée n'a aujourd'hui qu'une seule faction et <code>tags none</code>.</p>
  <div class="grid">
    <div class="card stat"><div class="v">1 093</div><div class="l">entrées dans 42 fichiers .cha</div></div>
    <div class="card stat"><div class="v">${DATA.length}</div><div class="l">analysées (hors Jedi/Sith numérotés)</div></div>
    <div class="card stat"><div class="v">${named}</div><div class="l">personnages nommés</div></div>
    <div class="card stat"><div class="v">${D.length}</div><div class="l">personnes présentes dans plusieurs factions</div></div>
    <div class="card stat"><div class="v">${withExtra}</div><div class="l">entrées avec factions à ajouter</div></div>
    <div class="card stat"><div class="v">${fixed}</div><div class="l">propositions d'agents corrigées</div></div>
  </div>

  <h2>À retenir</h2>
  <div class="two">
    <div class="card alert" style="border-left-color:var(--ok)"><h3>296 bios réparées</h3>
      <p style="margin:0">Les <code>.cha</code> utilisaient <code>CHARDESCREBELLION_*</code> et <code>CHARDESCREPUBLIC_*</code>, alors que les fichiers s'appelaient <code>CharDescREB.str</code> et <code>CharDescREP.str</code> (le moteur préfixe chaque clé par le nom du fichier). Ces fichiers ont été renommés en <code>CharDescREBELLION.str</code> et <code>CharDescREPUBLIC.str</code> dans <code>SWGL_Menu.pk3</code> (anglais et français). Les clés résolues passent de 700 à 996 sur 1 105. <em>Pas encore vu en jeu.</em></p></div>
    <div class="card alert"><h3>Bios manquantes ou copiées</h3>
      <ul class="clean">
        <li>Sans clé : CIS_HEAVY, CIS_ENGINEER, CIS_BUZZ, DRSE_OFFICER, GA_TRA, CRIM_Brutus, CV_Falleen, HC_Nizuc, REB_Jaxxon, Jedi/Sith numérotés.</li>
        <li>Bio d'un autre : REP_AQUA, REP_ALDERAAN, DRSE_OFFICER, GE_IMPGUNNER = REP_GUNNER.</li>
        <li>Assets identiques : CD_MAUL « Reborn » = INF_MAUL_OW, JO_JEDI8 = REP_Prequel_Jedi, et 4 autres paires.</li>
      </ul></div>
  </div>

  <h2>Doublons entre factions</h2>
  <div class="tablewrap"><table class="dup">
    <thead><tr><th>Personne</th><th>Entrées</th></tr></thead>
    <tbody>${D.map(([p,v])=>`<tr><td>${esc(p.replace(/\b\w/g,c=>c.toUpperCase()))}</td><td>${v.map(r=>`<a href="#lot/${r.b}?q=${encodeURIComponent(r.c)}" class="mono">${esc(r.c)}</a>`).join(", ")}</td></tr>`).join("")}</tbody>
  </table></div>
  <p class="lede" style="margin-top:10px">Les entrées <code>INF_*</code> (Infinities) sont des « what-if » volontaires. Le champ s'appelle <code>factions</code> au pluriel : s'il accepte plusieurs codes, ces entrées peuvent fusionner.</p>

  <h2>Tags proposés</h2>
  <p class="lede">Vocabulaire fermé, déjà appliqué à toutes les entrées. Le chiffre indique combien d'entrées portent le tag.</p>
  <div class="card">${axes.map(([a,l])=>`<div style="margin:6px 0"><strong style="display:inline-block;min-width:70px">${a}</strong> ${l.map(t=>`<span class="chip">${t}<small>${tc[t]||0}</small></span>`).join("")}</div>`).join("")}</div>
  <p class="lede" style="margin-top:10px">Pour les ~200 Jedi et Sith rangés dans des factions politiques, je recommande les tags <code>jedi</code>/<code>sith</code> plutôt que d'ajouter JO/SO partout.</p>`;
}

function lotsPage(){
  const rows = lots.map(n=>{
    const g = DATA.filter(r=>r.b===n);
    const facs = [...new Set(g.map(r=>r.f.toUpperCase()))];
    const named = g.filter(r=>tags(r).includes("named")).length;
    const ex = g.filter(r=>extras(r).length).length;
    const fx = g.filter(isFix).length, un = g.filter(isUnv).length;
    return `<tr class="click" onclick="location.hash='#lot/${n}'">
      <td class="mono">Lot ${pad(n)}</td>
      <td>${facs.map(facChip).join("")}</td>
      <td class="num">${g.length}</td><td class="num">${named}</td>
      <td class="num"><span class="pill">${ex}</span></td>
      <td class="num"><span class="pill ${fx?"ok":""}">${fx}</span></td>
      <td class="num"><span class="pill ${un?"warn":""}">${un}</span></td>
      <td style="min-width:280px">${esc(NOTES[n]||"")}</td></tr>`;
  }).join("");
  const tot = k => DATA.filter(k).length;
  return `
  <h1>Résumé des lots</h1>
  <p class="lede">Les ${DATA.length} entrées ont été réparties en ${lots.length} lots d'environ 50 personnages, chacun confié à un agent qui a lu la bio, identifié la personne, proposé des factions supplémentaires et des tags. J'ai ensuite tout relu et corrigé. Cliquer sur une ligne ouvre le détail.</p>
  <div class="tablewrap"><table>
    <thead><tr><th>Lot</th><th>Factions</th><th>Entrées</th><th>Nommés</th><th>+ Factions</th><th>Corrigés</th><th>Incertains</th><th>Note</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><th>Total</th><th></th><th class="num">${DATA.length}</th><th class="num">${tot(r=>tags(r).includes("named"))}</th><th class="num">${tot(r=>extras(r).length)}</th><th class="num">${tot(isFix)}</th><th class="num">${tot(isUnv)}</th><th></th></tr></tfoot>
  </table></div>
  <p class="lede" style="margin-top:10px">« Incertains » compte les entrées dont la justification signale une vérification incomplète. Wookieepedia renvoyait une erreur HTTP 402 aux agents, donc les recherches en ligne sont passées par des miroirs.</p>`;
}

function lotPage(n, q){
  const g = DATA.filter(r=>r.b===n);
  const facs = [...new Set(g.map(r=>r.f.toUpperCase()))];
  const i = lots.indexOf(n);
  return `
  <h1>Détail des lots</h1>
  <div class="controls">
    <button class="btn" id="prev" ${i<=0?"disabled":""}>←</button>
    <select id="sel">${lots.map(l=>{const ff=[...new Set(DATA.filter(r=>r.b===l).map(r=>r.f.toUpperCase()))];return `<option value="${l}" ${l===n?"selected":""}>Lot ${pad(l)} · ${ff.join(", ")}</option>`}).join("")}</select>
    <button class="btn" id="next" ${i>=lots.length-1?"disabled":""}>→</button>
    <input type="search" id="q" placeholder="Rechercher un nom, un code, un tag…" value="${esc(q||"")}">
    <select id="ff"><option value="">Toutes factions</option>${facs.map(f=>`<option value="${f}">${f} · ${esc(fname(f))}</option>`).join("")}</select>
    <label class="chk"><input type="checkbox" id="ox"> + factions seulement</label>
  </div>
  ${NOTES[n]?`<div class="note"><strong>Note du lot :</strong> ${esc(NOTES[n])}</div>`:""}
  <div id="list"></div>`;
}

function renderList(n){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const ff = document.getElementById("ff").value;
  const ox = document.getElementById("ox").checked;
  const g = DATA.filter(r=>r.b===n)
    .filter(r=>!ff || r.f.toUpperCase()===ff)
    .filter(r=>!ox || extras(r).length)
    .filter(r=>!q || [r.c,r.n,r.p,r.t,r.e,r.v].join(" ").toLowerCase().includes(q));
  const el = document.getElementById("list");
  if(!g.length){el.innerHTML=`<div class="empty">Aucune entrée ne correspond.</div>`;return}
  el.innerHTML = g.map(r=>`
    <details class="char" ${q&&g.length===1?"open":""}>
      <summary>
        <div><span class="nm">${esc(r.n)}</span>${isFix(r)?'<span class="flag fix">corrigé</span>':""}${isUnv(r)?'<span class="flag unv">incertain</span>':""}<br><span class="cd mono">${esc(r.c)}</span></div>
        <div class="fx">${facChip(r.f)}${extras(r).map(addChip).join("")}</div>
      </summary>
      <div class="body"><dl>
        <dt>Identité</dt><dd>${esc(r.p||"—")}</dd>
        <dt>Faction</dt><dd>${esc(r.f.toUpperCase())} · ${esc(fname(r.f))}</dd>
        <dt>À ajouter</dt><dd>${extras(r).length?extras(r).map(c=>`${addChip(c)} ${esc(fname(c))}`).join("<br>"):"—"}</dd>
        <dt>Justification</dt><dd>${esc(r.w||"—")}</dd>
        <dt>Tags</dt><dd>${tags(r).map(t=>`<span class="chip">${esc(t)}</span>`).join("")||"—"}</dd>
        <dt>Variantes</dt><dd>${esc((r.v||"").split("|").filter((x,i,a)=>a.indexOf(x)===i).join(" · ")||"—")}</dd>
        <dt>Bio en jeu</dt><dd>${r.bio?esc(r.bio):'<em style="color:var(--muted)">aucune bio trouvée</em>'}</dd>
      </dl></div>
    </details>`).join("");
}

function route(){
  const h = location.hash.slice(1) || "home";
  const [path, qs] = h.split("?");
  const parts = path.split("/");
  const app = document.getElementById("app");
  let r = parts[0];
  if(r==="lots"){ app.innerHTML = lotsPage(); }
  else if(r==="lot"){
    let n = parseInt(parts[1],10); if(!lots.includes(n)) n = lots[0];
    const q = qs ? decodeURIComponent((qs.match(/q=([^&]*)/)||[])[1]||"") : "";
    app.innerHTML = lotPage(n, q);
    const go = v => location.hash = "#lot/"+v;
    document.getElementById("sel").onchange = e => go(e.target.value);
    document.getElementById("prev").onclick = () => go(lots[lots.indexOf(n)-1]);
    document.getElementById("next").onclick = () => go(lots[lots.indexOf(n)+1]);
    ["q","ff","ox"].forEach(id=>document.getElementById(id).addEventListener("input",()=>renderList(n)));
    renderList(n);
  } else { r="home"; app.innerHTML = home(); }
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("active",a.dataset.r===r));
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

const root = document.documentElement;
try{ const t = localStorage.getItem("swgl-theme"); if(t) root.dataset.theme = t; }catch(e){}
document.getElementById("theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try{ localStorage.setItem("swgl-theme", root.dataset.theme); }catch(e){}
};
route();
</script>
</body>
</html>
