he course of a standard month, Sev\u0027rance led the Separatists to victory on multiple fronts. Sev\u0027rance was eventually tracked down and killed by Jedi Master Echuu Shen-Jon, whose Padawan Tann had killed before."},{"b":3,"c":"CIS_SHU_MAI","f":"CIS","n":"Shu Mai","v":"Shu Mai","p":"shu mai","e":"","t":"named canon era_prequel female non_sensitive","w":"Commerce Guild president; Separatist council only.","bio":"Shu Mai was a female Gossam, and Presidente of the Commerce Guild. During the Separatist Crisis, she allied the Guild with the Confederacy of Independent Systems, resulting in her gaining a seat on the Separatist Council. She was killed by Darth Vader on Mustafar following the end of the Clone Wars."},{"b":3,"c":"CIS_TACTICAL","f":"CIS","n":"Tactical Droid","v":"Tactical Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Generic tactical battle droid unit.","bio":"Tactical droids were a type of battle droid designed to plan battle strategies. Baktoid Combat Automata manufactured several models of tactical droid, including the T-series tactical droid and a more advanced super tactical droid."},{"b":3,"c":"CIS_TC14","f":"CIS","n":"TC-14","v":"TC-14","p":"tc-14","e":"","t":"named canon era_prequel non_sensitive","w":"Trade Federation protocol droid aboard the Saak\u0027ak; no extra faction.","bio":"TC-14 was a TC-series protocol droid that served aboard the Trade Federation Flagship, the Saak\u0027ak. During the Naboo crisis, TC-14 greeted Qui-Gon Jinn and Obi-Wan Kenobi when they boarded the vessel."},{"b":3,"c":"CIS_TESKA","f":"CIS","n":"Kul Teska","v":"Kul Teska","p":"kul teska","e":"","t":"named canon era_prequel male non_sensitive","w":"Skakoan mercenary employed by Dooku; no extra faction.","bio":"Kul Teska was a Skakoan male mercenary who worked with the Separatist Alliance during the first year of the Clone Wars. Once a respected scientist for the Techno Union, an accident with Teska\u0027s pressure suit caused him to be disfigured and thus forced to leave the union. Using his knowledge of cybernetics, he built himself a weaponized suit and became a mercenary, coming into the employ of Count Dooku at some point after the Clone Wars broke out across the galaxy. Within a hidden laboratory on Naboo, Teska attempted to utilize his superweapon to collapse Naboo\u0027s star, but his efforts were ultimately thwarted by Anakin Skywalker and Ahsoka Tano. Teska was killed in the ensuing battle."},{"b":3,"c":"CIS_TIKKES","f":"CIS","n":"Tikkes","v":"Tikkes","p":"tikkes","e":"","t":"named canon era_prequel male non_sensitive","w":"Quarren senator; Separatist council only.","bio":"Senator Tikkes was a Quarren male who served as Senator of Mon Calamari during the Naboo Crisis, and Separatist council member during the Clone Wars. During the Naboo Crisis, Tikkes was present when Padm  Amidala moved for a vote of no confidence against Chancellor Finis Valorum. During the Clone Wars, Tikkes defected to the Confederacy of Independent Systems. At the end of the war, Tikkes, along with the rest of the Separatist Council, was killed by the newly anointed Darth Vader."},{"b":3,"c":"CIS_TRANDO_ELITE","f":"CIS","n":"Trandoshan Elite","v":"Trandoshan Elite","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Generic Trandoshan elite guard of the slaver operation.","bio":"Trandoshan Elites were larger-than-average Trandoshans who were employed and provided security for the Trandoshan Slaver Operation during the Clone Wars. Easily distinguished by their heavy armor and rapid-firing cannon, the Trandoshan Elite was a threat to any number of enemies, including squads of Clone Troopers as well as Delta Squad."},{"b":3,"c":"CIS_TRANDO_MERC","f":"CIS","n":"Trandoshan Mercenary","v":"Trandoshan Mercenary","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Generic Trandoshan mercenary security force.","bio":"Trandoshan Mercenaries were highly paid mercenaries that provided security for the Trandoshan Slaver Operation during the Clone Wars. They carried blaster rifles and utilized jetpacks while in combat, making them very deadly opponents, even for Delta Squad."},{"b":3,"c":"CIS_TRANDO_SLAVER","f":"CIS","n":"Trandoshan Slaver","v":"Trandoshan Slaver","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Generic Trandoshan slaver; bio does not place them in the CIS.","bio":"During the Clone Wars, a Trandoshan Slaver operation took place which was ultimately thwarted by Delta Squad. The slavers often carried shotguns."},{"b":3,"c":"CIS_VENTRESS","f":"CIS","n":"Asajj Ventress","v":"Asajj Ventress|Asajj Ventress (Yavin)|Asajj Ventress (Nightsister)|Asajj Ventress (Bounty Hunter)|Asajj Ventress (Dark Disciple)","p":"asajj ventress","e":"SO BH NS","t":"named canon era_prequel sith female","w":"Dooku\u0027s Sith apprentice (SO), later a bounty hunter (BH), Dathomirian Nightsister (NS) per variants. Not verified on Wookieepedia.","bio":"Asajj Ventress was a Dathomirian female Sith apprentice of the Confederacy of Independent Systems during the Clone Wars. As Dooku\u0027s apprentice, Ventress was tasked with carrying out her master\u0027s orders during the Clone Wars. During the Battle of Sullust, Dooku betrayed Ventress and left her for dead. After this event, Ventress became a successful Bounty Hunter. Ventress was later supposedly killed by Dooku in an attempt to protect her lover, Quinlan Vos, who, with her apparent death, was able to renounce the dark side. However, upon her body\u0027s return to Dathomir, Ventress awakened and continued her work as a bounty hunter, briefly working with Clone Force 99 to discover Omega\u0027s force sensitivity."},{"b":3,"c":"CIS_WAT_TAMBOR","f":"CIS","n":"Wat Tambor","v":"Wat Tambor","p":"wat tambor","e":"","t":"named canon era_prequel male non_sensitive","w":"Techno Union foreman and Separatist council member; no extra faction.","bio":"Wat Tambor was a Skakoan male foreman of the Techno Union during the Clone Wars. Joining with Count Dooku at the beginning of the Clone Wars, Wat Tambor became a member of the Separatist Council. During an earlier conflict in the Clone Wars, Tambor was made emir of Ryloth, but was defeated and imprisoned, but later rescued. At the end of the Clone Wars, Tambor, along with the remaining Separatist Council was sent to Mustafar, where he was later killed by the newly anointed Darth Vader."},{"b":3,"c":"CRIM_0_0_0","f":"CRIM","n":"0-0-0","v":"0-0-0","p":"0-0-0","e":"GE","t":"named canon era_imperial non_sensitive","w":"Droid owned by the Empire and working for Vader before going independent; GE as a genuine Imperial servant. Not verified on Wookieepedia.","bio":"0-0-0 or Triple-Zero was a Protocol Droid who worked alongside Doctor Aphra during the height of the Galactic Civil War. Originally constructed as a personality matrix during the years of the Old Republic, Triple-Zero ultimately came into the hands of the Empire some years before the Battle of Yavin. Awoken a few weeks after the battle, the matrix was added to a protocol droid by Doctor Aphra, who then went on to activate another droid, BT-1. The pair worked alongside Doctor Aphra conducting a number of missions on behalf of the Empire, while continuing to work directly with Doctor Aphra after Aphra faked her death and abandoned the Empire."},{"b":3,"c":"CRIM_8T88","f":"CRIM","n":"8t88","v":"8t88","p":"8t88","e":"","t":"named legends era_imperial non_sensitive","w":"Information broker droid hired by Jerec; no faction code fits.","bio":"8t88 was a droid who worked as an information broker during the Galactic Civil War. Working for the highest bidder, a year after the Battle of Endor, 8t88 worked under the employ of Jerec to assist him in locating and translating a disc left by Morgan Katarn which was said to hold the location of the Valley of the Jedi. After successfully getting Jerec\u0027s information through other means, 8t88 was double-crossed and was deactivated by Gorc and Pic. However, his head was recovered by Kyle Katarn, who used the information stored in 8t88\u0027s memory banks to locate the Valley of the Jedi himself."},{"b":3,"c":"CRIM_ALIEN_MERC","f":"CRIM","n":"Alien Mercenary","v":"Alien Mercenary|Alien Mercenary|Alien Mercenary","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Generic alien mercenary; no bio. Canon status is a guess.","bio":""},{"b":3,"c":"CRIM_APHRA","f":"CRIM","n":"Chelli Lona Aphra","v":"Chelli Lona Aphra","p":"chelli lona aphra","e":"GE","t":"named canon era_imperial female non_sensitive","w":"Worked on secret missions for Vader and the Empire before going freelance; GE as a significant period of service.","bio":"Chelli Lona Aphra was an archeologist who was recruited by Darth Vader to perform a number of secret missions with her assassin droid companions 0-0-0 and BT-1. After falling out of favor with Lord Vader and faking her own death, she became free to roam the galaxy."},{"b":3,"c":"CRIM_B1","f":"CRIM","n":"B1","v":"B1","p":"b1","e":"","t":"named canon era_sequel non_sensitive","w":"Reprogrammed battle droid serving Neezo Vozo; no faction code fits.","bio":"B1 was a reprogrammed B1-series Battle Droid that was active during the First Order-Resistance War. Sold to Kragan Corr and the Warbird gang by Sidon Ithano, B1 was programmed by Neezo Vozo to be loyal only to him. During the Mutiny on the Colossus, B1 played a crucial role in defeat Kragan and his gang. However, after the conflict, B1 was impaled and destroyed by an Aeosian warrior who boarded the Colossus thinking it was the same First Order Star Destroyer that attacked its village."},{"b":3,"c":"CRIM_BANDO_GORA","f":"CRIM","n":"Bando Gora Servant","v":"Bando Gora Servant","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Generic member of the Bando Gora cult syndicate.","bio":"The Bando Gora were a criminal syndicate operating out of a large Citadel on the moon of Kohlma. Under the command of the fallen Jedi Komari Vosa, the Bando Gora began taking a hold on the galaxy, slowly building up their numbers with the use of modified deathsticks to brainwash new members into the cult. After the death of Komari Vosa, it was believed that the Bando Gora went extinct."},{"b":3,"c":"CRIM_BD_ULTRAGUNGAN","f":"CRIM","n":"Ultragungan Battle Droid","v":"Ultragungan Battle Droid","p":"generic","e":"","t":"generic legends era_prequel non_sensitive","w":"Generic salvaged battle droid serving the Ultragungans; no CIS membership per bio.","bio":"Ultragungan Battle Droids were reprogrammed Battle Droids salvaged from the Invasion of Naboo to serve an extremist Gungan group known as the Ultragungans. The droids were commonly used for guard duty in the Ultragungans few bases of operations, but like their former bretheren, posed little threat and could be easily destroyed."},{"b":3,"c":"CRIM_BERA","f":"CRIM","n":"Bera Kazan","v":"Bera Kazan","p":"bera kazan","e":"CIS","t":"named canon era_prequel female non_sensitive","w":"Served the Separatists as a mercenary for Dooku, so CIS as a significant period of service. Not verified on Wookieepedia.","bio":"Bera Kazan was a Female Human Smuggler, Pilot, and Mercenary. Kazan was originally a Smuggler before the Clone Wars, during which she became a Mercenary in the service of the Separatists. Count Dooku tasked her with locating and retrieving an ancient device known as the Force Harvester which could drain the life energy of nearby beings to create immense power. Together with Cydon Prax, another Mercenary, Kazan found the device on Raxus Prime and retrieved it. After Obi-Wan Kenobi and Anakin Skywalker pursued Kazan to Alaris Prime, she was betrayed and imprisoned along with Skywalker who had been captured by Count Dooku. Cydon Prax used the Force Harvester on Alaris Prime, intending to drain the local Wookiee population of its life force, but Skywalker and Kazan formed an unlikely alliance and helped the Wookiees escape before the device could kill them all. Skywalker then called for reinforcements and a battle ensued between Separatist and Republic forces. Bazan was able to help the Wookiees, the Jedi, and the Clone Troopers defeat the Separatists and ensure that Alaris Prime stayed free of their influence."},{"b":3,"c":"CRIM_BOM","f":"CRIM","n":"Bom Vimdin","v":"Bom Vimdin","p":"bom vimdin","e":"","t":"named legends era_imperial male non_sensitive","w":"Cantina cameo mercenary; no extra faction. Identity and canon status uncertain.","bio":"Bom Vimdin was an Advozse male who operated as a mercenary during the reign of the Galactic Empire. Bom was present in Chalmun\u0027s Cantina while Luke Skywalker and Ben Kenobi entered the establishment to locate a pilot to bring them to Alderaan."},{"b":3,"c":"CRIM_BREA","f":"CRIM","n":"Brea Tonnika","v":"Brea Tonnika","p":"brea tonnika","e":"","t":"named legends era_prequel era_imperial female non_sensitive","w":"Con artist sister of Senni; no faction code fits. Canon status uncertain.","bio":"Brea Tonnika was a Humanoid female who was active during the Clone Wars and Galactic Civil War. She, along with her sister Senni, worked as con artists. After overhearing from Han Solo the location of the Millienium Falcon, the two sisters attempted to steal the ship, but were quickly dissuaded upon seeing Jabba the Hutt."},{"b":3,"c":"CRIM_Brutus","f":"CRIM","n":"Brutus","v":"Brutus","p":"brutus","e":"","t":"named legends era_imperial non_sensitive","w":"Unidentified: no bio and the name is too generic to match a known character.","bio":""},{"b":3,"c":"CRIM_BT1","f":"CRIM","n":"BT-1","v":"BT-1","p":"bt-1","e":"GE","t":"named canon era_imperial non_sensitive","w":"Assassin droid owned by the Empire and serving Vader, then independent with Aphra; GE as Imperial servant.","bio":"BT-1 was an assassin droid taking on the appearance of an astromech droid that served under Darth Vader and later Doctor Aphra during the Galactic Civil War. Constructed by the Tarkin Initiative, BT-1 was later activated by Doctor Aphra who used the help of 0-0-0 who understood the language needed to activate the droid. The pair worked alongside Doctor Aphra conducting a number of missions on behalf of the Empire, while continuing to work directly with Doctor Aphra after Aphra faked her death and abandoned the Empire."},{"b":3,"c":"CRIM_BURG","f":"CRIM","n":"Burg","v":"Burg","p":"burg","e":"","t":"named canon era_new_republic male non_sensitive","w":"Devaronian mercenary in Din Djarin\u0027s crew on the Mandalorian; no extra faction.","bio":"Burg was a Devaronian male who worked as a mercenary during the early years of the New Republic. Burg, along with Xi\u0027an, Q9-0, Mis Mayfeld, and Din Djarin were hired to break out the prisoner Qin from a New Republic prison ship. Though they were initially successful in rescuing Qin, the group double-crossed Din Djarin. Ultimately, Djarin was able to free himself, and Burg and the rest of the group were captured by the New Republic."},{"b":3,"c":"CRIM_CHOPAA","f":"CRIM","n":"Chop\u0027aa Notimo","v":"Chop\u0027aa Notimo","p":"chop\u0027aa notimo","e":"","t":"named legends era_imperial male non_sensitive","w":"Crime lord who attacked Cloud City; no extra faction.","bio":"Chop\u0027aa Notimo was a Human male who worked as an underworld kingpin in the years prior to the Galactic Civil War. Assaulting Cloud City with his private army, Notimo took Senator Garm Bel Iblis hostage. Though Notimo\u0027s victory seemed assured, Notimo\u0027s forces were attacked by the aspiring Sith, Galen Marek, who desired Garm Bel Iblis\u0027s aid. Confronting Marek within the city with his Basilisk War Droid, Chop\u0027aa was ultimately no match for Marek, and was slain."},{"b":3,"c":"CRIM_DAVIK","f":"CRIM","n":"Davik Kang","v":"Davik Kang","p":"davik kang","e":"","t":"named legends era_old_republic male non_sensitive","w":"Taris Exchange boss who worked under Sith rule without becoming a member.","bio":"Davik Kang was a Male Human from the planet Taris. Kang grew up in the improvrished Lower City on Taris and at some point gathered a large group of bounty hunters to his cause and took over leadership of the Taris branch of the criminal organization known as the Exchange. Using his power and influence, Kang effectively ruled Taris through the use of Mercenaries and Enforcers and Kang ran galaxy-spanning criminal operations through the Exchange. When Revan\u0027s Sith Empire overtook the planet during the Jedi Civil War, Kang had to alter his methods and be careful not to disturb the Sith outright, a state of events he resented greatly. After being convinced by one of his Enforcers, Canderous Ordo, that Revan, still unaware of his identity, would make a good Mercenary for his organization, Kang invited Revan and Ordo to his compound. However, when Darth Malak\u0027s ships began bombarding Taris from orbit he attempted to flee the planet onboard his prized ship, the Ebon Hawk, only to discover that Ordo and Revan were working together to steal it and escape the planet. Kang and one of his Bounty Hunters, Calo Nord, attempted to stop them, but Kang was killed in the ensuing battle and Nord was incapacitated by falling debris, thus allowing Revan and his allies to escape."},{"b":3,"c":"CRIM_DREXL","f":"CRIM","n":"Drexl Roosh","v":"Drexl Roosh","p":"drexl roosh","e":"","t":"named legends era_imperial male non_sensitive","w":"Rodian Salvager\u0027s Cartel leader; no extra faction.","bio":"Drexl Roosh was a Rodian male who led the Rodian Salvager\u0027s Cartel in the years prior to the Galactic Civil War. During Galen Marek\u0027s mission to hunt down the crazed Jedi Kazdan Paratus, Marek was confronted by Drexl Roosh and his gang. Roosh was threatened into telling Marek of Kazdan Paratus\u0027s location, but was spared. However, Roosh later confronted Marek a short while later, and was eventually slain by the Sith apprentice."},{"b":3,"c":"CRIM_ENFYS","f":"CRIM","n":"Enfys Nest","v":"Enfys Nest","p":"enfys nest","e":"REB","t":"named canon era_imperial female non_sensitive","w":"[corrigé] Cloud-Riders gang leader in Solo; opposed the Empire and Crimson Dawn, but not a Rebel Alliance member.","bio":"Enfys Nest was a Human female who led the Cloud-Riders gang during the years prior to the Galactic Civil War. Though seemingly another swoop gang leader, Nest was instead seeking to fight against the Empire and Crimson Dawn, whom she gained a reputation with the latter and developed an intense rivalry. During Han Solo\u0027s heist to steal coaxium from the Empire, Nest and her gang interrupted the heist, wishing to steal the coaxium themselves. After Han and his crew were successful in stealing coaxium from Kessel and refining it on Savareen, Nest made her presence known and explained her actions, which persuaded Solo to give her the coaxium which she in turn gave to Saw Gerrera."},{"b":3,"c":"CRIM_GADON","f":"CRIM","n":"Gadon Thek","v":"Gadon Thek","p":"gadon thek","e":"","t":"named legends era_old_republic male non_sensitive","w":"Hidden Beks swoop gang leader on Taris; cooperated with Revan without joining.","bio":"Gadon Thek was a Human male who led the Hidden Beks swoop gang on Taris during the Jedi Civil War. Unlike his rival gang, the Black Vulkars, Gadon took a more hospitable approach to visitors, despite objections from his personal bodyguard Zaerdra. During the Sith\u0027s blockade of Taris, Gadon assisted the amnesiac Revan in rescuing Bastila Shan, whom he informed was being held by the Black Vulkars. After sending off Revan to retrieve a prototype swoop engine from the Vulkar base, Gadon allowed Revan to race for the Beks. After Revan won and freed Bastila, Gadon retired to his chambers, saddened at the loss of Brejik, the leader of the Black Vulkars, whom Gadon referred to as a son. Gadon was thought to have perished during the bombardment of Taris along with the rest of the Tarisian population."},{"b":3,"c":"CRIM_GOTO","f":"CRIM","n":"G0-T0","v":"G0-T0","p":"g0-t0","e":"","t":"named legends era_old_republic non_sensitive","w":"Droid crime lord in KOTOR II; no faction code fits.","bio":"G0-T0 was a droid crime lord during the Dark Wars. Shortly after the First Jedi Purge, the criminal known as Goto placed a high bounty on the head of any Jedi. Eventually, the Exile attracted the attention of Goto, and enlisted Surik\u0027s help to stabilize the galaxy one way or another. Eventually, Surik realized that Goto and G0-T0 were one and the same. After Bao-Dur\u0027s remote finished activating the Mass Shadow Generator on Malachor V, G0-T0 attempted to stop the destruction until he was thwarted by HK-47, who destroyed him."},{"b":3,"c":"CRIM_GUAVIAN","f":"CRIM","n":"Guavian Death Gang","v":"Guavian Death Gang","p":"generic","e":"","t":"generic canon era_sequel non_sensitive","w":"Generic gang members from the Eravana scene.","bio":"The Guavian Death Gang was a gang operating at the time of the First Order-Resistance War. A group of its members boarded Han Solo\u0027s vessel, the Eravana, along with members of Kanjiklub, and demanded their money from Solo. However, with Rey accidentally releasing a group of Rathtars, many members of both gangs were killed, and Han, Chewbacca, Finn, Rey, and BB-8 were able to slip away in the chaos."},{"b":3,"c":"CRIM_HK50","f":"CRIM","n":"HK-50","v":"HK-50","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Generic HK-50 assassin droid model.","bio":"HK-50 units were a type of assassin droid built around the time of the Dark Wars. Commissioned by the Sith Lord Darth Revan shortly after the Mandalorian Wars, HK-50 droids did not see mass production until sometime before the Dark Wars, where their factory was re-activated by the droid crimelord G0-T0 for the sole purpose of hunting Jedi. Their presence in the galaxy greatly annoyed HK-47, who discovered the location of the factory and, after bringing the newer HK-51 droids to his side, destroyed the factory and all HK-50 units within."},{"b":3,"c":"CRIM_HK51","f":"CRIM","n":"HK-51","v":"HK-51","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Generic HK-51 assassin droid model.","bio":"HK-51 units were a type of assassin droid built during the Dark Wars. An upgrade of the HK-50 units, the 51 series was under construction, with the prototype droids proving to be buddy and would fire on their 50 counterparts. HK-47 stormed the HK factory, programming the droids to fight for him. Sometime during the Cold War, a freighter carrying an army of the droids was shot down over Belsavis, and Republic and Empire forces fought to claim these droids."},{"b":3,"c":"CRIM_HK77","f":"CRIM","n":"HK-77","v":"HK-77","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Generic HK-77 droid from HK-47\u0027s Mustafar army.","bio":"HK-77 droids were the primary force of HK-47\u0027s droid army during his brief conquest on Mustafar during the Galactic Civil War. Manufactured from a former Separatist droid factory on Mustafar, the HK-77 units were designed by the Separatists, but never saw mass-production until HK-47 took control of the factory during the Galactic Civil War. All HK-77 droids were defeated or deactivated after HK-47\u0027s conquest resulted in failure."},{"b":3,"c":"CRIM_HONDO","f":"CRIM","n":"Hondo Ohnaka","v":"Hondo Ohnaka|Hondo Ohnaka","p":"hondo ohnaka","e":"","t":"named canon era_prequel era_imperial male non_sensitive","w":"Weequay pirate who helped rebels only for his own gain; not a Rebel Alliance member.","bio":"Hondo Ohnaka was a Weequay pirate who was active during the Clone Wars and Galactic Civil War. During the Clone Wars, Hondo led the Ohnaka Gang, based on the planet Florrum. Hondo would be responsible for a number of crimes against the Republic and Confederacy of Independent Systems, even at one point taking Anakin Skywalker, Obi-wan Kenobi, and Count Dooku hostage. By the time the war ended, Hondo\u0027s gang was dissolved. During the Galactic Civil War, Hondo assisted the Lothal Rebels, but for selfish reasons."},{"b":3,"c":"CRIM_HUMAN_MERC","f":"CRIM","n":"Human Mercenary","v":"Human Mercenary","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Generic mercenary hired by the Disciples of Ragnos.","bio":"A number of mercenaries found work with the Disciples of Ragnos led by Tavion Axmis. This mercenaries were often sent to guard important points in a cult or hutt stronghold."},{"b":3,"c":"CRIM_KLEEF","f":"CRIM","n":"Kleef","v":"Kleef","p":"kleef","e":"","t":"named legends era_imperial male non_sensitive","w":"Chop\u0027aa Notimo\u0027s second-in-command; no extra faction.","bio":"Kleef was a Gungan male who worked was Chop\u0027aa Notimo\u0027s second-in-command of his forces shortly before the Galactic Civil War. Early on, Kleef was part of the Gungan resistance movement against the Trade Federation during the Naboo Crisis, however, after growing bored working in Senator Jar Jar Binks\u0027s security detail, Kleef instead pursued a life of crime, eventually joining up with Chop\u0027aa Notimo who hired him. Shortly before the outbreak of the Galactic Civil War, Notimo, along with Kleef, assaulted Cloud City, winding up capturing Senator Garm Bel Iblis. When Galen Marek arrived on Cloud City to recruit the senator, he eventually came across Kleef who engaged him in a violent battle. Kleef was ultimately no match for the Sith Apprentice and was killed."},{"b":3,"c":"CRIM_KRIX","f":"CRIM","n":"Krix","v":"Krix","p":"krix","e":"","t":"named canon era_prequel male non_sensitive","w":"Trandoshan pilot for Garnac\u0027s Hunting Guild; no bounty hunter membership stated.","bio":"Krix was a Trandoshan male hunter and pilot who was active during the Clone Wars. Krix was responsible for piloting the freighter for Garnac\u0027s Hunting Guild, which was responsible for transporting sentient individuals across the galaxy to be hunted on the moon of Wasskah."},{"b":3,"c":"CRIM_MANDO_BH","f":"CRIM","n":"Mandalorian Bounty Hunter","v":"Mandalorian Bounty Hunter","p":"generic","e":"MANDO BH","t":"generic canon era_imperial non_sensitive","w":"Generic Mandalorian bounty hunters; MANDO and BH per variant and bio.","bio":"A number of Mandalorians worked with the crime lord Chop\u0027aa Notimo and were present during Chop\u0027aa\u0027s kidnapping of the senator Garm Bel Iblis. When Galen Marek arrived at the city, Marek carved his way through many of Chop\u0027aa\u0027s forces, including the Mandalorians."},{"b":3,"c":"CRIM_NYM","f":"CRIM","n":"Nym","v":"Nym","p":"nym","e":"","t":"named canon era_imperial male non_sensitive","w":"Feeorin Lok Revenant pirate leader; no extra faction. Canon status and media not verified.","bio":"Nym was a Feeorin male who led the Lok Revenants during and long after the Naboo Crisis. Gaining the ire of the Trade Federation, Nym and his people were attacked by them during the Naboo Crisis, and later on during the Clone Wars. By the Galactic Civil War, Nym retained control of his band of pirates, but had no desire to participate in the conflict. Nym would assist a small group assault IG-88\u0027s stronghold on his world when the droid bounty hunter went rogue."},{"b":3,"c":"CRIM_Q9_0","f":"CRIM","n":"Q9-0","v":"Q9-0","p":"q9-0","e":"","t":"named canon era_new_republic non_sensitive","w":"Droid mercenary in Din Djarin\u0027s crew on the Mandalorian; no extra faction.","bio":"Q9-0 was a reprogrammed protocol droid who worked as a mercenary during the early years of the New Republic. Q9-0, along with Xi\u0027an, Burg, Mis Mayfeld, and Din Djarin were hired to break out the prisoner Qin from a New Republic prison ship. Though they were initially successful in rescuing Qin, the group double-crossed Din Djarin. Ultimately, Djarin was able to free himself, and after locking away most of the criminal group, destroyed Q9-0 when he attempted to kill Grogu. Q9-0\u0027s remains remained aboard the Razor Crest and were used briefly in order for Din Djarin to successfully understand a Frog Lady\u0027s dialect."},{"b":3,"c":"CRIM_REBOLT","f":"CRIM","n":"Rebolt","v":"Rebolt","p":"rebolt","e":"","t":"named canon era_imperial male non_sensitive","w":"White Worms gang member on Corellia; no extra faction.","bio":"Rebolt was a Human male who worked for the White Worms gang on Corellia during the first decade of the Galactic Empire\u0027s reign. He, along with Syke, hunted for Han Solo and Qi\u0027ra after the former failed to return to Lady Proxima with anything of value."},{"b":3,"c":"CRIM_RODIAN_HEAVY","f":"CRIM","n":"Rodian Heavy Defender","v":"Rodian Heavy Defender","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Generic Rodian heavy security for Drexl Roosh\u0027s salvage operation.","bio":"A number of Rodians provided security for a salvage operation headed by Drexl Roosh on Raxus Prime. They were armed with heavy armor and heavy blaster cannons. However, many were killed By Galen Marek, Imperial forces, and Kazdan Paratus\u0027s droid army."},{"b":3,"c":"CRIM_SENNI","f":"CRIM","n":"Senni Tonnika","v":"Senni Tonnika","p":"senni tonnika","e":"","t":"named legends era_prequel era_imperial female non_sensitive","w":"Con artist sister of Brea; no faction code fits. Canon status uncertain.","bio":"Senni Tonnika was a Humanoid female who was active during the Clone Wars and Galactic Civil War. She, along with her sister Brea, worked as con artists. After overhearing from Han Solo the location of the Millienium Falcon, the two sisters attempted to steal the ship, but were quickly dissuaded upon seeing Jabba the Hutt."},{"b":4,"c":"CRIM_SIDON","f":"CRIM","n":"Sidon Ithano","v":"Sidon Ithano","p":"sidon ithano","e":"","t":"named canon era_sequel male non_sensitive","w":"Delphidian pirate captain seen in The Force Awakens and a comic short (Wookieepedia mirrors). Only CRIM is a fit, so no extra faction.","bio":"Sidon Ithano was a Delphidian male pirate who was active prior to and during the First Order-Resistance conflict. Head of his own crew of pirates, Sidon tracked the downed Obrexta III, raiding it while believing the ship contained valuable Kyber crystals once belonging to Count Dooku, but instead found the Clone Trooper, Kix, who had been frozen in stasis. Sidon was at Maz Kanata\u0027s castle when the First Order destroyed the Hosnian system."},{"b":4,"c":"CRIM_SWOOPGANG","f":"CRIM","n":"Black Vulkar Member","v":"Black Vulkar Member","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Taris swoop gang from KOTOR (Legends). Generic gang members; the Hidden Beks are not a code.","bio":"The Black Vulkars were a swoop gang that operated on Taris at some point during the Jedi Civil War. Led by Brejik, the Black Vulkars did all they could to take control of the Lower City, making the Sith Empire\u0027s occupation of the planet diffcult as the gang was not friendly to their quarantine. After capturing Bastila Shan and offering her as the prize in the annual swoop race, the amnesiac Revan raced on behalf of the Hidden Bek swoop gang and won her freedom. The Black Vulkars and Hidden Beks were killed when Darth Malak\u0027s orbital bombardment of Taris."},{"b":4,"c":"CRIM_SYKE","f":"CRIM","n":"Syke","v":"Syke","p":"syke","e":"","t":"named canon era_imperial male non_sensitive","w":"White Worms enforcer in Solo: A Star Wars Story (13 BBY), per Wookieepedia mirrors. White Worms are CRIM, so no extra faction.","bio":"Syke was a Human male who worked for the White Worms gang on Corellia during the first decade of the Galactic Empire\u0027s reign. He, along with Rebolt, hunted for Han Solo and Qi\u0027ra after the former failed to return to Lady Proxima with anything of value."},{"b":4,"c":"CRIM_TERAK","f":"CRIM","n":"Terak","v":"Terak","p":"terak","e":"","t":"named legends era_imperial male non_sensitive","w":"Sanyassan warlord of the Marauders in Ewoks: The Battle for Endor (Legends TV film), per Wookieepedia mirrors. Pirate only, no extra faction.","bio":"Terak was a Sanyassan male who was chief of the Sanyassan Marauders on Endor during the Galactic Civil War. While on Endor, Terak craved what he called The Power, and attempted to steal it from a crystal oscillator located on the ship belonging to the Towani. Within the year prior to the Battle of Endor, Terak grew increasingly obsessed with the device, eventually putting him at odds with the Ewok Wicket W Warrick. Ultimately, Terak was killed by Wicket, who accidentally activated the device, causing Terak to burn to a crisp."},{"b":4,"c":"CRIM_UBESE","f":"CRIM","n":"Ubese Bounty Hunter","v":"Ubese Bounty Hunter","p":"generic","e":"BH","t":"generic legends era_old_republic non_sensitive","w":"Ubese bounty hunters serving crime lord Visquis on Nar Shaddaa in KOTOR II (Legends). BH proposed because they worked as bounty hunters, although their real loyalty was to G0-T0.","bio":"On Nar Shaddaa during the Dark Wars, a group of Ubese Bounty Hunters worked as personal enforcers to the crime lord Visquis to guard him from Meetra Surik and the bounty hunter Mira after they infiltrated his compound respectively. Though Visquis believed himself safe in the company of these individuals, the Ubese\u0027s true loyalty was the G0-T0, and executed Visquis with no hesitation."},{"b":4,"c":"CRIM_VANA","f":"CRIM","n":"Vana Sage","v":"Vana Sage","p":"vana sage","e":"","t":"named legends era_prequel female non_sensitive","w":"Mercenary pilot and head of security for Nym\u0027s Lok Revenants (Legends), per Wookieepedia mirrors. Lok Revenants are CRIM, so no extra faction.","bio":"Vana Sage was a Human female mercenary who operated during the Invasion of Naboo and Galactic Civil War. Initially employed by the Trade Federation, Vana\u0027s contract was terminated after intercepting an message incriminating the Federation regarding their invasion on Naboo. Working with the Lok Revenant leader Nym, along with Reti and Rhys Dallows, the four pilots worked to cripple a droid factory on Eos and assisted the Royal Naboo Security Forces during the final offensive on Naboo. By the time of the Galactic Civil War, Vana Sage was stationed on Lok along with Nym, working as head of security in Nym\u0027s compound."},{"b":4,"c":"CRIM_VILLIE","f":"CRIM","n":"Vilmarh Grahrk","v":"Vilmarh Grahrk","p":"vilmarh grahrk","e":"","t":"named legends era_prequel male non_sensitive","w":"Devaronian smuggler in the Republic/early Empire (Legends comics), per Wookieepedia mirror. Smuggler only, no extra faction.","bio":"Vilmarh Grahrk, also known as Villie was a Devaronian male smuggler who was active during the final years of the Galactic Republic and the early days of the Galactic Empire. A notorious gambler, grifter and scoundrel, Villie took part in a number of underhanded schemes in his quest for money and women. Throughout the later part of his career, Vilmarh would have repeated encounters with Jedi Master Quinlan Vos from his amnesiac stage up until the end of the Clone Wars at the Battle of Kashyyyk where he\u0027d help the Jedi Master escape the planet."},{"b":4,"c":"CRIM_VOSA","f":"CRIM","n":"Komari Vosa","v":"Komari Vosa","p":"komari vosa","e":"","t":"named legends era_prequel fallen_jedi female","w":"Fallen Jedi who led the Bando Gora cult (Legends), per Wookieepedia mirror. Her story is post-Jedi and does not fit JO or UFU, so no extra faction.","bio":"Komari Vosa was a Human female Dark Jedi who led the Bando Gora at some point after the Invasion of Naboo. Once a promising Jedi, and highly regarded by her master, Count Dooku, Komari Vosa snalled and fell to the dark side after her banishment from the Jedi Order. Leading an army of cult followers, known as a Bando Gora, Vosa amassed a criminal gang powerful enough to concern Darth Sidious. Ordering Dooku to eliminate Vosa, Dooku put a hefty price on Komari Vosa\u0027s head, competed for by Jango Fett and Montross. After a lengthy hunt, Jango confronted Vosa and bested her in single combat, but was killed by Dooku."},{"b":4,"c":"CRIM_XIAN","f":"CRIM","n":"Xi\u0027an","v":"Xi\u0027an","p":"xi\u0027an","e":"","t":"named canon era_new_republic female non_sensitive","w":"Twi\u0027lek mercenary in The Mandalorian season 1, Chapter 6 (canon), per Wookieepedia mirror and the Star Wars gallery for that chapter. Mercenary only, no extra faction.","bio":"Xi\u0027an was a Twi\u0027lek female who worked as a mercenary during the early years of the New Republic. Xi\u0027an, along with Burg, Q9-0, Mis Mayfeld, and Din Djarin were hired to break out the prisoner, and Xi\u0027an\u0027s brother, Qin from a New Republic prison ship. Though they were initially successful in rescuing Qin, the group double-crossed Din Djarin. Ultimately, Djarin was able to free himself, and Xi\u0027an and the rest of the group were captured by the New Republic."},{"b":4,"c":"CRTRS_ACKLAY","f":"CRTRS","n":"Acklay","v":"Acklay","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Carnivorous Vendaxan species from Attack of the Clones (canon). Creature, no faction.","bio":"Acklay were a carnivorous species native to the world Vendaxa. Given their predatory nature, Acklays were occasionally exported to other worlds for Gladitorial combat."},{"b":4,"c":"CRTRS_GORAX","f":"CRTRS","n":"Gorax","v":"Gorax","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Predatory creatures on Endor (Legends, Ewoks). Creature, no faction.","bio":"Gorax were large bi-pedal humanoid-like creatures that were considered an invasive species to the forest moon of Endor. They were a predatory species that would occasionally raid Ewok villages and take Ewoks as either food or pets. Despite their apparent threat to the Ewoks, the Gorax were considered a rare sight."},{"b":4,"c":"CRTRS_HOWLER","f":"CRTRS","n":"Howler","v":"Howler","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Native Yavin IV predator (Legends). Creature, no faction.","bio":"The Yavin IV Howler was a native predator of the moon, getting their name for their ear-piercing shriek they used to stun their prey and ward off attackers."},{"b":4,"c":"CRTRS_LAIGREK","f":"CRTRS","n":"Laigrek","v":"Laigrek","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Dantooine insect predator from KOTOR (Legends). Creature, no faction.","bio":"Laigrek were a predatory insect native to the planet Dantooine. Laigrek often infested dark and damp areas of the planet, including long-abandoned structures such as the sublevel of the Jedi Enclave. One subspecies of the Laigrek, known by locals as the Deadly Laigrek, were capable of breathing fire over short distances and could also survive high temperatures."},{"b":4,"c":"CRTRS_MUTANT_RANCOR","f":"CRTRS","n":"Mutant Rancor","v":"Mutant Rancor","p":"generic","e":"","t":"generic legends era_new_republic non_sensitive","w":"Modified Rancor on Tanaab that Jaden Korr fought (Legends). Disciples of Ragnos are not a code. Creature, no faction.","bio":"The Mutant Rancor of Tanaab was a massive Rancor that had been modified to bear six cylinders of toxic gas, metal shields over its eyes, and giant bone spikes sticking out from its shoulders. The cylinders of toxic gas gave the Rancor the ability to blow the toxic gas within out towards its prey. Additionally, the Rancor was made immune to poison and venom and its hide was able to withstand most attacks. When Jedi Knight Jaden Korr arrived on Tanaab, he discovered that the Disciples of Ragnos were keeping the beast contained at a spaceport. One of the cultists released the beast that then went on a rampage through the spaceport, killing indiscriminately and wreaking havoc. Korr eventually lured the beast to the end of a conveyer belt and activated controls which crushed the beast between a force field and a massive crate, ending the beast\u0027s life."},{"b":4,"c":"CRTRS_RAKGHOUL","f":"CRTRS","n":"Rakghoul","v":"Rakghoul|Rakghoul","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Sith-spawn mutant from Karness Muur on Taris (Legends, KOTOR). The creator was a Sith Lord, but the Rakghouls were not Sith members, so SO is not proposed.","bio":"Rakghouls were a Sith-spawn mutant species that originated by the Sith Lord Karness Muur at some point during his life. By the Jedi Civil War, the Rakghouls became a significant threat within an area of Taris known as the Undercity, being a constant threat to the outcasts forced to live in the harsh environment. After Taris was razed by Darth Malak, the Rakghoul population increased exponentially, posing a greater threat on the galaxy during the Great Galactic War and subsequent conflicts. Any being could be turned into a Rakghoul simply by being scratched or bitten by the beasts."},{"b":4,"c":"CRTRS_RANCOR","f":"CRTRS","n":"Rancor","v":"Rancor|Bull Rancor|Felucian Rancor|Felucian Bull Rancor","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Rancor from Return of the Jedi (canon). Dathomir Witches tamed them in Legends, but creatures are not NS members. No extra faction.","bio":"Rancors were giant semi-sentient reptilian bipedal animals native to the planet Dathomir. Rancors were known for their agressive natures and tough hides, being able to withstand blaster fire and light blows from Lightsabers. They also sported large claws protruding from the ends of their fingers and had large teeth attached to powerful jaws. They were usually indiscriminate hunters and ate almost any being they could kill. Rancors were also often used as warmounts by various groups as they made formidable opponents in battle. The Witches of Dathomir were a particularly prominent group that often tamed the Rancors of Dathomir to serve as mounts and beasts of burden. Some Rancors were also kept as trophies, others were used as arena combatants, and still some were employed to provide entertaining executions as in the case of Jabba the Hutt."},{"b":4,"c":"CRTRS_WAMPA","f":"CRTRS","n":"Wampa","v":"Wampa|Swamp Wampa","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Hoth predator from The Empire Strikes Back (canon). Creature, no faction.","bio":"Wampas were tall bipedial animals native to the freezing wastes of the planet Hoth. Wampas sported thick white fur coats, two horns which curved inward from the sides of their heads, and long black claws which they used to attack their prey. Wampas usually made their homes in caves where they were sheltered from the harsh weather of the world outside. Wampas typically preferred to ambush their prey by hiding amongst the snow and leaping out suddenly to kill or stun them. In many cultures, their hides were considered trophies and some particularly wealthy individuals kept live specimens as status symbols."},{"b":4,"c":"CRTRS_ZOMBIE","f":"CRTRS","n":"Death Trooper","v":"Death Trooper","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Blackwing-virus undead stormtroopers (Legends). They were infected dead troopers, not GE members in good standing, so GE is not proposed.","bio":"Undead Stormtroopers, or Death Troopers, were deceased Stormtroopers that were infected by the deadly Blackwing Virus. During the Galactic Civil War, an imperial research facility on Dathomir studying the virus had an outbreak of the disease. As a result, a large portion of Dathomir was placed under quarantine. Those infected by the virus were killed and the virus took control of their bodies. The virus was sentient enough to the point where it was capable of forcing the host body to use a blaster or other weapons."},{"b":4,"c":"CV_ALDERAAN","f":"CV","n":"Alderaan Scientist","v":"Alderaan Scientist","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Alderaanian scientist with no specific canon source. No faction.","bio":"Many Alderaanians found work in the sciences in an effort to continue the advancement of their homeworld."},{"b":4,"c":"CV_ARALANI","f":"CV","n":"Aralani","v":"Aralani","p":"ar\u0027alani","e":"","t":"named canon era_imperial female non_sensitive","w":"Chiss admiral of the Expansionary Defense Fleet, per Wookieepedia mirrors and the canon Thrawn novels. Chiss Ascendancy is not a code, and she was not a GE member, so no extra faction.","bio":"Ar\u0027alani, born Irizi\u0027ar\u0027alani, was a Chiss Female who served as an admiral in the Expansionary Defense Fleet of the Chiss Ascendency during the reign of the Galactic Empire. Loyal to the Ascendency, Ar\u0027alani promised to Thrawn that she would bolster the defenses of the colony world where a numner of Force Sensitive Chiss girls were kidnapped."},{"b":4,"c":"CV_ASOGIAN","f":"CV","n":"Asogian","v":"Asogian","p":"generic","e":"","t":"generic legends era_prequel non_sensitive","w":"Asogian species from Brodo Asogi. Canon status unverified. No faction.","bio":"Asogians were short sentient beings with yellowish skin, cylindrical heads, large eyes, and flat fleet. Asogians were native to Brodo Asogi and had joined the Galactic Republic sometime before the Battle of Naboo. After the Rise of the Empire, the Asogians homeworld became a territory of the Galactic Empire."},{"b":4,"c":"CV_BABU","f":"CV","n":"Babu Frik","v":"Babu Frik","p":"babu frik","e":"RES","t":"named canon era_sequel male non_sensitive","w":"Anzellan technician in The Rise of Skywalker who aided the Resistance and worked with Lando\u0027s team. Spice Runners of Kijimi are not a clear CRIM membership, so RES is the only extra.","bio":"Babu Frik was a Male Anzellan from the planet Kijimi. Frik worked for the Spice Runners on his homeworld, during which he had helped the future Resistance hero Poe Dameron escape offworld. After the rise of the First Order, Kijimi fell under its control. During the war between the First Order and the Resistance, Poe Dameron and his allies came to Frik for help, hoping that he could extract information from C-3PO\u0027s memory banks. Frik was able to successfully complete the operation and retrieve the data. After Poe and his allies left the planet, Darth Sidious\u0027 forces decimated the planet with a Xyston-class Star Destroyer, however, Frik managed to escape and soon joined Lando Calrissian and the Citizens\u0027 Fleet and fought in the Battle of Exegol, in which he managed to destroy one of the Xyston-class Destroyers. After the victory celebrations on Ajan Kloss, Frik officially signed on with the Resistance."},{"b":4,"c":"CV_BD_JUNKER","f":"CV","n":"Iago Battle Droid","v":"Iago Battle Droid","p":"generic","e":"CIS","t":"generic canon era_prequel non_sensitive","w":"Iago battle droids were Separatist units (CIS). Their reprogramming by Jaybo does not change their membership. Canon status unverified.","bio":"In the early period of the Clone Wars, Iago was briefly occupied by Separatist forces, after which all essential personnel were relocated offworld, with the majority of Battle Droids left behind. A resident of Iago, Jaybo, with his knowledge of droids, reprogrammed all Battle Droids left behind to serve him. The reprogrammed droids were seemingly incapable of violence, and a small number of them were destroyed by Anakin Skywalker after arriving, searching for the cure to the Blue Shadow Virus."},{"b":4,"c":"CV_BITH","f":"CV","n":"Bith","v":"Bith","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Bith species, the Mos Eisley cantina musicians (canon). No faction.","bio":"The Bith were a peaceful and intelligent sentient species who hailed from Clak\u0027dor VII. They had hairless, dome-shaped heads and black, glassy eyes that lacked lids and could not shed tears. Bith often found work as musicians, scientists, and engineers. Bith also had very sensitive hearing, and loud sonic grenades could make their heads explode. Because Bith had no noses, they smelled through special organs beneath the skin flaps on their faces."},{"b":4,"c":"CV_BOTHAN","f":"CV","n":"Bothan","v":"Bothan","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Bothan species. The SpyNet gathered Death Star intelligence for the Rebellion, but this is a species, not a member, so no extra faction is proposed.","bio":"Bothans were a short race of furry humanoids hailing from the planet Bothawui. Known for being master politicians and spies, Bothans took little part in the Galactic Civil War, officially remaining neutral, though their famed SpyNet playing both sides and commercial interests sold profits. The Bothans were famously credited for acquiring intel about the location of the second Death Star, as well as confirming Emperor Palpatine was aboard. This however cost the lives of many Bothans."},{"b":4,"c":"CV_CAMI","f":"CV","n":"Camie Marstrap","v":"Camie Marstrap","p":"camie marstrap","e":"","t":"named canon era_imperial female non_sensitive","w":"Tatooine civilian and Luke\u0027s childhood friend, shown in The Book of Boba Fett (canon). No faction.","bio":"Camie Marstrap was a Female Human from the planet Tatooine. Marstrap grew up as the daughter of hydroponic gardners that often bought water from the moisture farmers Owen and Beru Lars. Marstrap was also a friend of Luke Skywalker in his youth and often spent time with him at Tosche Station along with Deak, Windy, Biggs Darklighter, and her boyfriend Laze \u0027Fixer\u0027 Loneozner. Sometime after Luke Skywalker and his allies rescued Han Solo from certain death in the Great Pit of Carkoon, Marstrap and Loneozner were acosted by a group of Nikto bikers at Tosche Station. After Loneozner stood up to the gang, they proceeded to beat him and stick him with shock sticks. Loneozner was rescued by Boba Fett who slaughtered the Nikto bikers in cold blood."},{"b":4,"c":"CV_CEREAN","f":"CV","n":"Cerean (Female)","v":"Cerean (Female)|Cerean (Male)","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Cerean species (canon). Both male and female variants share one code. No faction.","bio":"The Cereans were a humanoid species native to the planet Cerea. Cereans were easily distinguished by their large heads which contained a second brain."},{"b":4,"c":"CV_CHAM","f":"CV","n":"Cham Syndulla","v":"Cham Syndulla","p":"cham syndulla","e":"REP REB","t":"named canon era_prequel era_imperial male non_sensitive","w":"Twi\u0027lek resistance leader who allied with the Republic in the Clone Wars and fought the Empire with the Rebels (canon, The Clone Wars and Rebels). Both REP and REB fit.","bio":"Cham Syndulla was a Twi\u0027lek male resistance fighter who was active during the Clone Wars and the reign of the Empire. Early in his career, Syndulla worked to oppose Senator Orn Free Taa\u0027s corruption until the outbreak of the Clone Wars. During the war, Cham led a resistance group against the Separatists who had invaded Ryloth, later allying himself with Mace Windu and the Republic forces. After the rise of the Empire, Cham continued to lead his people against the Empire\u0027s occupation of Ryloth, during which his wife, Eleni was killed, causing him to devote his whole life to fighting, causing his relationship with his daughter, Hera Syndulla, to be strained. Years before the Battle of Yavin, Cham worked with Hera and her Rebel cell to capture a Imperial carrier, which he attempted to destroy until he was convinced otherwise. Cham later worked with Hera to recover their family Kalikori."},{"b":4,"c":"CV_CHISS","f":"CV","n":"Chiss","v":"Chiss","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Chiss species from the Thrawn canon novels. Chiss Ascendancy is not a code, so no extra faction.","bio":"The Chiss were a near-human species hailing from the planet Csillia. Though identical to humans in terms of body type. Chiss were easily identifiable by their blue skin, red eyes, and blue-black hair. The Chiss Ascendancy were their governing body and individual Chiss rarely left their homeworld, making them a rare sight in the galaxy."},{"b":4,"c":"CV_CIVILIANDROID","f":"CV","n":"Civilian Battle Droid","v":"Civilian Battle Droid","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Civilian security battle droids on Dantooine (KOTOR, Legends). Not CIS military units, so no extra faction.","bio":"Civilian Battle Droids were a type of droid popularly used as security for major spaceports and wealthy individuals prior to and during the Jedi Civil War. During the Jedi Civil War, Dantooine farm owners Nurik Sandral and Ahlan Matale owned a number of these droids, using them to provide security inside their mansions and to members of their respective families should they venture outside their homes."},{"b":4,"c":"CV_CLEGG","f":"CV","n":"Clegg Holdfast","v":"Clegg Holdfast","p":"clegg holdfast","e":"","t":"named canon era_prequel male non_sensitive","w":"Nosaurian podracing journalist in The Phantom Menace (canon). No faction.","bio":"Clegg Holdfast was a Nosaurian Male journalist who worked for a number of Podracing journals by the time of the Naboo Crisis. Clegg participated in the Boonta Eve Classic which Anakin Skywalker competed in and won, coming in seventh place."},{"b":4,"c":"CV_COBB","f":"CV","n":"Cobb Vanth","v":"Cobb Vanth","p":"cobb vanth","e":"","t":"named canon era_new_republic male non_sensitive","w":"Marshal of Mos Pelgo in The Mandalorian (canon). A local official, no faction.","bio":"Cobb Vanth was a Human male who served as marshal of Mos Pelgo in the early years of the New Republic. After the Battle of Endor, Mos Pelgo was raided by bandits, which Cobb barely escaped from. He later purchased a set of Mandalorian armor once belonging to Boba Fett, and single-handedly liberated Mos Pelgo. With the arrival of Din Djarin, Cobb struck a deal to return the armor if Djarin assisted the town against a Krayt Dragon. With the dragon defeated, Cobb kept his word and returned the armor to Djarin."},{"b":4,"c":"CV_CZERKA","f":"CV","n":"Czerka Guard","v":"Czerka Guard","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Czerka Corporation security guards (Legends, KOTOR). Their loyalty is to corporate profits, not CRIM or any other code.","bio":"Czerka Guards were the primary security force for Czerka Corporation on worlds that Czerka either occupied or had a heavy influence in. Though Czerka Guards played the role of security, their primary directive was to only interfere in affairs that directly involved Czerka\u0027s profits. As such, they would never escort civilians through hostile territory or stop petty crimes unless Czerka was at risk."},{"b":4,"c":"CV_DANT_MIL","f":"CV","n":"Dantooine Militiaman","v":"Dantooine Militiaman|Dantooine Militiaman","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Dantooine militia farmers who defended Falon Grey (Legends). No faction.","bio":"During the Dark Times in the aftermath of the Jedi Purge, several Dantooine farmers worked together to hide the Jedi Knight Falon Grey from Imperial forces. When X2 arrived ahead of an Imperial force sent to hunt down Grey, the farmers organized into a Militia and prepared to defend Grey, but instead, Grey introduced himself to X2 and accepted X2\u0027s offer of aid in the coming battle. Soon after, an Imperial force spearheaded by X2\u0027s twin brother X1 arrived on the planet and began attacking the Militia forces. At first, the Militia together with X2 and Grey managed to stave off the attack, but were soon overwhelmed by the Imperial force\u0027s superior might. X1 and his soldiers ruthlessly dispatched every Militia member in the village before ultimately murdering Falon Grey and leaving X2 for dead."},{"b":4,"c":"CV_DEVARONIAN","f":"CV","n":"Devaronian","v":"Devaronian|Devaronian","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Devaronian species (canon). No faction.","bio":"Devaronians were a horned, humanoid species hailing from the planet Devaron. An unusual species, Devaronians had a gender dimorphism, with the males growing a pair of horns from their heads, and the females having no horns, but instead had a full head of hair. Many people in the larger galaxy felt uncomfortable in their presence, for they resembled the devils of a thousand different myths."},{"b":4,"c":"CV_DOOGO","f":"CV","n":"Doogo","v":"Doogo","p":"doogo","e":"","t":"named legends era_imperial male non_sensitive","w":"Rodian in Star Wars Galaxies: An Empire Divided (Legends). Wookieepedia mirror is thin and gives no affiliation. No faction.","bio":"Doogo was a Rodian male who lived during the Galactic Civil War."},{"b":4,"c":"CV_DOPAK","f":"CV","n":"Dopak","v":"Dopak","p":"dopak","e":"","t":"named legends era_old_republic male non_sensitive","w":"Mercenary second-in-command under Azkul who switched sides at Khoonda (KOTOR II, Legends), per Wookieepedia mirror. Mercenary only, no extra faction.","bio":"Dopak was a Human male who worked as a member of Azkul\u0027s mercenaries during the time of the Dark Wars. Initially let go by the Republic by the time of the Jedi Civil War, Dopak fell in with a band of mercenaries led by Azkul. However, Dopak found himself disagreeing with Azkul\u0027s methods and allied himself with Khoonda\u0027s milita leader, Zherron. With the code phrase given to him by Zherron through Meetra Surik, Dopak and a handful of other mercenaries defected and defended Khoonda against Azkul, which they were victorious."},{"b":4,"c":"CV_DRESSELLIAN","f":"CV","n":"Dressellian","v":"Dressellian","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Dressellian species. Some joined the Rebels, but this is a species entry, not a member. Canon status unverified.","bio":"Dressellians were a humanoid species hailing from the planet Dressel. Up until the Galactic Civil War, the Dressellians lived in isolation, though were fiercely loyal to the Galactic Republic. After the formation of the Empire, many Dressellians joined the ranks of the Rebel Alliance."},{"b":4,"c":"CV_DROOPY","f":"CV","n":"Droopy McCool","v":"Droopy McCool","p":"droopy mccool","e":"HC","t":"named canon era_imperial male non_sensitive","w":"Kitonak musician in Jabba\u0027s Palace band (Return of the Jedi, canon). He was Jabba\u0027s employee for a significant part of his story, so HC is proposed.","bio":"Droopy McCool, also called Snit, was a Male Kitonak from the planet Kirdo III. McCool began his career as a slave musician under the ownership of Evar Orbus after being bought on Orvax IV. McCool played in the band, called Evar Orbus and His Galactic Jizz-Wailers, alongside other muscisians Max Rebo and Sy Snootles. Eventually the band traveled to Tatooine where they clashed with another band, Figrin D\u0027an and the Modal Nodes. A fight broke out between the two bands in which Orbus was killed. After the death of Orbus, McCool and his bandmates rebranded as the Max Rebo Band and were contracted by Jabba\u0027s Palace to be his Palace Band. During the rescue of Han Solo above the Great Pit of Carkoon, McCool and his bandmates abandonded Jabba\u0027s Barge in favor of the hot sands below. Arguing amongst each other as to what to do next, the members of the band ultimately parted ways with McCool wandering into the Dune Sea, hoping to find a rumored group of Kitonaks that were said to live in the far sands of Tatooine."},{"b":4,"c":"CV_DUROS","f":"CV","n":"Duros","v":"Duros|Duros","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Duros species (canon). No faction.","bio":"Duros were a humanoid species hailing from the planet Duro. They had smooth blue-green skin, red eyes, lipless mouths and long, thin, noseless faces with green blood."},{"b":4,"c":"CV_Falleen","f":"CV","n":"Falleen","v":"Falleen","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Falleen species. The bio is empty, so this is based on general knowledge. Canon status unverified. No faction.","bio":""},{"b":4,"c":"CV_GAND","f":"CV","n":"Gand","v":"Gand","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Gand species (canon). No faction.","bio":"The Gand were a insectoid species hailing from the planet Gand. They were consider a humble species and often referred to themselves in the 3rd person, only referring to Gands held in high regard by their name."},{"b":4,"c":"CV_GIVIN","f":"CV","n":"Givin","v":"Givin","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Givin species from Yag\u0027Dhul. Canon status unverified. No faction.","bio":"Givins were a humanoid species hailing from the planet Yag\u0027Dhul. Known for their mathematical genius, many Givins were widely sought after in job markets, despite appearing unsettling to most other individuals, and even greeted each other using mathematical equations. The harsh environments of their homeworld adapted the Givins to the point where they could survive for a short time in a vacuum."},{"b":4,"c":"CV_GUNGAN","f":"CV","n":"Gungan","v":"Gungan","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Gungan species of Naboo (canon). No faction.","bio":"Gungans were a warrior species hailing from the planet Naboo. An aquatic species, Gungans lived underwater, but could survive on land just as easily. Gungans were capable fighters, even one holding his own against General Grievous for a short time, and fought against the Trade Federation\u0027s Droid Army during the Naboo Crisis."},{"b":4,"c":"CV_HUMAN_F","f":"CV","n":"Human Female","v":"Human Female|Human Female","p":"generic","e":"","t":"generic canon female non_sensitive","w":"Generic human female civilian. No faction.","bio":"Humans were mammalian bipeds originating on Coruscant. Humans were the most populous and common species in the galaxy, often being seen on a modicum of worlds and in numerous locations. Humans took up diverse occupations, everything from politicians to bounty hunters. There was no one center of Human culture in the galaxy, but notable Human-dominant planets included Coruscant, Corellia, Onderon, Alderaan, Dantooine, and Anaxes. Some groups of Humans, like Corellians, Mandalorians, Chandrilans, and Hapans considered their sub-groups distinct from other Human groups, often due to culture or policy. Many notable individuals were also of the Human species, including Ajunta Pall, Revan, Meetra Surik, Darth Bane, Sheev Palpatine, Anakin Skywalker, Luke Skywalker, Jaina Solo, and Cade Skywalker."},{"b":4,"c":"CV_HUMAN_M","f":"CV","n":"Human Male","v":"Human Male","p":"generic","e":"","t":"generic canon male non_sensitive","w":"Generic human male civilian. No faction.","bio":"Humans were mammalian bipeds originating on Coruscant. Humans were the most populous and common species in the galaxy, often being seen on a modicum of worlds and in numerous locations. Humans took up diverse occupations, everything from politicians to bounty hunters. There was no one center of Human culture in the galaxy, but notable Human-dominant planets included Coruscant, Corellia, Onderon, Alderaan, Dantooine, and Anaxes. Some groups of Humans, like Corellians, Mandalorians, Chandrilans, and Hapans considered their sub-groups distinct from other Human groups, often due to culture or policy. Many notable individuals were also of the Human species, including Ajunta Pall, Revan, Meetra Surik, Darth Bane, Sheev Palpatine, Anakin Skywalker, Luke Skywalker, Jaina Solo, and Cade Skywalker."},{"b":4,"c":"CV_ILCO","f":"CV","n":"Ilco Munica","v":"Ilco Munica","p":"ilco munica","e":"","t":"named canon era_sequel male non_sensitive","w":"Abednedo Church of the Force member executed on Tuanul in The Force Awakens (canon), per the Databank and Wookieepedia mirrors. Not a fit for any code.","bio":"Ilco Munica was an Abednedo male who served as a member of the Church of the Force by the time of the First Order-Resistance War. When Kylo Ren attacked Tuanul on Jakku, searching for a map to Luke Skywalker, Kylo Ren ordered the execution of all civilians. Ilco, like the remaining survivors, perished from the firing squad."},{"b":4,"c":"CV_ISHI_TIB","f":"CV","n":"Ishi Tib","v":"Ishi Tib","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Ishi Tib species (canon). No faction.","bio":"The Ishi Tib were an aquatic humanoid species hailing from the planet Tibrin. They were easily recognized by their green skin, large eyes that extended from angular stalks on their heads, and beaks."},{"b":4,"c":"CV_ITHORIAN","f":"CV","n":"Ithorian","v":"Ithorian|Ithorian","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Ithorian species (canon). No faction.","bio":"Ithorians were a mammalian, herbivorous species hailing from the planet Ithor. Among the galaxy, Ithorians were known as a pacifistic species, pursuing careers as politicians or gardeners. Ithorians could be force sensitive and would train to be Jedi. With four throats, Ithorians had an ability to shout at such intensity to ward off or even deafen potential threats. Force Sensitive members could amplify this ability and could use it with more devastating effects."},{"b":4,"c":"CV_JARJAR","f":"CV","n":"Jar Jar Binks","v":"Jar Jar Binks","p":"jar jar binks","e":"REP","t":"named canon era_prequel male non_sensitive","w":"Gungan Representative who sat in the Galactic Senate in the prequels (canon). Senate membership fits REP for a significant part of his story.","bio":"Jar Jar Binks was a Gungan male who served alongside Padm� Amidala as Representative of the Gungans prior to and during the Clone Wars. A clumsy individual, Binks was exiled from his people for his consistent accidents, until he was welcomed back into Gungan society following the Naboo Crisis. As a representative of his people, Binks spoke for Naboo in the senate following Padm�\u0027s leave of absense. Binks proposed the Senate to grant Palpatine emergency powers, paving the way for Palpatine\u0027s rise as Emperor."},{"b":5,"c":"CV_JAWA","f":"CV","n":"Jawa","v":"Jawa|Jawa","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Tatooine scavenger species seen in A New Hope; no faction membership in the bio.","bio":"Jawas were a small, rodent-like species hailing from the planet Tatooine. Jawas were passionate scavengers, seeking out technology for sale or trade while riding aboard their sandcrawlers, massive vehicles which were famously known as a Jawa band\u0027s base of operations."},{"b":5,"c":"CV_KABE","f":"CV","n":"Kabe","v":"Kabe","p":"kabe","e":"","t":"named canon female era_imperial non_sensitive","w":"Chadra-Fan cantina patron in A New Hope; a bystander, no faction. Name not verified on Wookieepedia.","bio":"Kabe was a Chadra-Fan female who was a frequent patron of Chalmun\u0027s Cantina on the planet Tatooine. Kabe would often use her annoying high pitched squeaks as a method of getting the attention of the cantina\u0027s bartender, Wuher. She was present in the cantina when Luke Skywalker and Obi-Wan Kenobi visited in order to find a pilot to fly them to Alderaan."},{"b":5,"c":"CV_KAGE","f":"CV","n":"Kage","v":"Kage","p":"generic","e":"","t":"generic legends era_ancient non_sensitive","w":"Quarzite warrior people from Legends; bio describes their own warriors fighting the Belugans, no faction code fits. Not verified on Wookieepedia.","bio":"The Kage were a near-human species that hailed from the planet Quarzite. A spirited and dedicated people, the Kage formed their own warriors in an effort to combat the Belugans, whom they regarded as tyrannical."},{"b":5,"c":"CV_KALEESH","f":"CV","n":"Kaleesh","v":"Kaleesh","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Warrior species from Kalee in The Clone Wars; no faction membership stated.","bio":"Kaleesh were reptillian humanoids originating from the planet Kalee. The Kaleesh were a warrior species, believing that war was an essential part of life. Kaleesh would often wear a traditional mask made out of carved animal bones to obscure their face around outsiders."},{"b":5,"c":"CV_KAMINOAN","f":"CV","n":"Kaminoan","v":"Kaminoan","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Cloning pioneers from Kamino who supplied the Republic; a service provider, not a member, so no extra faction.","bio":"Kaminoans were an amphibious species hailing from the planet Kamino. Though not well-known prior to the Clone Wars, the Kaminoans were widely regarded as the pioneers of cloning in the galaxy."},{"b":5,"c":"CV_KARKARODON","f":"CV","n":"Karkarodon","v":"Karkarodon","p":"generic","e":"","t":"generic legends era_prequel non_sensitive","w":"[corrigé] Bio says the species was allied with the Separatists and ran campaigns for them in the Clone Wars; not verified on Wookieepedia.","bio":"Karkarodon were amphibious humanoids from the planet Karkaris. Karkarodons had webbed feat and hands, flat faces with square jaws and mouths with rows of sharp teeth. Karkarodons were known for being quick in the water and also for being deadly and resilient hunters. The Karkarodons also as some point invented the aquatic cyborg jellyfish called the Hydroid Medusas which were largely invulnerable to blaster fire and Lightsaber strikes. The Karkarodons were allied with the Separatist Alliance during the Clone Wars and helped conduct campaigns on worlds like Mon Calamari."},{"b":5,"c":"CV_KELDOR","f":"CV","n":"Armored Kel\u0027Dor","v":"Armored Kel\u0027Dor","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Kel Dor species from Dorin (Plo Koon); armored variant is a unit variant, no faction.","bio":"The Kel Dor were a sentient species native to the planet Dorin. Due to their biology, Kel Dor who ventured off Dorin were required to wear special breath masks over their eyes and nostrils."},{"b":5,"c":"CV_KIMMI","f":"CV","n":"Kimmi Chyler","v":"Kimmi Chyler","p":"kimmi chyler","e":"","t":"named legends female era_imperial non_sensitive","w":"Galactic Civil War swoop racer; Legends-only character, no faction in bio. Not verified on Wookieepedia.","bio":"Kimmi Chyler was a Human female who worked as a swoop racer during the Galactic Civil War, making a name for herself as the best female swoop racer in the galaxy."},{"b":5,"c":"CV_KINO","f":"CV","n":"Kino Loy","v":"Kino Loy","p":"kino loy","e":"","t":"named canon male era_imperial non_sensitive","w":"Narkina 5 prisoner in Andor; a prisoner unit floor manager, no faction.","bio":"Kino Loy was a Male Human prisoner held at the Narkina V facility. At some point after his imprisonment, Loy became the floor manager of his prisoner unit, giving orders to his fellow inmates as they worked and supervising their conduct. When Cassian Andor, under the name Keef Girgo, was imprisoned on Narkina V, he was assigned to Loy\u0027s unit and Loy worked to integrate him with the other inmates under his authority. During his imprisonment, Loy heard the suicide of another inmate and later saw one of his unit named Ulaf suffer a stroke, only later to be euthanized by a doctor and fellow inmate named Rhasiv. Rhasiv also informed Loy that no prisoner had ever been released from the facility which convinced Loy to help Andor escape. After Andor created a distraction, Loy and the rest of the prisoners in their unit fought their way to the control room where Loy used the intercom to inspire the rest of the prisoners to revolt. The prisoners soon overwhelmed the understaffed prison guards and escaped, however, the prison was surrounded by a sea and, at the threshold of escape, Loy informed Andor that he could not swim and moved back from the edge as Andor was pushed into the sea by the mass of prisoners rushing forward."},{"b":5,"c":"CV_KUIIL","f":"CV","n":"Kuiil","v":"Kuiil","p":"kuiil","e":"","t":"named canon male era_new_republic non_sensitive","w":"Ugnaught moisture farmer in The Mandalorian; ally of Din Djarin but not a member of MANDO, no extra faction.","bio":"Kuiil was an Ugnaught male who resided on Arvala-7 in the years following the Galactic Civil War. Having working a life of servitude under the Empire, Kuiil settled on his new home as a moisture farmer. After the Mandalorian Din Djarin arrived to his world, Kuiil requested that the hunter take out a group of mercenaries that had settled recently and were causing trouble. Djarin was successful in doing so and captured his bounty, the child Grogu. Re-uniting some time later, Kuiil attempted to protect Grogu from Gideon\u0027s forces, but was killed just shy of boarding Djarin\u0027s vessel and keeping Grogu safe."},{"b":5,"c":"CV_LEESUB","f":"CV","n":"Leesub Sirln","v":"Leesub Sirln","p":"leesub sirln","e":"","t":"named legends female force_user era_imperial","w":"Qiraash fugitive with minor precognition during the Galactic Civil War; Legends-only, no faction. Not verified on Wookieepedia.","bio":"Leesub Sirln was a Female Qiraash fugitive during the Galactic Civil War. Sirln was suspected of being Force-sensitive by the Galactic Empire, though in truth she only bore some semblance of precognition. Sirln was forced to flee from the Empire and at one point arrived at Chalmun\u0027s Spaceport Cantina on Tatooine and was witness to Ben Kenobi cutting off the Aqualish Ponda Baba\u0027s arm."},{"b":5,"c":"CV_MUSTAFARIAN","f":"CV","n":"Southern Mustafarian","v":"Southern Mustafarian|Northern Mustafarian","p":"generic","e":"","t":"generic legends era_prequel non_sensitive","w":"Insectoid species from Mustafar; no faction membership in bio. Not verified on Wookieepedia.","bio":"Mustafarians were an insectoid sentient species hailing from the planet Mustafar. They were divided into two subspecies: Northern and Southern. Northern Mustafarians were taller and thinner, whereas Southern Mustafarians were smaller, stockier, and hardier."},{"b":5,"c":"CV_MUUN","f":"CV","n":"Muun","v":"Muun","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Mathematical and financial species from Scipio; founders of the InterGalactic Banking Clan, which is not a faction code.","bio":"Muuns were a humanoid species originating from the planet Scipio. Muuns were often regarded for their excellent mathematical and financial skills, and some members of the species founded the InterGalactic Banking Clan."},{"b":5,"c":"CV_NABRUN","f":"CV","n":"Nabrun Leids","v":"Nabrun Leids","p":"nabrun leids","e":"","t":"named canon male era_imperial non_sensitive","w":"Moseerian smuggler in the Mos Eisley cantina scene of A New Hope; no faction. Name not verified on Wookieepedia.","bio":"Nabrun Leids was a Moseerian male smuggler who was active during the Galactic Civil War. Nabrun was present in Chalmun\u0027s Spaceport Cantina as Luke Skywalker and Obi-Wan Kenobi were attempting to locate a pilot to take them to Alderaan."},{"b":5,"c":"CV_NARKINA","f":"CV","n":"Narkina Prisoner","v":"Narkina Prisoner","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Narkina 5 prison inmates forced into labor for the Empire; prisoners, not Imperial members, so no extra faction.","bio":"In the years prior to the outbreak of the Galactic Civil War, the prison factory located on Narkina 5 housed many prisoners of the Galactic Empire, taking advantage of the recent Rebel activity to increase prison sentences and justify their usage of prisoners for hard labor. The prison was kept under strict supervison at all times, with the prisoners being forced to work every day unknowingly on parts for the Death Star and any appearance of a riot being struck down by the prison\u0027s electric flooring system. Cassian Andor and Kino Loy helped to spark a riot in the prison which led to most of the prisoners escaping."},{"b":5,"c":"CV_NASS","f":"CV","n":"Boss Nass","v":"Boss Nass","p":"boss nass","e":"","t":"named canon male era_prequel non_sensitive","w":"Gungan leader of Otoh Gunga during the Naboo crisis (The Phantom Menace); no extra faction.","bio":"Boss Nass was a Gungan male leader of the Gungans during the Naboo Crisis. Nass governed the Gungans from the city of Otoh Gunga within Naboo\u0027s oceans, keeping a close eye on Gungan affairs and, for a time, assuring that the Gungans and the Naboo did not interact. "},{"b":5,"c":"CV_NIKTO","f":"CV","n":"Nikto","v":"Nikto","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Reptilian species from Kintan seen in A New Hope; no faction membership in bio.","bio":"Niktos were a reptillian humanoid species originating from the planet Kintan. Though there were multiple subspecies of the Nikto, each one was often easily recognized by their leathery skin with some being covered in spikes or horns."},{"b":5,"c":"CV_NOGHRI","f":"CV","n":"Noghri","v":"Noghri|Noghri","p":"generic","e":"GE","t":"generic legends era_imperial non_sensitive","w":"Noghri assassins who served the Empire under Darth Vader in Legends; bio does not state it. Not verified on Wookieepedia.","bio":"Noghri were a primitive humanoid species hailing from the planet Honoghr. They had steely gray or blue skin, and were extremely skilled assassins due to their abilities in stealth and hand-to-hand combat. Despite their small size, they were efficient killing machines, with claws, fangs, and a sense of smell so acute, they could smell one\u0027s bloodline. They were much like the Wookiee species culturally, in that they respected honor above all else."},{"b":5,"c":"CV_OHWUN","f":"CV","n":"Ohwun De Maal","v":"Ohwun De Maal","p":"ohwun de maal","e":"","t":"named legends male era_imperial non_sensitive","w":"Duros who owned the Millennium Falcon before Han Solo; a smuggler and dock owner with no faction. Not verified on Wookieepedia.","bio":"Ohwun De Maal was a Male Duros who worked in various occupations. Maal owned several docking bays on Tatooine in Mos Eisley with his wife Chachi De Maal. In addition to this, Maal served as a flight instruction and a smuggler. The couple often used aliases when conducting business with Maal using the names Ellor Madak and Ellorrs Madak and his wife using the name Baniss Keeg. Maal was also the owner of the Millennium Falcon which was stolen by Han Solo and Chewbacca not long before the Battle of Yavin. The two would later be witnesses to Cornelius Evazan\u0027s attack againt Luke Skywalker in the cantina in Mos Eisley and the subsequent retaliation by Ben Kenobi in which he cut off the arm of Evazan\u0027s companion, Ponda Baba. The two also saw Han Solo kill the bounty hunter Greedo who had been holding the smuggler at blaster point."},{"b":5,"c":"CV_OPO_CHANO","f":"CV","n":"Opo Chano","v":"Opo Chano","p":"opo chano","e":"","t":"named legends male era_old_republic non_sensitive","w":"Duros droid engineer in Knights of the Old Republic II; worked for Czerka Corporation, which is not a faction code.","bio":"Opo Chano was a Duros Male who worked as a Droid Engineer during the Dark Wars. Owing a hefty sum to the Exchange, Chano found work with Czerka Corporation, designing their protocol droid B-4D4-GE3. When Meetra Surik approached Chano, asking for his credentials to B-4D4, Chano initially refused, but after Surik paid off his loan, Chano immediately gave Surik the credentials, happy to be free from his debt."},{"b":5,"c":"CV_PAX","f":"CV","n":"Pax Bonkik","v":"Pax Bonkik","p":"pax bonkik","e":"","t":"named legends male era_prequel non_sensitive","w":"Rodian slave to Mars Guo in The Phantom Menace era; no faction. Not verified on Wookieepedia.","bio":"Pax Bonkik was a Rodian male who worked as a slave to the podracer Mars Guo prior to and during the Naboo Crisis. In an attempt to save himself and his brother, Pax struck a deal with the podracer Teemto Pagalies in an effort to purchase him and his brother from Guo\u0027s ownership. A plan which ultimately failed as Guo lost the race and threatened to sell off his brother. Though freed by Pagalies, Pax was ultimately able to secure enough cr
