u0027s force made short work of the defenses of Coruscant and the Mandalorians were able to seize experimental weapons during the battle, however, they were abruptly ordered to retreat by Aleema Keto, one of the Krath commanders, after she lied to the Indomitable, telling him that Qel-Droma had died during the battle. The Indomitable discovered this deception, however, and alterted Kun who agreed to help the Mandalorians rescue Qel-Droma from Coruscant where he was being held prisoner. In a devastating but short conflict, Kun killed the Supreme Chancellor of the Republic and the Mandalorians managed to resuce Qel-Droma. After his resuce, Qel-Droma ordered the Mandalorians to attack Onderon and take over the capital city of Iziz. Following his master\u0027s orders, the Indomitable led his forces in an all out assault on the city, clashing with the Beast Riders in the skies above. However, after Republic reinforcements arrived, the tide of the battle turned and the Indomitable found himself in a desperate struggle for survival. The Indomitable ordered a retreat to the nearby moon of Dxun but during the flight, the Indomitable\u0027s Basilisk was destroyed, throwing him to the jungle floor. After a brief struggle against his pursuers, Mandalore the Indomitable was struck down and killed."},{"b":11,"c":"MANDO_KHOMO","f":"MANDO","n":"Khomo Fett","v":"Khomo Fett","p":"khomo fett","e":"","t":"named legends era_ancient male non_sensitive","w":"Advisor to Mandalore the Avenger; no extra faction.","bio":"Khomo Fett was a human male Mandalorian active during the Great Galactic War.  He served as advisor to Mandalore the Avenger with a fierce loyalty and a fiercer temperament.  Said temperament led him to refuse the title of Mandalore when Mandalore the Vindicated fell in battle, refusing to live the rest of his days planning and giving orders rather than fighting."},{"b":11,"c":"MANDO_KOSKA","f":"MANDO","n":"Koska Reeves","v":"Koska Reeves","p":"koska reeves","e":"","t":"named canon era_new_republic female non_sensitive","w":"Nite Owl mercenary; Nite Owls have no code in the list, so no extra faction.","bio":"Koska Reeves was a Human female Mandalorian who was a member of the Nite Owls in the early years of the New Republic. On the moon of Trask, Koska worked alongside Din Djarin, Bo-Katan Kryze, and Axe Woves to steal an Imperial Gozanti-class cruiser, and would later work with Djarin again in order to rescue Grogu from Moff Gideon\u0027s Star Destroyer."},{"b":11,"c":"MANDO_MANDALORIAN","f":"MANDO","n":"Mandalorian","v":"Mandalorian|Mandalorian|Mandalorian","p":"generic","e":"","t":"generic canon non_sensitive","w":"Generic Mandalorian; no extra faction.","bio":"Mandalorians were a culture of elite, highly trained warriors spanning all throughout galactic history. The Mandalorian culture revolved around seeking honor and glory through war and other conflicts. Many Mandalorians took up mercenary work, often working as bounty hunters which often caused their clients to pay a high price. While the Mandalorians were often split into multiple clans, at times fighting each other, the Mandalorian\u0027s sole ruler was known as Mandalore."},{"b":11,"c":"MANDO_MANDALORIAN_WARRIOR","f":"MANDO","n":"Mandalorian Warrior","v":"Mandalorian Warrior","p":"generic","e":"","t":"generic canon non_sensitive","w":"Generic Mandalorian warrior; no extra faction.","bio":"Mandalorians were a culture of elite, highly trained warriors spanning all throughout galactic history. The Mandalorian culture revolved around seeking honor and glory through war and other conflicts. Many Mandalorians took up mercenary work, often working as bounty hunters which often caused their clients to pay a high price. While the Mandalorians were often split into multiple clans, at times fighting each other, the Mandalorian\u0027s sole ruler was known as Mandalore."},{"b":11,"c":"MANDO_MIRTA","f":"MANDO","n":"Mirta Gev","v":"Mirta Gev","p":"mirta gev","e":"BH","t":"named legends era_legacy female non_sensitive","w":"Bounty hunter working with Boba Fett (BH). Human/Kiffar, tagged human.","bio":"Mirta Gev was a Human/Kiffar female Mandalorian who worked as a Bounty Hunter during the Second Galactic Civil War. The Granddaughter of Boba Fett, Mirta was sent by her mother Ailyn Vel to find and kill her grandfather. However, after tracking him down, assisted Fett with finding a cure for an illness that was killing him. She continued to work with Fett, including tracking down and finding her Grandmother, Sintas Vel. She continued to fight alongside the Mandalorians in the Second Galactic Civil War, at one point getting captured and interrogated by the Sith Lord, Darth Caedus."},{"b":11,"c":"MANDO_SATINE","f":"MANDO","n":"Duchess Satine Kryze","v":"Duchess Satine Kryze","p":"satine kryze","e":"","t":"named canon era_prequel female non_sensitive","w":"Duchess and leader of the New Mandalorians; no extra faction.","bio":"Duchess Satine Kryze was a Human female who served as the pacifistic leader of the New Mandalorians and the planet Mandalore during the Clone Wars. A controversial leader, and a constant target from Pre Viszla, leader of the Death Watch, Satine sought to change the Mandalorian culture, turning the people into peaceful beings, forsaking their warrior heritage. Her rule would not last however, as Satine was usurped by the Death Watch with the help of Darth Maul, who later killed her in front of Obi-wan Kenobi, her former lover."},{"b":11,"c":"MANDO_SHAE","f":"MANDO","n":"Shae Vizla","v":"Shae Vizla","p":"shae vizla","e":"RSE BH","t":"named legends era_old_republic female non_sensitive","w":"[corrigé] Mercenary tied to the Revanites (REV); later Mandalore the Avenger under the Eternal Empire (EE).","bio":"Shae Vizsla was a Human female Mandalorian mercenary who often worked for the resurgent Sith Empire during the Great Galactic War and Cold War. Nicknamed Torch for her love of flamethrowers, Shae teamed with the Nova Blade pirates on Rishi to keep civil relations in Raider\u0027s Cove, seperating from them after the Blades aligned with the Revanites. Sometime after the reborn Revan was defeated, the Eternal Empire conquered the known galaxy, killed Mandalore the Vindicated. Shae was named Mandalore, known as Mandalore the Avenger."},{"b":11,"c":"MANDO_SINTAS","f":"MANDO","n":"Sintas Vel","v":"Sintas Vel","p":"sintas vel","e":"BH","t":"named legends era_imperial female non_sensitive","w":"Bounty hunter alongside Boba Fett (BH). Kiffar, tagged alien.","bio":"Sintas Vel was a Kiffar female Mandalorian who worked as a Bounty Hunter alongside Boba Fett during his career. Boba and Sintas Vel married prior to the Battle of Yavin and had one child, Ailyn Vel. After Sintas was raped by Fett\u0027s superior officer, she and Fett divorced after Boba murdered Lenovar, and thus was exiled from Concord Dawn. While on a job to purchase a gift for her daughter, Sintas wound up forzen in carbonite for over 40 years, and was later unfrozen by her granddaughter, Mirta Gev. Suffering amnesia, Sintas was taken to Mandalore and with the help of Mirta, Boba Fett, and Gotab, was able to pursue a normal life once again."},{"b":11,"c":"MANDO_TARRE","f":"MANDO","n":"Tarre Vizsla","v":"Tarre Vizsla","p":"tarre vizsla","e":"JO","t":"named legends era_ancient jedi male","w":"Mandalorian Jedi Knight, the only one known (JO).","bio":"Tarre Vizsla was a human male Mandalorian and the only known Mandalorian Jedi in galactic history.  Using methods unknown to any but him, he crafted the Darksaber and served as a Jedi Knight until his eventual passing.  Vizsla\u0027s influence left lasting effects on his people, cementing his family and his lightsaber as pivotal figures of Mandalorian leadership for centuries to come."},{"b":11,"c":"MANDO_TARRO","f":"MANDO","n":"Tarro Blood","v":"Tarro Blood","p":"tarro blood","e":"BH","t":"named legends era_old_republic male non_sensitive","w":"Bounty hunter in the Great Hunt (BH).","bio":"Tarro Blood was Human male Mandalorian who worked as a Bounty Hunter during the Cold War. Leaving his life of luxury on Alderaan behind, Tarro trained under the Mandalorian Hedarr Soongh, attempting to particpiate in the Great Hunt competition, but his efforts were sabotaged by other Mandalorians seeking victory. In his final Great Hunt, Tarro left all honor behind and attempted to sabotage every competitor. When the bounty hunter who would become champion and Blood crossed paths aboard the Aurora, Blood attempted to goad the hunter into a final showdown. Blood ultimately perished aboard the Aurora."},{"b":11,"c":"MNC_CANDEROUS","f":"MNC","n":"Canderous Ordo","v":"Canderous Ordo|Mandalore the Preserver","p":"canderous ordo","e":"TOR MANDO","t":"named legends era_old_republic male non_sensitive","w":"[corrigé] Followed Revan in the Jedi Civil War (DRSE); later Mandalore the Preserver (MANDO).","bio":"Canderous Ordo was a Human male Mandalorian and follower of the amnesiac Revan during the Jedi Civil War, and Meetra Surik during the Dark Wars. Born into Clan Ordo, Canderous fought in the Mandalorian Wars. After this people\u0027s loss, Canderous eventually made his way to Taris, becoming tarisian crimelord Davik Kang\u0027s enforcer. Eventually he helped Revan escape Taris and defeat Darth Malak. After the war, Revan assisted Clan Ordo in finding Mandalore\u0027s Mask. Taking up the mask, Canderous was named Mandalore the Preserver."},{"b":11,"c":"MNC_CASSUS","f":"MNC","n":"Cassus Fett","v":"Cassus Fett","p":"cassus fett","e":"MANDO","t":"named legends era_old_republic male non_sensitive","w":"Aide-de-camp to Mandalore the Ultimate (MANDO).","bio":"Cassus Fett was a Human male Mandalorian who spear-headed the creation of the Mandalorian Neo-Crusaders and worked as Mandalore the Ultimate\u0027s aide-de-camp during the Mandalorian Wars. "},{"b":11,"c":"MNC_NEO_CRUSADER","f":"MNC","n":"Mandalorian Neo-Crusader","v":"Mandalorian Neo-Crusader","p":"generic","e":"MANDO","t":"generic legends era_old_republic non_sensitive","w":"Neo-Crusaders were an order sponsored by Mandalore the Ultimate (MANDO).","bio":"Old Mandalorian Warriors were known as Mandalorian Neo-Crusaders and existed during the Mandalorian Wars, Jedi Civil War, and Dark Wars. They were an order of Mandalorians sponsored by Mandalore the Ultimate following the Great Sith War. Based on Dxun, these Mandalorians trained in the wilds, hunting fierce beasts such as the Zakkeg, Boma, and Maalraas."},{"b":11,"c":"MNC_ROHLAN","f":"MNC","n":"Rohlan Dyre","v":"Rohlan Dyre","p":"rohlan dyre","e":"","t":"named legends era_old_republic male non_sensitive","w":"Commander who deserted the crusaders; no extra faction.","bio":"Rohlan Dyre - known to some as The Questioner - was a human male Mandalorian who served as a commander in the early days of the Mandalorian Wars.  He deserted his fellow crusaders several times, choosing to find the reasons behind the sudden war rather than fan its flames."},{"b":11,"c":"MNC_ULTIMATE","f":"MNC","n":"Mandalore the Ultimate","v":"Mandalore the Ultimate","p":"mandalore the ultimate","e":"MANDO","t":"named legends era_old_republic male non_sensitive","w":"Taung Mandalore who led the Mandalorian Wars (MANDO).","bio":"Mandalore the Ultimate was a Taung Male who ruled as Mandalore during the Mandalorian Wars. Fearing the extinction of his species and the Mandalorian culture, Mandalore waged war on the Republic. At first his attacks were small, attacking fringe worlds still recovering from the Great Sith War. Mandalore later led his forces on Republic worlds, with minimal resistance from the Republic and the Jedi. Mandalore came close to winning the war until Revan took leadership of the Republic\u0027s defenses, and turned the tide, eventually confronting Mandalore in single combat, killing him and ending the war."},{"b":11,"c":"NR_ALLANA","f":"NR","n":"Allana Djo Solo","v":"Allana Djo Solo","p":"allana djo solo","e":"","t":"named legends era_legacy female jedi","w":"Hapan heir and Force-sensitive daughter of Jacen and Tenel Ka; no code for Hapan royalty, so no extra faction.","bio":"Allana Djo Solo was a Force sensitive Human female, daughter of Jacen Solo and Tenel Ka Djo, born in 36 ABY. Allana faced soon in her life assassination attempts caused by her bonds to the noble Hapan family she descended from via her mother s blood, making her the heir to the Hapan throne. Because of this, her identity was hidden by her parents, from everyone including Leia Solo, Han Solo and Luke Skywalker, her own family. When her father, Jacen Solo, turned to the Dark Side and became the Sith Lord Darth Caedus, Tenel Ka tried to hide her from her father, whose hate was fuelled by his desire to protect his daughter. After another assassination attempt by the Moff Council, Allana faked her death, took the name Amelia and was placed under her grandparents  custody, Han Solo and Leia Solo."},{"b":11,"c":"NR_ANAKIN_SOLO","f":"NR","n":"Anakin Solo","v":"Anakin Solo","p":"anakin solo","e":"JO","t":"named legends era_new_republic jedi male","w":"Jedi Knight in Luke\u0027s New Jedi Order (JO).","bio":"Anakin Solo was a Human Male Jedi Knight who was a member of the New Jedi Order during the Yuuzhan Vong War. The third child of Han Solo and Leia Organa, Anakin was named after his grandfather, Anakin Skywalker, after Leia learned to forgive Anakin for the atrocities he committed as Darth Vader. As a child, Anakin felt afraid of falling to the dark side like his grandfather and joined Luke\u0027s Jedi Order at the age of 11. As a pivotal figure in the Yuuzhan Vong War, Anakin developed highly effective tactics against the Vong. On Myrkr, Anakin led a strike team to kill the Voxyn. Anakin died in the ensuing battle against the Voxyn Queen."},{"b":11,"c":"NR_CARA","f":"NR","n":"Cara Dune","v":"Cara Dune","p":"cara dune","e":"REB","t":"named canon era_imperial era_new_republic female non_sensitive","w":"Rebel Shock Trooper at Endor (REB), then New Republic marshal.","bio":"Cara Dune was a Human female Rebel Shock Trooper who served with the Rebellion during the Battle of Endor and the New Republic during its early years governing the galaxy. Leaving the Rebellion after Endor, Cara found work as a mercenary, eventually running into the Mandalorian Din Djarin on the planet Sorgan. Briefly working with Djarin to save a local village from raiders, Cara later assisted Djarin against Moff Gideon on Nevarro. Working with Greef Karga as Marshall of Nevarro, Cara worked again with Djarin to take over Gideon\u0027s light cruiser after the Mandalorian Foundling Grogu was kidnapped."},{"b":11,"c":"NR_CORRAN","f":"NR","n":"Corran Horn","v":"Corran Horn|Corran Horn (Pilot)","p":"corran horn","e":"JO REB","t":"named legends era_new_republic jedi male","w":"Rogue Squadron pilot (REB) who became a Jedi Master (JO).","bio":"Corran Horn was a Human Male Jedi Master who was an early member of Luke Skywalker\u0027s New Jedi Order. Initially a member of the Corellian Security Force, Corran developed a skill for piloting and joined Rogue Squadron some years after the Battle of Endor. After the kidnapping of his wife, Corran sought out Luke Skywalker for training, and by the time of the Disciples of Ragnos crisis, became a Jedi Master. Years after the crisis, Corran retired from Rogue Squadron to devote all of his time to serving on the Jedi High Council."},{"b":11,"c":"NR_DORSK","f":"NR","n":"Dorsk 81","v":"Dorsk 81","p":"dorsk 81","e":"JO","t":"named legends era_new_republic jedi male","w":"Khommite Force-sensitive clone trained as a Jedi (JO).","bio":"Dorsk eighty-one was a Male Khommite Clone of the original Dorsk that was born eighty generations prior. Unlike his predecesors, the other eighty clones of Dorsk, Dorsk eighty-one could wield the Force. Dorsk joined Luke Skywalker\u0027s New Jedi Order and became one of the first twelve Jedi trained by Skywalker himself. On one occassion, Kyp Durron, a fellow student, took Dorsk to the Tomb of Exar Kun and put the Khommite into a deep sleep. Upon awakening, Dorsk disocvered what had occurred and worked with the rest of the Jedi Order to defeat the spirit of Exar Kun once and for all. After he received the rank of Jedi Knight, Dorsk attempted to return to his homeworld as a Jedi Watchman, but soon found that the Khommites did not appreciate his newfound role. Having failed to ingratiate himself on Khom, Dorsk traveled with the redeemed Kyp Durron to the Deep Core where they discovered the United Warlord Fleets led by Imperial Admiral Natasi Daala. The two fled, but in retaliation for uncovering their presence, Daala ordered that Dorsk\u0027s homeworld be attacked, resulting in many deaths. Despite this, Dorsk and Kyp rallied the Jedi to battle against the Warlords. In an act of ultimate sacrifice, Dorsk allowed the other Jedi to focus the Force through him and used this power to throw the Star Destroyers from the Yavin System. However, Dorsk\u0027s physical frame could not handle the strain and he died, having given the Jedi the victory over the Warlords."},{"b":11,"c":"NR_JACEN","f":"NR","n":"Jacen Solo","v":"Jacen Solo","p":"jacen solo","e":"JO SO","t":"named legends era_new_republic era_legacy fallen_jedi sith male","w":"Jedi Knight who fell as Darth Caedus, a Sith Lord (SO), after training as a Jedi (JO).","bio":"Jacen Solo was a Human Male Jedi Knight who was a member of the New Jedi Order during the Yuuzhan Vong War and Second Galactic Civil War. The son of Han Solo and Leia Organa, Jacen had a strong connection to the Force and trained at Luke Skywalker\u0027s Jedi Praxeum under the guidance of Luke himself. During the Yuuzhan Vong War, Jacen was captured after successfully killing the Voxyn Queen, and spent nearly a year in captivity. The experience caused Jacen to slip to the dark side briefly, but was able to escape. Years later, Jacen fell to the dark side in an effort to prevent the galaxy from descending into chaos, as Darth Caedus."},{"b":11,"c":"NR_JADEN","f":"NR","n":"Jaden Korr","v":"Jaden Korr","p":"jaden korr","e":"JO","t":"named legends era_new_republic jedi male","w":"Jedi Master in Luke\u0027s Jedi Order (JO).","bio":"Jaden Korr was a Human male Jedi Master who was a member of Luke Skywalker\u0027s Jedi Order during the Disciples of Ragnos crisis. Considered a promising student by Luke Skywalker and Kyle Katarn, Jaden went out on multiple missions during the crisis, thwarting the Disciples of Ragnos and their plans on multiple occasions, eventually preventing Marka Ragnos\u0027s return by dueling and defeating Tavion in single combat. During the Second Galactic Civil War, Jaden was killed by a clone of himself known as The Iteration. However, Korr\u0027s mind was successfully transfered into the clone body, and was able to continue serving the Jedi Order."},{"b":11,"c":"NR_JAINA","f":"NR","n":"Jaina Solo","v":"Jaina Solo|Jaina Solo (Black Jumpsuit)|Jaina Solo (Jedi Knight)|Jaina Solo (Pilot)|Jaina Solo (Rogue Squadron)","p":"jaina solo","e":"JO REB","t":"named legends era_new_republic jedi female","w":"Jedi Master (JO) and Rogue Squadron pilot (REB).","bio":"Jaina Solo was a Human Female Jedi Master who was a member of the New Jedi Order during the Yuuzhan Vong War and Second Galactic Civil War. The daughter of Han Solo and Leia Organa, Jaina had a strong connection to the Force and trained at Luke Skywalker\u0027s Jedi Praxeum under the guidance of Mara Jade Skywalker. When the Yuuzhan Vong invaded the galaxy, Jaina distinguished herself as an accomplished pilot for Rogue Squadron, and earned the title of Sword of the Jedi by the end of the conflict. Jaina remained a member of the Jedi Order after striking down her brother and continued to serve, later marrying Jagged Fel."},{"b":11,"c":"NR_JAN","f":"NR","n":"Jan Ors","v":"Jan Ors|Jan Ors (Mercenary)|Jan Ors (Mercenary)|Jan Ors","p":"jan ors","e":"REB","t":"named legends era_imperial female non_sensitive","w":"Kyle Katarn\u0027s pilot and partner, fighting on the Rebel side (REB) during the Civil War.","bio":"Jan Ors was a Human female Mercenary during the Galactic Civil War and the New Republic. As Kyle Katarn\u0027s partner, she joined in as Kyle\u0027s pilot throughout his many campaigns, helping him defeat the Dark Trooper project, assisting him during his mission to the Valley of the Jedi, and finally assisting him against the Imperial Remnant before being captured by the Dark Jedi Desann. After being freed by Kyle, who returned to the ways of the Force, Jan and Kyle continued to serve the New Republic up through the Yuuzhan Vong War."},{"b":11,"c":"NR_jedi_random","f":"NR","n":"New Republic Jedi","v":"New Republic Jedi","p":"generic","e":"JO","t":"generic legends era_new_republic jedi","w":"Generic New Republic Jedi (JO).","bio":""},{"b":11,"c":"NR_JEDI_TRAINER","f":"NR","n":"Jedi Trainer","v":"Jedi Trainer","p":"generic","e":"JO","t":"generic legends era_new_republic jedi","w":"Generic trainer of Luke\u0027s New Jedi Order (JO).","bio":"After the fall of Palpatine and the Galactic Empire, Luke spent many years gathering as much knowledge as he could regarding the Jedi Order and its past traditions. In the early years of his new Jedi Order, Luke was forced to make certain exceptions to past traditions until the New Jedi Order was better established."},{"b":12,"c":"NR_KARRDE","f":"NR","n":"Talon Karrde","v":"Talon Karrde","p":"talon karrde","e":"CRIM","t":"named legends era_new_republic male non_sensitive","w":"Independent smuggler and information broker who stayed neutral; the NR distrusted him, so NR is not a real membership. CRIM fits his criminal network. Legends (Zahn novels).","bio":"Talon Karrde was a Human male smuggler and information broker was active during the Galactic Civil War and subsequent conflicts. Prior to Palpatine\u0027s demise, Karrde kept himself strictly neutral until rescuing Luke Skywalker from deep space and preventing his capture by Grand Admiral Thrawn. Karrde continued to remain as an ally to Luke Skywalker and his New Jedi Order, but was overall distrusted by the New Republic due to his shady past and dealings."},{"b":12,"c":"NR_KIRANA","f":"NR","n":"Kirana Ti","v":"Kirana Ti","p":"kirana ti","e":"JO","t":"named legends era_new_republic jedi force_user female","w":"Singing Mountain Clan witch of Dathomir (not a Nightsister, so no NS). Trained at Luke\u0027s Praxeum and served as a Jedi Master in the NJO (JO). Wookieepedia (via search mirror) confirms Singing Mountain affiliation; Legends/NJO era.","bio":"Kirana Ti was a Force sensitive Human female from the Singing Mountain Clan of Dathomir where she was born during the Galactic Republic era. Under the New Republic Era, Han and Leia Solo landed on Dathomir. Informed of this, warlord Zsinj promised a transport ship to the present locals who would deliver the Solo couple to him. While the Nightsisters clan agreed, the Singing Mountain clan was convinced by Leia to protect them. Nightsisters clan then led an assault on the Singing Mountain clan to get both Han and Leia, but after a harsh battle, failed to do so when the Milenium Falcon took off with both Solo onboard. Despite the violence of the attack and numerous casualties on the Singing Mountain side, Kirana survived and was taken to Luke s Jedi Praxeum to learn about the Force. After a successful training in the Jedi way, Kirana participated in the destruction of Exar Kun s spirit with the help of her fellow Jedi apprentices and repelled an important Imperial assault on Yavin IV in 12 ABY. After that, she fought against the Yuuzhan Vong invaders as a Jedi Master in 25 ABY and was involved in the Swarm War in 34 ABY."},{"b":12,"c":"NR_KYLE","f":"NR","n":"Kyle Katarn","v":"Kyle Katarn|Kyle Katarn (Mercenary)|Kyle Katarn (Journeyman)|Kyle Katarn (Journeyman)|Kyle Katarn (Jedi Mentor)|Kyle Katarn (Jedi Robes)|Kyle Katarn (Stealth Gear)","p":"kyle katarn","e":"REB JO","t":"named legends era_imperial era_new_republic jedi male","w":"Rebel Alliance mercenary (REB) in Dark Forces, then NJO Battlemaster (JO). Legends.","bio":"Kyle Katarn was a Human male Mercenary and Battlemaster of the Jedi Order during the Galactic Civil War and New Republic era. Working as a Mercenary for the Rebellion, Kyle destroyed the Dark Trooper project headed by Rom Mohc. Sometime after, Kyle discovered the ways of the Force, guided by the spirit of Qu Rahn, Kyle fulfilled an ancient prophecy, to free the trapped souls of Jedi and Sith from the Valley of the Jedi, defeating Jerex and his Dark Jedi. Sometime later, a hero to the New Jedi Order, Kyle joined as Battlemaster."},{"b":12,"c":"NR_KYP","f":"NR","n":"Kyp Durron","v":"Kyp Durron","p":"kyp durron","e":"JO","t":"named legends era_new_republic dark_jedi redeemed jedi male","w":"Dark Jedi under Exar Kun\u0027s influence, redeemed and became an NJO Jedi Master (JO). Legends.","bio":"Kyp Durron was a Human male Jedi Master, and Dark Jedi during the New Republic era. Driven by his anger at those who imprisoned him on Kessel, the spirit of Exar Kun took an interest in the young Force sensitive and commanded him to commit many violent anti-imperial acts. When Kun\u0027s influence and spirit vanished, Durron began a quest of absolution, eventually leading him to becoming one of Luke Skywalker\u0027s most talented pupils and one of the first Jedi Masters of the New Jedi Order."},{"b":12,"c":"NR_LANT","f":"NR","n":"Lant Davan","v":"Lant Davan","p":"lant davan","e":"","t":"named canon era_new_republic male non_sensitive","w":"New Republic Correctional Corps officer; no faction beyond NR. Wookieepedia (via search mirror) describes him as a New Republic Correctional Corps lieutenant killed on the Bothan-5 transport. Media uncertain.","bio":"Lant Davan was a Human male soldier during the Galactic Civil War and New Republic Era. Lant server as a Corrections officer under the New Republic with the rank of Lieutenant. He was the only organic guard of the Bothan-5 Corrections transport, and during a raid of a mercenary group consisting of the Mandalorian Din Djarin, the Human Migs Mayfeld, the Devaronian Burg and the Twi Lek Xi an, he was killed, albeit the N5 Sentry droids guarding the ship s cells with him, all of which got destroyed by the mercenary commando."},{"b":12,"c":"NR_LOWBACCA","f":"NR","n":"Lowbacca","v":"Lowbacca","p":"lowbacca","e":"JO","t":"named legends era_new_republic jedi male","w":"Wookiee Jedi Knight in Luke\u0027s New Jedi Order (JO). Legends.","bio":"Lowbacca was a Wookiee male Jedi Knight who served in Luke Skywalker\u0027s Jedi Order during the Yuuzhan Vong War. The nephew of Chewbacca, he trained at Luke Skywalker\u0027s Jedi Praxeum on Yavin 4 alongside Jacen and Jaina Solo. Despite his species\u0027 natural aversion to technology, Lowbacca proved highly skilled with computers and droids, often using his translator droid, M-TD, to communicate with fellow Jedi that didn\u0027t understand the Shyriiwook language. He played a crucial role in battles against the Shadow Academy, the Diversity Alliance, and later the Yuuzhan Vong invasion. His loyalty, intelligence, and bravery made him a valued member of the New Jedi Order."},{"b":12,"c":"NR_MARA","f":"NR","n":"Mara Jade","v":"Mara Jade|Mara Jade (Emperor\u0027s Hand)|Mara Jade (Smuggler)|Mara Jade (Cold-Weather Gear)|Mara Jade (Poncho)|Mara Jade (Vong Armor)","p":"mara jade","e":"GE JO CRIM","t":"named legends era_imperial era_new_republic jedi redeemed female","w":"[corrigé] Served Palpatine as one of the Emperor\u0027s Hands (GE, assassin for the Empire) before becoming an NJO Jedi Knight (JO). Legends.","bio":"Mara Jade was a Human female Emperor\u0027s Hand and Jedi Knight during the Galactic Civil War and New Republic era. Under the control of Palpatine, serving him as one of his Hands; assassinating key Imperial targets. After the second Death Star was destroyed, Jade became a smuggler working under Talon Karrde until uniting with, Luke Skywalker, reluctantly helping him in his mission to stop Joruus C\u0027Baoth. Succeeding, Mara joined the New Jedi Order, marrying Luke. Sometime after, Mara was killed by Darth Caedus, Han\u0027s son."},{"b":12,"c":"NR_MIRAX","f":"NR","n":"Mirax Terrik Horn","v":"Mirax Terrik Horn","p":"mirax terrik horn","e":"CRIM","t":"named legends era_new_republic female non_sensitive","w":"Smuggler and courier; her smuggling career is her main identity, not NR membership. Legends.","bio":"Mirax Terrik Horn was a Human female who was the wife of Jedi Master Corran Horn during the Yuuzhan Vong and Second Galactic Civil War. While working as a smuggler, Mirax took an interest in the New Jedi Order, and while acting as a courier for potential clients, she took priority over requests from Jedi Order members such as Luke Skywalker, Mara Jade, and Anakin Solo. She and Corran together had two children, Valin and Jysella Horn."},{"b":12,"c":"NR_NR_DROID","f":"NR","n":"N5 Sentry Droid","v":"N5 Sentry Droid","p":"n5 sentry droid","e":"","t":"generic canon era_new_republic non_sensitive","w":"Generic New Republic Correctional Corps sentry droid; no faction beyond NR.","bio":"The N5 sentry droids were utilized by the New Republic Correctional Corps aboard their transports to prevent evasions in a way or another."},{"b":12,"c":"NR_NR_GUARD","f":"NR","n":"New Republic Guard","v":"New Republic Guard","p":"new republic guard","e":"","t":"generic canon era_new_republic non_sensitive","w":"Generic New Republic prison guard soldier; no additional faction.","bio":"New Republic guards were New Republic soldiers tasked with guarding prisoner cells onboard Correctional Transports."},{"b":12,"c":"NR_NR_OFFICER","f":"NR","n":"New Republic Officer","v":"New Republic Officer|New Republic Officer","p":"new republic officer","e":"","t":"generic canon era_new_republic non_sensitive","w":"Generic New Republic officer; no additional faction.","bio":"After the formation of the New Republic, individuals who distinguished themselves as leaders during the years of the Rebellion were drafted to help lead the New Republic\u0027s efforts to defend the galaxy from the Imperial Remnant and other threats."},{"b":12,"c":"NR_ROSH","f":"NR","n":"Rosh Penin","v":"Rosh Penin","p":"rosh penin","e":"JO","t":"named legends era_new_republic jedi fallen_jedi male","w":"NJO Jedi Padawan (JO) captured and turned to the dark side on Byss, not a separate faction. Legends.","bio":"Rosh Penin was a Human male Jedi Padawan of the New Jedi Order. A cocky student, Rosh, along with his friend and fellow apprentice, Jaden Korr, were assigned to Kyle Katarn. Wanting to prove himself the better Jedi, Rosh feared he was being held back, even sending a training droid after Jaden during their first training session. On his mission to Byss, Rosh was captured and turned to the dark side, out of fear of being hurt. Angered by his friend\u0027s betrayal, Jaden threatened to strike him down, but spared him."},{"b":12,"c":"NR_TENEL","f":"NR","n":"Tenel Ka","v":"Tenel Ka","p":"tenel ka","e":"JO","t":"named legends era_new_republic jedi female","w":"Hapan Jedi Knight of the NJO (JO). Legends.","bio":"Tenel Ka Djo was a Hapan female Jedi Knight who served the New Jedi Order during the Yuuzhan Vong and Second Galactic Civil War. Joining Luke Skywalker\u0027s Academy at a young age, she quickly developed friendships with Jacen and Jaina Solo, and Zekk. During the Yuuzhan Vong war, she worked with a strike team to destroy the Voxyn queen, and helped the Galactic Alliance against Jacen Solo, now the Sith Lord Darth Caedus. During a training exercise, Tenel\u0027s lightsaber malfunctioned, causing Jacen to accidentally cut off her left arm at the elbow. She refused a mechanical replacement, instead using the loss as a reminder of the cost of arrogance."},{"b":12,"c":"NR_WEEGEE","f":"NR","n":"WeeGee","v":"WeeGee","p":"weegee","e":"","t":"named legends era_imperial non_sensitive","w":"Droid belonging to the Katarn family; no faction membership beyond the family. Legends (Dark Forces).","bio":"WeeGee was a droid, hand-built by Morgan Katarn and belonging to the Katarn family during the Galactic Civil War. WeeGee was a multi-purpose droid able to lift heavy loads with its powerful right arm and use tools with its weaker, human shaped left hand. WeeGee was the holder of Qu Rahn s lightsaber and the one droid that could tell the existence of the map to the Valley of the Jedi. After the subjugation of Sulon and the Katarn s home was sacked, Kyle found the droid in a pitiful state. WeeGee didn t recognize him at first, but after Kyle explained everything, the droid accepted to play Kyle s holodisk, giving him the location of the map to the Valley of the Jedi, located on the very house s roof."},{"b":12,"c":"NR_X2","f":"NR","n":"X2","v":"X2","p":"x2","e":"REP GE REB","t":"named legends era_prequel era_imperial male non_sensitive","w":"Clone trooper of the GAR (REP) who was later an Imperial stormtrooper (GE) before defecting to the Rebellion (REB), per the bio and Wookieepedia-derived mirror. Canon status uncertain (legends assumed, Battlefront II).","bio":"X2 was a Clone of Falen Grey who fought in the Grand Army of the Republic during the Clone Wars. Initially stationed on Tatooine, X2 and his brother, X1 came under the command of Jedi Master Ferroda, and by the end of the war, joined Ferroda on Ord Mantell. When Order 66 was ordered, X2 and his brother, X1 carried out the order. Ultimately, X2 was the one to carry out the order and slew Ferroda. X2 would come to regret his actions and wanted nothing to do with the Empire, defecting and later being recruited into the alliance by Rahm Kota."},{"b":12,"c":"NR_ZEKK","f":"NR","n":"Zekk","v":"Zekk","p":"zekk","e":"JO IR GA","t":"named legends era_new_republic dark_jedi redeemed jedi male","w":"[ajouté] Darkest Knight de la Shadow Academy (Second Imperium), puis Jedi; Galactic Alliance.","bio":"Zekk was a Human male Jedi Knight who served the New Jedi Order during the Yuuzhan Vong and Second Galactic Civil War. A former member of the Shadow Academy, a Dark Jedi training academy founded by Brakiss, Zekk was redeemed to the light side and took a strict adherance to Jedi protocol, wanting nothing to do with the dark side or dark side tendencies. During the Blockade of Corellia, Zekk mysteriously vanished from the Force, but Jaina Solo refused to believe he had perished. Months later, Zekk reemerged in the galaxy alive and well, and romantically involved with Taryn Zel, a Hapan Security Officer."},{"b":12,"c":"NS_CHARAL","f":"NS","n":"Charal","v":"Charal","p":"charal","e":"","t":"named canon era_new_republic force_user female","w":"Witch-Queen of Endor; Nightsister origin is a later retcon, so NS is already assigned and no extra faction. Canon via Ewoks: The Battle for Endor (per search mirrors).","bio":"Charal was a Nightsister of Dathomir who lived during the final centuries of the Galactic Republic and into the Imperial era. After stealing the enchanted Talisman of the Raven and leaving her clan, she spent many years evading both her former sisters and the Jedi. She eventually joined a group of Sanyassan Marauders whose ship later crashed on the forest moon of Endor, leaving her stranded for more than a century. During this time she relied on her Nightsister abilities, including shapeshifting into a raven, to gain influence among the Marauders and to establish a reputation as a dangerous figure among the Ewoks.  Her activities on Endor culminated in the conflict known as the Battle for Endor. Working with King Terak, she attempted to seize a starship component believed to hold supernatural power, which led to the capture of the human child Cindel Towani. The confrontation that followed at the site of Noa Briqualon’s crashed starship resulted in the destruction of the Talisman of the Raven. The release of its uncontrolled magic killed Terak and permanently transformed Charal into a raven. She fled into the forests of Endor, and her ultimate fate remained unknown to later Imperial and New Republic investigators."},{"b":12,"c":"NS_DAKA","f":"NS","n":"Old Daka","v":"Old Daka","p":"old daka","e":"","t":"named canon era_prequel force_user female","w":"Nightsister elder; only NS. Clone Wars.","bio":"Old Daka was a Dathomirian Female Nightsister who served as a Nightsister Elder by the time of the Clone Wars. Regarded as the most powerful and wisest, Daka was kept hidden from most deep within Mother Talzin\u0027s stronghold. When Grievous began his invasion on Dathomir, Daka performed a ritual to awaken an army of undead Nightsisters. However, her efforts failed, as Grievous successfully tracked her down and ran her through with one of his lightsabers."},{"b":12,"c":"NS_GETHZERION","f":"NS","n":"Gethzerion","v":"Gethzerion","p":"gethzerion","e":"","t":"named legends era_imperial era_new_republic force_user female","w":"Founder and leader of the Nightsisters; worked with warlord Zsinj but no separate faction code. Legends.","bio":"Gethzerion was a Dathomirian female who founded and led the Nightsisters prior to and during the Galactic Civil War. Born on Dathomir centuries before the Galactic Civil War, Gethzerion\u0027s strength in the Force was discovered, not requiring the usage of the typical chants from her fellow sisters. Creating the Nightsisters, Gethzerion terrorized the planet and the other native Dathomiri for years. During the Galactic Civil War, Emperor Palpatine was made aware of Gethzerion\u0027s power, and forbade any planet from entering or leaving the system out of concern for his own power. After Palpatine\u0027s death and Warlord Zsinj began his conquest, Gethzerion and Zsinj worked together, though at Gethzerion\u0027s own benefit. After attempting to capture Han Solo and Leia Organa after the Falcon crashed on Dathomir\u0027s surface, Gethzerion was confronted by Luke Skywalker and her niece Teneniel Djo. Bested by the two, Gethzerion attempted to flee Dathomir, but was ultimately betrayed by Zsinj who order two of his destroyers to destroy Gethzerion\u0027s ship, killing her and ending her tyranical reign over Dathomir."},{"b":12,"c":"NS_MALICOS","f":"NS","n":"Taron Malicos","v":"Taron Malicos","p":"taron malicos","e":"JO","t":"named canon era_imperial dark_jedi fallen_jedi male","w":"[corrigé] Fallen Jedi who led the Nightbrothers and learned Nightsister magic; stays within NS. Jedi: Survivor.","bio":"Taron Malicos was a Human male Dark Jedi who led the Nightbrothers in the early years of the Empire\u0027s reign. After surviving Order 66, Malicos found himself on Dathomir and with the Nightsister Merrin, Malicos learned more of Nightsister Magic and fell to the dark side. When Cal Kestis arrived on Dathomir, Malicos took an interest in the Padawan and attempted to corrupt him. Within the Tomb of Kujet, Malicos squared off against Cal Kestis and later Merrin. With their combined strength, Malicos was defeated, and Merrin buried him alive."},{"b":12,"c":"NS_MERRIN","f":"NS","n":"Merrin","v":"Merrin","p":"merrin","e":"","t":"named canon era_imperial force_user female","w":"Surviving Nightsister, only NS. Jedi: Survivor.","bio":"Merrin was a Dathomirian female who was one of the few surviving Nightsisters in the aftermath of the Clone Wars and into the early reign of the Galactic Empire. Surviving the extermination of her people at the hands of General Grievous, Merrin was overcome with grief at the loss, which was later manipulated by the fallen Jedi Taron Malicos into shifting blame onto the Jedi. When Cal Kestis arrived on Dathomir during his quest to retrieve a holocron containing a list of Force Sensitive children, Merrin and the Nightbrothers stood in his way, with Merrin later raising up armies of undead Nightsisters in an effort to stop Cal. Though Cal fled Dathomir with his lightsaber destroyed temporarily, Cal later returned and convinced Merrin that the Jedi were not to blame for her people\u0027s extinction. Merrin went on to work with Kestis to defeat Taron Malicos, and later joined the Mantis Crew. Years later, Merrin worked with Cal again to establish a base on the hidden world of Tanalorr, helping him against the fallen Jedi Bode Akuna, and welcoming his daughter, Kata, into the crew."},{"b":12,"c":"NS_NIGHTBROTHER","f":"NS","n":"Nightbrother","v":"Nightbrother","p":"nightbrother","e":"","t":"generic canon era_prequel force_user male","w":"Zabrak clan of exiles affiliated with the Nightsisters; the group is already NS. Clone Wars.","bio":"The Nightbrothers were a clan of Zabraks descending from a group of exiled criminals that settled on Dathomir. The exiles quickly integrated themselves with the Nightsisters, though the Nightsisters kept the Nightbrothers at a distance. Sometime before the Battle of Naboo, one of the Nightbrothers named Maul was taken by Darth Sidious as an apprentice. Later, Asajj Ventress chose Savage Opress from among the Nightbrothers to serve her. The Nightbrothers also fought against the Jedi Obi-Wan Kenobi and Anakin Skywalker when they came in search of Opress. Later, the Nightbrothers attacked Count Dooku on Ord Mantell at the behest of Mother Talzin, though they were quickly defeated. Sometime later, Maul managed to bring Dooku into a trap on Dathomir and hold him with the help of the Nightbrothers, however, many of the Nightbrothers and even Mother Talzin herself were killed in a Separatist attack shortly thereafter. Not long after the end of the Clone Wars, the fallen Jedi Taron Malicos took control of the Nightbrothers along with a Nightsister named Merrin. The Nightbrothers would later defend Malicos when Cal Kestis arrived on Dathomir, though would ultimately be left leaderless after Malicos\u0027 death and Merrin\u0027s departure."},{"b":12,"c":"NS_NIGHTSISTER","f":"NS","n":"Nightsister","v":"Nightsister","p":"nightsister","e":"","t":"generic canon era_prequel force_user female","w":"Generic Nightsister; only NS.","bio":"Nightsisters were a sect of female Force Sensitives native to the planet Dathomir. Practicing the dark side of the Force in their own way, the Nightsisters would employ special rituals and even mixed elixars and other potions in order to defend themselves from attack, torture their victims, or even enhance one another in combat. The Nightsisters were considered to be extinct in the final years of the Clone Wars, after General Grievous led an invasion on Dathomir to enact revenge for Savage Opress\u0027s attempted assassination of Count Dooku."},{"b":12,"c":"NS_NS_MASTER","f":"NS","n":"Nightsister Master","v":"Nightsister Master","p":"nightsister master","e":"","t":"generic canon era_prequel force_user female","w":"Generic Nightsister leader; only NS.","bio":"Certain Nightsisters distinguished themselves from their fellow sisters and were considered as masters, guiding their other sisters in pursuit of their own power."},{"b":12,"c":"NS_SPIRIT","f":"NS","n":"Nightsister Spirit","v":"Nightsister Spirit","p":"nightsister spirit","e":"","t":"generic canon era_prequel force_user","w":"Ghostly remains of Nightsisters; only NS.","bio":"Nightsisters Spirits were the ghostly remains of fallen Nightsisters who passed away or were killed. As a Nightsister\u0027s bond was considered eternal, the living had the ability to perform rituals to bring them back in times of conflict. Nightsister Spirits had the ability to possess the living and take full control of their bodies, but could only venture so far from their altars which summoned them."},{"b":12,"c":"NS_TALZIN","f":"NS","n":"Mother Talzin","v":"Mother Talzin","p":"mother talzin","e":"","t":"named canon era_prequel force_user female","w":"Clan Mother of the Nightsisters; only NS. Clone Wars.","bio":"Mother Talzin was a Dathomirian female Clan Mother of the Nightsisters prior to and during the Clone Wars. A shaman of her people, Talzin was among the most powerful of her people, believing that she would become Darth Sidious\u0027s apprentice, but instead the Sith Lord chose Maul. Seeking revenge, Talzin sought to kill Sidious and Dooku. After Maul returned, Talzin restored Maul but forced her to take a spirit form. Sometime after Maul escaped from Sidious, Talzin was killed by Grievous, her magic turning her to stone."},{"b":12,"c":"REB_2_1B","f":"REB","n":"2-1B","v":"2-1B","p":"2-1b","e":"","t":"named canon era_imperial non_sensitive","w":"Medical droid who was forced to serve Imperial governor Cuvir but was not a genuine Imperial member. REB only.","bio":"2-1B was a 2-1B series medical droid who saw first use on Firro, where the droid treated civilians  wounds caused by the Empire s ruthless rule at the time. Lord Cuvir, Firro s newly proclaimed governor, took 2-1B as his own surgical droid despite the needs of the civilians. While 2-1B hated Cuvir, the droid had no other choice than obeying his new master. Soon enough, Cuvir was assassinated on Wor Tandell by an undercover rebel agent, Tay Vanis. 2-1B followed the rebel and joined the Alliance. He then served as a skilled surgical droid who healed Luke Skywalker s wounds three times : the scars caused by the Wampa Luke met on Hoth, his hand lost on Bespin to Darth Vader and the wounds caused by the Emperor s Force Lightning onboard the second Death Star."},{"b":12,"c":"REB_ACKBAR","f":"REB","n":"Admiral Gial Ackbar","v":"Admiral Gial Ackbar","p":"admiral gial ackbar","e":"NR RES","t":"named canon era_imperial era_sequel male non_sensitive","w":"[corrigé] Rebel Admiral who later joined the Resistance (RES), leading the Starkiller Base assault. The Republic captain role during the Clone Wars is brief, so no REP.","bio":"Gial Ackbar was a Mon Calamari Male who served the Rebel Alliance and Resistance as Admiral during the Galactic Civil War and First Order-Resistance War. With a career beginning as captain of the Mon Calamari Guard during the Clone Wars, Ackbar would later join the Rebel Alliance at a point after the Empire\u0027s rise to power. From his flagship, Ackbar led the Alliance to victory in the Battle of Endor, and later the Battle of Jakku, after which he retired. Ackbar later joined the Resistance and helped coordinate the assault on Starkiller Base. Ackbar was later killed after Kylo Ren\u0027s wingmen fired missiles at the bridge of the Raddus."},{"b":12,"c":"REB_AHSOKA_REBEL","f":"REB","n":"Ahsoka Tano (Fulcrum)","v":"Ahsoka Tano (Fulcrum)|Ahsoka Tano (Nomad)","p":"ahsoka tano","e":"JO REP","t":"named canon era_prequel era_imperial jedi female","w":"Former Jedi Padawan (JO) and Clone Wars Republic commander (REP), later Rebel Fulcrum agent (REB).","bio":"After the rise of the Empire, Ahsoka Tano continued to work alongside other Rebel cells under the codename Fulcrum, with her true identity unknown to all but a few individuals. After Kanan Jarrus was rescued over Mustafar, Ahsoka revealed her identity to the Phoenix cell, and continued working in the open until her fateful duel against her former master, Darth Vader. After surviving Malachor thanks to Ezra Bridger\u0027s intervention, Ahsoka and Sabine started to search for Bridger."},{"b":12,"c":"REB_ALIEN_REB","f":"REB","n":"Alien Rebel","v":"Alien Rebel","p":"alien rebel","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic alien Rebel; no additional faction.","bio":"Often looked down on by many within the Empire, many beings from many worlds chose to rise up and take up arms against the Empire."},{"b":12,"c":"REB_AWING_PILOT","f":"REB","n":"A-Wing Pilot","v":"A-Wing Pilot","p":"a-wing pilot","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Rebel pilot; no additional faction.","bio":"A-Wing Pilots were Rebel Pilots that were trained to fly A-Wing Starfighters."},{"b":12,"c":"REB_BAZE","f":"REB","n":"Baze Malbus","v":"Baze Malbus","p":"baze malbus","e":"","t":"named canon era_imperial male non_sensitive","w":"Freelance assassin who was a Guardian of the Whills; no faction code fits the Guardians, so REB only.","bio":"Baze Malbus was a Human male freelance assassin during the Galactic Civil War. Once a devoted member of the Guardians of the Whills, Baze, along with his lifelong friend Chirrut  mwe, continued to guard the Temple of the Kyber on Jedha. After escaping Jedha with the rest of Rogue One, Baze accompanied Jyn to Scarif in an effort to steal the Deathstar plans. During a vicious assault with resulted in Chirrut\u0027s death, Baze was killed after rushing the Imperial Death Troopers, caught in the explosion of a C-25 Frag Grenade."},{"b":12,"c":"REB_BEN","f":"REB","n":"Ben Kenobi","v":"Ben Kenobi","p":"obi-wan kenobi","e":"JO REP","t":"named canon era_prequel era_imperial jedi male","w":"Jedi Master (JO) who served as a Clone Wars general for the Republic (REP).","bio":"After the Republic\u0027s fall, Obi-wan brought young Luke Skywalker to Tatooine and watched over the youth, taking on the name of Ben Kenobi. After reuniting with Luke at the height of the Galactic Civil War, Ben attempted to assist the Rebellion by delivering R2-D2 to the Rebellion. After the Falcon was captured by the Death Star, Ben confronted Darth Vader one last time, accepted his death and became one with the Force. Ben continued to guide Luke as a spirit."},{"b":12,"c":"REB_BESPIN_COP","f":"REB","n":"Bespin Officer","v":"Bespin Officer|Bespin Jumptrooper","p":"bespin officer","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Cloud City police officer; no additional faction.","bio":"Bespin Wing Guards were the primary police force of Cloud City on the planet Bespin."},{"b":12,"c":"REB_BODHI","f":"REB","n":"Bodhi Rook","v":"Bodhi Rook","p":"bodhi rook","e":"GE","t":"named canon era_imperial male non_sensitive","w":"Imperial cargo pilot who defected to the Rebellion; served the Empire before REB.","bio":"Bodhi Rook was a Human male cargo pilot who defected from the Empire to the Rebellion during the Galactic Civil War. Sent by Galen Erso to Jedha, Bodhi was tasked with sending a message to Saw Gerrera to give to Jyn. Saw captured Bodhi but was later rescued by Rogue One. After escaping Jedha, Bodhi flew Rogue One to Scarif in an effort to steal the Deathstar plans. Shortly after establishing comms with the Rebel Fleet, an Imperial tossed a detonator into the shuttle, killing Bodhi and destroying the shuttle."},{"b":12,"c":"REB_C3PO","f":"REB","n":"C-3PO","v":"C-3PO|C-3PO (Battle Droid Head)|C-3PO (Battle Droid Body)","p":"c-3po","e":"REP RES","t":"named canon era_prequel era_imperial era_sequel non_sensitive","w":"[corrigé] Protocol droid serving Senator Padme as aide during the Clone Wars (REP), then Rebel service.","bio":"C-3PO was a Protocol Droid during the Naboo Crisis, Clone Wars, Galactic Civil War, and First Order-Resistance Conflict. Built by the young Anakin Skywalker, C-3P0 eventually came into the service of the Republic, serving as Senator Padm  Amidala\u0027s aide during the Clone Wars. After the fall of the Republic, C-3P0\u0027s memory was wiped, and unwittingly came into the service of the Rebellion, eventually being purchased by Anakin\u0027s son, Luke Skywalker."},{"b":12,"c":"REB_CASSIAN","f":"REB","n":"Cassian Andor","v":"Cassian Andor","p":"cassian andor","e":"CRIM","t":"named canon era_imperial male non_sensitive","w":"Rebel intelligence operative with a criminal past in Andor; CRIM is a stretch and not clearly a membership, so REB only.","bio":"Cassian Andor was a Human male soldier and member of the Rebel Alliance during the Galactic Civil War. Being tasked with hunting down Jyn Erso\u0027s father, Galen Erso, the lead scientist for the Deathstar, Cassian refused to carry out his orders. Following Jyn to Scarif to steal the Deathstar plans, after suffering many casualties, their mission was a success. After the Deathstar fired down on Scarif, Cassian, along with Jyn, perished in the resulting explosion, telling Jyn her father would\u0027ve been proud of her."},{"b":12,"c":"REB_CHEWIE","f":"REB","n":"Chewbacca","v":"Chewbacca|Chewbacca (Bespin Escape)","p":"chewbacca","e":"HC NR RES","t":"named canon era_imperial era_new_republic male non_sensitive","w":"[corrigé] Smuggled goods for Jabba the Hutt (HC) for years; later a New Republic member (NR) alongside Han.","bio":"Chewbacca was a Wookiee male smuggler during the Galactic Civil War. Partnered with Han Solo, Chewbacca and Han smuggled goods in service to Jabba the Hutt, until Han dumped a shipment of spice. Chartering Ben Kenobi and Luke Skywalker to Alderaan, Chewie eventually found himself a spot in the Rebellion along with Han after rescuing Princess Leia. After Jabba was killed, Chewie, along with Han, became fully fledged members of the Rebellion, and later the New Republic."},{"b":12,"c":"REB_CHIRRUT","f":"REB","n":"Chirrut Imwe","v":"Chirrut Imwe","p":"chirrut imwe","e":"","t":"named canon era_imperial force_user male","w":"Force-sensitive Guardian of the Whills; not a Jedi, so force_user only. No additional faction.","bio":"Chirrut  mwe was a Human male who served as one of the Guardians of the Whills on Jedha during the Galactic Civil War. Often spending his time preaching the Force on the streets of Jedha, Chirrut met Jyn, immediately recognizing the Kyber crystal necklace she wore. After escaping Jedha, Chirrut accompanied Jyn to Scarif in an effort to steal the Deathstar plans. After activating a master switch, opening a line of communication between their shuttle and the Rebel fleet, Chirrut was killed after a fuel canister exploded."},{"b":12,"c":"REB_CHOPPER","f":"REB","n":"Chopper","v":"Chopper","p":"chopper","e":"","t":"named canon era_imperial non_sensitive","w":"Astromech of the Lothal Rebels; only REB.","bio":"Chopper, or C1-10P, was an Astromech Droid and member of the Lothal Rebels during the Galactic Civil War. Rescued from his crashed Y-wing during the Clone Wars, Chopper came under the ownership of Hera Syndulla, and went with her on the Ghost to create the Lothal Rebels, with him maintaining the Ghost. With Chopper\u0027s advanced age and little maintenance performed on him over the years, Chopper developed a cranky, mischievious personality, often pranking the Lothal Rebels, especially Ezra and Zeb."},{"b":12,"c":"REB_COMMANDO","f":"REB","n":"Rebel Commando","v":"Rebel Commando|Rebel Assault Commando","p":"rebel commando","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Rebel special forces; no additional faction.","bio":"Rebel Commandos were a special military branch of the Rebellion led by General Crix Madine. Known to be a cocky and arrogant in general, Commandos often took the Rebellion more seriously than most ground troops, and disdained on those who shirked from duty. All SpecForce personnel were required to pass training which consisted of four months of intense, physical and mental training, including learning the use of antique slugthrowers, disarming proximity mines and rappelling off a ray shield"},{"b":12,"c":"REB_CRIX","f":"REB","n":"Crix Madine","v":"Crix Madine","p":"crix madine","e":"GE","t":"named canon era_imperial male non_sensitive","w":"Former Imperial commando officer (GE) who defected and led Rebel commandos; later served the New Republic briefly, not enough to add NR.","bio":"Crix Madine was a Human male general of the Rebellion during the Galactic Civil War. Originally in service to the Galactic Empire, in charge of a commando unit in the Empire\u0027s military, Crix defected to the Rebellion, where by the time of the Battle of Endor, served as a general. During the Battle of Endor, Crix devised the attack on the Endor shield generator and trained the soldiers that joined Han Solo in this mission. After the Galactic Civil War, Crix continued to serve in the New Republic."},{"b":12,"c":"REB_DASH","f":"REB","n":"Dash Rendar","v":"Dash Rendar","p":"dash rendar","e":"CRIM","t":"named legends era_imperial male non_sensitive","w":"Mercenary smuggler working jobs for hire; CRIM fits his independent criminal life. Legends (Shadows of the Empire).","bio":"Dash Rendar was a Human male smuggler during the Galactic Civil War and pilot of the famous modified Corellian YT-2400  Outrider . After he took off from his native planet Corellia, Dash Rendar took on several jobs as a mercenary for a living. He obtained the Outrider from one of his employers, Vanya, a Twi Lek crime lord, and customized it to suit his needs, making it a formidable smuggling ship. Dash Rendar and the Outrider were mostly known for the support they brought to the Rebellion against the Empire and Xizor s Black Sun, from the Battle of Hoth to the Battle over Coruscant which pitted the Imperial fleet, the Rebellion s fleet and Xizor s skyhook, the Falleen s Fist. After the battle, Dash faked his death and went missing for everyone."},{"b":12,"c":"REB_DODONNA","f":"REB","n":"Jan Dodonna","v":"Jan Dodonna","p":"jan dodonna","e":"REP GE","t":"named canon era_prequel era_imperial male non_sensitive","w":"Republic bridge officer during the Clone Wars (REP), then Star Destroyer Captain for the Empire (GE), before defecting to the Rebellion.","bio":"Jan Dodonna was a Male Human from the planet Commenor who served in the military of the Galactic Republic, the Galactic Empire, and later the Rebel Alliance. Dodonna served as a bridge officer onboard the Guardian during the Clone Wars and became one of the first Star Destroyer Captains in the Galactic Empire. Dodonna would eventually decide to leave the Empire and join the fledgling Rebellion many years before the Battle of Yavin. Sometime later, Dodonna would take leadership of the Rebel forces stationed on Yavin IV, sometimes working with the Phoenix Cell to obtain munitions and supplies. Dodonna would later be ambushed by Grand Admiral Thrawn during preparations for an attack on the planet Lothal. Dodonna\u0027s forces as well as the forces of the other Rebel Cells were forced to retreat, taking heavy losses in the process. Thrawn pursued the group to Chopper Base and Dodonna\u0027s forces were once again forced to retreat, this time fleeing to Yavin IV. Dodonna was also witness to Jyn Erso\u0027s efforts to obtain the Death Star plans and later used those plans to formulate the attack on the Death Star I that resulted in its destruction. Dodonna and the rest of the Rebel Alliance later fled Yavin IV, traveling to the Mako-Ta Space Docks that would serve as the Alliance High Command\u0027s new base. When it was discovered that Vader had been trapped on Vrogas Vas, Dodonna personally ordered an extra battalion to aid in the ultimately doomed attempt to kill him. After being betrayed, the Rebels were again forced to fight a desperate battle against the Empire and retreat from Mako-Ta. Near the end of the battle, Dodonna\u0027s ship, the Republic, was destroyed as he attempted to help other ships escape."},{"b":12,"c":"REB_EVAAN","f":"REB","n":"Evaan Verlane","v":"Evaan Verlane","p":"evaan verlane","e":"NR","t":"named legends era_imperial era_new_republic female non_sensitive","w":"Rebel pilot who later fought for the New Republic at Kashyyyk (NR). Legends.","bio":"Evaan Verlaine was a human female rebel pilot during the Galactic Civil War, born on Alderaan. Evaan participated in numerous events such as the Battle of Scarif as a Gold Squadron pilot and the Battle of Yavin. After that, Verlaine pledged her loyalty to Princess Leia Organa, at which point both of them went on multiple missions together, on Naboo and Sullust noticeably. Evaan even saved Leia Organa once, on Skaradosh, as Leia was captured by Dreed, an Imperial commander after he exchanged her for another prisoner he had, Tula. Verlaine also fought for the New Republic during the Battle of Kashyyyk, where a Wookiee uprising caused an orbital bombardment from three Imperial Star Destroyers. With the help of Wedge Antilles  Phantom Squadron and pilots Han Solo and Chewbacca, Leia, Verlaine and their allies managed to destroy on of the ISDs, capture another and force the third one to surrender."},{"b":12,"c":"REB_EZRA","f":"REB","n":"Ezra Bridger","v":"Ezra Bridger|Ezra Bridger (Jedi Training)|Ezra Bridger (Peridea)","p":"ezra bridger","e":"JO","t":"named canon era_imperial era_new_republic jedi male","w":"Jedi Padawan under Kanan Jarrus (JO), also a Lothal Rebel (REB).","bio":"Ezra Bridger was a Human male rebel and Jedi Padawan during the Galactic Civil War. Born the day the Empire was founded, Ezra was eventually orphaned by the Empire and lived on the streets of Lothal until he was found by Kanan Jarrus and taken as his Padawan. With a strong affinity to the Force, Ezra progressed quickly in his training. After Kanan\u0027s death, Ezra led a small group to free Lothal from imperial control. Confronting Thrawn, Ezra summoned a group of Purrgils, which dragged Thrawn\u0027s destroyer in hyperspace."},{"b":12,"c":"REB_FX_7","f":"REB","n":"FX-7 Medical Droid","v":"FX-7 Medical Droid","p":"fx-7 medical droid","e":"","t":"named canon era_imperial non_sensitive","w":"Rebel medical droid; only REB.","bio":"FX-7 was an FX-7 medical droid to served the Rebel Alliance around the time of the Battle of Hoth. FX-7 saw to Luke Skywalker\u0027s injuries he sustained from a Wampa, and after Echo Base was evacuated of all Rebel personnel, FX-7 was re-assigned to the Rebel\u0027s Nebulon-B Frigate known as the Redemption."},{"b":12,"c":"REB_GALEN_REBEL","f":"REB","n":"Galen Marek (Jedi Adventurer Robes)","v":"Galen Marek (Jedi Adventurer Robes)|Galen Marek (Medical Robes)|Galen Marek (Bounty Hunter Disguise)|Galen Marek (Corellian Jacket)|Galen Marek (Temple Exploration Gear)|Galen Marek (Jungle Combat Gear)|Galen Marek (Industrial Gear)","p":"galen marek","e":"SO GE","t":"named legends era_imperial sith redeemed male","w":"Secret apprentice of Darth Vader (SO), serving the Empire (GE) before turning on Vader. Legends (The Force Unleashed).","bio":"After awakening from his near-death experience caused by Darth Vader, Galen was assigned to establish an alliance of rebel insurgents. While his intentions were those of his master, Galen failed to realize that his mission was a means to an end, and after gathering the Rebel leaders on Corellia, it was revealed that Galen was nothing more than a tool. After surviving Corellia, Galen journeyed to the Death Star, and of his own free will, confronted his master and successfully freed the Rebel leaders, at the cost of his own life. His sacrifice inspired the formation of the Rebel Alliance, using his family crest as their symbol."},{"b":12,"c":"REB_GARM","f":"REB","n":"Garm Bel Iblis","v":"Garm Bel Iblis","p":"garm bel iblis","e":"REP NR","t":"named legends era_prequel era_imperial male non_sensitive","w":"[corrigé] Corellian Senator during the Clone Wars (REP), then a Rebel fighter. Legends.","bio":"Garm Bel Iblis was a Human male who served as Senator of Corellia during the Clone Wars, and Rebel fighter during the Galactic Civil War. After Bail Organa was killed after the Death Star destroyed Alderaan, Garm left the Rebellion, waging his own war against the Galactic Empire until its eventual end."},{"b":12,"c":"REB_GRIZZ","f":"REB","n":"Grizz Frix","v":"Grizz Frix","p":"grizz frix","e":"","t":"named legends era_imperial male non_sensitive","w":"Red Squadron pilot in the Rebel Alliance; only REB. Legends.","bio":"Grizz Frix was a Male Human pilot who fought for the Rebel Alliance during the Galactic Civil War. Frix was selected for the reformed Red Squadron by Wedge Antilles sometime after the evacuation of Hoth. Soon after, Frix would help Red Squadron attack a pirate base that threatened the Rebel\u0027s rendezvous point. Frix would later participate in the Battle of Endor, piloting a X-wing fighter. He died when his ship was destroyed during an attack on a Star Destroyer during the battle."},{"b":13,"c":"REB_GUERILLA","f":"REB","n":"Rebel Guerilla Fighter","v":"Rebel Guerilla Fighter","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Generic Rebel Guerrilla unit (led by Crix Madine per bio); no extra faction.","bio":"Rebel Guerrillas were a special military branch of the Rebellion led by General Crix Madine. Trained for covert operations, Guerrillas carried out ambush missions for the Rebellion, stealing information, supplies, and weapons from vulnerable Imperial patrols."},{"b":13,"c":"REB_HAN","f":"REB","n":"Han Solo","v":"Han Solo|Han Solo (Stormtrooper)|Han Solo (Hoth)|Han Solo (Beckett\u0027s Crew)","p":"han solo","e":"CRIM","t":"named canon era_imperial male non_sensitive","w":"Independent smuggler career and Beckett\u0027s Crew variant give CRIM; brief Jabba employ not counted. Identity from bio and canon knowledge, not verified on Wookieepedia.","bio":"Han Solo was a Human male smuggler and later general of the Rebellion during the Galactic Civil War. Owner of the Millenium Falcon, Han was in the employ of Jabba the Hutt until Han dumped a shipment of spice, where he was shortly after marked with a price on his head. Seeking money, Han accepted a charter from Ben Kenobi, to take them to Alderaan, which then turned into a rescue mission. Over the years, Han continued to serve the Rebellion, and after Jabba the Hutt was killed, accepted his role in the Alliance as a general."},{"b":13,"c":"REB_HERA","f":"REB","n":"Hera Syndulla","v":"Hera Syndulla","p":"hera syndulla","e":"","t":"named canon era_imperial female non_sensitive","w":"Twi\u0027lek leader of the Lothal rebels (already REB); no other faction.","bio":"Hera Syndulla was a Twi\u0027lek female rebel and co-leader of Phoenix Squadron during the Galactic Civil War. Daughter to famous Twi\u0027lek Resistance leader Cham Syndulla and an adept pilot, Hera would travel across the galaxy in hopes of forming her own resistance movement against the Empire in her ship, the Ghost. Leading a group of rebels known as the Spectres on the planet Lothal, she would play a key part in the early rebellion against the Galactic Empire."},{"b":13,"c":"REB_HONOR_GUARD","f":"REB","n":"Rebel Honor Guard","v":"Rebel Honor Guard","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Generic Rebel Honor Guard elite unit; no extra faction.","bio":"Rebel Honor Guards were elite troops in the Rebellion during the Galactic Civil War. They wore dark buttoned down jackets with pockets, matching pants and black boots. Their helmets were similar to those of the standard Rebel troopers, and their weapon of choice was the Electropole"},{"b":13,"c":"REB_IDEN","f":"REB","n":"Iden Versio","v":"Iden Versio","p":"iden versio","e":"GE","t":"named canon era_imperial female non_sensitive","w":"Served as Inferno Squad leader for the Empire for most of her story before defecting, so GE. Identity from bio.","bio":"Iden Versio was a Human female who served the Galactic Empire and led Inferno Squad during the Galactic Civil War. As the commander of Inferno Squad, Iden led fellow agents Del Meeko and Gideon Hask on special ops missions unsuited for the common Imperial Military. At the conclusion of the Battle of Endor, Iden witnessed the destruction of the second Death Star, and worked with her father, Admiral Garrick Versio, to enact the beginning phases of Operation: Cinder. After learning of her homeworld\u0027s impending destruction, Iden lost faith in the Empire and defected to the Rebel Alliance."},{"b":13,"c":"REB_Jaxxon","f":"REB","n":"Jaxxon","v":"Jaxxon","p":"jaxxon","e":"","t":"named legends era_imperial male non_sensitive","w":"Marvel Star Wars comics Rebel pilot; Legends-only character. Bio is empty, identity from knowledge.","bio":""},{"b":13,"c":"REB_JUNO","f":"REB","n":"Juno Eclipse","v":"Juno Eclipse","p":"juno eclipse","e":"GE","t":"named legends era_imperial female non_sensitive","w":"Imperial pilot under Vader (Black Five) before joining the Rebellion, so GE. Force Unleashed character (Legends).","bio":"Juno Eclipse was a Human female pilot captain who served the Empire and the Rebellion during the Galactic Civil War. The youngest student ever accepted to the Imperial Academy, after graduation, Juno was chosen by Darth Vader to lead his Black Five Squadron until re-assigned as Starkiller\u0027s pilot. After Vader\u0027s first betrayal, Juno assisted Starkiller as he searched for the Rebel Senators. After Starkiller\u0027s death, Juno continued to serve the Rebellion as a Captain of the Nebulon-B Frigate, Salvation."},{"b":13,"c":"REB_JYN","f":"REB","n":"Jyn Erso","v":"Jyn Erso|Jyn Erso (Disguise)","p":"jyn erso","e":"","t":"named canon era_imperial female non_sensitive","w":"Rogue One protagonist; the Partisan upbringing under Saw Gerrera is not a faction membership.","bio":"Jyn Erso was a Human female soldier and former criminal during the Galactic Civil War. A pivotal member of the Rebel Alliance, Jyn was separated by her parents at a young age, being raised by Rebel extremist Saw Gerrera. After escaping Jedha, Jyn led Rogue One to the planet Scarif in an effort to steal the Deathstar plans. After suffering many casualties, Jyn succeeded in transmitting the plans to the Rebel fleet. After the Deathstar fired its superlaser on Scarif, Jyn, along with Cassian Andor, perished shortly after."},{"b":13,"c":"REB_K2SO","f":"REB","n":"K-2SO","v":"K-2SO","p":"k-2so","e":"","t":"named canon era_imperial non_sensitive","w":"Imperial KX droid captured and reprogrammed by Cassian; Imperial service too brief to count.","bio":"K-2SO was a KX Security Droid who served the Rebellion at some point prior to the Battle of Scarif. Captured and reprogrammed by Cassian Andor, K-2SO developed a highly snarky personality as a byproduct of the reprogramming. Despite this, he continued to serve the Rebel Alliance faithfully. On Scarif, K-2SO accompanied Jyn Erso and Cassian to the main vault where the Death Star plans were located. After his cover was blown, K-2SO fought bravely and sustained heavy damage. After locking the vault to prevent the imperials from capturing Jyn and Cassian, K-2SO powered off permanently."},{"b":13,"c":"REB_K3PO","f":"REB","n":"K-3PO","v":"K-3PO","p":"k-3po","e":"","t":"named legends era_imperial non_sensitive","w":"Protocol droid serving as a Rebel Alliance captain at Echo Base; no extra faction.","bio":"K-3PO was a Protocol Droid who served as a Captain in the Rebel Alliance during the Galactic Civil War. Stationed in Echo Base, K-3PO was destroyed after debris fell on him during the Battle of Hoth."},{"b":13,"c":"REB_KANAN","f":"REB","n":"Kanan Jarrus","v":"Kanan Jarrus|Kanan Jarrus (Jedi Knight)|Caleb Dume","p":"kanan jarrus","e":"JO","t":"named canon era_prequel era_imperial jedi male","w":"Caleb Dume was a Jedi Padawan and then Jedi Knight, so JO. Rebels and Clone Wars canon.","bio":"Kanan Jarrus was a Human male Jedi Knight during the Galactic Civil War. Originally known as Caleb Dume, Depa Billaba\u0027s Padawan, Kanan escaped Order 66 and eventually joined the Lothal Rebels, hiding his true secret until discovering his apprentice, Ezra Bridger on Lothal. Passing multiple trials, Kanan was later made a Jedi Knight by an apparition of the former Grand Inquisitor. On Lothal, after rescuing Hera from captivity, Kanan perished on top of a large fuel depot, after Arihnda Pryce ordered it destroyed to prevent their escape."},{"b":13,"c":"REB_KEYAN","f":"REB","n":"Keyan Farlander","v":"Keyan Farlander","p":"keyan farlander","e":"","t":"named legends era_imperial male non_sensitive","w":"B-wing pilot in Legends novels; no extra faction.","bio":"Keyan Farlander was a Male Human pilot who fought for the Rebel Alliance during the Galactic Civil War. Farlander was a B-wing pilot that had fought for the Alliance on multiple occasions, most notably at the Battle of Endor."},{"b":13,"c":"REB_KOTA","f":"REB","n":"Rahm Kota","v":"Rahm Kota|Rahm Kota (Drunk)|Rahm Kota (Rebel General)","p":"rahm kota","e":"JO REP","t":"named legends era_prequel era_imperial jedi male","w":"[corrigé] Jedi Master during the Clone Wars and the Galactic Civil War, so JO. Force Unleashed character (Legends).","bio":"Rahm Kota was a Human male Jedi Master during the Clone Wars and Galactic Civil War. During the Clone Wars, Kota established his own army to fight against the Separatists, believing the clones were unfit for battle. As a result, Kota was able to avoid Order 66. In 3 BBY, Kota attacked a TIE Construction Facility, but was defeated and blinded by Starkiller, Darth Vader\u0027s apprentice. A year later, Kota reunited with Starkiller, and the two helped form the Rebellion, which Kota was made general of shortly after Starkiller\u0027s death."},{"b":13,"c":"REB_KOTA_MILITIA","f":"REB","n":"Militia Trooper","v":"Militia Trooper|Militia Saboteur|Militia Elite","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Generic militia trooper of Rahm Kota; no extra faction.","bio":"Rahm Kota did not trust clones efficiency and loyalty, thus he surrounded himself with non-clone humans to assist him in battle. After the execution of Order 66, Rahm Kota used his militia to assist him in attacking a TIE Fighter factory, but all of his soldiers present on the station were wiped out by Galen Marek. They mostly used vibroblades, blaster rifles, rotary blasters to win their battles."},{"b":13,"c":"REB_KOTH","f":"REB","n":"Koth Melan","v":"Koth Melan","p":"koth melan","e":"","t":"named legends era_imperial male non_sensitive","w":"Head of the Bothan Spynet in the Rebellion; no extra faction.","bio":"Koth Melan was a Bothan male who worked as head of the Bothan Spynet during the Galactic Civil War. After losing his father to the Empire, Koth immediately joined the Rebel Alliance after its formation. When learning of a secret Imperial military project, Koth got into contact with Luke Skywalker and Dash Rendar, and the three were able to raid the transport Suprosa to retrieve the data. On Kothlis, Melan\u0027s team of slicers were successful in deciphering the data, which turned out to be the plans for the Second Death Star. Koth\u0027s safehouse was raided by bounty hunters, and in the ensuing firefight, Koth was shot and killed."},{"b":13,"c":"REB_LAK","f":"REB","n":"Lak Sivrak","v":"Lak Sivrak","p":"lak sivrak","e":"","t":"named legends era_imperial male non_sensitive","w":"[corrigé] Worked as an Imperial scout and hunter before defecting mid-war, so GE. Legends.","bio":"Lak Sivrak was a Male Shistavanen who worked for the Galactic Empire as a scout and hunter. Sometime during the Galactic Civil War, Sivrak met the Lamproid Dice Ibegon and fell in love with her, defecting to the Rebel Alliance and even eventually flying an X-wing during the Battle of Endor."},{"b":13,"c":"REB_LANDO","f":"REB","n":"Lando Calrissian","v":"Lando Calrissian|Lando Calrissian (Disguise)|Lando Calrissian (Smuggler)|Lando Calrissian (Thrawn Crisis)","p":"lando calrissian","e":"CRIM","t":"named canon era_imperial male non_sensitive","w":"Smuggler career gives CRIM. Cloud City administration was under Imperial duress, not membership.","bio":"Lando Calrissian was a Human male smuggler and later general of the Rebellion during the Galactic Civil War. A successful smuggler, Lando began his smuggling career sometime after the fall of the Republic, additionally around this time losing the Millenium Falcon in a game of Sabacc with Han Solo. Sometime during the War, Lando won the Tibanna gas colony of Cloud City. Forced by Vader to give up Han Solo, Lando complied, only to have a change of heart, and helped the Rebels free Han, and led an assault on the second Death Star."},{"b":13,"c":"REB_LEEBO","f":"REB","n":"Leebo","v":"Leebo","p":"leebo","e":"","t":"named legends era_imperial non_sensitive","w":"Dash Rendar\u0027s repair droid and pilot in Legends; no extra faction.","bio":"Leebo was a Cybot Galactica, LE repair droid owned by Dash Rendar during the Galactic Civil War. Leebo began his career as a safety standards inspector in Esseles starport. While checking a parked ship, the vessel took off, keeping the droid in the cargo bay unwillingly. There, Leebo learnt to work as a mechanic. Throughout the years Leebo had several masters who taught him many different things, until Kood Gareeda sold him to Dash Rendar. From this point on, Leebo served as a pilot and mechanic under Dash s command for the Outrider, participating in the Battle of Hoth, the escapade to Ord Mantell, the assault on the Suprosa and the Battle over Coruscant."},{"b":13,"c":"REB_LEIA","f":"REB","n":"Princess Leia Organa","v":"Princess Leia Organa|Princess Leia Organa (Lothal)|Leia Organa (Mimban)|Leia Organa (Mimban)|Princess Leia Organa (Ord Mantell)|Leia Organa (Rebel Officer)|Leia Organa (Bespin)|Leia Organa (Captive)|Leia Organa (Boushh Disguise)|Leia Organa (Slave)|Leia Organa (Endor)|Leia Organa (Honoghr)|Leia Organa Solo|Leia Organa Solo (Jedi Training)|Leia Organa Solo (Jedi Knight)","p":"leia organa","e":"NR RES","t":"named canon era_imperial era_sequel female non_sensitive","w":"Senator and General of the New Republic and later Resistance leader in canon, so NR and RES. Force-sensitive.","bio":"Leia Organa was a Human female who served as Princess of Alderaan during the Galactic Civil War. The adopted daughter of Bail and Breha Organa, Leia entered politics at a young age, and secretly assisted the Rebellion during the war. After receiving the Death Star plans, Leia was captured by the Empire, and was later rescued by Luke Skywalker, Han Solo, and Chewbacca. Years later after the Death Star was destroyed, Leia fell in love with Han, and later learned of her true parentage, that she was the daughter of Vader."},{"b":13,"c":"REB_LOBOT","f":"REB","n":"Lobot","v":"Lobot","p":"lobot","e":"CRIM","t":"named canon era_imperial male non_sensitive","w":"Smuggler partner of Lando, so CRIM. Identity from film knowledge.","bio":"Lobot was a Human male smuggler and partner of Lando Calrissian during the Galactic Civil War. Equipped with an AJ6 cyborg construct, Lobot was considered a strategic genius, assisting Lando with a number of dangerous missions. Sometime after losing the Falcon, Lobot and Lando came under attack by Imperial Forces, Lobot was wounded, and lost his mind and personality to his cybernetic implants. Lobot continued to serve Lando as his aide during the latter\u0027s tenant as Baron Administrator of Cloud City."},{"b":13,"c":"REB_LUKE","f":"REB","n":"Luke Skywalker","v":"Luke Skywalker|Luke Skywalker (Farmboy)|Luke Skywalker (Stormtrooper)|Luke Skywalker (Yavin Ceremony)|Luke Skywalker (Mimban)|Luke Skywalker (Mimban)|Luke Skywalker (Rebel)|Luke Skywalker (Hoth)|Luke Skywalker (Pilot)|Luke Skywalker (Dagobah)|Luke Skywalker (Bespin)|Luke Skywalker (Thrawn Crisis)|Luke Skywalker (Sith Apprentice)|Luke Skywalker (Jedi Trainer)|Luke Skywalker (Crystal Star)|Luke Skywalker (Jedi Master)|Luke Skywalker (Grand Master)","p":"luke skywalker","e":"JO NR","t":"named canon era_imperial era_sequel jedi male","w":"[corrigé] Trained as a Jedi and rebuilt the Jedi Order, so JO. Identity from film knowledge.","bio":"Luke Skywalker was a Human male Jedi Knight during the Galactic Civil War. The son of Anakin Skywalker, Luke was strong in the Force. After joining the Rebellion and destroying the Death Star, Luke traveled to Dagobah to learn the ways of the Jedi from Master Yoda. Luke went off to confront Vader, who revealed he was Luke\u0027s father, Anakin. One year later, Luke confronted Vader and Palpatine, redeemed his father, and destroyed the Emperor, becoming a full Jedi Knight. After the war, Luke began to train a new Jedi Order."},{"b":13,"c":"REB_MARKSMAN","f":"REB","n":"Rebel Marksman","v":"Rebel Marksman","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Generic Rebel marksman; no extra faction.","bio":"Rebel marksmen were skilled snipers who used their precision rifles to kill important targets on the battlefield during skirmishes against the Empire. They were also equipped with a scout droid able to call for an orbital strike, an automatic turret to de
