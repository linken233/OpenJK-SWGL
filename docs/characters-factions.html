edits to buy his brother\u0027s freedom."},{"b":5,"c":"CV_PIT_DROID","f":"CV","n":"Pit Droid","v":"Pit Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Maintenance droid used on starships and podracers; no faction.","bio":"Pit Droids were droids commonly used for maintenance work on Starships and Podracers. They were widely sought after as a cheap labor force as they didn\u0027t cost much, were durable, and were perfectly willing to throw themselves into danger regardless of their potential destruction."},{"b":5,"c":"CV_POLIS_MASSAN","f":"CV","n":"Polis Massan","v":"Polis Massan","p":"generic","e":"","t":"generic legends era_prequel non_sensitive","w":"Telepathic medical species from Polis Massa; no faction membership in bio. Not verified on Wookieepedia.","bio":"The Kallidahin or more commonly known as the Polis Massans were a humanoid species originating from Kallidah before establishing themselves on Polis Massa. They were a mute species, communicating to each other through telepathy, or to outsiders with droids. Many members of the species were known for their skills in the medical field, taking a very compassionate approach to their care."},{"b":5,"c":"CV_QUADRINAROS","f":"CV","n":"Ben Quadrinaros","v":"Ben Quadrinaros","p":"ben quadrinaros","e":"","t":"named canon male era_prequel non_sensitive","w":"Toong podracer in the Boonta Eve Classic (The Phantom Menace); no faction.","bio":"Ben Quadrinaros was a Toong male who raced in the Boonta Eve Classic during the Naboo Crisis. During the Boonta Eve Classic, Quadrinaros\u0027s rented pod malfunctioned and wouldn\u0027t start, eventually all 4 engines went off, rendering the pod destroyed. Despite the loss, Quadrinaros continued to race in the years that passed."},{"b":5,"c":"CV_QUARREN","f":"CV","n":"Quarren","v":"Quarren|Quarren","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"[corrigé] Squid-like species of Mon Cala that allied with the Confederacy of Independent Systems in the Clone Wars, per bio.","bio":"Quarren were a humanoid squid-like species that were native to the planet Mon Cala. The Quarren and Mon Calamari shared Mon Cala and were often at odds with each other, at one point allying with the Confederacy of Independent Systems during the Clone Wars."},{"b":5,"c":"CV_RAKATA","f":"CV","n":"Rakata","v":"Rakata","p":"generic","e":"","t":"generic legends force_user era_ancient","w":"Ancient Rakata enslaved the galaxy under the Infinite Empire and later became barbaric; the Infinite Empire has no code and is not in the list.","bio":"Rakata were an amphibious, humanoid species hailing from the planet Lehon, otherwise known as Rakata Prime. A technologically advanced race, the Rakata enslaved the entire galaxy, ruling under their own faction, known as the Infinite Empire. However, due to prolonged use of the dark side, the Rakata grew corrupted, and overtime lost their connection to the Force, eventually becoming a barbaric race, and twenty thousand years later, around the time of the Jedi Civil War, only a few tribes remained."},{"b":5,"c":"CV_SEBULBA","f":"CV","n":"Sebulba","v":"Sebulba","p":"sebulba","e":"","t":"named canon male era_prequel non_sensitive","w":"Dug podracer in The Phantom Menace; rival of Anakin, no faction.","bio":"Sebulba was a Dug Male who participated in the Boonta Eve Classic during the Naboo Crisis. An aggressive being, Sebulba developed a talent for Podracing, utilizing his illegally modified Podracer which offered a significant advantage to him while racing. During the Boonta Eve Classic, Sebulba sabotaged Anakin Skywalker\u0027s Podracer in an effort to prevent the child from winning the race. However, his plan backfired as Anakin was able to recover and win the race, destroying Sebulba\u0027s racer in the process. Sebulba purchased Anakin\u0027s pod after the race and continued to use it during the rest of his career."},{"b":5,"c":"CV_SELKATH","f":"CV","n":"Selkath","v":"Selkath","p":"generic","e":"","t":"generic canon era_old_republic non_sensitive","w":"Aquatic species of Manaan that stayed neutral; the Order of Shasa is a local group with no code.","bio":"Selkaths were an aquatic species hailing from the planet Manaan. Manaan was well-known for its kolto, a powerful healing agent popularly used around the time of the Jedi Civil War. Using this valuable resource to their advantage, the Selkath maintained a strict neutrality between both factions. Some Selkath were Force sensitive, and had their own Force sensitive group, known as the Order of Shasa, named after a Selkath who inspired the natives to rise against the Sith Empire and bring justice to their world."},{"b":5,"c":"CV_SHAMAN","f":"CV","n":"Tusken Shaman","v":"Tusken Shaman","p":"generic","e":"","t":"generic legends force_user era_imperial","w":"Tusken shamans who fought and healed for their tribes; a variant of Tusken Raiders, no faction. Not verified on Wookieepedia.","bio":"Tusken Shamans were a type of Tusken Raider who entertained their tribe with stories as well as assisted them in combat. Shamasn specialized in delivering lethal poisons to their enemies and healing wounds to their fellow tribesmen."},{"b":5,"c":"CV_SHMI","f":"CV","n":"Shmi Skywalker","v":"Shmi Skywalker","p":"shmi skywalker","e":"","t":"named canon female era_prequel non_sensitive","w":"Slave on Tatooine, mother of Anakin Skywalker; no faction.","bio":"Shmi Skywalker was a Human female who worked as a slave on Tatooine in the final years of the Galactic Republic. By the Invasion of Naboo, Shmi and her son, Anakin Skywalker, were in the service of the Toydarian Watto. During the Invasion of Naboo, Anakin met with Qui-Gon Jinn and offered to participate in the Boonta Eve Classic, Shmi reluctantly agreed to allow her son to take part. After Anakin won and earned his freedom, Shmi continued work for Watto until being freed by the moisture farmer Cliegg Lars. Years later, Shmi was captured by a band of Tusken Raiders, and after being rescued by Anakin Skywalker, died in his arms."},{"b":5,"c":"CV_SORTIE","f":"CV","n":"50R-T","v":"50R-T","p":"50r-t","e":"","t":"named legends era_old_republic non_sensitive","w":"Tactical droid turned gambling dealer and bodyguard; no faction membership. Not verified on Wookieepedia.","bio":"50R-T, also called Sortie, was a tactial droid in the lineage of the ancient GEMINI droid classes. At some point, 50R-T was left in pieces on a battlefield, but was rebuilt and reprogrammed to act as a dealer for various gambling activities. However, 50R-T was also capable of acting as a bodyguard, often carrying a blaster pistol and a modified deck of Sabacc cards that could double as weapons."},{"b":5,"c":"CV_SULLUSTAN","f":"CV","n":"Sullustan","v":"Sullustan","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"[corrigé] Sullustans played an important role in the Galactic Civil War and were charter members of the New Republic per bio.","bio":"Sullustans were a Near-human species hailing from the planet Sullust. As skilled pilots and navigators, Sullustans were common sights for spacers and at busy spaceports. The Sullustans played an important role in the Galactic Civil War and were charter members of the New Republic."},{"b":5,"c":"CV_T3H8","f":"CV","n":"T3-H8","v":"T3-H8","p":"t3-h8","e":"","t":"named legends era_old_republic non_sensitive","w":"Astromech who followed amnesiac Revan in KOTOR; a droid companion, not a faction member.","bio":"T3-H8 was a T3-series astromech droid who was briefly a follower of the amnesiac Revan during the Jedi Civil War. While trapped on Taris, Revan wandered into Janice Nall\u0027s shop, and purchased the refurbished droid. However, shortly after exiting the shop, T3-H8 exploded, forcing Janice to give Revan a refund. T3 would later be repaired but later completely destroyed during Darth Malak\u0027s bombardment of Taris."},{"b":5,"c":"CV_TALZ","f":"CV","n":"Talz","v":"Talz","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Sentient species of the snowy worlds in The Clone Wars; no faction membership in bio.","bio":"The Talz were a sentient species hailing from the planet Alzoc III and Orto Plutonia. Native to the snowy worlds, the Talz were relatively unknown to the galaxy until the Clone Wars. After Chairman Chi Cho\u0027s death after declaring war on the Talz, Senator Riyo Chuchi declared peace, and promised to leave the Talz alone. The Talz lived without much technology and were considered a primitive species. Because of this, many cultures dismissed the Talz as savages, and wanted nothing to do with them."},{"b":5,"c":"CV_TARFFUL","f":"CV","n":"Tarfful","v":"Tarfful","p":"tarfful","e":"","t":"named canon male era_prequel non_sensitive","w":"Wookiee chieftain of Kachirho who fought with Chewbacca and Yoda at Kashyyyk; no faction.","bio":"Tarfful was a Wookiee male Chieftain of Kachirho prior to and during the Clone Wars. During the war, he led a band of Wookiees to answer a distress signal made by Chewbacca, who was imprisoned on the Trandoshan hunting grounds of Wasskah. Tarfful later participated in the Battle of Kashyyyk alongside Chewbacca and Grand Master Yoda."},{"b":5,"c":"CV_TUSKEN","f":"CV","n":"Tusken Raider","v":"Tusken Raider|Tusken Raider|Tusken Raider","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Nomadic Tatooine raiders from A New Hope and related films; no faction membership.","bio":"Tusken Raiders, also known as Sand People, were a culture of nomadic, primitive beings hailing from the planet Tatooine. Considered barbarians by Tatooine citizens, Tuskens were known for a number of attacks on Moisture Farms, under the belief that all water was scared and promised to them. Tuskens were divided into tribes consisting of approximately 20 individuals, headed by clan leaders, tribal chiefs, and warlords. Each Tusken carried a gaderfii stick, crafted by the individual Tusken so that each was unique."},{"b":5,"c":"CV_TUSKEN_KING","f":"CV","n":"Tusken King","v":"Tusken King","p":"tusken king","e":"","t":"named legends male era_imperial non_sensitive","w":"Unnamed leader of a Tusken tribe who attacked Mos Espa; no faction. Not verified on Wookieepedia.","bio":"The Tusken King was the leader of a Sand Person Tribe during the height of the Galactic Civil War. During the war, a spacer hired by the Mos Espa scholar Srimaur was tasked with recovering relics belonging to the tribe, which enraged the King, causing him to launch an attack on Mos Espa in retribution for the theft. A volunteer task force alongside Mos Espa\u0027s militia were successful in driving off the Tuskens, which also saw to the death of the Tusken King himself during his tribe\u0027s last stand."},{"b":5,"c":"CV_TWILEK","f":"CV","n":"Twi\u0027lek Male","v":"Twi\u0027lek Male|Twi\u0027lek Male","p":"generic","e":"","t":"generic canon male era_prequel non_sensitive","w":"Twi\u0027lek male species from Ryloth; no faction membership in bio.","bio":"Twi\u0027leks were a tall, humanoid species hailing from the planet Ryloth. A distinctive species, the Twi\u0027lek\u0027s most striking feature was a pair of Lekku protruding from their heads, which were very sensitive and partly housed a Twi\u0027lek\u0027s brain, thus the lekku were very sensitive to touch. Males of the species possessed ears similar to humans, and had sharp, pointed teeth."},{"b":5,"c":"CV_TWILEK_F","f":"CV","n":"Twi\u0027lek Female","v":"Twi\u0027lek Female","p":"generic","e":"","t":"generic canon female era_prequel non_sensitive","w":"Twi\u0027lek female species from Ryloth; no faction membership in bio.","bio":"Twi\u0027leks were a tall, humanoid species hailing from the planet Ryloth. A distinctive species, the Twi\u0027lek\u0027s most striking feature was a pair of Lekku protruding from their heads, which were very sensitive and partly housed a Twi\u0027lek\u0027s brain, thus the lekku were very sensitive to touch. Females of the species, known for their beauty, were often sold into slavery or worked as dancers. A female would also dress revealingly, using their power of seduction to their advantage should the need arise."},{"b":5,"c":"CV_UGNAUGHT","f":"CV","n":"Ugnaught","v":"Ugnaught","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Industrial species from Gentes, some forced into Imperial shipyard service; forced labor, not membership, so no extra faction. Borderline.","bio":"Ugnaughts were short, porcine humanoids hailing from the planet Gentes. Often working in industrial positions, Ugnaughts were known for their engineering skills, and many of them were forced into the Galactic Empire\u0027s service to maintain their countless shipyards. Many Ugnaughts lived on Cloud City, maintaining the city\u0027s many industrial needs."},{"b":5,"c":"CV_WATTO","f":"CV","n":"Watto","v":"Watto","p":"watto","e":"CRIM","t":"named canon male era_prequel non_sensitive","w":"Toydarian junk dealer and human trafficker, an independent criminal rather than a syndicate member, per bio.","bio":"Watto was a Toydarian male junk dealer and human trafficker prior to and during the Clone Wars. The owner of Anakin Skywalker and his mother, Shmi Skywalker, Watto was tricked by the Jedi Master Qui-Gon Jinn into freeing Anakin. Sometime prior to the Clone Wars, Watto sold Shmi to a moisture farmer named Cliegg Lars. He was later visited by Anakin and was asked by his former slave to locate his mother, which the Toydarian reluctantly agreed."},{"b":5,"c":"CV_WILLROW","f":"CV","n":"Willrow Hood","v":"Willrow Hood","p":"willrow hood","e":"","t":"named legends male era_imperial non_sensitive","w":"Cloud City resident who fled the Empire\u0027s takeover of Bespin; no faction. Not verified on Wookieepedia.","bio":"Willrow Hood was a Human male who lived as a resident of Cloud City during the Galactic Civil War. During the Empire\u0027s takeover of Bespin, Willrow, along with many of Cloud City\u0027s citizens, made an attempt to flee the city, carrying a camtono as he made his escape."},{"b":5,"c":"CV_WOOKIEE","f":"CV","n":"Wookiee","v":"Wookiee","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Wookiee species of Kashyyyk; no faction membership in bio.","bio":"Wookiees were tall, hairy humanoids hailing from the planet Kashyyyk. An honorable species, Wookiees were renowned for their great strength, intelligence, loyalty, and their short tempers. Wookiees lived in tribes, led by a Chieftain, where they trained as warriors. Wookiees knew how to work advanced technology, and used their claws to assist in repairs and tree climbing, but were never to be used as weapons. Should a Wookiee use their claws in combat, they were branded a mad-claw and banished from their homeworld."},{"b":5,"c":"CV_WOOKIEE_WARRIOR","f":"CV","n":"Wookiee Warrior","v":"Wookiee Warrior","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Wookiee warrior variant of the species; no faction.","bio":"Wookiee Warriors often wore primitive-looking armor while facing down any threat to their people or while out hunting any of Kashyyyk\u0027s dangerous beasts."},{"b":5,"c":"CV_ZORII","f":"CV","n":"Zorii Bliss","v":"Zorii Bliss","p":"zorii bliss","e":"CRIM RES","t":"named canon female era_sequel non_sensitive","w":"[corrigé] Spice Runner leader who flew with the Resistance at the Battle of Exegol and joined the Resistance in The Rise of Skywalker. Borderline on the extra faction.","bio":"Zorii Bliss was a Human female who led the Spice Runners of Kijimi during the First Order-Resistance War. After Palpatine\u0027s return, Zorii reunited with Poe Dameron, who had once been a part of her crew. After Palpatine ordered Kijimi\u0027s destruction, Zorii flew alongside the Resistance during the Battle of Exegol in her personalized Y-Wing Bomber."},{"b":5,"c":"DKGE_HAVOK","f":"DKGE","n":"Darth Havok","v":"Darth Havok","p":"darth havok","e":"JO","t":"named legends male sith era_legacy","w":"[corrigé] Iktochi who was an Imperial Knight under Empress Fel before deserting and killing her, then served Krayt; FE is a genuine earlier affiliation. Legends.","bio":"Darth Havok was an Iktochi male who worked as a Sith Inquisitor for Darth Krayt\u0027s Galactic Empire. Once the Imperial Knight, Eshkar Niin, Niin deserted his post and killed Empress Elliah Fel. After being defeated by Antares Draco, Niin went to Darth Krayt and pledged his allegiance, taking on the name Darth Havok. Havok continued to serve Krayt\u0027s Empire faithfully until Krayt\u0027s eventual death at the hands of Cade Skywalker. Havok, like the remaining Sith forces, went into hiding with their new Dark Lord, Darth Nihl."},{"b":5,"c":"DKGE_KRAYT","f":"DKGE","n":"Darth Krayt","v":"Darth Krayt|Darth Krayt (Vong Armor)","p":"a\u0027sharad hett","e":"JO SO","t":"named legends sith male era_legacy","w":"[corrigé] Founder and leader of the One Sith, ruling the galaxy as Darth Krayt; proposed SO for the Sith order he led.","bio":"Darth Krayt was a Human male Sith Lord during the Legacy Era. The founder and leader of the One Sith, Krayt ruled the galaxy with an iron fist for seven years. His system, the Rule of One, allowed for many Sith to exist at once, but only ever answered to him and him alone. Krayt\u0027s reign was short-lived however, as Cade Skywalker struck him down, and flew his body into Coruscant\u0027s sun."},{"b":5,"c":"DKGE_KRAYT_OFFICER","f":"DKGE","n":"Imperial Officer","v":"Imperial Officer","p":"generic","e":"","t":"generic legends era_legacy non_sensitive","w":"Generic officer of Krayt\u0027s Empire, no named individual.","bio":"Like the Empire that came before, the officers of Darth Krayt\u0027s Galactic Empire were tasked with overseeing and directing operations in accordance with Krayt\u0027s will."},{"b":5,"c":"DKGE_KRAYT_TROOPER","f":"DKGE","n":"Sith Trooper","v":"Sith Trooper","p":"generic","e":"","t":"generic legends force_user era_legacy","w":"Force-sensitive cybernetic troopers of Krayt\u0027s Empire; part of DKGE only.","bio":"The Sith Troopers of Darth Krayt\u0027s Empire were Force Sensitive individuals taken at birth and augmented by cybernetic implants to maintain an unquestioning loyalty to Darth Krayt."},{"b":5,"c":"DKGE_KRUHL","f":"DKGE","n":"Darth Kruhl","v":"Darth Kruhl","p":"kruhl","e":"SO","t":"named legends sith male era_legacy","w":"Assassin in Krayt\u0027s One Sith Order and Sith Intelligence under Darth Maladi; proposed SO.","bio":"Darth Kruhl was a male Sith Lord and Assassin of Darth Krayt\u0027s One Sith Order. An operative of Darth Maladi\u0027s Sith Intelligence division, Kruhl was dispatched from planet to planet in order to further Krayt\u0027s goals of galactic domination. It would not last however, as on Kruhl\u0027s final mission to assassinate Roan Fel, the two engaged in a Lightsaber duel. Kruhl was killed when Roan Fel shot him in the stomach with a concealed blaster pistol."},{"b":6,"c":"DKGE_MALADI","f":"DKGE","n":"Darth Maladi","v":"Darth Maladi","p":"maladi","e":"","t":"named legends era_legacy sith female","w":"Devaronian Sith scientist (Ixetal Cilona) serving Krayt\u0027s One Sith; bio shows no membership beyond DKGE.","bio":"Darth Maladi was a Devaronian female Sith Lord who served Darth Krayt and the One Sith during Krayt\u0027s reign. Taken by the Sith after her father was killed by Darth Krayt, Maladi was trained in the ways of the Sith, becoming a prominent Sith Lady. Maladi specialized in science, using her knowledge to create the narcotic Ixetal Cilona. Though unsuccessful in tricking Roan Fel in unleashing a chemical bioweapon to eradicate all non-Sith in its vicinity, Maladi joined Nihl and the remaining One Sith in hiding after Darth Krayt\u0027s defeat."},{"b":6,"c":"DKGE_MALEVAL","f":"DKGE","n":"Darth Maleval","v":"Darth Maleval","p":"maleval","e":"","t":"named legends era_legacy sith male","w":"Quarren Sith Lord commanding Krayt\u0027s stormtrooper division against the 908th; no extra faction.","bio":"Darth Maleval was a Male Quarren Sith Lord who served Darth Krayt during the Sith-Imperial War and the Second Imperial Civil War. Maleval was placed in charge of the 407th Stormtrooper Division that was staioned on Yinchorr. After the 908th Stormtrooper Division based on Borosk defected to the Fel Empire, Maleval and his Stormtroopers were sent to lay waste to the division. As the battle went on, Maleval made it clear that there would be no mercy for any member of the 908th and that all of them would die. This directive did not sit well with many members of the 407th and some discussed defecting or other measures. When Maleval\u0027s forces finally defeated the 908th, Maleval took one of the 908th\u0027s captains, Jared Cassel, and brought him before his brother, Gil Cassel, who was a member of the 407th. Maleval ordered Gil to kilL Jared, but Gil refused. Angered at this refusual, Maleval killed both men. This outraged some of the Stormtroopers in the 407th and a small group of soldiers managed to kill the Sith. Maleval\u0027s death was officially reported as killed in action, covering up any actions by the members of the 407th."},{"b":6,"c":"DKGE_MORRIGAN","f":"DKGE","n":"Morrigan Corde","v":"Morrigan Corde","p":"morrigan corde","e":"FE","t":"named legends era_legacy female non_sensitive","w":"[corrigé] Human schemer in Krayt\u0027s Galactic Empire, alias Nyna Calixte; no Force use stated, no extra faction.","bio":"Morrigan Corde was a Human female who served in Darth Krayt\u0027s Galactic Empire before and during the Sith-Imperial War. During a chance meeting with Kol Skywalker, the two fell in love, married, and had a child, Cade Skywalker. However, while Cade was still an infant, Morrigan abandoned her family, returning to Krayt\u0027s service. Abandoning her true name, Corde adopted the name of Nyna Calixte, and attempted to give herself more power by engaging in relationships with Moffs she felt were the most powerful. When the One Sith approached the Empire, Corde attempted to have her lover, Morlish Veed, placed on the Imperial Throne, but was betrayed and ultimately Krayt took the throne for himself. Abandoning her false persona, Morrigan worked in secret with the Fel Empire to inform them of Krayt\u0027s plans in addition to attempting to keep her son, Cade Skywalker, from turning to the dark side. Her regrets caused her to seek forgiveness from her son. After Krayt was defeated, Morrigan along with Cade found a new life together as Cade\u0027s destiny was fulfilled."},{"b":6,"c":"DKGE_NIHL","f":"DKGE","n":"Darth Nihl","v":"Darth Nihl","p":"nihl","e":"","t":"named legends era_legacy sith male","w":"Nagai Sith enforcer and hand of Krayt; belongs to the One Sith under DKGE only.","bio":"Darth Nihl was a Nagai male Sith Lod who served in Darth Krayt\u0027s Galactic Empire during the Sith-Imperial War. As Krayt\u0027s enforcer, Nihl was tasked with eliminating threats against Krayt\u0027s rule, including killing Jedi Master Kol Skywalker and capturing Cade Skywalker. Nihl was later attacked by Cade on Krayt\u0027s orders which saw to the amputation of his arm and near-death, but his life was spared by Cade. After Krayt\u0027s defeat at the hands of Cade Skywalker, Nihl and the rest of the One Sith went into hiding in an unknown section of space."},{"b":6,"c":"DKGE_RAV","f":"DKGE","n":"Rav","v":"Rav","p":"rav","e":"CRIM","t":"named legends era_legacy male non_sensitive","w":"Feeorin pirate leader of the Bloody Bones gang, who worked with Krayt\u0027s Empire through both wars; independent pirate, so CRIM.","bio":"Rav was a Feeorin male pirate who worked with Darth Krayt\u0027s Galactic Empire during the Sith-Imperial War and Second Imperial Civil War. Rav\u0027s gang, the Bloody Bones pirates, were known and feared across the galaxy."},{"b":6,"c":"DKGE_TALON","f":"DKGE","n":"Darth Talon","v":"Darth Talon|Darth Talon","p":"talon","e":"","t":"named legends era_legacy sith female","w":"Twi\u0027lek Sith Lady, one of Krayt\u0027s two hands; no extra faction.","bio":"Darth Talon was a Twi\u0027lek female Sith Lady during the Legacy era. Loyal to Darth Krayt, Krayt anointed her as one of her two hands, along with Darth Nihl. Tasked with training Cade Skywalker, Cade and her briefly shared an intimate relationship, which ended almost as quicky as it began. After betraying the One Sith, Cade stabbed Talon. However, Talon was able to survive the attack. After Krayt was killed, Talon, along with the remaining members of the One Sith fled into hiding."},{"b":6,"c":"DKGE_WYYRLOK","f":"DKGE","n":"Darth Wyyrlok","v":"Darth Wyyrlok","p":"wyyrlok","e":"","t":"named legends era_legacy sith male","w":"Chagrian Sith Lord and Krayt\u0027s healer/servant; no extra faction.","bio":"Darth Wyyrlok was a Male Chagrian Sith Lord that served as the third individual to hold the title and was the most trusted servant of the Dark Lord Darth Krayt. He was chiefly responsible for tending to the health and well-being of the Dark Lord even as the Yuuzhan Vong organic enslavement device called the Yorik-Kul grew inside of Darth Krayt. After the end of the Sith-Imperial War, Wyyrlok accompanied his master when Krayt seized control of Coruscant, thus beginning a new era in the galaxy. For years afterward, Wyyrlok attempted find ways to heal his master, but nothing availed Krayt of his condition. After the former Jedi Cade Skywalker was captured by the One Sith, Krayt and Wyyrlok hoped to use his natural healing abilites to cure the Dark Lord of his illness. However, when Krayt\u0027s focus turned too intently toward Skywalker, Wyyrlok voiced his concern, however, his words were largely dismissed. After Skywalker escaped, Wyyrlok again advised his master against pursuing him, but Krayt again refused to listen to him. Still determined to save his master, Wyyrlok traveled to the planet Prakith and found the tomb of Darth Andeddu. There he defeated the Sith Lord\u0027s cult, known as the Malevolence, and defeated the spirit of Andeddu himself, taking his works in hopes of finding a cure for his master within them. Sometime later, after a capital ship was stolen from the shipyards above Mon Calamari, Krayt deicmated the population, killing a tenth of all sentiet beings on the planet and enslaving the rest, despite Wyyrlok\u0027s protests. After Krayt was badly wounded on Had Abbadon in battle against Skywalker and his allies, Wyyrlok turned on his master and executed him with Sith Lightning, usurping his place as Dark Lord, however, Wyyrlok deceived the rest of the Sith into believing that Krayt was merely in stasis. After ordering a planet-wide genocide on Mon Calamari, hoping to lure out the last of the Galactic Alliance Remnant, Wyyrlok discovered that his master\u0027s body was missing. Krayt arrived on Coruscant and confronted Wyyrlok in the Temple of the Sith. After a short duel, Krayt slew his insubordinate former servant, ending his threat his reign."},{"b":6,"c":"DRSE_APPRENTICE","f":"DRSE","n":"Sith Apprentice","v":"Sith Apprentice","p":"generic","e":"","t":"generic legends era_old_republic sith","w":"Generic Sith Triumvirate apprentice unit from KOTOR II; no extra faction.","bio":"Sith Apprentices were individuals who served the Sith Trimuverate during the Dark Wars. While skilled with the dark side of the Force, to the Sith Triumverate, they were looked upon as little more than a common foot soldier, and were considered expendable."},{"b":6,"c":"DRSE_ASSASSIN","f":"DRSE","n":"Sith Assassin","v":"Sith Assassin","p":"generic","e":"","t":"generic legends era_old_republic sith","w":"Generic Sith assassin unit from the Dark Wars; no extra faction.","bio":"Sith Assassins were individuals who served the Sith Triumverate during the Dark Wars. Utilizing forbidden knowledge, the assassins drew upon the strengths of their opponent, allowing them to face them on equal footing. Their ability had drawbacks, as if their target was weak in the Force, the assassin would become weaker as a result, and could be easily struck down."},{"b":6,"c":"DRSE_BANDON","f":"DRSE","n":"Darth Bandon","v":"Darth Bandon","p":"bandon","e":"","t":"named legends era_old_republic sith male","w":"Malak\u0027s apprentice who ambushed Revan on Manaan; no extra faction.","bio":"Darth Bandon was a Human male Sith Apprentice during the Jedi Civil War. As Darth Malak\u0027s own apprentice, Darth Bandon, he was only second to his Master in the hierarchy of the Sith Empire. During Revan\u0027s quest to locate the Star Maps to the Star Forge, Bandon was dispatched on Malak\u0027s orders to kill the former Sith Lord. At Hrakert Station on Manaan, Bandon ambushed Revan and his allies, and was struck down. Bandon\u0027s head was preserved and given to Alderaanian nobles 300 years later by an unknown smuggler, as tribute for Trask Ulgo\u0027s death."},{"b":6,"c":"DRSE_COMMANDER","f":"DRSE","n":"Sith Commander","v":"Sith Commander","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Generic former Republic officers who defected to the Sith; the Republic service is origin only, no extra faction.","bio":"Sith Commanders were former Republic officers that joined the Sith Empire during the Jedi Civil War when Darth Revan and Darth Malak turned on the Galactic Republic after the Battle of Malachor V. They held a higher authority than their officer counterparts."},{"b":6,"c":"DRSE_DARKJEDI","f":"DRSE","n":"Dark Jedi","v":"Dark Jedi|Dark Jedi (Female)|Dark Jedi Master","p":"generic","e":"","t":"generic legends era_old_republic dark_jedi fallen_jedi","w":"Generic fallen Jedi turned Dark Jedi; former Jedi status is origin only, no extra faction.","bio":"Many Jedi joined Revan and Malak when they joined the Mandalorian Wars, and almost all of them became Dark Jedi when the Jedi Civil War started. Jedi who hadn\u0027t followed them were captured and turned to the dark side, becoming Dark Jedi themselves."},{"b":6,"c":"DRSE_IRIDONIAN_MERC","f":"DRSE","n":"Iridonian Mercenary","v":"Iridonian Mercenary","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Hired hand paid by the Sith to abduct Manaan youth; not a member of the Sith Empire.","bio":"The Iridonian Mercenary was an Iridonian male active as a hired hand during the Jedi Civil War.  He was hired by the Sith Empire to abduct the youth of the Manaan natives, part of an initiative to grow a generation of Sith roots in Manaan\u0027s society and eventually take hold of the planet without need to ever attack."},{"b":6,"c":"DRSE_JORAK","f":"DRSE","n":"Jorak Uln","v":"Jorak Uln","p":"jorak uln","e":"","t":"named legends era_ancient era_old_republic sith male","w":"[corrigé] Headmaster of the Korriban Sith Academy under Exar Kun\u0027s Sith Empire (ASE) and later under Revan and Malak.","bio":"Jorak Uln was a Human male Sith Master and former head of the Korriban Sith Academy during the Jedi Civil War. Once the headmaster of the Sith Academy for Exar Kun\u0027s Sith Empire, after Exar Kun\u0027s fall and Darth Revan and Malak rose in his place, Jorak swore allegiance to the two Sith Lords. As time passed, Uln grew mentally unstable and was eventually overthrown by Uthar Wynn. Uln took up residence in the tomb of Tulak Hord where he would eventually re-unite with Revan. Revan, along with another student, Mekel, with their combined strength slew Jorak, which inspired Mekel to abandon the ways of the Sith."},{"b":6,"c":"DRSE_MALAK","f":"DRSE","n":"Darth Malak","v":"Darth Malak","p":"malak","e":"","t":"named legends era_old_republic sith male","w":"Darth Malak, Sith Lord and Revan\u0027s former apprentice; no extra faction.","bio":"Darth Malak was a Human male Sith Lord during the Jedi Civil War. After betraying Revan and claiming the title of Dark Lord for himself, Malak set his sights on Bastila Shan, hoping to capture her and turn her to the dark side. His plan succeeded for a short time, as Bastila was redeemed by Revan, who then went on to confront his former pupil. After a vicious duel, Revan emerged victorious, and as Malak\u0027s life slowly left him, he uttered his final words. \u0027\u0027And in the end, as the darkness takes me, I am nothing\u0027\u0027."},{"b":6,"c":"DRSE_MASTER","f":"DRSE","n":"Sith Master","v":"Sith Master","p":"generic","e":"","t":"generic legends era_old_republic sith","w":"Generic Sith Triumvirate master unit leading attacks; no extra faction.","bio":"Sith Masters were individuals who served the Sith Triumverate during the Dark Wars. Considered the more accomplished Sith, Sith Masters were in charge of leading attacks on Republic worlds, even performing complicated Sith rituals to give their forces a significant advantage in combat."},{"b":6,"c":"DRSE_NIHILUS","f":"DRSE","n":"Darth Nihilus","v":"Darth Nihilus","p":"nihilus","e":"","t":"named legends era_old_republic sith male","w":"Darth Nihilus, Triumvirate member under Traya; no extra faction.","bio":"Darth Nihilus was a Human male Sith Lord during the Dark Wars. Bound by an insatiable hunger to feast on all life through the Force, Nihilus was responsible for the deaths of many Jedi at the Conclave of Katarr. Along with Darth Sion, they overpowered their master, Darth Traya, and Nihilus stripped Traya of the Force. Eventually, at the Battle of Telos IV, Traya tricked Nihilus to attempt to feed from a false Jedi Academy. Weakened by his efforts, he was struck down by the combined strength of Meetra Surik, Visas Marr, and Canderous Ordo."},{"b":6,"c":"DRSE_OFFICER","f":"DRSE","n":"Sith Officer","v":"Sith Officer","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Bio text describes Imperial Academy officers of the Galactic Empire (GE), not Sith Empire officers; likely copied text. Flagged for review, no extra proposed.","bio":"Straight from the rigorous Imperial Acadamies scattered throughout the Empire, the Imperial Officers are high-class soldiers who are trained to lead the Emperor\u0027s legions, and are instilled with total loyalty to Palpatine and his ideology. While the Imperial Academies taught youth military traditions and zealous devotion to the Empire, these Academies were breeding grounds for hyper ruthless and ambitious men and women. Survival of the fittest. Whether assassinating their own Imperials to gain their higher rank, or facing the Rebellion 1,000 to 1, not even certain death will stop the Imperial Officer from gaining the Emperor\u0027s favor."},{"b":6,"c":"DRSE_REVAN","f":"DRSE","n":"Darth Revan","v":"Darth Revan","p":"revan","e":"JO TOR","t":"named legends era_old_republic sith fallen_jedi redeemed male","w":"[corrigé] Former Republic Jedi who fought in the Mandalorian Wars and was retrained as a Jedi after capture; hence JO and REP.","bio":"Darth Revan was a Human male Sith Lord who waged war on the galaxy during the Jedi Civil War, and Galactic War. Corrupted to the dark side by the Sith Emperor Vitiate, Revan waged war on the Republic until his eventual capture by Bastila Shan. After much debating by the Jedi Council, they ultimately decided in a controversial act to program Revan with a new identity and re-train him as a Jedi."},{"b":6,"c":"DRSE_ROGUE_DROID","f":"DRSE","n":"Mark VII Assassin Droid","v":"Mark VII Assassin Droid","p":"mark vii","e":"","t":"named legends era_old_republic non_sensitive","w":"Sentient assassin droid that fled its creators and lived freely; no extra faction.","bio":"Mark VII was a droid being developed by the Sith Empire specifically to hunt and kill Jedi.  Due to its complex adaptive programming, it developed sentience and fled its creators.  With Revan\u0027s help, its assassination protocols were deleted and it was able to flee Korriban forever and live out its existence in peace."},{"b":6,"c":"DRSE_SAUL","f":"DRSE","n":"Saul Karath","v":"Saul Karath","p":"saul karath","e":"","t":"named legends era_old_republic male non_sensitive","w":"Sith admiral under Revan and Malak; Mandalorian War veteran, but no sustained extra membership.","bio":"Saul Karath was a Human male Admiral of the Sith Empire during the Jedi Civil War. A veteran of the Mandalorian Wars, Saul served under Revan and Malak after the pair returned to known space as Sith Lords as an admiral. To prove his loyalty, Saul was ordered by Malak to lay waste to Telos IV, earning him not only a place in the Empire, but the loathing from his former prot g , Carth Onasi. After Revan found the fourth Star Map, Saul captured the Ebon Hawk, and was later killed by the combined efforts of Revan, Carth, and Bastila."},{"b":6,"c":"DRSE_SION","f":"DRSE","n":"Darth Sion","v":"Darth Sion|Darth Sion (Alternate)","p":"sion","e":"","t":"named legends era_old_republic sith male","w":"Darth Sion, Lord of Pain in the Triumvirate; no extra faction.","bio":"Darth Sion was a Human male Sith Lord during the Dark Wars.The Lord of Pain in the Sith Triumverate, Sion learned that through the dark side of the Force, he could escape death and rise again from death, at the cost of excruciating pain. Combining his strength with Darth Nihilus, the pair betrayed their master, Darth Traya, and took control of the Triumverate. When Traya returned, Sion was forced to serve her once again. He confronted Meetra Surik, and after being struck down time and time again, his will to live faded, and he finally allowed himself to die."},{"b":6,"c":"DRSE_SITH_COMMANDO","f":"DRSE","n":"Sith Commando","v":"Sith Commando","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Generic elite Sith Empire unit; no extra faction.","bio":"Sith Commandos were an elite unit within the military ranks of the Sith Empire during the Jedi Civil War and later the Dark Wars."},{"b":6,"c":"DRSE_TRAYA","f":"DRSE","n":"Darth Traya","v":"Darth Traya|Kreia","p":"kreia","e":"JO","t":"named legends era_old_republic sith fallen_jedi female","w":"Darth Traya is Kreia, a former exiled Jedi Master for a significant part of her story; hence JO.","bio":"Darth Traya was a Human female Sith Lord during the Dark Wars. As one that hated the Force, Traya was eager to train new wounds in the Force, taking on apprentices Darth Sion and Darth Nihilus. After being betrayed by her students, she eventually met Meetra Surik. Despite Traya\u0027s efforts to corrupt the Exiled Jedi to help destroy the Force itself, Traya was struck down by Surik inside the Trayus Core on Malachor V."},{"b":6,"c":"DRSE_TROOPER","f":"DRSE","n":"Sith Trooper","v":"Sith Trooper","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Generic Sith Empire foot soldier; no extra faction.","bio":"Sith Troopers were the foot soldiers of the Sith Empire during the Jedi Civil War. Former Republic forces in the beginning, later free people who followed Revan, Sith troopers were the primary infantry units for the Sith Triumvirate during the Dark Wars. The faceless and inhuman design of the Sith trooper armor they wore as well as their aggressive combat tactics gave a sense of fear that would often demoralize enemy forces into surrender."},{"b":6,"c":"DRSE_UTHAR","f":"DRSE","n":"Uthar Wynn","v":"Uthar Wynn","p":"uthar wynn","e":"","t":"named legends era_old_republic sith male","w":"Malak\u0027s Korriban academy head; bio says Humanoid, treated as human (unverified).","bio":"Uthar Wynn was a Humanoid male Sith Master who headed Malak\u0027s Sith Academy on Korriban during the Jedi Civil War. When the amnesiac  Revan returned to Korriban to find the Star Map, Uthar assigned tasks for Revan and the other students to perform to earn prestige.  After Revan gained the prestige needed to advance, Uthar took Revan into the tomb of Naga Sadow for his final trial. Goading Revan into striking down Yuthura, Revan instead attacked Uthar, with Yuthura by his side. With their combined efforts, Uthar was struck down."},{"b":6,"c":"DRSE_WARRIOR_MALAK","f":"DRSE","n":"Sith Warrior","v":"Sith Warrior","p":"generic","e":"","t":"generic legends era_old_republic sith","w":"Generic Sith Warrior combat specialist; no extra faction.","bio":"Sith Warriors, described as \u0027\u0027an unstoppable force of darkness\u0027\u0027, were combat specialists of the Sith Empire, and served as the champions of the battlefield, entrusted with the task of destroying the Empire s enemies and enforcing Sith domination across the galaxy. Trained to rely on the emotions of fear, anger, and hatred to improve their connection to the dark side of the Force, channeling its power through their bodies and purging weakness from themselves."},{"b":6,"c":"DRSE_YUTHURA","f":"DRSE","n":"Yuthura Ban","v":"Yuthura Ban","p":"yuthura ban","e":"JO","t":"named legends era_old_republic sith fallen_jedi redeemed female","w":"Twi\u0027lek former Jedi who abandoned the Order and was later redeemed; the Jedi Order is a significant part of her story.","bio":"Yuthura Ban was a Twi\u0027lek female Sith Apprentice during the Jedi Civil War. A struggling Jedi, Yuthura abandoned the Jedi Order and eventually found her way to the Sith Academy on Korriban. As time went on, Yuthura sought to overthrow Uthar Wynn and take over the academy, when she met Revan, she believed then was the time. After Revan completed the final trial in Naga Sadows tomb, she and Revan defeated Uthar Wynn. Afterwards, despite her claim that Revan was a friend to her,she fought Revan and lost. Shortly after, Revan redeemed her to the light side."},{"b":6,"c":"DW_BD_DEATHWATCH","f":"DW","n":"Death Watch Battle Droid","v":"Death Watch Battle Droid","p":"generic","e":"","t":"generic legends era_imperial non_sensitive","w":"Battle droids reprogrammed by Death Watch; droids possessed by the faction, not members. Legends status uncertain.","bio":"By the time of the Battle of Yavin, a number of Battle Droids came into the possession of the Death Watch organization. The droids were reprogrammed to serve the Death Watch organization and at some point prior to the Battle of Hoth, stood guard within a bunker that the Death Watch took over on the Forest Moon of Endor."},{"b":6,"c":"DW_DEATH_WATCH","f":"DW","n":"Death Watch Warrior","v":"Death Watch Warrior","p":"generic","e":"MANDO","t":"generic canon era_prequel era_imperial non_sensitive","w":"Death Watch warriors are Mandalorians; Mandalorian membership is a significant part of their story.","bio":"The Death Watch were a Mandalorian terrorist organization active during the Clone Wars with the sole purpose of returning the ancient warrior ways to Mandalore, which Duchess SAtine Kryze put a stop to at some point during her reign. Led by Pre Viszla, the Death Watch worked briefly with Count Dooku and the CIS in an unsuccessful attempt to usurp the throne from Satine. During the final years of the Clone Wars, the former Sith Lord Maul took control of Death Watch, splitting the faction in half. By the Galactic Civil War, all remnants of Death Watch had gone into hiding."},{"b":6,"c":"DW_VIZSLA","f":"DW","n":"Pre Vizsla","v":"Pre Vizsla","p":"pre vizsla","e":"MANDO","t":"named canon era_prequel male non_sensitive","w":"Mandalorian leader of Death Watch, a Mandalorian clan figure; Mandalore membership is significant.","bio":"Pre Vizsla was a Human male Mandalorian and leader of Death Watch prior to and during the Clone Wars. Refusing to accept Duchess Satine Kryze\u0027s pacifistic ways, Pre became leader of Death Watch, taking up an ancient Darksaber as a symbol of his leadership. During the Clone Wars, Pre Vizsla joined with Darth Maul, the two working together to overthrow Satine. Pre betrayed Maul, who then challenged him to a duel. After a vicious fight, Maul emerged victorious, decapitating Pre with his own Darksaber."},{"b":6,"c":"EA_GAULT","f":"EA","n":"Gault Rennow","v":"Gault Rennow","p":"gault rennow","e":"CRIM","t":"named legends era_old_republic male non_sensitive","w":"Devaronian con artist (born Tyresius Lokai) with a criminal career before joining EA; CRIM.","bio":"Gault Rennow was a Devaronian male who was active during the Great Galactic War, Cold War, and Second Great Galactic War. Originally known as Tyresius Lokai, Gault ran a con business on Tatooine, which earned himself a bounty on his head to be collected during the Great Hunt. Tracked to Tatooine by an unknown bounty hunter, Gault was bested and outmatched by the hunter. However, Gault swore allegiance to the hunter, no longer wanting to be living in fear constantly. Gault continued to work with the hunter until the Eternal Empire rose to power, in which he joined the alliance and helped them pull off a heist to rob the Empire of its riches."},{"b":6,"c":"EA_HK55","f":"EA","n":"HK-55","v":"HK-55","p":"hk-55","e":"","t":"named legends era_old_republic non_sensitive","w":"Assassin droid serving the Alliance; no extra faction.","bio":"HK-55 was an HK-series assassin droid that served the Alliance during the Revolt against the Eternal Empire. Owned by Koth Vortena, Koth, along with Sith Lord Lana Beniko worked together to free the Outlander from their carbonite prison. Programmed to serve the Outlander, HK-55 helped Beniko, the Outlander, and Koth Vortena with repairing the Gravestone. During the Battle of Asylum, Emperor Arcann and the Outlander engaged in a vicious duel, and HK-55 sacrificed itself in an effort to save them. HK-55\u0027s remains were later recovered and rebuilt, HK-55 was later captured by The Shroud, but was able to escape."},{"b":6,"c":"EA_HYLO","f":"EA","n":"Hylo Visz","v":"Hylo Visz","p":"hylo visz","e":"CRIM","t":"named legends era_old_republic female non_sensitive","w":"Mirialan smuggler who later handled Eternal Alliance underworld affairs; CRIM.","bio":"Hylo Visz was a Mirialan female who worked as a smuggler in the years prior to the Great Galactic War and for the Eternal Alliance after the Eternal Empire rose to power. Gaining fame after breaking a Mandalorian blockade disrupting important Republic trade routes, Hylo disappeared from the public eye, later re-emerging to assist the Eternal Alliance in all of their underworld affairs."},{"b":6,"c":"EA_JAKARRO","f":"EA","n":"Jakarro","v":"Jakarro","p":"jakarro","e":"","t":"named legends era_old_republic male non_sensitive","w":"Wookiee smuggler double-crossed by the Revanites; not a member of any extra faction.","bio":"Jakarro was a Wookiee male smuggler who was active during the Galactic War and was accompanied by the head of the droid C2-D4. Hired by the Order of Revan to make a delivery to their secret laboratory on Manaan, Jakarro was double-crossed and imprisoned until being freed by an individual who was investigating the Order of Revan\u0027s activities on Manaan. Working with the individual and later Lana Beniko and Theron Shan, Jakarro assisted the future Alliance Commander in taking out Darth Arkous and Colonel Darok, who were spies for the Revanites in both the Empire and Republic respectively. Despite getting revenge on the two, Jakarro was forced into hiding with Theron and Lana. Jakarro later worked with a coalition of the Republic and Empire on Yavin IV to defeat the rebirthed Revan, eventually taking part in a vicious battle against the crazed Jedi Master. After Revan\u0027s defeat, Jakarro resumed his operations until eventually finding his way into the ranks of the Eternal Alliance."},{"b":6,"c":"EA_KALIYO","f":"EA","n":"Kaliyo Djannis","v":"Kaliyo Djannis","p":"kaliyo djannis","e":"RSE CRIM","t":"named legends era_old_republic female non_sensitive","w":"Rattataki who worked with Cipher Nine in Imperial intelligence during the Cold War (RSE) and later as an anarchist terrorist (CRIM).","bio":"Kaliyo Djannis was a Rattataki female who worked with Cipher Nine of Imperial Intelligence during the Cold War and subsequent Galactic Wars. During her time with Cipher Nine, the pair worked together to dismantled multiple operations of the Republic\u0027s Strategic Information Service. After the Eternal Empire rose to power and the alliance against it was formed, Kaliyo made a name for herself as an anarchist against Zakuul\u0027s reign over the galaxy, plotting multiple terrorist attacks. Meeting with the alliance commander on Zakuul, the two carried out an attack to dismantle Zakuul\u0027s network, with Kaliyo having ulterior motives with her plans to cripple much of Zakuul\u0027s infrastructure. Later joining the Alliance, Kaliyo worked with former Havoc Squad commander Aric Jorgan to steal the Gemini Frequency which ultimately resulted in failure."},{"b":6,"c":"EA_LANA","f":"EA","n":"Lana Beniko","v":"Lana Beniko|Lana Beniko","p":"lana beniko","e":"RSE","t":"named legends era_old_republic sith female","w":"Sith Lord and advisor to Darth Arkous of the Sith Empire before joining the Alliance; RSE.","bio":"Lana Beniko was a Human female Sith Lord who served as the Eternal Alliance Commander\u0027s advisor during the Third Galactic War. Once an advisor to Darth Arkous, Lana and Theron Shan forged an alliance to uncover a hidden plot by the returned Revan and his followers to resurrect the Sith Emperor on Yavin IV. After Revan was defeated and the Eternal Empire rose to power, Lana led a rescue mission to save the individual later known as the Alliance Commander. During their fight against the Eternal Empire, Lana served the Alliance Commander faithfully including after the Eternal Alliance was dissolved."},{"b":6,"c":"EA_NICO","f":"EA","n":"Nico Okarr","v":"Nico Okarr","p":"nico okarr","e":"CRIM","t":"named legends era_old_republic male non_sensitive","w":"Human smuggler active in underworld trade; CRIM.","bio":"Nico Okarr was a Human male smuggler who was active in the years prior to and following the Great Galactic War. Shortly before the Empire\u0027s return, Nico was caught attempting to smuggle Sith Artifacts off of Korriban, and was briefly imprisoned until the arrival of the Sith, which Nico brought Satele Shan and Jace Malcolm to Coruscant to inform the Republic of the Empire\u0027s return, which Nico quickly left and disappeared for years until he was rediscovered on Zakuul by the Eternal Alliance\u0027s future commander. Nico challenged the commander to mix him a drink, and later offered to join the Alliance."},{"b":6,"c":"EA_SENYA","f":"EA","n":"Senya Tirall","v":"Senya Tirall","p":"senya tirall","e":"EE","t":"named legends era_old_republic force_user female","w":"Zakuul Knight and personal guard to Valkorion for a long stretch of service; EE.","bio":"Senya Tirall was a Human female who served as a Zakuul Knight, and later as personal guard to Valkorion of the Eternal Empire. During her career, Senya rose to the ranks of personal guard and later had a love affair with Valkorion, bearing three children, Thexan, Arcann, and Vaylin, the latter of whom she grew close with. After Valkorion brought Vaylin to Nathema for mental conditioning, Senya lost the affection of her children. Though still loyal to the Empire, Senya took assignments far away from the Empire\u0027s boundaries. After Arcann usurped his father\u0027s throne, Senya defected from the Eternal Empire and helped to form the Eternal Alliance with Lana Beniko, Theron Shan, and the individual known as The Outlander."},{"b":6,"c":"EA_THERON","f":"EA","n":"Theron Shan","v":"Theron Shan","p":"theron shan","e":"TOR","t":"named legends era_old_republic male non_sensitive","w":"[corrigé] Republic SIS agent before the Eternal Alliance; REP.","bio":"Theron Shan was a Human male who worked as an SIS Agent for the Galactic Republic during the Second Great Galactic War. Overseeing an assault on Korriban, Theron correctly deduced that the main focus of the attack was a robbery. Working with Sith Lord Lana Beniko, Theron helped uncover the return of the Revanites and Revan, his own ancestor. After the Eternal Empire rose to power, Theron and Lana assisted a veteran of the Galactic War to form the Eternal Alliance to overthrow Arcann and later Vaylin."},{"b":6,"c":"EA_TORIAN","f":"EA","n":"Torian Cadera","v":"Torian Cadera","p":"torian cadera","e":"MANDO","t":"named legends era_old_republic male non_sensitive","w":"Human Mandalorian shamed by his clan but still a Mandalorian; MANDO.","bio":"Torian Cadera was a Human male Mandalorian who worked with the Grand Champion of the Great Hunt during the Galactic War. Once shamed by his clan for his father\u0027s heritage, Torian made it his mission to track down his father and avenge himself. Working with the Grand Champion on Taris, who was hunting his father as a bounty target on the Blacklist, Torian confronted his father and the bounty was collected by the Grand Champion. Torian continued working with the Grand Champion up until the Eternal Empire rose to power. Working with Shae Vizla on Darvannis, Torian worked with the Alliance Commander to reclaim a weapons factory that was supplying the Eternal Empire. After the mission was successful, Torian joined the Alliance and continued to work with the alliance after Arcann was dethroned and Vaylin assumed his place as Empress."},{"b":6,"c":"EA_VETTE","f":"EA","n":"Vette","v":"Vette|Vette","p":"vette","e":"RSE CRIM","t":"named legends era_old_republic female non_sensitive","w":"[corrigé] Twi\u0027lek thief; CRIM.","bio":"Vette, born Ce\u0027na, was a Twi\u0027lek female thief who served Darth Baras\u0027s apprentice during the Cold War and subsequent Galactic Wars. Captured on Korriban while attempting to access an area in Naga Sadow\u0027s tomb, Vette was fitted with a shock collar and gifted to Baras\u0027s future apprentice. Vette continued working with Baras\u0027s apprentice, who later become the Emperor\u0027s Wrath. After the Eternal Empire rose to power, Vette found work with Gault Rennow, a notorious con artist, and worked with the Alliance commander to rob the Empire\u0027s treasury ship, the Gilded Star. After the heist was successful, Vette continued working with the Alliance after Arcann was dethroned and Vaylin assumed his place as Empress."},{"b":6,"c":"EA_VORTENA","f":"EA","n":"Koth Vortena","v":"Koth Vortena","p":"koth vortena","e":"EE","t":"named legends era_old_republic male non_sensitive","w":"Former Zakuul military officer who served the Eternal Empire for a significant period; EE.","bio":"Koth Vortena was a Human male who served the Alliance during the War against Zakuul. A former member of Zakuul\u0027s military, Koth deserted at some point after Arcann\u0027s rise to power after Emperor Valkorion\u0027s assassination. Working with Lana Beniko, HK-55, and T7-O1, the three freed an individual that would later become the Alliance Commander. Though Koth wanted Arcann off the throne, he strongly supported Zakuul and Valkorion, and refused to take part in any action that threatened Zakuul and its citizens."},{"b":6,"c":"EA_ZOOM","f":"EA","n":"Z0-0M","v":"Z0-0M","p":"z0-0m","e":"","t":"named legends era_old_republic non_sensitive","w":"Replicator droid running The Shroud\u0027s spy network; no extra faction proposed, affiliation of the network not confirmed.","bio":"Z0-0M was a reprogrammed replicator droid who was active during the Second Great Galactic War and subsequent conflicts. Assuming the identity of the the man known as The Shroud, Z0-0M murdered his predecessor and assumed his identity, taking full control over the Shroud\u0027s spy network at some point after the Makeb incident. After the Eternal Empire rose to power, Z0-0M captured the Alliance Commander\u0027s HK-55 unit, but during the memory wipe process, accidentally erased her own memory, causing her personality to shift completely. After helping HK escape her facility, Z0-0M eagerly joined the Alliance."},{"b":6,"c":"EE_ARCANN","f":"EE","n":"Arcann","v":"Arcann|Prince Arcann","p":"arcann","e":"","t":"named legends era_old_republic force_user male","w":"Prince and ruler of Zakuul; no extra faction.","bio":"Arcann was a Human male prince who ruled Zakuul after the Galactic War was halted. He was the son and heir of Valkorion, the Immortal Emperor of the Eternal Empire of Zakuul, who he eventually killed to seize the throne for himself. He led the Eternal Empire into conflict, crippling both the Republic and Sith Empire for many years, which caused volunteers from both factions to come together to form the Alliance. He ruled Zakuul with a firm hand until the Outlander, with the aid of Valkorion\u0027s spirit, defeated him."},{"b":6,"c":"EE_KNIGHT","f":"EE","n":"Zakuul Knight","v":"Zakuul Knight","p":"generic","e":"","t":"generic legends era_old_republic force_user","w":"Generic Zakuul Knight; Eternal Alliance membership came only after the Empire fell, so no extra.","bio":"The Knights of Zakuul were force sensitive warriors who served a number of military roles in the Eternal Empire, including policing and bodyguards to the Zakuul royal family. Differing in philosophies from the Jedi and Sith, the Knights believed that the Force was theirs to use in pursuit of justice. After the Eternal Empire was defeated, many Knights joined the Eternal Alliance to provide security for the Alliance\u0027s operations, while others deserted and joined Zakuulan splinter groups such as the Order of Zildrog."},{"b":6,"c":"EE_SKYTROOPER","f":"EE","n":"Skytrooper","v":"Skytrooper","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"[corrigé] Generic Skytrooper unit reprogrammed to serve the Eternal Alliance military after the Empire fell; EA.","bio":"The Skytrooper was the primary military force used by the Eternal Empire during their rise to power. Like the Eternal Fleet, the Skytroopers were programmed for absolute loyalty to the one who sat on the Eternal Throne. Each Skytrooper was equipped with a variety of weapons and a jetpack, allowing them to overwhelm their opposing force in combat. After Vaylin was dethroned and the Eternal Alliance was formed, the Skytroopers were reprogrammed to serve in the Eternal Alliance\u0027s military."},{"b":6,"c":"EE_THEXAN","f":"EE","n":"Thexan","v":"Thexan","p":"thexan","e":"","t":"named legends era_old_republic male non_sensitive","w":"Zakuul prince, twin of Arcann; no extra faction.","bio":"Thexan was a Human male prince prior to the halt of the Galactic War. The twin brother of Arcann, Thexan fought alongside him in early skirmishes against the Republic and Sith Empire. While Thexan remained level-headed despite Valkorion\u0027s indifference,  Arcann grew more and more frustrated. When Arcann eventually snapped and attempted to kill his father, Thexan attempted to stop his  brother. After a brief duel, Arcann struck down Thexan, which he regretted immediately afterward."},{"b":6,"c":"EE_VALKORION","f":"EE","n":"Valkorion","v":"Valkorion","p":"tenebrae","e":"ASE","t":"named legends era_ancient era_old_republic sith male","w":"Vitiate, the Sith Emperor (ASE), who later ruled as Valkorion over Zakuul.","bio":"Valkorion was a Human male who ruled as Emperor of Zakuul prior to, during, and after the Galactic War. The new identity of Vitiate, Valkorion ruled Zakuul for centuries, earning the name Immortal  Emperor. After offering a place at his side to the Outlander, he was struck down. Valkorion\u0027s spirit remained with the Outlander for a time. After reclaiming the Eternal Throne, Valkorion attempted to take control of the Outlander. With the combined efforts of  the Outlander and his family, Valkorion\u0027s spirit was eradicated. "},{"b":6,"c":"EE_VAYLIN","f":"EE","n":"Vaylin","v":"Vaylin","p":"vaylin","e":"","t":"named legends era_old_republic force_user female","w":"Force prodigy and Empress of Zakuul; no extra faction.","bio":"Vaylin was a Human female who served as Empress of Zakuul sometime after the halt of the Great Galactic War. A force prodigy, Vaylin was sent to Nathema to be conditioned to control her immense power with the Force. After Arcann was dethroned, Vaylin immediately assumed control of the throne with SCORPIO as her advisor. Launching a vicious assault on the Alliance base on Odessen, her efforts  were thwarted by the Outlander, who struck her down and later worked with her spirit to fight against Valkorion\u0027s spirit."},{"b":7,"c":"EWOK_EWOK","f":"EWOK","n":"Ewok","v":"Ewok","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Ewok species from Return of the Jedi; no other faction membership.","bio":"Ewoks were a small, furry biped species hailing from the Forest Moon of Endor. Ewoks were individuals that stood about one meter tall. They used spears, slings, and knives as weapons; they also used hang gliders as vehicles. Although skilled in forest survival and the construction of primitive technology, the Ewoks had yet to progress past stone-level technology when discovered by the Empire. They were quick learners, however, when exposed to advanced technology with simple mechanical processes and concepts."},{"b":7,"c":"EWOK_LOGRAY","f":"EWOK","n":"Logray","v":"Logray","p":"logray","e":"","t":"named canon era_imperial male non_sensitive","w":"Ewok chief shaman of the Bright Tree tribe in Return of the Jedi; no other faction membership.","bio":"Logray was an Ewok male who served as chief shaman of the Bright Tree tribe during the Galactic Civil War. After capturing Luke Skywalker, Han Solo, Chewbacca, and R2-D2, Logray ordered the rebels to be served as a banquet in C-3PO\u0027s honor, believing him to be a god. After the Battle of Endor, Logray officiated Han Solo and Leia Organa\u0027s wedding."},{"b":7,"c":"EWOK_PAPLOO","f":"EWOK","n":"Paploo","v":"Paploo","p":"paploo","e":"","t":"named canon era_imperial male non_sensitive","w":"Ewok warrior at the Battle of Endor (Return of the Jedi); single scene, no extra faction.","bio":"Paploo was an Ewok male who participated in the Battle of Endor during the Galactic Civil War. During the Rebel strike team\u0027s first attempt to destroy the shield generator, Paploo stole an imperial speederbike, leading all guards except one on a chase through the forest, allowing Han Solo and his team to infiltrate the bunker."},{"b":7,"c":"EWOK_TEEBO","f":"EWOK","n":"Teebo","v":"Teebo","p":"teebo","e":"","t":"named canon era_imperial male non_sensitive","w":"Ewok shaman and hunter in the Endor tribe; no extra faction.","bio":"Teebo was an Ewok male Shaman who lived on Endor with his tribe during the Galactic Civil War. Teebo participated in the Battle of Endor, using his skills as a hunter to catch the Imperial forces offguard. At some point after the Battle of Endor, Teebo was made a Shaman in his tribe."},{"b":7,"c":"EWOK_TOKKAT","f":"EWOK","n":"Tokkat","v":"Tokkat","p":"tokkat","e":"","t":"named canon era_imperial male non_sensitive","w":"Minor Ewok at Endor; no extra faction.","bio":"Tokkat was an Ewok male who participated in the Battle of Endor during the Galactic Civil War."},{"b":7,"c":"EWOK_WICKET","f":"EWOK","n":"Wicket W. Warrick","v":"Wicket W. Warrick","p":"wicket w. warrick","e":"","t":"named canon era_imperial male non_sensitive","w":"Ewok who helped the Rebels at Endor (Return of the Jedi); an ally for one story arc only, so no REB proposed.","bio":"Wicket Wystri Warrick was an Ewok make who participated in the Battle of Endor during the Galactic Civil War. First meeting Princess Leia Organa after her speederbike crashing, Wicket was cautious, but ended up befriending the rebel. Wicket later assisting Han Solo and his strike team on Endor, directing the group to the Death Star II\u0027s shield bunker, and participated in the bloody land battle afterward along with the rest of his tribe. At some point after the Battle, Wicket sired a child named Pommet, and decades later watched a First Order Star Destroyer be destroyed in orbit above his planet."},{"b":7,"c":"FE_JAGGED","f":"FE","n":"Jagged Fel","v":"Jagged Fel","p":"jagged fel","e":"GA","t":"named legends era_new_republic male non_sensitive","w":"[corrigé] Head of State of the Imperial Remnant before becoming Emperor of the Fel Empire (Wookieepedia: Jagged Fel), so IR is a genuine membership.","bio":"Jagged Fel was a Human male ace pilot and Head of State of the Imperial Remnant. An outcast from the Chiss, Fel was able to establish an alliance with the New Republic, and with Luke Skywalker\u0027s help, was made Head of State of the Imperial Remnant. Doing so kept the Moffs in line, and allowed a stable peace settlement between both factions. Eventually, Jagged Fel married Jaina Solo, and later on, became Emperor of the revived Empire, ruling as the first of the Fel dynasty."},{"b":7,"c":"FE_KNIGHT","f":"FE","n":"Imperial Knight","v":"Imperial Knight","p":"generic","e":"","t":"generic legends era_legacy force_user","w":"[corrigé] Imperial Knights were Force users who rejected both the light and dark side (identified as Gray Jedi), which fits UFU.","bio":"Imperial Knights were the elite guards of the Fel Empire and were strictly loyal to the Emperor. Though fully trained in the ways of the Force, the knights rejected the dark side of the Force. However, they did not strictly follow the light side either, and were usually identified as Gray Jedi by the New Jedi Order. The Imperial Knights continued to function through Darth Krayt\u0027s One Sith, and were dispatched to fight on the front lines against his forces on multiple occasions."},{"b":7,"c":"FE_SIGEL","f":"FE","n":"Sigel Dare","v":"Sigel Dare","p":"sigel dare","e":"","t":"named legends era_legacy female force_user","w":"Imperial Knight Master; cooperation with the Galactic Alliance and NJO was one mission, so no extra faction.","bio":"Sigel Dare was a Human female who served Emperor Roan Fel as an Imperial Knight Master during the Second Imperial Civil War. Fiercely loyal to the Fel Dynasty, Sigel worked with the Empire-in-Exile, along with the Galactic Alliance and New Jedi Order to topple Darth Krayt\u0027s rule of the galaxy on Coruscant. Sigel participated in Cade Skywalker\u0027s strike team to sabotage Coruscant\u0027s orbital defenses, allowing the coalition to take back the capital world."},{"b":7,"c":"FO_CARDINAL","f":"FO","n":"Cardinal","v":"Cardinal","p":"archex","e":"RES","t":"named canon era_sequel male non_sensitive","w":"Wookieepedia Archex (also Cardinal, CD-0922): former First Order captain who joined the Resistance on Batuu and died there, so RES is a genuine ally for his arc.","bio":"Cardinal was a Human male who served the First Order as a Captain during the Cold War and First Order-Resistance War. A rival to Captain Phasma, Cardinal attempted to undermine his rival at any cost, gaining a reputation for his skills in combat. Approaching Phasma demanding to know her involvement in General Brendol Hux\u0027s death, the two fought and Cardinal was critcally injured. Saved by Vi Moradi, Cardinal assisted the Resistance in setting up a base on the planet Batuu. When the First Order arrived, Archex sacrificed himself to transmit a message to the First Order telling them Batuu was not important, Archex died in the ensuing explosion."},{"b":7,"c":"FO_FLAMETROOPER","f":"FO","n":"Flametrooper","v":"Flametrooper","p":"generic","e":"","t":"generic canon era_sequel non_sensitive","w":"Specialized First Order stormtrooper variant; no extra faction.","bio":"Flametroopers were a specialized Stormtrooper who were equipped with a Flamethrower and other heavy weapons to burn down incoming threats or to cause incredible destruction to their environments."},{"b":7,"c":"FO_FO_FEMALE","f":"FO","n":"First Order Officer","v":"First Order Officer","p":"generic","e":"","t":"generic canon era_sequel female non_sensitive","w":"Generic First Order officer; no extra faction.","bio":"Officers of the First Order were individuals who held a position of authority and responsibility within the military of the First Order. Directly answering to the leading figures of the First Order, most notably Armitage Hux, officers would oversee the necessary preparations needed to continue the vision of Supreme Leader Snoke and later Kylo Ren."},{"b":7,"c":"FO_FO_MALE","f":"FO","n":"First Order Officer","v":"First Order Officer","p":"generic","e":"","t":"generic canon era_sequel male non_sensitive","w":"Generic First Order officer; no extra faction.","bio":"Officers of the First Order were individuals who held a position of authority and responsibility within the military of the First Order. Directly answering to the leading figures of the First Order, most notably Armitage Hux, officers would oversee the necessary preparations needed to continue the vision of Supreme Leader Snoke and later Kylo Ren."},{"b":7,"c":"FO_FO_PILOT","f":"FO","n":"TIE Pilot","v":"TIE Pilot","p":"generic","e":"","t":"generic canon era_sequel non_sensitive","w":"Generic First Order TIE pilot; no extra faction.","bio":"First Order TIE Pilots were individuals who specialized in flying the First Order\u0027s TIE fighters and their other variations."},{"b":7,"c":"FO_FO_TECH","f":"FO","n":"First Order Technician","v":"First Order Technician","p":"generic","e":"","t":"generic canon era_sequel non_sensitive","w":"Generic First Order technician; no extra faction.","bio":"First Order Technicians were individuals who served the First Order by keeping all of their equipment fully functional at all times."},{"b":7,"c":"FO_HUX","f":"FO","n":"Armitage Hux","v":"Armitage Hux","p":"armitage hux","e":"","t":"named canon era_sequel male non_sensitive","w":"Armitage Hux served only the First Order in this bio; no extra faction.","bio":"Armitage Hux was a Human male who served as a General for the First Order during the First Order-Resistance Conflict. Loyal to Supreme Leader Snoke, Hux was tasked alongside Kylo Ren and Captain Phasma to locate a map that would reveal Luke Skywalker\u0027s location. Hux would go on to oversee the destruction of the Hosnian System. After Starkiller Base was destroyed, Hux oversaw an attack on the Resistance base on D\u0027Qar. After Snoke\u0027s murder, Hux very reluctantly accepted Kylo Ren as the new Supreme Leader. However, his efforts to feed intel to the Resistance were quickly discovered by Admiral Pryde, who shot him dead."},{"b":7,"c":"FO_KYLO","f":"FO","n":"Kylo Ren","v":"Kylo Ren|Kylo Ren (Unmasked)|Ben Solo|Ben Solo","p":"ben solo","e":"JO SO","t":"named canon era_sequel male jedi sith redeemed","w":"Ben Solo trained under Luke at the Jedi Praxeum (JO) and later was the Sith-aligned Supreme Leader, so JO and SO fit; the redemption is in the bio.","bio":"Kylo Ren was a Human male Knight of Ren for the First Order during the First Order-Resistance Conflict. The son of Han Solo and Leia Organa, Kylo was seduced to the dark side shortly after being threatened by his uncle, Luke Skywalker. While hunting for a map to find Skywalker, Kylo met Rey, a young scavenger from Jakku. After being defeated on Starkiller Base, Rey attempted to turned Kylo from the dark side, where he in turn struck down Snoke, and took the title of Supreme Leader for himself. Long after discovering Exegol, Kylo was confronted by the memory of his father, which caused him to renounce the dark side and become Ben Solo once again."},{"b":7,"c":"FO_PHASMA","f":"FO","n":"Captain Phasma","v":"Captain Phasma","p":"phasma","e":"","t":"named canon era_sequel female non_sensitive","w":"Captain Phasma; full name not in bio and no other faction membership.","bio":"Captain Phasma was a Humam female Captain for the First Order during the First Order-Resistance Conflict. Fiercely loyal to the First Order, Phasma worked alongside Kylo Ren and General Hux in their efforts to locate a section of a map that led to Luke Skywalker. Aboard Starkiller base, Phasma was thrown into one of the base\u0027s trash compactors after being forced to lower the shields around the planet. Aboard the Supremacy, Phasma reunited with Finn who, after a brief duel, knocked her into the flaming bowels of the ship."},{"b":7,"c":"FO_PRAETORIAN","f":"FO","n":"Praetorian Guard","v":"Praetorian Guard","p":"generic","e":"","t":"generic canon era_sequel non_sensitive","w":"Snoke\u0027s personal guard; no extra faction.","bio":"Praetorian Guards were the elite guards of Supreme Leader Snoke, and were composed of eight human warriors divided into four pairs. Trained in many martial arts, including Ter s K si, and equipped with high-tech melee weapons that had the power to resist a Lightsaber, Praetorian Guards were formidable warriors, ready to defend, or avenge Snoke with ruthless efficiency. The guards aboard the Supremacy present during Snoke\u0027s assassination were killed by the combined efforts of Kylo Ren and Rey."},{"b":7,"c":"FO_PYRE","f":"FO","n":"Commander Pyre","v":"Commander Pyre","p":"pyre","e":"","t":"named canon era_sequel male non_sensitive","w":"Commander Pyre from Star Wars Resistance (Wookieepedia: Pyre, Thunderer); only First Order, no extra faction.","bio":"Commander Pyre was a Human male who served the First Order as a Commander during the First Order-Resistance War. Pyre worked closely with Agent Tierny to track down the Resistance, specifically the Colossus resistance cell. This gained the attention of General Armitage Hux and Supreme Leader Kylo Ren, who demanded the station be destroyed at any cost. However, during the battle against the Colossus, Pyre was killed when his flagship, the Thunderer, was destroyed."},{"b":7,"c":"FO_RAIDER","f":"FO","n":"Raider","v":"Raider","p":"generic","e":"","t":"generic canon era_sequel non_sensitive","w":"Specialized First Order stormtrooper variant serving Kylo Ren; no extra faction.","bio":"First Order Raiders were specialized stormtroopers that served Supreme Leader Kylo Ren and the First Order during the First Order-Resistance War. They were tasked by Kylo Ren to locate him Sith artifacts."},{"b":7,"c":"FO_SNOKE","f":"FO","n":"Supreme Leader Snoke","v":"Supreme Leader Snoke","p":"snoke","e":"SE","t":"named canon era_sequel male sith","w":"[corrigé] Snoke was engineered by Darth Sidious as a Sith creation (bio), so SO is a genuine membership.","bio":"Snoke was a male bred by Sith Alchemy who led as Supreme Leader of the First Order during the First Order-Resistance Conflict. Engineered by Darth Sidious, Snoke made it his mission to destroy the Jedi Order. After anointing Ben Solo as Kylo Ren, Snoke continued to lead the First Order. Fascinated by the young Rey, Snoke bridged the minds of Kylo and Rey to lure the girl to him. Aboard the Supremacy, Snoke was killed by Kylo Ren, who tricked Snoke into believing his intent was to kill Rey instead."},{"b":7,"c":"FO_STORM_TFA","f":"FO","n":"Stormtrooper","v":"Stormtrooper","p":"generic","e":"","t":"generic canon era_sequel non_sensitive","w":"Generic First Order stormtrooper; no extra faction.","bio":"The First Order Stormtroopers were the military infantry units of the First Order. With their stark white armor, this new generation of stormtroopers was one of many symbols that the First Order derived from the fallen Galactic Empire. Conscripted as soldiers, they were trained since birth, given unit designations instead of names, and subjected to years of propaganda to ensure their loyalty and obedience to the First Order and Supreme Leader Snoke."},{"b":7,"c":"FO_TEREX","f":"FO","n":"Agent Terex","v":"Agent Terex","p":"terex","e":"CRIM","t":"named canon era_sequel male non_sensitive","w":"Wookieepedia Terex: former stormtrooper who led the Ranc Gang criminal group and returned to it after leaving the First Order, so CRIM is a genuine membership.","bio":"Terex was a Human male who worked as an agent of the First Order Security Bureau during the cold war. Initially the leader of the Ranc gang, Terex learned of the First Order. Taking an interest in the possible new empire, Terex left his gang and joined the First Order within the Unknown Regions. During his time working for the First Order, Terex often found himself at odds with the Resistance\u0027s top pilot, Poe Dameron. However, after being defeated by Poe, Terex went rogue and tried his own mission to destroy the Resistance. Ultimately, Terex failed and was sentenced to work in the mines after convincing Captain Phasma of his loyalty. Ultimately, Terex freed himself of his imprisonment and abandoned the First Order, caring not if either side won the war that was to come."},{"b":7,"c":"FO_VICRUL","f":"FO","n":"Vicrul","v":"Vicrul","p":"vicrul","e":"","t":"named canon era_sequel male dark_jedi","w":"Knight of Ren, a Force-sensitive dark side harvester (Wookieepedia: Knights of Ren, Vicrul); no extra faction.","bio":"Vicrul was a Human male who served in the Knights of Ren prior to and during the First Order-Resistance War. Initially serving Ren, after Ren was killed by Ben Solo, Ben took up the name of Kylo Ren and took command over the Knights of Ren, including Vicrul. During the Battle of Exegol, Vicrul and the other Knights confronted a redeemed Ben Solo but all of the Knights, including Vicrul, were slain."},{"b":7,"c":"GA_ALEMA","f":"GA","n":"Alema Rar","v":"Alema Rar","p":"alema rar","e":"NR SO","t":"named legends era_new_republic era_legacy female fallen_jedi","w":"[corrigé] Twi\u0027lek pilot for the New Republic Defense Force Twin Suns squadron; NR is a genuine membership before the GA entry.","bio":"Alema Rar was a Twi lek blue skinned female born in 10 ABY on Ryloth and dead in 40 ABY on The Home. Rar and her sister, Numa, were of the poor part of the society and were soon enslaved, working as dancers to earn just enough to live. As Force sensitive beings, they were taken off Ryloth by Jedi Knight Daeshara cor to Luke Skywalker s Jedi Praxeum on Yavin IV. Both sisters fought the Yuuzhan Vong invasion. It was during the defense of New Plympto that her sister died, pushing Alema a little step towards the Dark Side. After that, she became a pilot for the Twin Suns squadron in the New Republic Defense Force, participating in many battles and most noticeably, the recapture or Coruscant, which put an end to the war. Years after this event, during the Dark Nest Crisis, Alema ran into a trap set by Lomi Plo in the Unknown Regions, who used the power of the Hive s Mind to manipulate her to join the Dark Side, using the death of her sister years before. Alema then became Plo s apprentice. She then fought against her former allies, including Leia Solo and Luke Skywalker, to whom she was mutilated. Alone after her master s death and the destruction of the Gorog nest she was part of, she became insane. Alema returned to the known regions in 40 ABY, waiting for the right time to avenge herself during the Second Galactic Civil War. She failed to do so and was killed by Jagged Fel."},{"b":7,"c":"GA_BEN_SKYWALKER","f":"GA","n":"Ben Skywalker","v":"Ben Skywalker|Ben Skywalker","p":"ben skywalker","e":"JO","t":"named legends era_new_republic era_legacy male jedi","w":"Jedi Knight trained at the Jedi Praxeum and a member of the New Jedi Order (bio), so JO is a genuine membership.","bio":"Ben Skywalker was a Human Male Jedi Knight who was a member of the New Jedi Order by the time of the Dark Nest Crisis. The son of Luke and Mara Jade Skywalker, Ben was highly force sensitive and received training at the Jedi Praxeum initially by Jacen Solo. After Jacen\u0027s fall to the dark side, Ben attempted to kill Jacen in an effort to avenge the murder of his mother, but his attempts ultimately failed. At some point after Caedus\u0027s defeat, Luke Skywalker was exiled by Chief of State Natasi Daala, and Ben accompanied him. Later on, Ben would fight alongside his father and the Lost Tribe of Sith against the entity known as Abeloth. "},{"b":7,"c":"GA_CADE","f":"GA","n":"Cade Skywalker","v":"Cade Skywalker","p":"cade skywalker","e":"JO BH","t":"named legends era_legacy male fallen_jedi redeemed","w":"Cade was trained as a Jedi (JO) and worked as a Bounty Hunter and Smuggler (bio), so JO and BH are genuine memberships.","bio":"Cade Skywalker was a Human male Jedi, Sith Apprentice, Bounty Hunter, and Smuggler during the Legacy Era. Born on Ossus, and trained by his father\u0027s former apprentice, Cade was a promising Jedi until his father was kille
