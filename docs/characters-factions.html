":"Revanite Pursuer","p":"generic","e":"","t":"generic legends era_old_republic force_user male","w":"Generic Revanite cultist; Legends (SWTOR). Individual name not given in bio.","bio":"Revanites were cultists of the Order of Revan which was active during the Cold War and Great Galactic Wars. Attempting to follow their teachings of Revan, the Revanites attempted to strike a balance within themselves and the Sith Empire. Though Revan was aware of the cult\u0027s existence, he at first dismissed them, but after his defeat on the Foundry and fall to the dark side, recruited the Revanites. With their assistance, Revan plotted to resurrect and destroy the Sith Emperor Vitiate on Yavin IV."},{"b":17,"c":"REV_REVANITE2","f":"REV","n":"Revanite Vindicator","v":"Revanite Vindicator","p":"generic","e":"","t":"generic legends era_old_republic force_user male","w":"Generic Revanite cultist; Legends (SWTOR). Individual name not given in bio.","bio":"Revanites were cultists of the Order of Revan which was active during the Cold War and Great Galactic Wars. Attempting to follow their teachings of Revan, the Revanites attempted to strike a balance within themselves and the Sith Empire. Though Revan was aware of the cult\u0027s existence, he at first dismissed them, but after his defeat on the Foundry and fall to the dark side, recruited the Revanites. With their assistance, Revan plotted to resurrect and destroy the Sith Emperor Vitiate on Yavin IV."},{"b":17,"c":"REV_REVANITE3","f":"REV","n":"Revanite Avenger","v":"Revanite Avenger","p":"generic","e":"","t":"generic legends era_old_republic force_user male","w":"Generic Revanite cultist; Legends (SWTOR). Individual name not given in bio.","bio":"Revanites were cultists of the Order of Revan which was active during the Cold War and Great Galactic Wars. Attempting to follow their teachings of Revan, the Revanites attempted to strike a balance within themselves and the Sith Empire. Though Revan was aware of the cult\u0027s existence, he at first dismissed them, but after his defeat on the Foundry and fall to the dark side, recruited the Revanites. With their assistance, Revan plotted to resurrect and destroy the Sith Emperor Vitiate on Yavin IV."},{"b":18,"c":"REV_REVANITE4","f":"REV","n":"Revanite Champion","v":"Revanite Champion","p":"generic","e":"","t":"generic legends era_old_republic force_user","w":"Revanite cultist champion of the Order of Revan; REV is the group itself, no extra faction in bio","bio":"Revanites were cultists of the Order of Revan which was active during the Cold War and Great Galactic Wars. Attempting to follow their teachings of Revan, the Revanites attempted to strike a balance within themselves and the Sith Empire. Though Revan was aware of the cult\u0027s existence, he at first dismissed them, but after his defeat on the Foundry and fall to the dark side, recruited the Revanites. With their assistance, Revan plotted to resurrect and destroy the Sith Emperor Vitiate on Yavin IV."},{"b":18,"c":"REV_REVANITE5","f":"REV","n":"Revanite Convert","v":"Revanite Convert","p":"generic","e":"","t":"generic legends era_old_republic force_user","w":"Revanite cultist convert; REV is the group itself, no extra faction in bio","bio":"Revanites were cultists of the Order of Revan which was active during the Cold War and Great Galactic Wars. Attempting to follow their teachings of Revan, the Revanites attempted to strike a balance within themselves and the Sith Empire. Though Revan was aware of the cult\u0027s existence, he at first dismissed them, but after his defeat on the Foundry and fall to the dark side, recruited the Revanites. With their assistance, Revan plotted to resurrect and destroy the Sith Emperor Vitiate on Yavin IV."},{"b":18,"c":"ROT_BANE","f":"RoT","n":"Darth Bane","v":"Darth Bane|Darth Bane (Apprentice)|Darth Bane (Spirit)","p":"bane","e":"SO","t":"named legends era_ancient sith male","w":"Bio: member of Lord Kaan\u0027s Brotherhood of Darkness before founding the Rule of Two (SO for the Sith brotherhood); birth name not in bio, not checked on Wookieepedia","bio":"Darth Bane was a Human male Sith Lord during the Old Republic. In service to Lord Kaan\u0027s Brotherhood of Darkness, Bane quickly rose to prominence, and over time lost trust in them. Offered guidance from Darth Revan\u0027s holocron, Bane created the Rule of Two, which permitted for only two Sith at a time, a Master and an Apprentice. His power grown, Bane wiped out the Brotherhood and took Zannah as his apprentice. As was the way of the Sith and Rule of Two, Bane was struck down by Zannah, and she continued what Bane started."},{"b":18,"c":"ROT_COGNUS","f":"RoT","n":"Darth Cognus","v":"Darth Cognus","p":"cognus","e":"","t":"named legends era_ancient sith female","w":"Bio: Iktotchi Huntress turned Sith apprentice of Bane; no other faction in bio, not checked on Wookieepedia","bio":"Darth Cognus was a female Iktotchi Sith Lord who rose to prominence as the successor to Darth Zannah during the post–New Sith Wars era. Originally known only as the Huntress, the Huntress built a record as an assassin before being hired by Princess Serra of Doan to locate Darth Bane. She successfully ambushed and captured the Sith Lord, delivering him to the Stone Prison. Sensing that her destiny was tied to Bane, she remained on Doan, later submitting to him and requesting Sith training. Bane accepted and brought her to Ambria, where she cast aside her former identity and took the name Darth Cognus, reflecting her ability to perceive and influence future events. When Bane and his apprentice Darth Zannah dueled for mastery, Cognus pledged herself to the victor; Zannah prevailed, and Cognus became her apprentice. In the years that followed, Cognus eventually rose to the rank of Sith Master under the Rule of Two. She later trained Darth Millennial, though she ultimately renounced him for rejecting Bane’s doctrine."},{"b":18,"c":"ROT_DARTH_MAUL","f":"RoT","n":"Darth Maul","v":"Darth Maul|Darth Maul (Shirtless)","p":"maul","e":"CD DW","t":"named canon era_prequel sith male","w":"[corrigé] Founded Crimson Dawn (CD) per bio; Sidious\u0027 apprentice in the Sith Order (SO); canon film and Clone Wars/Rebels appearances","bio":"Darth Maul was a Dathomirian Zabrak male Sith Apprentice during the Naboo crisis, Clone Wars, and Galactic Civil War. Taken from his village at a young age by Sidious, Maul trained in the ways of the dark side. During the Naboo Crisis, Maul was tasked with capturing Queen Amidala but failed, and after killing Qui-Gon Jinn, was bisected by Obi-Wan Kenobi. 10 years later, Maul returned and created the criminal organization, Crimson Dawn. Tracking Obi-Wan Kenobi to Tatooine, Maul was struck down after a very brief duel against his old enemy. Dying, Maul proclaimed that the person Kenobi was protecting would avenge them, and he passed away."},{"b":18,"c":"ROT_PLAGUEIS","f":"RoT","n":"Darth Plagueis","v":"Darth Plagueis","p":"plagueis","e":"","t":"named canon era_prequel sith male","w":"Canon film Sith Lord (Revenge of the Sith) and Palpatine\u0027s master; Rule of Two only","bio":"Darth Plagueis was a Muun male Sith Lord sometime before the Naboo Crisis. Obsessed with immortality, Plagueis sought to create life using midi-chlorian manipulation, possibly even leading to the procreation of the Chosen One, Anakin Skywalker, with Darth Sidious as his apprentice. As was the way of the Rule of Two, Sidious struck down his master, claiming the title of Dark Lord of the Sith. Years later, during the Clone Wars, Palpatine would tell the tale of Darth Plagueis to Anakin Skywalker, further tempting him to the dark side."},{"b":18,"c":"ROT_TENEBROUS","f":"RoT","n":"Darth Tenebrous","v":"Darth Tenebrous","p":"tenebrous","e":"","t":"named legends era_prequel sith male","w":"Dark Lord of the Sith before Plagueis per bio; Rule of Two only; Legends novels","bio":"Darth Tenebrous was a Bith male Sith Lord who worked in the shadows as the Dark Lord of the Sith in the years prior to the Naboo Crisis. While searching for an apprentice, Tenebrous worked in the public eye as Rugess Nome, a starship designer, manipulating the Muun Caar Damask into having a child, whom Tenebrous took as his apprentice, Darth Plagueis. Though Plagueis would ultimately strike down Tenebrous, taking the mantle of Dark Lord for himself, Tenebrous would attempt to continue his reign by possessing the Chosen One once he was discovered. However, Tenebrous\u0027s spirit was trapped within an infinite reliving of his own death."},{"b":18,"c":"ROT_ZANNAH","f":"RoT","n":"Darth Zannah","v":"Darth Zannah","p":"zannah","e":"","t":"named legends era_ancient sith female","w":"Bane\u0027s apprentice and successor in the Rule of Two; no other faction in bio","bio":"Darth Zannah was a Human Female Sith Lord who served as Darth Bane\u0027s Sith Apprentice in the aftermath of the decimation of Lord Kaan and the Brotherhood of Darkness. As the first apprentice in the Rule of Two, Zannah dived deep into the arts of the dark side, aided by her master, Darth Bane. Though years had passed, Bane grew concerned about his apprentice after her failed attempt on his life. However, Zannah would later prove victorious and was successful in defeating Bane, taking the mantle of Dark Lord of the Sith herself, with a new apprentice, Darth Cognus."},{"b":18,"c":"RSE_2V_R8","f":"RSE","n":"2V-R8","v":"2V-R8","p":"2v-r8","e":"","t":"named legends era_old_republic non_sensitive","w":"Protocol droid; Eternal Alliance service is mentioned in bio only briefly, not significant","bio":"2V-R8 was a model of a Seneschal-series protocol droid which was owned by a number of notable individuals in the Sith Empire during the Cold War and Second Great Galactic War. Its primary purpose was to maintain the ships of the individuals and ensure the utmost comfort of the crew members. A 2V-R8 droid also found itself in the service of the Eternal Alliance."},{"b":18,"c":"RSE_ACHARON","f":"RSE","n":"Darth Acharon","v":"Darth Acharon","p":"acharon","e":"","t":"named legends era_old_republic sith male","w":"Dark Council member of RSE; no other faction in bio","bio":"Darth Acharon was a Human male Sith Lord who served on the Dark Council during the Cold War and Second Great Galactic War. Dispatched to Corellia to help oversee the battle, Acharon engaged a Republic strike team while defending the weapon known as the Ion Wall. Acharon was killed in the ensuing battle."},{"b":18,"c":"RSE_ACINA","f":"RSE","n":"Empress Acina","v":"Empress Acina","p":"acina","e":"EE","t":"named legends era_old_republic sith female","w":"Bio: took the Empress title under the Eternal Empire (EE) and swore loyalty to Arcann","bio":"Acina was a Human female who reigned as Empress of the Resurgent Sith Empire after the Eternal Empire rose to power. At some point after Vitiate\u0027s supposed death, Acina was appointed to the Dark Council as she led efforts to collect the Seeds of Rage Sith Artifacts the Dread Masters placed across the galaxy. After the Eternal Empire rose to power, Acina took the mantle of Empress unopposed and swore loyalty to Arcann. After the Eternal Alliance was declared, Acina was killed during the campaign on Iokath as she attempted to take command of an Iokath Superweapon."},{"b":18,"c":"RSE_ANGRAL","f":"RSE","n":"Darth Angral","v":"Darth Angral","p":"angral","e":"","t":"named legends era_old_republic sith male","w":"Sith Lord of RSE; no other faction in bio","bio":"Darth Angral was a Human male Sith Lord who participated in the Great Galactic War and the Cold War. During the Cold War, Angral sent his son, Tarnis to infiltrate Coruscant and steal a prototype superweapon known as the Planet Prison. Tarnis\u0027s efforts failed and he was killed by a Jedi Knight who would later be known as the Hero of Tython. Swearing revenge on the Knight, Angral continued developing his superweapon, the Desolator, eventually turning his sights on the Jedi homeworld of Tython. Confronted by the same Jedi who killed his son and Kira Carsen, Angral was slain after a vicious duel."},{"b":18,"c":"RSE_ASHARA","f":"RSE","n":"Ashara Zavros","v":"Ashara Zavros","p":"ashara zavros","e":"JO","t":"named legends era_old_republic sith fallen_jedi female","w":"Togruta Jedi Padawan (JO) before swearing to Darth Nox; fallen Jedi, not checked on Wookieepedia","bio":"Ashara Zavros was a Togruta female Jedi Padawan who fought alongside Darth Nox during the Cold War and Galactic War. A headstrong Padawan, Ashara would often seek to take a violent approach toward combatting the Sith Empire, often disregarding the abilities of her fellow pupils. After reluctantly agreeing to help the future Darth Nox capture a ghost of her ancestor, Ashara abandoned the Jedi and swore allegiance to Nox, but refused to give in fully to the dark side, claiming she would always be a Jedi."},{"b":18,"c":"RSE_BARAS","f":"RSE","n":"Darth Baras","v":"Darth Baras","p":"baras","e":"","t":"named legends era_old_republic sith male","w":"Dark Council member; RSE only","bio":"Darth Baras was a Human male Sith Lord who served on the Dark Council during the Cold War. A cold and calculating individual, Baras took on an apprentice from the Korriban Academy who would go on to become the Emperor\u0027s Wrath. Dispatching his apprentice to protect his spy network and eliminate his biggest threats, Baras set a plan in motion to become the Voice of the Emperor, and ultimately Emperor of the Sith Empire. When his plans were brought to light to the Emperor\u0027s Wrath by Servants One and Two, Baras was later confronted in the Dark Council chamber by his former apprentice and slain."},{"b":18,"c":"RSE_BESTIA","f":"RSE","n":"Dread Master Bestia","v":"Dread Master Bestia","p":"bestia","e":"","t":"named legends era_old_republic sith female","w":"Dread Master; the Dread Masters are their own sect, no listed faction code fits","bio":"Bestia was a Human female Sith Lord who served with the Dread Masters during the Great Galactic War and Cold War. The Dread Masters were a sect of powerful Sith Sorcerors capable of performing impressive feats as the war with the Republic raged on, destroying entire fleets and driving entire armies mad with terror. After Vitiate\u0027s death, the Dread Masters turned away from the Empire and caused chaos across the galaxy against both major factions. Bestia was confronted in the Dread Master\u0027s palace on Oricon and was ultimately slain."},{"b":18,"c":"RSE_BRONTES","f":"RSE","n":"Dread Master Brontes","v":"Dread Master Brontes","p":"brontes","e":"","t":"named legends era_old_republic sith female","w":"Dread Master; no listed faction code fits","bio":"Brontes was a Human female Sith Lord and member of the Dread Masters during the Great Galactic War and subsequent conflicts. Prior to the Treaty of Coruscant, Brontes, along with the other remaining Dread Masters, were imprisoned on Belsavis until they were later freed by a member of the Sith Empire during the outbreak of the Second Great Galactic War. After the Sith Emperor Vitiate\u0027s demise, the Dread Masters broke free of the Empire, deciding to take control of the galaxy themselves. On the moon of Oricon, within the Dread Palace, Brontes met her end during the Republic and Empire\u0027s campaign to end the Dread Masters threat upon the galaxy."},{"b":18,"c":"RSE_CALPHAYUS","f":"RSE","n":"Dread Master Calphayus","v":"Dread Master Calphayus","p":"calphayus","e":"","t":"named legends era_old_republic sith male","w":"Dread Master; the Republic strike team link in bio is a survival/ally moment, not membership","bio":"Calphayus was a Human male Sith Lord and member of the Dread Masters during the Great Galactic War and subsequent conflicts. Prior to the Treaty of Coruscant, Calphayus, along with the other remaining Dread Masters, were imprisoned on Belsavis until they were later freed by a member of the Sith Empire during the outbreak of the Second Great Galactic War. After the Sith Emperor Vitiate\u0027s demise, the Dread Masters broke free of the Empire, deciding to take control of the galaxy themselves. On the moon of Oricon, within the Dread Palace, Calphayus was the only survivor of the Republic and Empire\u0027s campaign to end the Dread Masters. Calphayus eventually found his way in the Republic\u0027s Strike Team camp, where he faced judgment."},{"b":18,"c":"RSE_CHRATIS","f":"RSE","n":"Darth Chratis","v":"Darth Chratis","p":"chratis","e":"","t":"named legends era_old_republic sith male","w":"Sith instructor at the Korriban academy; no other faction in bio","bio":"Darth Chratis was a near-human male Sith Lord during the Galactic Cold War. He was a cruel and brutal teacher to the acolytes under his mentorship, leading him to be controversial among his peers at the academy.  After a temporary alliance with Satele Shan to defeat the force of Fastbreeder combat droids created by Lema Xandret, Chratis was struck down by her daughter - Eldon Ax, his very own apprentice."},{"b":18,"c":"RSE_DECIMUS","f":"RSE","n":"Darth Decimus","v":"Darth Decimus","p":"decimus","e":"","t":"named legends era_old_republic sith male","w":"Dark Council member; led the Corellia invasion for RSE only","bio":"Darth Decimus was a Human male Sith Lord who served on the Dark Council during the Great Galactic War. During the Second Great Galactic War, Decimus led the invasion of Corellia, working with a notable imperial citizen to help bring Corellia to the Empire. While Decimus\u0027s campaign was initially successful, the Republic later attacked and recaptured Corellia, which ultimately resulted in Decimus\u0027s demise."},{"b":18,"c":"RSE_DESOLOUS","f":"RSE","n":"Darth Desolous","v":"Darth Desolous","p":"desolus","e":"","t":"named legends era_ancient sith fallen_jedi male","w":"Pau\u0027an former Jedi who became a Sith; the later Jedi simulation role is not membership","bio":"Darth Desolus was a Pau\u0027an male who reigned as a Sith Lord thousands of years before the Clone Wars. Once a promising Jedi, Desolous was expelled from the Jedi Order. Swearing revenge, Desolous amassed an army of followers to combat the Jedi, seemingly defeating almost 2,000 Jedi Knights before his death. Desolous continued to serve the Jedi Order as a simulation, pitting aspiring Jedi Knights in a trial of skill. Desolous\u0027s name was immortalized by the Sith Eternal Cult, naming a legion of Sith Troopers after him."},{"b":18,"c":"RSE_ELEENA","f":"RSE","n":"Eleena Daru","v":"Eleena Daru","p":"eleena daru","e":"","t":"named legends era_old_republic female non_sensitive","w":"Companion and fighter of Malgus; RSE only","bio":"Eleena Daru was a female Twi\u0027lek who served Darth Malgus as a close agent and confidant as well as his romantic partner.  She accompanied him, fearlessly fighting at his side during the Sacking of Coruscant.  Their relationship ultimately ended when her life did, with Malgus tearfully reminding her what she means to him before killing her himself, unable to live with the possibility of one of his enemies doing it first."},{"b":18,"c":"RSE_ERADICATOR","f":"RSE","n":"Sith Eradicator","v":"Sith Eradicator","p":"generic","e":"","t":"generic legends era_old_republic sith","w":"Generic Sith warrior unit; no extra faction","bio":"Sith Eradicators were present at the Battle of Alderaan and the Sacking of Coruscant. Like Sith Warriors, Eradicators channeled the dark side of the Force, and turned themselves into warriors on the battlefield."},{"b":18,"c":"RSE_HADRA","f":"RSE","n":"Darth Hadra","v":"Darth Hadra","p":"hadra","e":"","t":"named legends era_old_republic sith female","w":"Dark Council member; RSE only","bio":"Darth Hadra was a Human female Sith Lord who served on the Dark Council during the Second Great Galactic War. After the outbreak of the Second Great Galactic War, Hadra, along with Darth Acharon and Darth Decimus travelled to Corellia to bring the world under the control of the Empire. During the Republic\u0027s efforts to take back the Legislature building, Hadra was killed in the ensuing fight."},{"b":18,"c":"RSE_HONOR_GUARD","f":"RSE","n":"Dark Honor Guard","v":"Dark Honor Guard","p":"generic","e":"","t":"generic legends era_old_republic sith","w":"Generic elite guard unit of the Empire; no extra faction","bio":"The Dark Honor Guard were a division of elite soldiers within the Resurgent Sith Empire who were tasked with guarding the Sith Emperor Vitiate and areas the Emperor deemed important with their lives. Though the Honor Guards were not Force Sensitive, they were still mentally linked with the Sith Emperor and could draw upon his strength when in close proximity to him to aid them in battle. A sect of Honor Guards was formed after Darth Malgus declared his new empire, which consisted of Force Sensitives and even alien beings."},{"b":18,"c":"RSE_IMPTROOPER","f":"RSE","n":"Imperial Trooper","v":"Imperial Trooper","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Generic infantry trooper; no extra faction","bio":"Imperial Troopers, also known as Sith troopers, were the infantry units of the reconstituted Sith Empire\u0027s army. The soldiers served as the ground invasion force for the Imperial Military\u0027s campaigns of conquest, and worked to defend the Empire\u0027s holdings during the Great Galactic War and Cold War. Imperial soldiers were conscripted members of the Enlisted class, a social caste within the Empire destined to work in the military under the orders of their Sith overlords."},{"b":18,"c":"RSE_INQUISITOR","f":"RSE","n":"Sith Inquisitor","v":"Sith Inquisitor","p":"generic","e":"","t":"generic legends era_old_republic sith","w":"Generic Force-user class; no extra faction","bio":"Sith Inquisitors were a class of powerful Force-wielders within the Sith Empire, operating primarily within the upper echelons and political circles. Inquisitors specialized in Force abilities as opposed to martial might, and many would devote much time to researching skills to survive in the cutthroat Sith political environment."},{"b":18,"c":"RSE_JADUS","f":"RSE","n":"Darth Jadus","v":"Darth Jadus","p":"jadus","e":"","t":"named legends era_old_republic sith male","w":"Dark Council member plotting a coup against the Dark Council; RSE only","bio":"Darth Jadus was a Human male Sith Lord and member of the Dark Council during the Cold War. Overseeing the efforts of Imperial Intelligence, Jadus soon grew disillusioned with the Empire after constantly witnessing the civil wars amongst his fellow Dark Council members and the overall xenophobia of the Empire, Jadus attempted to throw a coup to overthrow the Dark Council and reshape the Empire in his image. However, Jadus disappeared from known space after the Sith Emperor Vitiate\u0027s defeat, continuing his plot."},{"b":18,"c":"RSE_JAESA","f":"RSE","n":"Jaesa Willsaam","v":"Jaesa Willsaam|Jaesa Willsaam (Jedi)","p":"jaesa willsaam","e":"JO","t":"named legends era_old_republic sith fallen_jedi female","w":"Trained as Jedi Padawan of Nomen Karr (JO) before becoming a Sith apprentice","bio":"Jaesa Willsaam was a Human female Sith Apprentice who fell to the dark side and served the Emperor\u0027s Wrath during the Cold War and Second Great Galactic War. Born on Alderaan and placed in service as a Handmaiden, Jaesa was discovered and was taken for training as a Jedi, eventually finding herself as the Padawan of Jedi Master Nomen Karr. Born with a rare ability to sense a person\u0027s true nature, Nomen Karr worked with Jaesa to expose a number of spies within the Republic placed by his rival, Darth Baras. Discovering the existence of Jaesa, Darth Baras dispatched his apprentice, the future Emperor\u0027s Wrath, to track down Jaesa and eliminate her. Confronting the apprentice on Nal Hutta after her master\u0027s defeat, Jaesa was ultimately overpowered by the warrior and pledged her allegiance to the warrior, murdering her former master and embracing the dark side. Jaesa continued to serve the warrior faithfully until the rise of the Eternal Empire, which then she embarked on her own path after her master\u0027s disappearance."},{"b":18,"c":"RSE_KHEM","f":"RSE","n":"Khem Val","v":"Khem Val","p":"khem val","e":"","t":"named legends era_ancient sith male","w":"Dashade shadow assassin serving Tulak Hord; no other faction in bio","bio":"Khem Val was a male Dashade warrior who served under Sith Lord Tulak Hord.  He was known as the greatest Shadow Assassin until meeting Hord, who bested him in single combat, winning Val\u0027s loyalty.  Centuries later, Lord Kallig\u0027s descendent - then a mere acolyte - would do the very same, prompting Val to allow them to take Hord\u0027s place as his master."},{"b":18,"c":"RSE_LARITH","f":"RSE","n":"Lord Larith","v":"Lord Larith","p":"larith","e":"","t":"named legends era_old_republic sith male","w":"Sith Lord of RSE; no other faction in bio","bio":"Lord Larith was a male Sith Lord of the Resurgent Sith Empire during the Cold War and Galactic War. He helped provide supplies to Imperial citizens, readying them for combat against potentially dangerous foes."},{"b":18,"c":"RSE_MALAVAI","f":"RSE","n":"Malavai Quinn","v":"Malavai Quinn","p":"malavai quinn","e":"","t":"named legends era_old_republic male non_sensitive","w":"Imperial officer serving Baras\u0027s apprentice; no extra faction in bio","bio":"Malavai Quinn was a human male Imperial Officer during the Great Galactic War.  Coming from a military family, Quinn had aspirations of serving the Empire like his father before him.  His tactical expertise landed him on a war-torn backwater planet Balmorra when his superior court martialed him for insubordination.  After assisting the apprentice of Darth Baras turn the tide on Balmorra, Baras allowed Quinn to choose his station. He decided to accompany the apprentice, playing the part of a loyal follower;  However, his loyalty to Baras always came first as was shown by him ambushing Baras\u0027s former apprentice in an attempt to kill them at Baras\u0027s request. However, after being defeated by the Emperor\u0027s Wrath and his life spared, Quinn swore his full allegience to the Emperor\u0027s Wrath."},{"b":18,"c":"RSE_MALGUS","f":"RSE","n":"Darth Malgus","v":"Darth Malgus|Darth Malgus","p":"veradun","e":"","t":"named legends era_old_republic sith male","w":"Known as Darth Malgus; bio gives birth name Veradun, used as key","bio":"Darth Malgus was a Human male Sith Lord during the Great Galactic War, Cold War, and Galactic War. Born as Veradun, Malgus was brought to the Sith Academy at an early age, and quickly became a successful student and commander. Malgus led an army of Sith to the Jedi Temple on Coruscant, and struck down Jedi Master Ven Zallow after a brutal duel. When the Galactic War broke out, Malgus declared a new Empire, feeling the old Empire was a broken shell. With the combined strength of the Republic and Empire, Malgus was defeated aboard his space station. Malgus returned years later after the fall of the Eternal Alliance."},{"b":18,"c":"RSE_MARR","f":"RSE","n":"Darth Marr","v":"Darth Marr","p":"marr","e":"","t":"named legends era_old_republic sith male","w":"Dark Council member; the coalition with Satele Shan was a temporary alliance, not membership","bio":"Darth Marr was a Human male Sith Lord who served on the Dark Council during the Great Galactic War, Cold War, and Galactic War. During the Cold War, Marr focused his efforts on strengthening Imperial defenses while distancing himself from internal power struggles within the Empire. During the Galactic War, Marr, along with Satele Shan, organized a coalition force against the reborn  Revan. After discovering the Eternal Empire, Marr was struck down after refusing to kneel before Valkorion, the rebirthed Vitiate."},{"b":18,"c":"RSE_MORTIS","f":"RSE","n":"Darth Mortis","v":"Darth Mortis","p":"mortis","e":"","t":"named legends era_old_republic sith male","w":"Dark Council member; the Order of Zildrog allegiance is not a listed faction code","bio":"Darth Mortis was a Human male Sith Lord who served on the Dark Council during the Second Great Galactic War and subsequent conflicts. During the height of the Second Great Galactic War, Mortis was present while Darth Baras attempted to lay claim to the title of Voice of the Emperor and was later confronted by his apprentice, the new Emperor\u0027s Wrath. Mortis was further present as Darth Thanaton was confronted by the descendent of Lord Kallig, who ended their Kaggath within the Dark Council chambers, with Mortis executing Thanaton and offering his seat to Kallig. After the rise of the Eternal Alliance, Mortis allied himself with the Order of Zildrog in an effort to crush the Eternal Fleet. Ultimately, Mortis, along with multiple other heralds were instead sacrificed to Zildrog to reawaken the ancient superweapon."},{"b":18,"c":"RSE_NYRISS","f":"RSE","n":"Darth Nyriss","v":"Darth Nyriss","p":"nyriss","e":"","t":"named legends era_old_republic sith female","w":"Dark Council member; RSE only","bio":"Darth Nyriss was a Sith female Sith Lord who served on the Dark Council in the years prior to and shortly after the Jedi Civil War. Working with her other fellow Dark Council members, Nyriss attempted to stage a coup against the Sith Emperor, Vitiate, to prevent him from causing all-out war against the Republic. Initially suspected of treason, Nyriss worked with Lord Scourge in an effort to conclude her plans. However, Scourge betrayed Nyriss, exposing the coup to the Emperor in an effort to assist Revan and the Jedi Exile Meetra Surik. During Surik\u0027s and Scourge\u0027s attempt to free Revan from his prison, Nyriss confronted the two, and attempted to end their lives until the timely intervention of Revan. Launching a barrage of power against Revan, Revan ultimately deflected the attack towards Nyriss, who in turn was unprepared, resulting in her death."},{"b":18,"c":"RSE_PHOBOS","f":"RSE","n":"Darth Phobos","v":"Darth Phobos","p":"phobos","e":"","t":"named legends era_ancient sith female","w":"Theelin Sith Lord, enemy of both Jedi and Sith; no faction membership","bio":"Darth Phobos was a Theelin female who reigned as a Sith Lord thousands of years before the Clone Wars. During her training on Korriban, Phobos slow many Sith in her bid for power. As an enemy of the Jedi and Sith alike, Phobos amassed a small cult of followers, attacking both factions. Eventually, a coalition of Jedi and Sith forces saw to the end of Phobos\u0027s life. Phobos served the Jedi Order after death, as a simulated hologram of her was pitted against aspiring Jedi Knights in a trial of courage. Phobos was further immortalized by the Sith Eternal Cult, naming a legion of Sith Troopers after her."},{"b":18,"c":"RSE_RAPTUS","f":"RSE","n":"Dread Master Raptus","v":"Dread Master Raptus","p":"raptus","e":"","t":"named legends era_old_republic sith male","w":"Leader of the Dread Masters; no listed faction code fits","bio":"Raptus was a Human male Sith Lord and considered the leader of the Dread Masters during the Great Galactic War and subsequent conflicts. Prior to the Treaty of Coruscant, Raptus, along with the other remaining Dread Masters, were imprisoned on Belsavis until they were later freed by a member of the Sith Empire during the outbreak of the Second Great Galactic War. After the Sith Emperor Vitiate\u0027s demise, the Dread Masters broke free of the Empire, deciding to take control of the galaxy themselves. On the moon of Oricon, within the Dread Palace, Raptus tested the strength of the strike team sent to destroy them, ultimately passing his test. Eventually, Raptus, along with the majority of the Dread Masters, were slain."},{"b":18,"c":"RSE_RAVAGE","f":"RSE","n":"Darth Ravage","v":"Darth Ravage","p":"ravage","e":"","t":"named legends era_old_republic sith male","w":"Dark Council member; the coalition effort with the Republic was a temporary alliance","bio":"Darth Ravage was a Human male Sith Lord who served on the Dark Council during the Second Great Galactic War. At the height of the conflict, Ravage witnessed Darth Baras\u0027s claim to be the Voice of the Emperor and later execution by the Emperor\u0027s Wrath, and later on witnessing Darth Thanaton and Lord Kallig\u0027s kaggath conclude, each within the Dark Council Chamber. During the Ilum campaign and Darth Malgus\u0027s subsequent betrayal, Ravage worked with a number of other notable imperials to lead a coalition effort with the Republic to defeat Malgus and end his threat."},{"b":18,"c":"RSE_SCORPIO","f":"RSE","n":"SCORPIO","v":"SCORPIO","p":"scorpio","e":"EE","t":"named legends era_old_republic non_sensitive","w":"Droid who set itself up as the Lady of Sorrows under the Eternal Empire (EE)","bio":"SCORPIO was a GEMINI droid that worked alongside the Imperial Agent Cipher Nine during the Second Great Galactic War. During Cipher Nine\u0027s hunt for the Star Cabal, SCORPIO attempted to subvert the Agent\u0027s efforts on Belsavis. However, SCORPIO was unable to prevent the agent from completing their objective, and was defeated and rebuilt to serve the agent. After the Eternal Empire rose to power, SCORPIO established itself as the Lady of Sorrows, an information broker.. SCORPIO later joined forces with Vaylin and devised a plan to re-merge with Iokath, using the Alliance and Vaylin\u0027s forces to achieve her goal."},{"b":18,"c":"RSE_STYRAK","f":"RSE","n":"Dread Master Styrak","v":"Dread Master Styrak","p":"styrak","e":"","t":"named legends era_old_republic sith male","w":"Dread Master; no listed faction code fits","bio":"Styrak was a Human male Sith Lord and member of the Dread Masters during the Great Galactic War and subsequent conflicts. Prior to the Treaty of Coruscant, Styrak, along with the other remaining Dread Masters, were imprisoned on Belsavis until they were later freed by a member of the Sith Empire during the outbreak of the Second Great Galactic War. After the Sith Emperor Vitiate\u0027s demise, the Dread Masters broke free of the Empire, deciding to take control of the galaxy themselves. On Darvannis, Styrak corrupted the Hutt Cartel\u0027s forces on the world, forcing them to defend him from the strike team sent to free the world. Styrak eventually confronted the team, but was ultimately killed."},{"b":18,"c":"RSE_THANATON","f":"RSE","n":"Darth Thanaton","v":"Darth Thanaton","p":"teneb kel","e":"","t":"named legends era_old_republic sith male","w":"Dark Council member; bio gives birth name Teneb Kel, used as key","bio":"Darth Thanaton was a Human male Sith Lord who served on the Dark Council during the Cold War. Born as Teneb Kel, raised as a slave in the Resurgent Sith Empire, the Sith Lord Calypho took Teneb on as an apprentice and trained him in the ways of the Sith. After a series of events leading to Kel executing Exal Kressh, Kel took on the name Darth Thanaton and headed the Sphere of Ancient Knowledge. After Darth Zash\u0027s apprentice, Lord Kallig, assassinated Darth Skotia, Thanaton obsessively worked toward having Kallig killed, ultimately facing them in the Dark Council chamber at the end of their Kaggath. Thanaton was ultimately killed."},{"b":18,"c":"RSE_TYRANS","f":"RSE","n":"Dread Master Tyrans","v":"Dread Master Tyrans","p":"tyrans","e":"","t":"named legends era_old_republic sith male","w":"Dread Master; no listed faction code fits","bio":"Tyrans was a Human male Sith Lord and member of the Dread Masters during the Great Galactic War and subsequent conflicts. Prior to the Treaty of Coruscant, Tyrans, along with the other remaining Dread Masters, were imprisoned on Belsavis until they were later freed by a member of the Sith Empire during the outbreak of the Second Great Galactic War. After the Sith Emperor Vitiate\u0027s demise, the Dread Masters broke free of the Empire, deciding to take control of the galaxy themselves. On the moon of Oricon, within the Dread Palace, Tyrans met his end during the Republic and Empire\u0027s campaign to end the Dread Masters threat upon the galaxy."},{"b":18,"c":"RSE_VITIATE","f":"RSE","n":"Emperor Vitiate","v":"Emperor Vitiate|Vitiate (Illusion)","p":"tenebrae","e":"EE","t":"named legends era_ancient era_old_republic sith male","w":"Vitiate/Valkorion; reigned as Eternal Emperor (EE) after rebirth as Valkorion","bio":"Vitiate was a Sith Male who reigned over the Resurgent Sith Empire for over a thousand years. After the Empire\u0027s defeat at the end of the Great Hyperspace War, Vitiate performed a ritual which absorbed the essence of every living thing, turning Nathema into a wasteland, and granting him immortality and an amplified command over the Force. Over a thousand years later, he launched his assault on the Republic. Threatening to absorb the life of every living thing in the galaxy, the Jedi known as the Hero of Tython struck him down. Death was not the end as Vitiate took control of Valkorion, dismissing the Sith as a failure."},{"b":18,"c":"RSE_VOWRAWN","f":"RSE","n":"Darth Vowrawn","v":"Darth Vowrawn","p":"vowrawn","e":"","t":"named legends era_old_republic sith male","w":"Dark Council member; no other faction in bio, species not stated","bio":"Darth Vowrawn was a Sith male who served on the Dark Council during the Second Great Galactic War and subsequent conflicts."},{"b":18,"c":"RSE_WAR_DROID","f":"RSE","n":"MK I War Droid","v":"MK I War Droid","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Generic war droid unit; no extra faction","bio":"Sith War Droids were fearsome macchines utilized by Darth Malgus during the Great Galactic War.  Quadrupedal and armed with heavy blaster cannons, they were an intimidating presence on any battlefield during the war."},{"b":18,"c":"RSE_WARRIOR","f":"RSE","n":"Sith Marauder","v":"Sith Marauder|Sith Juggernaut|Sith Juggernaut|Sith Slave","p":"generic","e":"","t":"generic legends era_old_republic sith","w":"Generic Sith Warrior class unit; no extra faction","bio":"Sith Warriors, described as \u0027\u0027an unstoppable force of darkness\u0027\u0027, were combat specialists of the Sith Empire, and served as the champions of the battlefield, entrusted with the task of destroying the Empire s enemies and enforcing Sith domination across the galaxy. Trained to rely on the emotions of fear, anger, and hatred to improve their connection to the dark side of the Force, channeling its power through their bodies and purging weakness from themselves."},{"b":18,"c":"RSE_XALEK","f":"RSE","n":"Xalek","v":"Xalek|Lord Xalek","p":"xivhkalrainik","e":"","t":"named legends era_old_republic sith male","w":"Kaleesh; bio gives birth name Xivhkalrainik, used as key; apprentice of Kallig, RSE only","bio":"Xalek was a Kaleesh male slave-turned-Sith Lord who served under Darth Nox during the Second Great Galactic War. Originally known as Xivhkalrainik, Xalek was captured and later enslaved by the Empire, only freed due to his force sensitivity. Sent to Korriban for his initial trials, Xalek, like his master, was assigned to Overseer Harkun. Eyed by the descendent of Kallig, Xalek murdered his competition, including a final acolyte who passed his final trial. However, Kallig admired Xalek\u0027s spirit and took him on as an apprentice."},{"b":18,"c":"RSE_ZASH","f":"RSE","n":"Darth Zash","v":"Darth Zash","p":"zash","e":"","t":"named legends era_old_republic sith female","w":"Dark Council member; RSE only","bio":"Darth Zash was a Human female Sith Lord who participated in the Cold War. Obsessed with rituals and other Sith magic, Zash accrued an intense amount of power, but at the cost of her own life. Seeking an apprentice from the Korriban Academy, Zash took on a Sith Acolyte who, unknown to her, was the descendent of the late Aloysius Kallig. Sending her apprentice to recover artifacts of Tulak Hord, Zash attempted a ritual to transfer her essence into the body of her apprentice. However, at the timely intervention of Khem Val, Zash was trapped in the Dashade\u0027s body and later a Rakatan Mind Prison."},{"b":18,"c":"SE_ETERNAL_PALPATINE","f":"SE","n":"Sith Eternal Emperor Palpatine","v":"Sith Eternal Emperor Palpatine","p":"sheev palpatine","e":"GE SO","t":"named canon era_sequel sith male","w":"Palpatine (Darth Sidious) returned as Sith Eternal emperor; Galactic Empire (GE) lineage and Sith Order (SO) leadership","bio":"Hidden away on the Sith world of Exegol, clone bodies were kept prepared by cultists of the Sith Eternal. However, the bodies were not strong enough to contain Palpatine\u0027s immense power. As a result, any clone body degraded quickly. After Palpatine made his presence known to the rest of the galaxy, Rey and the forces of the Resistance travelled to Exegol to stop him and the Final Order. After absorbing the Force Bond from Rey and Ben Solo, Palpatine was able to heal his body to its full extent. His rebirth was short-lived as Rey, empowered by the spirits of the past Jedi, rose up and slew the Dark Lord of the Sith once and for all."},{"b":18,"c":"SE_SITH_TECH","f":"SE","n":"Sith Eternal Technician","v":"Sith Eternal Technician","p":"generic","e":"","t":"generic canon era_sequel non_sensitive","w":"Generic Sith Eternal crew unit on Exegol; no extra faction","bio":"Sith Eternal Fleet Technicians were workers trained and conditioned by the Sith Eternal to crew the Xyston-class Star Destroyers. At Palpatine\u0027s command, a crew of the Technicians would fire the Axial Superlaser equipped on each Destroyer, destroying any planet that dared to oppose the Final Order."},{"b":19,"c":"SE_SITH_TROOP","f":"SE","n":"Sith Trooper","v":"Sith Trooper","p":"generic","e":"","t":"generic canon era_sequel non_sensitive","w":"Generic Sith Eternal conscript unit; belongs only to SE.","bio":"Sith Troopers were troopers conscripted into the Sith Eternal Cult at some point after the fall of the Galactic Empire. Though following the Sith religion, they were not Sith themselves, and were trained and conditioned to be the perfect extension of Emperor Palpatine\u0027s will and the menacing face of the Final Order."},{"b":19,"c":"SE_SOVEREIGN","f":"SE","n":"Sovereign Protector","v":"Sovereign Protector","p":"generic","e":"","t":"generic canon era_sequel non_sensitive","w":"Generic Sith Eternal personal guard unit from Rise of Skywalker; belongs only to SE.","bio":"Sovereign Protectors were the personal guardsmen of the rebirthed Emperor Palpatine. During the Battle of Exegol after Rey\u0027s refusal to strike down her grandfather, the Protectors engaged Rey. In the brief firefight that followed, all guards were killed."},{"b":19,"c":"SKIR_ADEN","f":"SKIR","n":"A\u0027den Skirata","v":"A\u0027den Skirata","p":"a\u0027den skirata","e":"REP MANDO","t":"named legends era_prequel male non_sensitive","w":"Republic clone commando during the Clone Wars (REP), then deserted to Mandalore with Clan Skirata (MANDO).","bio":"A\u0027den Skirata was a Null-class Advanced Recon Commando during the Clone Wars. The only Null ARC to become a sergeant and not an officer, Aden was adopted by Kal Skirata, who trained him. Aden, along with the remaining Clan Skirata, deserted to Mandalore after the Clone Wars."},{"b":19,"c":"SKIR_ATIN","f":"SKIR","n":"Atin Skirata","v":"Atin Skirata","p":"atin skirata","e":"REP MANDO","t":"named legends era_prequel male non_sensitive","w":"Republic clone commando in Omega Squad (REP); Clan Skirata deserted to Mandalore (MANDO).","bio":"Atin Skirata was a Clone Commando in the Republic\u0027s Omega Squad during the Clone Wars. He was trained by the mandalorian Walon Vau."},{"b":19,"c":"SKIR_CORR","f":"SKIR","n":"Corr Skirata","v":"Corr Skirata","p":"corr skirata","e":"REP MANDO","t":"named legends era_prequel male non_sensitive","w":"Republic clone trooper (REP); deserted to Mandalore with Clan Skirata (MANDO).","bio":"Corr was a Clone Trooper munitions disposal specialist during the Clone Wars. Wounded in action, Corr was assigned a desk job on Coruscant after losing his lower arms to an explosive. Due to his prosthetic limbs, Corr was known for sharpening knives on his mechanical fingertips. When the Clone Wars ended, Corr deserted to Mandalore."},{"b":19,"c":"SKIR_DARMAN","f":"SKIR","n":"Darman Skirata","v":"Darman Skirata","p":"darman skirata","e":"REP GE","t":"named legends era_prequel era_imperial male non_sensitive","w":"Republic clone commando, then Imperial Commando in the 501st Legion (GE); not MANDO as he could not desert.","bio":"Darman Skirata was a Clone Commando, later Imperial Commando, who fought for the Republic during the Clone Wars. Along with his other Skirata brothers, Darman was adopted by his training sergeant Kal Skirata. However, after the Clone Wars, Darman was unable to desert to Mandalore, and was made a member of the Imperial\u0027s 501st Legion after the formation of the Empire."},{"b":19,"c":"SKIR_FI","f":"SKIR","n":"Fi Skirata","v":"Fi Skirata","p":"fi skirata","e":"REP MANDO","t":"named legends era_prequel male non_sensitive","w":"Republic clone commando in Teroch and Omega Squads (REP); deserted to Mandalore (MANDO).","bio":"Fi Skirata was a Clone Commando and member of Teroch Squad, later Omega Squad during the Clone Wars. Adopted by Kal Skirata, Fi was trained as a commando, serving as his team\u0027s medic and sniper in both squads, until he was wounded in action, sustaining a severe brain injury. Along with most of his Skirata brothers, Fi deserted to Mandalore after the Clone Wars."},{"b":19,"c":"SKIR_GOTAB","f":"SKIR","n":"Gotab Skirata","v":"Gotab Skirata","p":"gotab skirata","e":"JO REP MANDO","t":"named legends era_prequel jedi male","w":"Former Jedi Knight and Republic general (JO, REP) who resigned to join the Mandalorians (MANDO), per Skirata clan Legends material.","bio":"Gotab, once known as Bardan Skirata, was a Human male Jedi Knight during the Clone Wars. Bardan was against the creation of the Clone Army, addressing his negative views toward the Council. After the Clone Wars broke out, Bardan was made a Commander, and was later knighted and became a general. He later resigned from the order to join the Mandalorians, saying that he couldn\u0027t fight for a Council that approved the slave labor that was the Clone Army, taking the name Gotab."},{"b":19,"c":"SKIR_IJAAT","f":"SKIR","n":"Ijaat Skirata","v":"Ijaat Skirata","p":"ijaat skirata","e":"MANDO","t":"named legends era_prequel male non_sensitive","w":"Mandalorian son of Kal Skirata, raised in Clan Skirata (MANDO); no other faction.","bio":"Ijaat Skirata was a Human male Mandalorian and the youngest son of Mandalorian mercenary Kal Skirata. Sometime in his life, Ijaat, along with his brother Tor, disowned his father, but when his sister was in trouble, Ijaat and Tor apologized to Kal after Kal offered his assistance."},{"b":19,"c":"SKIR_INI","f":"SKIR","n":"Skirata Initiate","v":"Skirata Initiate","p":"ini skirata","e":"REP MANDO","t":"named legends era_prequel male non_sensitive","w":"Republic clone commando (REP); deserted to Mandalore (MANDO).","bio":"Ini Skirata was a Clone Commando during the Clone Wars. Adopted by Kal Skirata, Ini was trained as a commando. After the Clone Wars, Ini deserted to Mandalore."},{"b":19,"c":"SKIR_JAING","f":"SKIR","n":"Jaing Skirata","v":"Jaing Skirata","p":"jaing skirata","e":"REP MANDO","t":"named legends era_prequel male non_sensitive","w":"Republic Null ARC trooper (REP); became a Mandalorian clan member after the war (MANDO).","bio":"Jaing Skirata was a Null-class Advanced Recon Commando during the Clone Wars. After the Clone Wars, he became a Mandalorian member of Clan Skirata."},{"b":19,"c":"SKIR_KAL","f":"SKIR","n":"Kal Skirata","v":"Kal Skirata","p":"kal skirata","e":"REP MANDO","t":"named legends era_prequel male non_sensitive","w":"Mandalorian mercenary who trained Omega Squad for the Republic (REP) and led the deserters to Mandalore (MANDO). Skirata Legends.","bio":"Kal Skirata was a Mandalorian mercenary prior to and during the Clone Wars. Responsible for training a number of Clone Commandos that made up Omega Squad, Kal adopted his students, giving them the surname, Skirata. After the Clone Wars, Kal, along with many clones he trained and adopted, deserted to Mandalore."},{"b":19,"c":"SKIR_KOMRK","f":"SKIR","n":"Komrk Skirata","v":"Komrk Skirata","p":"komrk skirata","e":"REP MANDO","t":"named legends era_prequel male non_sensitive","w":"Null ARC in Republic Clone Intelligence (REP); deserted to Mandalore with the clan (MANDO).","bio":"Kom\u0027rk Skirata was an Null-class Advanced Recon Commando during the Clone Wars. A member of Clone Intelligence, Kom\u0027rk was among the group responsible for locating General Grievous on Utapau, but years before the final year of the war, believing the information came too easily. However, near the end of the war, Kom\u0027rk and his team reported their findings. After the Clone Wars, Kom\u0027rk, along with his clan, desert to Mandalore with the rest of Clan Skirata."},{"b":19,"c":"SKIR_MEREEL","f":"SKIR","n":"Mereel Skirata","v":"Mereel Skirata","p":"mereel skirata","e":"REP MANDO","t":"named legends era_prequel male non_sensitive","w":"Republic Null ARC (REP); deserted to Mandalore with Clan Skirata (MANDO).","bio":"Jaster Mereel Skirata was a Null-class Advanced Recon Commando during the Clone Wars. He was named after Mandalore Jaster Mereel, his template, Jango Fett\u0027s mentor. After the Clone Wars, Mereel, along with Clan Skirata, deserted to Mandalore."},{"b":19,"c":"SKIR_MUNIN","f":"SKIR","n":"Munin Skirata","v":"Munin Skirata","p":"munin skirata","e":"MANDO","t":"named legends era_prequel male non_sensitive","w":"Mandalorian soldier who adopted and trained the boy later known as Kal Skirata; Mandalorian only.","bio":"Munin was a Human male Mandalorian soldier and member of Clan Skirata. On a mission to the planet Surcaris, he came across a young boy named Falin Mattran, who was living on the streets and surviving on his own. Munin adopted the young boy and trained him as a Mandalorian, giving him the name Kal Skirata."},{"b":19,"c":"SKIR_NINER","f":"SKIR","n":"Niner Skirata","v":"Niner Skirata","p":"niner skirata","e":"REP GE","t":"named legends era_prequel era_imperial male non_sensitive","w":"Leader of Omega Squad for the Republic (REP), then Imperial Commando for the Galactic Empire (GE).","bio":"Niner Skirata was a Clone Commando and leader of Omega Squad during the Clone Wars. Trained and adopted by Kal Skirata as a commando, Niner was the only survivor of his first squad following the First Battle of Geonosis, until joining with three other lone squad survivors, creating Omega Squad. After the Clone Wars, Niner, became an Imperial Commando serving the Galactic Empire."},{"b":19,"c":"SKIR_ORDO","f":"SKIR","n":"Ordo Skirata","v":"Ordo Skirata","p":"ordo skirata","e":"REP MANDO","t":"named legends era_prequel male non_sensitive","w":"Republic Null ARC (REP); deserted to Mandalore with Clan Skirata (MANDO).","bio":"Ordo Skirata was a Null-class Advanced Recon Commando during the Clone Wars. One of six surviving Null clones, Ordo was trained and adopted by Kal Skirata, given the name Ordo after the Mandalore, Canderous Ordo. After the Clone Wars, Ordo, along with Clan Skirata, deserted to Mandalore."},{"b":19,"c":"SKIR_PRUDII","f":"SKIR","n":"Prudii Skirata","v":"Prudii Skirata","p":"prudii skirata","e":"REP MANDO","t":"named legends era_prequel male non_sensitive","w":"Republic Null ARC (REP); deserted to Mandalore with Clan Skirata (MANDO).","bio":"Prudii Skirata was a Null-class Advanced Recon Commando during the Clone Wars. One of six Null clones, Prudii was trained by Kal Skirata, who trained and adopted him into Clan Skirata. After the Clone Wars, Prudii, along with Clan Skirata, deserted to Mandalore."},{"b":19,"c":"SKIR_RUUSAAN","f":"SKIR","n":"Ruusaan Skirata","v":"Ruusaan Skirata|Ruusaan Skirata (No Helmet)","p":"ruusaan skirata","e":"MANDO","t":"named legends era_prequel female non_sensitive","w":"Mandalorian daughter of Kal Skirata, raised in Clan Skirata (MANDO). Variant \"No Helmet\" is the same person.","bio":"Ruusaan Skirata was a Human female Mandalorian who was the youngest, and only biological daughter of Mandalorian mercenary Kal Skirata."},{"b":19,"c":"SKIR_TOR","f":"SKIR","n":"Tor Skirata","v":"Tor Skirata","p":"tor skirata","e":"MANDO","t":"named legends era_prequel male non_sensitive","w":"Mandalorian eldest son of Kal Skirata (MANDO).","bio":"Tor Skirata was a Human male Mandalorian and eldest child and son of Mandalorian mercenary Kal Skirata."},{"b":19,"c":"SKIR_VENKU","f":"SKIR","n":"Venku Skirata","v":"Venku Skirata","p":"venku skirata","e":"MANDO","t":"named legends era_new_republic male non_sensitive","w":"Farmer and political leader on Mandalore around 40 ABY (MANDO). Did not confirm a fit with MNC or DW from the bio.","bio":"Venku Skirata was a Human male farmer, and son of Clone Commando Darman and Jedi Knight Etain Tur-Mukan. Adopted by Kal Skirata, and raised in Mandalorian culture, Venku became a farmer on Mandalore. By 40 ABY, under the name Kad\u0027ika, or \u0027\u0027Little Saber\u0027\u0027 in Mando\u0027a, he was the leader of a political faction who wanted to see a resurgence of the Mandalorian people."},{"b":19,"c":"SKIR_WALON","f":"SKIR","n":"Walon Vau","v":"Walon Vau","p":"walon vau","e":"MANDO","t":"named legends era_prequel male non_sensitive","w":"Mandalorian recruited by Jango Fett who trained clones (no separate Republic membership in the bio); MANDO only.","bio":"Walon Vau was a Human male Mandalorian prior to, during, and after the Clone Wars. Born on Irmenu, Walon was heir to the title of Count of Gesl, but was exiled from his world after a love affair with the princess of a neighboring province. Walon was recruited by the mandalorian Jango Fett, and later trained a number of clones, often resorting to brutal methods to make his clones tough, seemingly immune to pain. His intention was to have soldiers who could overcome any obstacle, including interrogation."},{"b":19,"c":"SO_CAEDUS","f":"SO","n":"Darth Caedus","v":"Darth Caedus","p":"jacen solo","e":"JO GA","t":"named legends era_new_republic sith male","w":"Jacen Solo was a Jedi Knight before falling (JO), and as Caedus seized and led the Galactic Alliance (GA), per Legends NJO material.","bio":"Darth Caedus was a Human Male Sith Lord who reigned during the Dark Nest Crisis. Born Jacen Solo, son of Han and Leia, Jacen experienced multiple visions of horrible atrocities happening in the future. Determined to keep them from coming to fruition, and with Lumiya\u0027s guidance, Jacen fell to the dark side and became Darth Caedus. During his reign, he seized control of the Galactic Alliance and even killed his aunt, Mara Jade Skywalker. On Uroro Station, Caedus came face to face with his sister, Jaina, who after a vicious duel, struck him now, but not before his good intentions were made clear to Jaina."},{"b":19,"c":"SO_GITHANY","f":"SO","n":"Githany","v":"Githany","p":"githany","e":"JO","t":"named legends era_ancient sith female","w":"Former Jedi before defecting to Kaan\u0027s Brotherhood of Darkness (SO). JO is the one extra as she was a Jedi for a significant period; Legends lore.","bio":"Githany was a Human female Sith Lord who fought for Lord Kaan\u0027s Brotherhood of Darkness during the New Sith Wars. Formerly a Jedi, Githany and another Jedi, Kiel Charny fell in love, but after being discovered by Kiel\u0027s master, Kiel chose to end the relationship with Githany choosing to defect to the Brotherhood of Darkness. Arriving on Korriban, Githany noticed the apprentice Bane, who was broken after being defeated by his rival Sirak. Seeking to use Bane, Githany taught Bane in secret about the dark side that she learned from her own lessons, helping Bane overcome his weakness and ultimately destroying Sirak in a training duel. After Bane left the Academy, believing the Brotherhood\u0027s teachings to be heresy, Githany and the rest of the academy were dispatched to Ruusan. After Bane reappeared, declaring himself as Darth Bane, Bane manipulated Kaan and the rest of the Brotherhood into creating the Thought Bomb, a powerful weapon designed to destroy and trap the souls of all who were caught in its blast radius. After realizing Bane\u0027s intention, Githany broke herself free of the ritual and attempted to flee the site. However, Githany was ultimately engulfed in the Thought Bomb\u0027s blast, and she, along with the Brotherhood of Darkness and Lord Hoth\u0027s Jedi were vaporized, with their spirits trapped within what was later known as the Valley of the Jedi."},{"b":19,"c":"SO_KAAN","f":"SO","n":"Lord Kaan","v":"Lord Kaan","p":"skere kaan","e":"","t":"named legends era_ancient sith male","w":"Leader of the Brotherhood of Darkness, a Sith order (SO); no other faction membership in the bio.","bio":"Skere Kaan was a Human Male who was leader of the Brotherhood of Darkness during the New Sith Wars. After his fall, Kaan established the Brotherhood of Darkness, a new Sith Order aimed at doing away with the traditional infighting among the Sith. While initially successful, with Kaan\u0027s military genius leading the Sith to victory, his actions were seen as blasphemy among the ancient Sith. During the Ruusan Campaign, Kaan and the brotherhood journeyed into a cavern to perform the Thought bomb ritual, and after the arrival of Jedi Lord Hoth, Kaan detonated the bomb, vaporizing him, the brotherhood, and Hoth and his forces."},{"b":19,"c":"SO_SITH_DROID","f":"SO","n":"Sith Training Droid","v":"Sith Training Droid","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Generic training droid; belongs only to SO.","bio":"Sith Training Droids were droids designed to simulate combat against another lightsaber user, usually used by Sith in training or Sith Lords wishing to sharpen their skills. Though the droids were typically non-lethal, in the events of an emergency or at the instructor\u0027s discretion could set the droid to fight with lethal intentions."},{"b":19,"c":"SO_STATUE","f":"SO","n":"Sith Statue","v":"Sith Statue","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Generic statue guardian on Dromund Kaas; belongs only to SO.","bio":"The Sith Statues were statues that resided inside the former Temple of the Prophets of the Dark Side on Dromund Kaas. Each Statue possessed a Lightsaber and normally stood at rest, however, they became fierce foes when those considered intruders approached them. Only Lightsabers were viable weapons against them due to the Dark Side energies that disabled all other mechanical weapons on the planet."},{"b":19,"c":"SO_SWTOR_Sith","f":"SO","n":"Sith Lord","v":"Sith Lord","p":"generic","e":"","t":"generic legends era_old_republic sith","w":"Generic Sith Lord archetype; belongs only to SO.","bio":"The Sith were a group of force sensitives who practiced the dark side of the Force. Based on the culture of the Sith species, the Sith believed in a strict hierarchy, where only the strong would be permitted to rule. Their desire for control would often put them at odds with the Jedi. As per Sith Tradition, when an apprentice felt worthy, they would challenge their master. Should they prove stronger, the apprentice would strike down their master and claim their title."},{"b":19,"c":"SO_VESTARA","f":"SO","n":"Vestara","v":"Vestara","p":"vestara khai","e":"JO","t":"named legends era_new_republic sith female","w":"Former Sith saber of the Lost Tribe (SO), who later served the New Jedi Order (JO) per the bio. Legacy of the Force era.","bio":"Vestara Khai was a Human female former Sith saber who served the Lost Tribe of the Sith and later New Jedi Order during the Second Galactic Civil War. Early in the civil war, Vestara worked with a strike team attempting to kill Jedi Grand Master Luke Skywalker and his son, Ben Skywaler. The strike team was ultimately unsuccessful and Vestara was the sole survivor. Though later rescued by Skywalker on Dathomir, Vestara was accused of being a traitor, and was hunted by her fellow tribesmen, eventually being forced to kill her own father. Though welcomed back to her tribe and made a Sith Saber."},{"b":19,"c":"TOR_ALEK","f":"TOR","n":"Alek Squinquargesimus","v":"Alek Squinquargesimus","p":"alek squinquargesimus","e":"JO DRSE","t":"named legends era_old_republic sith fallen_jedi male","w":"Jedi Knight in the Mandalorian Wars (JO), who became Darth Malak of Revan\u0027s Sith Empire (DRSE).","bio":"Alek was a Human male Jedi Knight during the Mandalorian Wars. Revan\u0027s closest friend and the first Jedi to join Revan in the fight against the Mandalorians. After the war ended, he and Revan, aware of the Sith threat in the Unknown Regions, found their way to the Sith world of Dromund Kaas. Upon meeting the Sith Emperor, Revan and Alek were both corrupted to the dark side and were tasked with locating the Star Forge. By this time, he was no longer known as Alek, but rather Darth Malak."},{"b":19,"c":"TOR_ATRIS","f":"TOR","n":"Atris","v":"Atris|Atris (Fallen)|Darth Traya","p":"atris","e":"JO","t":"named legends era_old_republic jedi fallen_jedi redeemed female","w":"[corrigé] Jedi Master and Council member (JO). Fell to the dark side and was redeemed. Fan wiki (archivum.wiki) says she became a second Darth Traya (SO). Kreia is the main Traya, so treat SO as uncertain.","bio":"Atris was a Human female Jedi Master, Historian, and Council member during the Mandalorian Wars, Jedi Civil War, and Dark Wars. When Meetra Surik faced the Council\u0027s judgment after Malachor V, Atris was the first to condemn her, claiming she fell to the dark side like Revan.  After the First Jedi Purge ended, Atris sought to rebuild the Jedi Order on Telos, and collected many Sith Holocrons to better understand the Sith. This however corrupted her to the dark side, and she was later redeemed by Surik. Atris waited in her academy for judgment by the new Jedi Council."},{"b":19,"c":"TOR_ATTON","f":"TOR","n":"Atton Rand","v":"Atton Rand|Atton Rand (Jedi)","p":"atton rand","e":"JO DRSE","t":"named legends era_old_republic redeemed male","w":"Jedi Hunter for Revan\u0027s Sith forces (DRSE), later a Jedi Knight under Surik (JO).","bio":"Atton Rand was a Human male Republic Soldier during the Mandalorian Wars, a Jedi Hunter during the Jedi Civil War, and Jedi Knight during the Dark Wars. Loyal to Revan until his change of heart, Atton was a fierce fighter and skilled Jedi Hunter. When his final Jedi victim showed him the consequences of his actions, Atton deserted the Sith. After he met the Exile, he offered to help Surik destroy the Sith Triumverate, later revealing to Surik his tragic past. Surik forgave him and trained him as a Jedi. Atton was left to rebuild the Order after Surik left to track Revan down."},{"b":19,"c":"TOR_BAKARN","f":"TOR","n":"Syo Bakarn","v":"Syo Bakarn|The First Son","p":"syo bakarn","e":"JO","t":"named legends era_old_republic jedi sith male","w":"Jedi Master (JO) who was a Sith sleeper agent (Children of the Emperor, SWTOR). The Sith side is not clearly mapped to a code, so no extra faction beyond JO.","bio":"Syo Bakarn was a Human male Jedi Master who was a member of the Jedi Council during the Cold War and renewed Great Galactic War. Taken as an infant by agents of the Sith Emperor, he was secretly turned into the first of the Emperor’s sleeper agents, known as the Children of the Emperor. Infused with the Emperor\u0027s power, he unknowingly carried a second personality, the First Son, who acted as the leader of the Children and kept them hidden from detection. Returned to his family without memory of this, Bakarn was later discovered by the Jedi and trained in the Order, rising to the rank of Jedi Knight and eventually Jedi Master. Renowned for his healing abilities and humanitarian efforts during and after the war, he played a key role in the Republic\u0027s recovery and served on the Jedi High Council. Despite his accomplishments, Bakarn struggled with guilt after learning the truth about his hidden identity. He was eventually freed from the Emperor’s influence by the Barsen\u0027thor, who exposed the Children and succeeded him on the Council."},{"b":19,"c":"TOR_BAODUR","f":"TOR","n":"Bao-Dur","v":"Bao-Dur|Bao-Dur (Jedi)","p":"bao-dur","e":"JO","t":"named legends era_old_republic jedi male","w":"[corrigé] Engineer for the Republic in the Mandalorian Wars (REP), later a Jedi Knight (JO).","bio":"Bao-Dur was a Zabrak male engineer during the Mandalorian Wars and a Jedi Knight during the Dark Wars. During the Mandalorian Wars, Bao-Dur created the weapon known as the Mass Shadow Generator, which warped the gravity of Malachor V to destroy the Mandalorian fleet. Years later, he accompanied Surik, his former general, on a mission to destroy the Sith Triumverate. After learning how to control his anger, Surik taught him the ways of the Jedi. After Darth Traya was killed, the Mass Shadow Generator was activated again, and destroyed Malachor V permanently."},{"b":19,"c":"TOR_BASTILA","f":"TOR","n":"Bastila Shan","v":"Bastila Shan|Bastila Shan (Fallen)","p":"bastila shan","e":"JO DRSE","t":"named legends era_old_republic jedi fallen_jedi redeemed female","w":"Jedi who was seduced to the dark side by Malak and served the Sith Empire (DRSE) before redemption (JO).","bio":"Bastila Shan was a Human female who served as one of the amnesiac Revan\u0027s followers during the Jedi Civil War. Born on the planet Talravin, Bastila was taken to the Jedi Order at an early age, and was known for her gift of Battle Meditation, which allowed the user to inspire their allies, and demoralize their enemies. During the Jedi Civil War, the Sith Lord Darth Malak seduced Bastila to the Dark Side, and was later redeemed by Revan, expressing their love to one another. Revan and Bastila eventually married and had one child, Vaner Shan."},{"b":19,"c":"TOR_BELA","f":"TOR","n":"Bela Kiwiiks","v":"Bela Kiwiiks","p":"bela kiwiiks","e":"JO","t":"named legends era_old_republic jedi female","w":"Togruta Jedi Master and Jedi High Council member (JO) per archivum.wiki. Canon status unclear; fan-wiki source.","bio":"Bela Kiwiiks was a Togruta female who served as a Jedi Master and mentor during the Great Galactic War and the subsequent Cold War between the Galactic Republic and the Sith Empire. A respected scholar and battlefield commander, she was known for her calm insight, her dedication to her Padawans, and her role in early Republic operations following the Treaty of Coruscant. Born on Shili, Kiwiiks was identified as Force‑sensitive early in life and brought to the Jedi Temple on Coruscant for training. She excelled in diplomacy, telekinesis, and battlefield coordination, eventually rising to the rank of Jedi Master. Her measured temperament and strategic clarity made her a valued teacher within the Order.  During the Great Galactic War, Kiwiiks participated in several defensive campaigns, often serving as a stabilizing presence in chaotic theaters of conflict. After the Treaty of Coruscant, she relocated to Tython to help reestablish the Jedi Order’s ancient homeworld and train new generations of Jedi. She became the master of Kira Carsen and played a key role in the Flesh Raider crisis, supporting the newly arrived Jedi Knight who would later become the Hero of Tython. Kiwiiks was later captured by Darth Angral and used as leverage in his campaign against the Republic, but she remained steadfast and provided critical intelligence once rescued.  Kiwiiks survived her imprisonment and returned to the Jedi Order, continuing her work as a teacher and advisor. Though later records of her activities are limited, she remained an active Jedi Master during the early years of the Cold War, contributing to the Order’s recovery and the training of future Jedi."},{"b":19,"c":"TOR_BOWDAAR","f":"TOR","n":"Bowdaar","v":"Bowdaar","p":"bowdaar","e":"CRIM","t":"named legends era_old_republic male non_sensitive","w":"Wookiee freed by Drooga who joined the smuggler crew until the Eternal Empire rose (CRIM, independent smugglers).","bio":"Bowdaar was a Wookiee male who worked alongside the Voidwolf during the Cold War and Second Great Galactic War. Captured and sold to Drooga the Hutt on Nar Shaddaa, Bowdaar was forced to fight in Gladitorial Arenas to pay off his previous owner\u0027s gambling debt. When the smuggler later known as the Voidwolf arrived on Nar Shaddaa, Bowdaar was in the middle of a fight against a gang of Kaleesh warriors. After assisting the smuggler against Rogun the Butcher\u0027s bounty hunter Zank Helrott, Drooga set Bowdaar free, who then joined the smuggler\u0027s crew until the Eternal Empire rose to power."},{"b":19,"c":"TOR_BRIANNA","f":"TOR","n":"Brianna","v":"Brianna|Brianna (Jedi)","p":"brianna","e":"JO","t":"named legends era_old_republic jedi female","w":"Echani Handmaiden who became a Jedi Knight under Surik (JO).","bio":"Brianna was an Echani female Handmaiden and Jedi Knight during the Dark Wars. Considered by her sisters as the Last of the Handmaidens and the only one to carry the face of their mother, Brianna, under orders from Atris, joined the Exile\u0027s crew. As her respect for Surik grew, she rejected her oath to never become a Jedi and asked Surik to train her, which Surik accepted. After Surik was presumed dead on Dantooine, Brianna returned to Telos and was confronted by her sisters. Rejecting the title of Handmaiden, she overpowered her sisters and accepted her real name."},{"b":19,"c":"TOR_C2","f":"TOR","n":"C2-N2","v":"C2-N2","p":"c2-n2","e":"","t":"named legends era_old_republic non_sensitive","w":"Steward droid who served Revan and Surik\u0027s crews; no separate faction beyond TOR.","bio":"C2-N2 was a Hollis-series steward droid, a trait he shared with all other members of his product line.  He doted upon his various masters and maintained their starships while they were out adventuring, from things so mundane as keeping the interior clean to things as meticulous as monitoring the weight of the crew and adjusting their diets to keep them in good shape."},{"b":19,"c":"TOR_CARTH","f":"TOR","n":"Carth Onasi","v":"Carth Onasi","p":"carth onasi","e":"","t":"named legends era_old_republic male non_sensitive","w":"[corrigé] Republic soldier and pilot who was promoted to Admiral (REP).","bio":"Carth Onasi was a Human male who served as one of the amnesiac Revan\u0027s followers during the Jedi Civil War. Born on the planet Telos IV, Carth was a decorated soldier and expert pilot who served the Galactic Republic during the Mandalorian Wars and Jedi Civil War under the leadership of his former mentor Saul Karath, and Revan. After the Jedi Civil War, Carth was promoted to the rank of Admiral, and continued to proudly serve the Galactic Republic."},{"b":19,"c":"TOR_CAY","f":"TOR","n":"Cay Qel-Droma","v":"Cay Qel-Droma","p":"cay qel-droma","e":"JO","t":"named legends era_ancient jedi male","w":"Jedi Knight in the Great Sith War (JO).","bio":"Cay Qel-Droma was a Human male Jedi Knight who served during the Great Sith War. Trained on Arkania alongside his brother, Ulic Qel-Droma, Cay was known for his mechanical skill, loyalty, and quiet strength. He fought in key conflicts such as the Beast Wars of Onderon and the Naddist Uprising, standing firm against the rising tide of Sith influence. Despite Ulic’s fall to the dark side, Cay remained devoted to redeeming him, ultimately confronting his brother in a tragic duel on Ossus. Cay’s death at Ulic’s hands became a pivotal moment in the war, sparking Ulic’s remorse and contributing to the eventual defeat of Exar Kun."},{"b":19,"c":"TOR_DORAK","f":"TOR","n":"Dorak","v":"Dorak","p":"dorak","e":"JO","t":"named legends era_old_republic jedi male","w":"Jedi Master on the Dantooine Jedi Enclave Council (JO).","bio":"Dorak was a Human male Jedi Master, member of the Dantooine Jedi Enclave Council, and Chronicler of the Jedi during the Mandalorian Wars and Jedi Civil War. When the amnesiac Revan returned to Dantooine to train to become a Jedi, Dorak was among one of many Masters that assisted in re-training the former Sith Lord. After the Jedi Civil War ended, Dorak was killed during the Conclave of Katarr by Darth Nihilus."},{"b":19,"c":"TOR_DUSTIL","f":"TOR","n":"Dustil Onasi","v":"Dustil Onasi","p":"dustil onasi","e":"DRSE","t":"named legends era_old_republic sith redeemed male","w":"Sith acolyte who served Revan\u0027s Sith Empire (DRSE) before leaving the Sith.","bio":"Dustil Onasi was a Human male Sith Acolyte and son of Carth Onasi. Born on Telos IV, Dustil was raised mostly by his mother Morgana Onasi as his father was constantly absent due to his dutues in the Republic. After Telos IV was bombed, Dustil was presumed dead, but had infact survived and was brought to the Sith Academy. Dustil was reunited with his father while Revan was searching for the Korriban star map. Revan was able to convince Dustil to leave the Sith with evidence that his friend Selene, who he developed feelings for, was murdered by the Sith he swore to serve."},{"b":19,"c":"TOR_GNOST_DURAL","f":"TOR","n":"Gnost-Dural","v":"Gnost-Dural","p":"gnost-dural","e":"JO","t":"named legends era_old_republic jedi male","w":"Kel Dor Jedi Master and Keeper of the Archives (JO) per archivum.wiki. Canon status unclear; fan-wiki source.","bio":"Gnost-Dural was a Kel Dor male Jedi Master who served the Jedi Order during the Great Galactic War and subsequent conflicts. Trained on Coruscant, he began chronicling his experiences early on, uncovering vital historical records that shaped the Jedi\u0027s understanding of their past. Knighted during the outbreak of the Great Galactic War, he served on the front lines, defeated Sith opponents, and contributed to major Republic victories before returning to research the origins of the Sith Empire. As Jedi Master and keeper of the Archives, he revised Jedi history, fought former apprentice Darth Karrid, and later helped establish a hidden Jedi colony on Ossus after the Eternal Empire\u0027s rise. Gnost-Dural continued to guide the Jedi through crises, including the Meridian Complex battle and efforts to restrain Darth Malgus, solidifying his legacy as a warrior-scholar instrumental in preserving and shaping the Jedi Order."},{"b":19,"c":"TOR_HAVOC","f":"TOR","n":"Havoc Squad Trooper","v":"Havoc Squad Trooper|Havoc Squad Trooper","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"[corrigé] Republic special forces unit; members defected to the Sith Empire (RSE) and later went rogue under Aric Jorgan (CRIM).","bio":"Havoc Squad was an elite group of Republic Special Forces that took part in the conflicts against the Resurgent Sith Empire. Initially under the leadership of Jace Malcolm, Havoc Squad saw a major victory against the Sith Empire on Alderaan, a battle which saw to Jace becoming severely injured. After Jace was promoted, Havoc Squad was left in the care of Harron Tavus, who later defected to the Sith Empire along with the majority of Havoc Squad. Havoc Squad would again be rebuilt under the command of a loyal Republic Soldier but would fragment after the Eternal Empire rose to power. Under the command of Aric Jorgan, Havoc Squad went rogue."},{"b":19,"c":"TOR_HK47","f":"TOR","n":"HK-47","v":"HK-47","p":"hk-47","e":"DRSE","t":"named legends era_old_republic non_sensitive","w":"Assassin droid built by Revan; served Revan\u0027s Sith forces (DRSE) and later Surik.","bio":"HK-47 was an assassin droid who served as one of the amnesiac Revan\u0027s followers during the Jedi Civil War, and as one of Meetra Surik\u0027s followers during the Dark Wars. HK-47 was constructed by Revan himself, seperated, and reunited years later. After the Jedi Civil War, HK-47 was severely damaged and later repaired by the Jedi Exile, Meetra Surik. After assisting Surik against the Sith Triumverate, HK-47 was reunited with Revan 300 years later. After the events of the Galactic War, HK-47 was eventually destroyed in 1 ABY by a group of spacers on the planet Mustafar."},{"b":19,"c":"TOR_JKREVAN","f":"TOR","n":"Revan","v":"Revan|Revan (Jedi Master)|Revan (General)","p":"revan","e":"JO DRSE REV","t":"named legends era_old_republic jedi sith fallen_jedi redeemed male","w":"[corrigé] Republic general and Jedi Master (REP, JO), who led Revan\u0027s Sith Empire (DRSE) before redemption.","bio":"Revan was a human male Jedi Master who fought for the Republic during the Mandalorian Wars, Jedi Civil War, and Great Galactic War. A brave general during the Mandalorian Wars, Revan, along with Alek, were corrupted to the dark side by the Sith Emperor Vitiate. While heading the Sith Empire, Revan was caught off guard by his apprentice and a strike team led by Bastila Shan allowed him a second chance at life. Redeemed to the light, Revan took the fight to Darth Malak, and at the war\u0027s end, was promoted to Jedi Master. After his capture and imprisonment, Revan was awakened 300 years later and led a campaign to annihilate the Resurgent Sith Empire."},{"b":19,"c":"TOR_JOLEE","f":"TOR","n":"Jolee Bindo","v":"Jolee Bindo","p":"jolee bindo","e":"JO","t":"named legends era_old_republic jedi male","w":"Former Jedi who returned to the Jedi Order after the Civil War (JO).","bio":"Jolee Bindo was a Human male who served as one of the amnesiac Revan\u0027s followers during the Jedi Civil War. Self-exiled after his wife was struck down, Jolee spent the next twenty years exploring the Shadowlands of Kashyyyk before running into the amnesiac Revan. After assisting him with finding the Kashyyyk Star Map, Jolee joined Revan\u0027s crew. After the Jedi Civil War ended, Jolee returned to the Jedi Order but disappeared by the end of the Dark Wars."},{"b":19,"c":"TOR_JONAS","f":"TOR","n":"Jonas Balkar","v":"Jonas Balkar","p":"jonas balkar","e":"","t":"named legends era_old_republic male non_sensitive","w":"Republic intelligence agent; no faction beyond TOR.","bio":"Jonas Balkar was a human male intelligence agent for the Old Republic during the Galactic Cold War.  He was assisted at multiple points in his career by the leader of Havoc Squad in escalating conflicts ranging from stopping a bank robbery to convicting a senator of high treason.  He ultimately helped broker the agreement between the Eternal Alliance and the Republic, combining their strengths against the Sith in the Great Galactic War."},{"b":19,"c":"TOR_JUHANI","f":"TOR","n":"Juhani","v":"Juhani","p":"juhani","e":"JO","t":"named legends era_old_republic jedi female","w":"Cathar Jedi who continued to serve the Jedi Order (JO).","bio":"Juhani was a Cathar female who served as one of the amnesiac Revan\u0027s followers during the Jedi Civil War. Freed from servitude and brought into the order by Revan, Juhani struggled as a Jedi, and in frustration attacked her Master, Quatra, in anger. Believing she fell to the Dark Side, she retreated to an ancient grove where she was later confronted by the amnesiac Revan, who convinced her to return to the order and seek forgiveness. After the Jedi Civil War, Juhani continued to serve the Jedi Order."},{"b":20,"c":"TOR_KAEDAN","f":"TOR","n":"Jaric Kaedan","v":"Jaric Kaedan","p":"jaric kaedan","e":"JO","t":"named legends era_old_republic jedi male","w":"Jedi Master on the Jedi High Council during the Cold War, so Jedi Order membership.","bio":"Jaric Kaedan was a Human male Jedi Master who served on the Jedi Council during the Cold War and the renewed Great Galactic War. Rising to the rank of Jedi Knight during the Great Galactic War, he led a mission that captured the Dread Masters and secured vital intelligence from an Imperial dreadnought. Known for his formidable combat skills, Kaedan mastered a variation of Form VII lightsaber combat and earned a reputation as a living weapon guided by the Force. He fought alongside other Jedi, including Satele Shan and Syo Bakarn, in the bat
