ne Commando who led the Bad Batch during the Clone Wars. Like all members of the Bad Batch, Hunter was genetically mutated, and had heightened senses which allowed him to feel electromagnetic signals. The Bad Batch was called in to assist during the Battle of Anaxes, during which they, along with Captain Rex and Anakin Skywalker, worked a rescue mission to save the ARC Trooper Echo from his imprisonment. After Order 66 was issued, Hunter along with the rest of the Bad Batch took up mercenary work."},{"b":15,"c":"REP_IMA","f":"REP","n":"Ima-Gun Di","v":"Ima-Gun Di","p":"ima-gun di","e":"JO","t":"named canon era_prequel jedi male","w":"Kajain\u0027sa\u0027Nikto Jedi Master and general (Wookieepedia, via search), so Jedi Order membership (JO).","bio":"Ima-Gun Di was a Kajain\u0027sa\u0027Nikto male Jedi Master during the Clone Wars. During the early stages of the war, Ima-Gun Di was dispatched to Ryloth in an effort to repel a full Separatist Invasion against the native Twi\u0027lek people. Along with Captain Keeli and resistance fighter Cham Syndulla, Ima-Gun Di was successful in repelling the Separatist Forces at the cost of his own life and the soldiers under his command to allow the Twi\u0027lek civilians to receive shipments of food and water from the Republic."},{"b":15,"c":"REP_ITHORIANSENATOR","f":"REP","n":"Senator Stonk","v":"Senator Stonk","p":"stonk","e":"","t":"named canon era_prequel male non_sensitive","w":"Ithorian Senator of Ithor and Ottega per bio; no extra faction.","bio":"Stonk was an Ithorian male who served as Senator of Ithor and the Ottega System during the Clone Wars. At one point during the war, Stonk retracted his vote from Padm  Amidala\u0027s proposal to stop the production of additional Clone Troopers, out of concern for his public opinion."},{"b":15,"c":"REP_JARO","f":"REP","n":"Jaro Tapal","v":"Jaro Tapal","p":"jaro tapal","e":"JO","t":"named canon era_prequel jedi male","w":"Lasat Jedi Master and general, Cal Kestis\u0027s master (Wookieepedia, via search), so Jedi Order membership (JO).","bio":"Jaro Tapal was a Lasat male Jedi Master who led the Bracca Campaign during the Clone Wars. As master to Cal Kestis, Jaro led the 13th Clone Trooper Battalion while at the same time training Cal Kestis in the ways of the Force. After Order 66 was issued, Tapal engaged the Clone Troopers head on as Cal made his way to the escape pods. After securing a pod, Jaro was mortally wounded by the Clone\u0027s blaster fire. Dying, Jaro told Cal to wait for the Jedi Council\u0027s signal and reminded him to trust only in the Force before he passed away."},{"b":15,"c":"REP_JEK","f":"REP","n":"Jek","v":"Jek","p":"jek","e":"","t":"named canon era_prequel male non_sensitive","w":"Coruscant Guard shock trooper on the Rugosa escort mission per bio and Wookieepedia; sources disagree on his unit. No extra faction.","bio":"Jek was a Clone Shock Trooper of the Coruscant Guard and served under Grand Master Yoda during the Clone Wars. During the mission to Rugosa, Jek was one of three Clone Troopers that accompanied Yoda as his escorts through the world. Demoralized, Yoda counseled Jek telling him that weapons did not win battles, but the mind did instead. With this newfound wisdom, Jek, Thire, and Rys came to Yoda\u0027s aid when he needed it most, and completed their mission."},{"b":15,"c":"REP_JESSE","f":"REP","n":"Jesse","v":"Jesse|Jesse (Phase I)","p":"jesse","e":"","t":"named canon era_prequel male non_sensitive","w":"501st trooper per bio (Saleucami, Umbara); no extra faction.","bio":"Jesse was a Clone Trooper of the 501st Legion who served under Jedi generals Anakin Skywalker and Pong Krell during the Clone Wars. Taking part in the hunt for General Grievous on Saleucami, Jesse assisted with Rex\u0027s recovery after the latter was shot. During the Battle of Umbara, Jesse, along with Fives and Hardcase, took part in an illegal operation to destroy a Separatist supply ship. Fives and Jesse were ordered for execution by Pong Krell, but after a short speech by Fives, were both spared and later released from custody."},{"b":15,"c":"REP_JET","f":"REP","n":"Commander Jet","v":"Commander Jet","p":"jet","e":"","t":"named canon era_prequel male non_sensitive","w":"Commander of the flame troopers under Ki-Adi-Mundi per bio; no extra faction. Identity from bio only, not searched.","bio":"Commander Jet was a Clone Commander who led the flame troopers and served under Jedi Master Ki-Adi-Mundi during the Clone Wars at the Second Battle of Geonosis."},{"b":15,"c":"REP_JOCASTA","f":"REP","n":"Jocasta Nu","v":"Jocasta Nu","p":"jocasta nu","e":"JO","t":"named canon era_prequel jedi female","w":"Human Jedi Master and head Temple Librarian per bio, so Jedi Order membership (JO).","bio":"Jocasta Nu was a Human Female Jedi Master who served as the head Librarian of the Jedi Temple in the decades prior to the fall of the Jedi Order. A stern individual, Jocasta was highly protective of the knowledge stored within the Temple, even being so prideful as to dismiss things as non-existent if the archives did not contain a piece of information. After the fall of the Jedi Order, Jocasta Nu attempted to save what knowledge remained in the archives, but was no match for Darth Vader, who struck her down."},{"b":15,"c":"REP_JUROKK","f":"REP","n":"Jurokk","v":"Jurokk|Jurokk (Temple Guard)","p":"jurokk","e":"JO","t":"named legends era_prequel jedi male","w":"Human Jedi Master and Jedi Temple Gate Master per Wookieepedia (Legends, via search), so Jedi Order membership (JO).","bio":"Jurokk was a Human male who served as Gate Master for the Jedi Temple during the final years of the Galactic Republic. During the night of Operation: Knightfall, Jurokk was confronted by the newly christened Darth Vader, who demanded to know the whereabouts of Shaak Ti. After informing Skywalker of Shaak Ti\u0027s location, Jurokk questioned what was happening, to which Vader simply responded by igniting his saber into Jurokk\u0027s head, killing him instantly, and making him the first victim of the Great Jedi Purge."},{"b":15,"c":"REP_KAMINO_SECURITY","f":"REP","n":"Kamino Security","v":"Kamino Security","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Kaminoan security clone troopers per bio; no extra faction.","bio":"Kamino Security Guards were Clone Troopers that were assigned to protect the cloning facilities on Kamino during the Clone Wars."},{"b":15,"c":"REP_KEELI","f":"REP","n":"Captain Keeli","v":"Captain Keeli","p":"keeli","e":"","t":"named canon era_prequel non_sensitive","w":"Clone Trooper Captain under Ima-Gun Di on Ryloth per bio; no extra faction.","bio":"Captain Keeli was a Clone Trooper Captain who served under Jedi Master Ima-Gun Di during the Clone Wars. In the initial Separatist assault on Ryloth, Keeli, along with Ima-Gun Di, made a final stand on Ryloth, destroying many droids in the process. Keeli was killed after being shot in the chest twice, and Ima-Gun Di was killed shortly after. Their sacrifice allowed Republic supply ships to break through, delivering supplies to the Twi\u0027leks."},{"b":15,"c":"REP_KELLER","f":"REP","n":"Commander Keller","v":"Commander Keller","p":"keller","e":"","t":"named legends era_prequel male non_sensitive","w":"Clone commander of Galactic Marines on Toola per Wookieepedia mirror (Legends, non-canon); no extra faction. Medium not verified.","bio":"Commander Keller was a Clone Commander who led a special division of Galactic Marines, and served under Jedi General Kai Hudorra during the Clone Wars. After Order 66 was issued, Keller and his squad attempted to execute Kai Huddora, who escaped."},{"b":15,"c":"REP_KELLERAN","f":"REP","n":"Kelleran Beq","v":"Kelleran Beq","p":"kelleran beq","e":"JO","t":"named canon era_prequel jedi male","w":"Human Jedi Master who saved Grogu during Order 66 (The Mandalorian season 3, Jedi Temple Challenge, via search), so Jedi Order membership (JO).","bio":"Kelleran Beq was a Human male Jedi Master who served the Jedi Order during the final years of the Galactic Republic. Known as the Sabered Hand, Kelleran was responsible for overseeing a number of trials for aspiring Jedi Knights. During the night of Order 66, Kelleran rescued the Jedi youngling Grogu from the Clone onslaught, escaping with him from Coruscant."},{"b":16,"c":"REP_KENOBI","f":"REP","n":"Obi-Wan Kenobi","v":"Obi-Wan Kenobi|Obi-Wan Kenobi (Exile)|Obi-Wan Kenobi (Hermit)|Obi-Wan Kenobi (Jabiim)|Obi-Wan Kenobi (Armor)|General Kenobi (Mid-War)|General Kenobi|Obi-Wan Kenobi (Jedi Knight)|Obi-Wan Kenobi (Padawan)","p":"obi-wan kenobi","e":"JO","t":"named canon era_prequel era_imperial jedi male","w":"Jedi Master on the High Council; Jedi Order membership is core to his identity. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Obi-Wan Kenobi was a Human male Jedi Master and member of the Jedi High Council during the Clone Wars. After defeating Darth Maul during the Naboo crisis, Kenobi was promoted to Jedi Knight, with Anakin as his Padawan. During the Clone Wars, Kenobi earned himself the title of The Negotiator, due to his diplomatic skills, and often came into conflict with General Grievous until he killed him. After Order 66 was issued, and a vicious duel with Darth Vader, Kenobi exiled himself to Tatooine, promising to watch over Anakin\u0027s son, Luke Skywalker."},{"b":16,"c":"REP_KI_ADI","f":"REP","n":"Ki-Adi-Mundi","v":"Ki-Adi-Mundi","p":"ki-adi-mundi","e":"JO","t":"named canon era_prequel jedi male","w":"Cerean Jedi Master and High Council member; Jedi Order membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Ki-Adi-Mundi was a Cerean male Jedi Master and member of the Jedi High Council during the Naboo Crisis and the Clone Wars. During the Naboo Crisis, Ki-Adi-Mundi was present when Anakin was being tested by the Council, informing Anakin that they knew he was thinking about his mother. After the Clone Wars broke out, Ki-Adi-Mundi oversaw and led many battles against the CIS. On Mygeeto, near the end of the war, Ki-Adi-Mundi was gunned down by his own soldiers after Order 66 was issued by Darth Sidious."},{"b":16,"c":"REP_KIT","f":"REP","n":"Kit Fisto","v":"Kit Fisto|Kit Fisto (Mon Calamari)","p":"kit fisto","e":"JO","t":"named canon era_prequel jedi male","w":"Nautolan Jedi Master and High Council member; Jedi Order membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Kit Fisto was a Nautolan male Jedi Master and member of the Jedi High Council during the Clone Wars. During the Clone Wars, Kit Fisto took part in a number of battles, even dueling General Grievous to a draw. At the end of the Clone Wars, Kit Fisto joined Mace Windu in a mission to arrest Chancellor Palpatine, then known to be the Sith Lord Darth Sidious. Within the first few seconds of the duel, Kit Fisto was struck down by the Sith Lord."},{"b":16,"c":"REP_KIX","f":"REP","n":"Kix","v":"Kix|Kix (Phase I)","p":"kix","e":"CRIM","t":"named canon era_prequel era_new_republic male non_sensitive","w":"Clone medic of Torrent Company; bio says he later joined the Crimson Corsair pirates, a criminal group. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Kix was a Clone Trooper and Medic of the 501st Legion\u0027s Torrent Company under Captain Rex during the Clone Wars. During the hunt for General Grievous on Saleucami, Kix tended to a wounded Rex after the latter was shot. Near the end of the war, Kix discovered what Fives did before about their bio-chips, and was later locked in a stasis pod. Kix was re-awakened 50 years after the Clone Wars ended and eventually joined the Crimson Corsair Pirates."},{"b":16,"c":"REP_KKRUHK","f":"REP","n":"K\u0027Kruhk","v":"K\u0027Kruhk","p":"k\u0027kruhk","e":"JO","t":"named legends era_prequel era_legacy jedi male","w":"Whiphid Jedi Master who served on the New Jedi Order High Council per bio; Jedi Order membership. Wookieepedia not reachable (HTTP 402), unverified.","bio":"K\u0027Kruhk was a Whiphid male Jedi Master who lived during the Clone Wars, Galactic Civil War, and the Legacy-era. A loyal Jedi through and through, K\u0027Kruhk served with distinction during the Clone Wars, surviving many of the war\u0027s most gruesome events, including a duel with General Grievous. K\u0027Kruhk survived Order 66 and went into hiding, only coming out of it after Luke Skywalker re-established the New Jedi Order. Joining Luke\u0027s order, K\u0027Kruhk went on to serve on the Jedi High Council, a position he held even after Darth Krayt\u0027s death."},{"b":16,"c":"REP_KOFFI","f":"REP","n":"Koffi Arana","v":"Koffi Arana","p":"koffi arana","e":"JO","t":"named legends era_prequel era_imperial jedi male","w":"Jedi Master who survived Order 66 and went into hiding; Jedi Order membership. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Koffi Arana was a Human male Jedi Master who survived the initial stage of Order 66 and went into hiding during the early reign of the Galactic Empire. Koffi and seven other Jedi gathered on Kessel in order to lay a trap for Darth Vader. However, Koffi\u0027s desperation to kill the Sith Lord caused him to act recklessly. After successfully incapacitating Vader, Koffi demanded Vader be killed on the spot, killing Bultar Swan when she refused to do so. As Koffi prepared to strike down Vader, Vader threw a cortosis blade into Koffi\u0027s chest, killing him instantly."},{"b":16,"c":"REP_LAMA","f":"REP","n":"Lama Su","v":"Lama Su","p":"lama su","e":"","t":"named canon era_prequel male non_sensitive","w":"Kaminoan Prime Minister who oversaw the clone army project; no extra faction membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Lama Su was a Kaminoan male who served as Prime Minister of Kamino prior to and during the Clone Wars. Commissioned prior to the Naboo Crisis to create a clone army by Jedi Master Sifo-Dyas, and later Count Dooku, secretly the Sith Lord Darth Tyranus. Over the next ten years until the Clone Wars erupted, Lama Su oversaw the creation of the Grand Army of the Republic."},{"b":16,"c":"REP_LILIT","f":"REP","n":"Lilit Twoseas","v":"Lilit Twoseas","p":"lilit twoseas","e":"JO","t":"named legends era_prequel jedi female","w":"Jedi Master and teacher of K\u0027Kruhk; Jedi Order membership. Wookieepedia not reachable (HTTP 402), unverified; bio spells the name \"Lilt\".","bio":"Lilt Twoseas was a Human female Jedi Master who served the Jedi Order during the final years of the Galactic Republic. As the master of the famed Jedi Master K\u0027Kruhk, Lilit was responsible for teaching K\u0027Kruhk the ways of the Jedi. A year before the invasion of Naboo, Lilit, along with K\u0027Kruh accompanied Mace Windu to the Yinchorri system to quell the Rebellion taking place. On Yinchorri, Lilit and K\u0027Kruhk engaged the rebels while the two were briefly separated by their enemy. Sensing her Padawan would soon be overwhelmed, Lilit sacrificed herself to save K\u0027Kruhk\u0027s life."},{"b":16,"c":"REP_LUMAS","f":"REP","n":"Lumas Etima","v":"Lumas Etima","p":"lumas etima","e":"JO","t":"named canon era_prequel jedi male","w":"Jedi Padawan killed at Geonosis; Jedi Order membership. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Lumas Etima was a Human male Jedi Padawan who served the Jedi Order during the final years of the Galactic Republic. Etima was one of the two hundred Jedi dispatched to Geonosis in order to rescue Padme Amidala, Obi-Wan Kenobi, and Anakin Skywalker. Overwhelmed by the overwhelming number of Battle Droids, Etima was one of the many casualties of the battle."},{"b":16,"c":"REP_LUMINARA","f":"REP","n":"Luminara Unduli","v":"Luminara Unduli","p":"luminara unduli","e":"JO","t":"named canon era_prequel jedi female","w":"Mirialan Jedi Master and commander of the 41st Elite Corps; Jedi Order membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Luminara Unduli was a Mirialan Jedi Master during the Clone Wars. Commander of the 41st Elite Corps, and master of Barriss Offee, she and her Padawan fought in numerous battles during the Clone Wars until Barriss\u0027s fall to the dark side. At the end of the Clone Wars, Luminara fought in the Battle of Kashyyyk until Order 66 was issued, where she was arrested and later executed by her own soldiers. Luminara\u0027s remains were placed in the Empire\u0027s prison, the Spire, as a trap to any Jedi that sought to come rescue her."},{"b":16,"c":"REP_MACE","f":"REP","n":"Mace Windu","v":"Mace Windu","p":"mace windu","e":"JO","t":"named canon era_prequel jedi male","w":"Jedi Master and High Council member; Jedi Order membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Mace Windu was a Human male Jedi Master and member of the Jedi High Council during the Naboo Crisis and Clone Wars. During the Clone Wars, Mace fought and oversaw many battles, growing increasingly suspicious of Palpatine\u0027s rise in power. At the end of the Clone Wars, Mace attempted to arrest Palpatine, then known to be the Sith Lord Darth Sidious. After a vicious duel, Mace prepared to strike the Sith Lord down until he was rescued by Anakin, who severed his hand, allowing Palpatine to launch Mace out of a window to his death."},{"b":16,"c":"REP_MAS_AMEDDA","f":"REP","n":"Mas Amedda","v":"Mas Amedda","p":"mas amedda","e":"GE","t":"named canon era_prequel era_imperial male non_sensitive","w":"Chagrian Vice Chair of the Senate who became Palpatine\u0027s Grand Vizier and head of the Imperial Ruling Council, a significant Galactic Empire role. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Mas Amedda was a Chagrian male who served as Vice Chair of the Galactic Republic\u0027s Senate prior to and during the Clone Wars. Known for his booming voice, calling for order whenever shouting matches erupted in the senate, Mas was one of few individuals who knew Palpatine\u0027s true identity as Sith Lord, Darth Sidious. After the Galactic Empire rose to power, Mas Amedda became Palpatine\u0027s Grand Vizier and head of the Imperial Ruling Council."},{"b":16,"c":"REP_MAVRA","f":"REP","n":"Mavra Zane","v":"Mavra Zane","p":"mavra zane","e":"JO","t":"named legends era_prequel jedi female","w":"Jedi Master who headed the Kashyyyk outpost; Jedi Order membership. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Mavra Zane was a Human female Jedi Master who headed the Jedi Training Outpost on Kashyyyk during the final years of the Galactic Republic. During the Clone Wars, Zane taught a number of students the ways of the Force until Trandoshan Slavers and the armies of the commerce guild invaded Kashyyyk. Zane along with several of her students were captured. Though Zane freed herself and her pupils, she discovered an impending attack on one of the Core Worlds. Ultimately successful in getting the information, Zane knighted her students with the blessing of the High Council."},{"b":16,"c":"REP_MONNK","f":"REP","n":"Commander Monnk","v":"Commander Monnk","p":"monnk","e":"","t":"named canon era_prequel male non_sensitive","w":"Clone Commander of the SCUBA troopers at Mon Cala; no extra faction. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Monnk was a Clone Commander who headed the Clone SCUBA Troopers during the Battle of Mon Cala. Like most Clone Commanders, Monnk reported to Jedi Master Kit Fisto."},{"b":16,"c":"REP_MOTHMA","f":"REP","n":"Mon Mothma","v":"Mon Mothma","p":"mon mothma","e":"REB","t":"named canon era_prequel era_imperial female non_sensitive","w":"Senator who founded the Rebel Alliance and led it, a significant membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Mon Mothma was a Human female who served as Senator of Chandrila during the Clone Wars. She was advocate of peace, and member of the Loyalist Committee, charged with maintaining the integrity of the Republic from within. After the war broke out, Mothma remained on the committee, but was an outspoken opponent of the war. After the Clone Wars ended, Mon Mothma, along with other senators, founded the Rebel Alliance, with her as its leader."},{"b":16,"c":"REP_NABOO1","f":"REP","n":"Naboo Palace Guard","v":"Naboo Palace Guard","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Naboo Royal Security Forces unit; generic guard, not a Republic member. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"The Royal Naboo Security Forces, also called the Naboo Security Forces or Naboo Royal Guards, were the corps responsible for policing the planet of Naboo as well as protecting its monarch and people."},{"b":16,"c":"REP_NABOO2","f":"REP","n":"Naboo Security Guard","v":"Naboo Security Guard","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Naboo Security Forces unit; generic guard. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"The Royal Naboo Security Forces, also called the Naboo Security Forces or Naboo Royal Guards, were the corps responsible for policing the planet of Naboo as well as protecting its monarch and people."},{"b":16,"c":"REP_NABOO3","f":"REP","n":"Naboo Guard","v":"Naboo Guard","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Naboo Royal Guard unit; generic guard. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"The Royal Naboo Security Forces, also called the Naboo Security Forces or Naboo Royal Guards, were the corps responsible for policing the planet of Naboo as well as protecting its monarch and people."},{"b":16,"c":"REP_NABOO4","f":"REP","n":"Naboo Heavy Guard","v":"Naboo Heavy Guard","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Naboo Heavy Guard unit; generic guard. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"The Royal Naboo Security Forces, also called the Naboo Security Forces or Naboo Royal Guards, were the corps responsible for policing the planet of Naboo as well as protecting its monarch and people."},{"b":16,"c":"REP_NAHDAR","f":"REP","n":"Nahdar Vebb","v":"Nahdar Vebb|Nahdar Vebb","p":"nahdar vebb","e":"JO","t":"named canon era_prequel jedi male","w":"Mon Calamari Jedi Knight trained by Kit Fisto; Jedi Order membership. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Nahdar Vebb was a Mon Calamari male Jedi Knight during the Clone Wars. As a young Padawan, Nahdar was trained by the Jedi Master Kit Fisto, earning the rank of Jedi Knight sometime during the early stages of the Clone Wars. On the third moon of Vassek, Nahdar and Fisto reunited in an effort to track down and capture General Grievous. During the mission, Nahdar, acting against Kit Fisto\u0027s orders, engaged Grievous in a duel. After a brief duel, Nahdar was killed by Grievous, his Lightsaber was retrieved by Kit Fisto."},{"b":16,"c":"REP_NAVAL","f":"REP","n":"Clone Naval Officer","v":"Clone Naval Officer","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Clone naval crew for Republic starships; generic clone. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Clone Naval Officers were clone troopers who assisted in crewing Star Destroyers and other starships in the Republic Navy during the Clone Wars."},{"b":16,"c":"REP_OPPO","f":"REP","n":"Oppo Rancisis","v":"Oppo Rancisis","p":"oppo rancisis","e":"JO","t":"named canon era_prequel jedi male","w":"Thisspiasian Jedi Master and High Council member; Jedi Order membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Oppo Rancisis was a Thisspiasian male Jedi Master who served on the Jedi High Council during the Naboo Crisis and the Clone Wars. He joined the order at infancy and came to train under the Jedi Master, Yaddle. At one point, Rancisis was offered the throne of his homeworld, but he declined it to continue to serve the Jedi Order. Eventually, Rancisis was made a Jedi Master, and he took a seat on the High Council. He was known to being present during every Council meeting."},{"b":16,"c":"REP_ORD","f":"REP","n":"Ord Enisence","v":"Ord Enisence","p":"ord enisence","e":"JO","t":"named canon era_prequel jedi male","w":"Skrilling Jedi Master killed by Cad Bane\u0027s plan; Jedi Order membership. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Ord Enisence was a Skrilling male Jedi Master who was active with the Jedi Order at some point during the Clone Wars. After Cad Bane was hired by the Sith Lord, Darth Sidious, to steal a Jedi Holocron, Cad Bane devised a plan, which included the execution of Ord Enisence. The clawdite bounty hunter Cato Parasitti impersonated the former Jedi, and Bane was ultimately successful in carrying out his theft."},{"b":16,"c":"REP_PABLO","f":"REP","n":"Pablo-Jill","v":"Pablo-Jill","p":"pablo-jill","e":"JO","t":"named canon era_prequel jedi male","w":"Ongree Jedi Knight killed on the Invisible Hand; Jedi Order membership. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Pablo-Jill was an Ongree Male Jedi Knight who fought alongside the Jedi assault team sent to rescue Anakin Skywalker, Obi-Wan Kenobi, and Padm  Amidala from Geonosis just prior to the Clone Wars. Near the end of the Clone Wars, aboard General Grievous\u0027s Flagship, the Invisible Hand, Pablo-Jill and Jedi Knight L\u0027lacielo Sageon attempted to rescue Chancellor Palpatine, but were thwarted by the Droid General, who killed them both, tossing their bodies into the vacuum of space."},{"b":16,"c":"REP_PADME","f":"REP","n":"Padme Amidala (Geonosis)","v":"Padme Amidala (Geonosis)|Padme Amidala (Mustafar)|Senator Amidala|Padme Amidala (Nightgown)|Padme Amidala (Purple)|Padme Amidala (Snow Gear)|Padme Amidala (Clone Wars)|Padme Amidala (Pilot)|Senator Amidala|Padme Amidala|Queen Amidala (Black)|Queen Amidala","p":"padme amidala","e":"","t":"named canon era_prequel female non_sensitive","w":"Queen and Senator of Naboo; no extra faction membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Padm  Amidala was a Human female Senator of Naboo during the Clone Wars. As Senator of Naboo prior to the Clone Wars, Padm  reunited with Anakin Skywalker, and eventually the pair fell in love and married in secret. At the end of the Clone Wars, Padm  told Anakin that she was pregnant. After Anakin fell to the dark side, she travelled to Mustafar in an effort to save her husband, but was instead strangled by Vader. Dying, Padm  gave birth to her twin children, Luke and Leia, on Polis Massa, before passing away."},{"b":16,"c":"REP_PALPATINE","f":"REP","n":"Chancellor Palpatine","v":"Chancellor Palpatine|Darth Sidious","p":"sheev palpatine","e":"GE ROT","t":"named canon era_prequel era_imperial sith male","w":"[corrigé] Chancellor who was secretly Darth Sidious, Sith Lord, and then Emperor of the Galactic Empire. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Chancellor Palpatine was a Human male Chancellor of the Republic during the Clone Wars. Born on and Senator of Naboo, Palpatine used the threat that the Trade Federation represented to convince the galaxy to remove then-Chancellor Valorum from office and elect him. Before the Clone Wars broke out, Palpatine was granted emergency powers by the Senate to allow him to retaliate against the CIS. Unknown to the galaxy, save a few individuals, Palpatine\u0027s true identity was Darth Sidious, Dark Lord of the Sith."},{"b":16,"c":"REP_PANAKA","f":"REP","n":"Quarsh Panaka","v":"Quarsh Panaka","p":"quarsh panaka","e":"GE","t":"named canon era_prequel era_imperial male non_sensitive","w":"Naboo Captain who was made a Moff of the Galactic Empire, a significant membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Captain Panaka was a Human male Captain of the Naboo Guard during the Naboo Crisis. Head of Amidala\u0027s security during the Naboo Crisis, Panaka accompanied the Queen on her mission to seek assistance from the Republic. After Amidala became Senator of Naboo, Panaka was replaced with his nephew, Gregar Typho, whereas Panaka continued to serve under Queen Jamilla. When the Galactic Empire rose to power, Panaka was made a Moff."},{"b":16,"c":"REP_PLO","f":"REP","n":"Plo Koon","v":"Plo Koon|Plo Koon (General)|Plo Koon","p":"plo koon","e":"JO","t":"named canon era_prequel jedi male","w":"Kel-Dor Jedi Master and High Council member; Jedi Order membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Plo Koon was a Kel-Dor male Jedi Master and member of the Jedi High Council during the Naboo Crisis and Clone Wars. Before the Clone Wars, Plo Koon brought young Ahsoka Tano, Anakin Skywalker\u0027s future Padawan, to the Jedi Order. During the Clone Wars, Plo fought and oversaw many Republic battles, often teaming up with Ahsoka. At the end of the Clone Wars, Plo Koon was conducting a patrol on Cato Neimoidia, when Order 66 was issued, Plo Koon\u0027s clone escorts shot his ship down, killing him."},{"b":16,"c":"REP_POLICE_DROID","f":"REP","n":"Coruscant Police Droid","v":"Coruscant Police Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Coruscant police droid; generic droid. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Coruscant Police Droids were droids programmed to patrol the capital world of Coruscant."},{"b":16,"c":"REP_PONCHO","f":"REP","n":"Clone Trooper (Poncho)","v":"Clone Trooper (Poncho)","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Clone trooper variant wearing a poncho; generic clone. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"In harsh environments, many clones chose to wear ponchos over their armor in order to provide some degree of camoflauge in their environment as well as to protect themselves from the elements."},{"b":16,"c":"REP_PONDS","f":"REP","n":"Commander Ponds","v":"Commander Ponds","p":"commander ponds","e":"","t":"named canon era_prequel male non_sensitive","w":"Clone Commander who served under Mace Windu; no extra faction. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Commander Ponds was a Clone Commander and served under Jedi Master Mace Windu during the Clone Wars. After first seeing action during the First Battle of Geonosis, Ponds accompanied Mace during the Battles of Ryloth and Malastare. On the Star Destroyer Endurance, Boba Fett shot the core of the ship and crashed the ship onto Vanquor, taking Ponds and other crewman hostage. In a warning transmission to Mace, Aurra Sing executed Ponds after Boba Fett hesistated."},{"b":16,"c":"REP_PONG","f":"REP","n":"Pong Krell","v":"Pong Krell","p":"pong krell","e":"JO CIS","t":"named canon era_prequel jedi male","w":"[corrigé] Besalisk Jedi General during the Clone Wars; Jedi Order membership. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Pong Krell was a male Besalisk Jedi Master who served as a Jedi General during the Clone Wars. During the war, his campaigns produced key victories for the Republic, but also resulted in the highest clone casualty rates of any Jedi general, reflecting his disregard for the individuality and lives of the troopers under his command. During the Battle of Umbara, Pong Krell temporarily commanded the 501st Legion, forcing Captain Rex and company into several hostile situations, eventually tricking them into engaging the 212th Attack Battalion. His treachery exposed, the Clones engaged and captured Krell. As Captain Rex hesitated to execute Krell, Krell was instead executed by the Clone trooper Dogma."},{"b":16,"c":"REP_Prequel_Jedi","f":"REP","n":"Galactic Republic Jedi","v":"Galactic Republic Jedi","p":"generic","e":"JO","t":"generic canon era_prequel jedi","w":"Generic Jedi entry; Jedi Order membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Jedi were a group of Force sensitives that practiced the Light Side of the Force and acted as peacekeepers for the Republic for thousands of years. Despite their command over the Force, the Jedi refused to take direct control of any situation, electing to only intervene when absolutely necessary. This drew controversy from the Republic\u0027s citizens, as the Jedi would take commanding roles during wartime, despite their supposed pacifism."},{"b":16,"c":"REP_QUI_GON","f":"REP","n":"Qui-Gon Jinn","v":"Qui-Gon Jinn","p":"qui-gon jinn","e":"JO","t":"named canon era_prequel jedi male","w":"Jedi Master who discovered Anakin; Jedi Order membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Qui-Gon Jinn was a Human male Jedi Master during the Naboo Crisis. During the Naboo Crisis, Jinn and his Padawan Obi-Wan Kenobi helped Queen Amidala escape Naboo, but with a damaged hyperdrive, they had to land on Tatooine. There, Jinn discovered Anakin Skywalker, and believed he was the Chosen One, destined to destroy the Sith and bring balance to the Force. After Jinn and Kenobi accompanyed Amidala back to Naboo, the two faced off against Darth Maul. Jinn was killed when Maul stabbed him through the stomach."},{"b":16,"c":"REP_QUINLAN","f":"REP","n":"Quinlan Vos","v":"Quinlan Vos|Quinlan Vos (General)","p":"quinlan vos","e":"JO","t":"named canon era_prequel jedi fallen_jedi redeemed male","w":"Jedi Master who fell to the dark side and was later redeemed; Jedi Order membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Quinlan Vos was a Kiffar male Jedi Master during the Clone Wars. Like Qui-Gon Jinn, Vos was considered a maverick of the Jedi, one who did not always follow the Code. During the Clone Wars, Vos teamed with Obi-wan Kenobi to track down Ziro the Hutt. Sometime later, Vos was tasked by the Council to assassinate Dooku, and was teamed with Asajj Ventress. During their mission, Vos was captured and tortured until he succumbed to the dark side, redeemed to the light by the death of Ventress, whom he had fallen in love with."},{"b":16,"c":"REP_R2B1","f":"REP","n":"R2-B1","v":"R2-B1","p":"r2-b1","e":"","t":"named canon era_prequel non_sensitive","w":"Astromech droid of Queen Amidala\u0027s ship; no extra faction. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"R2-B1 was an Astromech Droid who served aboard Queen Amidala\u0027s personal starship at some point prior to the Invasion of Naboo. During Amidala\u0027s escape from the Trade Federation, her ship\u0027s shield generator took damage. R2-B1 and a number of other astromechs, including R2-D2, attempted to repair the damaged generator. During its attempt, R2-B1 was struck by turbolaser fire, destroying it instantly. R2-D2 would go on to repair the generator as the sole-surving astromech."},{"b":16,"c":"REP_REDATH","f":"REP","n":"Que-Mars Redath-Gom","v":"Que-Mars Redath-Gom","p":"que-mars redath-gom","e":"JO","t":"named canon era_prequel jedi male","w":"Weequay Jedi Knight killed at Geonosis; Jedi Order membership. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Que-Mars Redath-Gom was a Weequay male Jedi Knight just prior to the outbreak of the Clone Wars. One of the 200 Jedi sent to Geonosis to rescue Obi-Wan Kenobi, Anakin Skywalker, and Padm  Amidala, Redath-Gom was one of the many casualties within the arena, shot dead by the overwhelming number of battle droids."},{"b":16,"c":"REP_REX","f":"REP","n":"Captain Rex","v":"Captain Rex","p":"rex","e":"REB","t":"named canon era_prequel era_imperial male non_sensitive","w":"Captain of Torrent Company who joined the Lothal Rebels, a significant membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Captain Rex was a Clone Trooper Captain who led Torrent Company of the 501st Legion, and served under Jedi Knight Anakin Skywalker during the Clone Wars. A veteran of the Clone Wars, Rex took part in many battles throughout the war. After Fives was killed, Rex, along with Commander Wolffe and Captain Gregor, removed their bio-chips, and disobeyed Order 66. Living on an AT-TE walker on the planet Seelos, Rex and company were met by the Lothal Rebels. After fighting off the Empire, Rex joined the Lothal Rebels."},{"b":16,"c":"REP_RIG","f":"REP","n":"Rig Nema","v":"Rig Nema","p":"rig nema","e":"JO","t":"named canon era_prequel jedi female","w":"Jedi doctor who treated Yoda; Jedi Order membership. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Rig Nema was a female Jedi doctor who served the Jedi Order during the Clone Wars. Near the end of the war, one of Doctor Nema\u0027s patients was Grand Master Yoda, who had started to hear the disembodied voice of Qui-Gon Jinn, much to the Jedi Council\u0027s concern. She arranged for him to undertake the deprivation ritual. She then placed him into a Bacta Tank and lowered his vitals to allow him to be as close to death as possible so that he could commune with Qui-Gon, a feat which succeeded unbeknownst to her."},{"b":16,"c":"REP_RORON","f":"REP","n":"Roron Corobb","v":"Roron Corobb","p":"roron corobb","e":"JO","t":"named canon era_prequel jedi male","w":"Ithorian Jedi Master killed protecting Palpatine; Jedi Order membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Roron Corobb was an Ithorian male Jedi Master during the Clone Wars. One of the Jedi protecting Palpatine during the Battle of Coruscant, Roron was struck down by General Grievous who then went on to kidnap Chancellor Palpatine."},{"b":16,"c":"REP_RYS","f":"REP","n":"Rys","v":"Rys","p":"rys","e":"","t":"named canon era_prequel male non_sensitive","w":"Clone Shock Trooper who escorted Yoda; no extra faction. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Rys was a Clone Shock Trooper of the Coruscant Guard and served under Grand Master Yoda during the Clone Wars. During the mission to Rugosa, Rys was one of three Clone Troopers that accompanied Yoda as his escorts through the world. Demoralized, Yoda counseled Rys telling him to not draw on inspiration from his enemies, but from himself and those around him. With this newfound wisdom, Rys, Thire, and Jek came to Yoda\u0027s aid when he needed it most, and completed their mission."},{"b":16,"c":"REP_SABE","f":"REP","n":"Sabe","v":"Sabe","p":"sabe","e":"","t":"named canon era_prequel female non_sensitive","w":"Royal handmaiden and decoy of Queen Amidala; no extra faction. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Sab  was a Human female Royal Handmaiden to Queen Padm  Amidala during the Naboo Crisis. During the Naboo Crisis, Sab  switched roles with the queen, acting as her decoy, thus keeping Amidala safe from harm as her most loyal bodyguard."},{"b":16,"c":"REP_SAESEE","f":"REP","n":"Saesee Tiin","v":"Saesee Tiin|Saesee Tiin","p":"saesee tiin","e":"JO","t":"named canon era_prequel jedi male","w":"Iktotchi Jedi Master and High Council member; Jedi Order membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Saesee Tiin was an Iktotchi male Jedi Master and member of the Jedi High Council during the Naboo Crisis and the Clone Wars. During the Clone Wars, Saesee Tiin took part in very few battles, often overseeing operations from the Jedi Temple. At the end of the Clone Wars, Tiin was one of the masters that attempted to arrest Palpatine, then known to be the Sith Lord Darth Sidious. Despite Tiin\u0027s skill as a swordsman, Tiin was almost immediately struck down by Palpatine."},{"b":16,"c":"REP_SCORCH","f":"REP","n":"Scorch","v":"Scorch","p":"scorch","e":"GE","t":"named canon era_prequel era_imperial male non_sensitive","w":"Clone Commando who was later assigned to train the first Stormtroopers, a significant Empire role. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Scorch was a Clone Commando and Demolitions Expert of Delta Squad during the Clone Wars. As a Commando, Scorch, along with Delta Squad, was tasked with more specialized missions unfit for other Clones. Following Boss\u0027s lead on Geonosis, the Republic Assault Cruiser Prosecutor, and Kachirho, the squad was able to clear the way for a full Republic invasion of Kashyyyk, at the expense of Sev, whom Scorch reluctantly left behind. After the Fall of the Republic, Scorch was assigned to train the first generation of Stormtroopers, and attempted to capture the Bad Batch as they rescued Captain Gregor from his imprisonment."},{"b":16,"c":"REP_SENATE_COMMANDO","f":"REP","n":"Senate Commando","v":"Senate Commando","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Senate Commando unit; generic security force. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Senate Commandos were the best of the Senate Guard, an elite security force of the Galactic Republic centered on the galactic capital planet of Coruscant which protected the Republic\u0027s Galactic Senate and the Supreme Chancellor. The Senate Guards were a frequent sight in the halls of the Senate Building, their ceremonial uniforms and robes helping to blend in with the formal settings."},{"b":16,"c":"REP_SENATE_GUARD","f":"REP","n":"Senate Guard","v":"Senate Guard","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Senate Guard unit; generic security force. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Senate Guards were the primary security force for the Supreme Chancellor during the years of the Galactic Republic. After Palpatine was elected Chancellor, the Senate Guards armor was eventually phased out to a more intimidating red, which continued to be used through Palpatine\u0027s reign as Emperor."},{"b":16,"c":"REP_SERRA","f":"REP","n":"Serra Keto","v":"Serra Keto","p":"serra keto","e":"JO","t":"named canon era_prequel jedi female","w":"Human Jedi Knight and Padawan of Cin Drallig; Jedi Order membership. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Serra Keto was a Human Female Jedi Knight who was active by the time of the Clone Wars. As the Padawan of Jedi Battlemaster Cin Drallig, Serra developed a talent and reputation for swordfighting like her master, often considered as his best student. During the night of Operation: Knightfall, Serra confronted Darth Vader in an effort to stop his assault, but ultimately was no match for the Sith Lord and was killed."},{"b":16,"c":"REP_SEV","f":"REP","n":"Sev","v":"Sev","p":"sev","e":"","t":"named canon era_prequel male non_sensitive","w":"Clone Commando of Delta Squad; no extra faction. Wookieepedia not reachable (HTTP 402), unverified.","bio":"Sev was a Clone Commando and Expert Sharpshooter of Delta Squad during the Clone Wars. As a Commando, Sev, along with Delta Squad, was tasked with more specialized missions unfit for other Clones. Following Boss\u0027s lead on Geonosis, the Republic Assault Cruiser Prosecutor, and Kachirho, the squad was able to clear the way for a full Republic invasion of Kashyyyk. However, after their final mission in Kachirho, Sev went missing in action."},{"b":16,"c":"REP_SHAAK","f":"REP","n":"Shaak Ti","v":"Shaak Ti|Shaak Ti (Felucia)","p":"shaak ti","e":"JO","t":"named canon era_prequel jedi female","w":"Togruta Jedi Master and High Council member; Jedi Order membership. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Shaak Ti was a Togruta female Jedi Master and member of the Jedi High Council during the Clone Wars. Overseeing the testing of clone cadets on Kamino, Shaak Ti saw very little action during the war, only getting involved in one battle which Grievous attacked Tipoca City, the primary cloning facility on Kamino. By the end of the Clone Wars, Shaak Ti returned to Coruscant, where on the night of Order 66, was meditating when Darth Vader stabbed her in the back. The first true victim of the Jedi Purge."},{"b":16,"c":"REP_SHADOW_CLONE","f":"REP","n":"Clone Shadowtrooper","v":"Clone Shadowtrooper","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Clone Shadowtrooper unit; generic clone. Wookieepedia not reachable (HTTP 402), knowledge-based.","bio":"Shadow Troopers were specialized clones who were trained in the art of infiltration, reconnaissance, and sabotage. With their unique-looking armor, Shadow Troopers were capable of disguising themselves as mercenaries or even blending in dark environments. The special equipment installed within their armor ensured that they couldn\u0027t fight alongside a standard clone trooper, and so they would be relegated to sniper duty or other tasks as necessary."},{"b":17,"c":"REP_SHARAD","f":"REP","n":"Sharad Hett","v":"Sharad Hett","p":"sharad hett","e":"JO UFU","t":"named legends era_prequel fallen_jedi male","w":"Jedi Knight who left the Order and became a Tusken warlord on Tatooine (UFU after leaving). Legends per archivum.wiki mirror of Wookieepedia; debut issue not confirmed.","bio":"Sharad Hett was a Human male Jedi Knight who was active in the years prior to the Invasion of Naboo. Considered a hero in the Galactic Republic, Sharad grew tired of the fame and after the destruction of his homeworld, left the Jedi Order and became a Tusken warlord on Tatooine, siring his son, A\u0027sharad Hett. After Ki-Adi Mundi was sent to retrieve him, Sharad was later killed by Aurra Sing during the Tusken\u0027s war against the Hutt\u0027s on Tatooine."},{"b":17,"c":"REP_SIFO_DYAS","f":"REP","n":"Sifo-Dyas","v":"Sifo-Dyas","p":"sifo-dyas","e":"JO","t":"named canon era_prequel jedi male","w":"Jedi Master on the High Council before the Clone Wars; canon (Attack of the Clones). Secret Kaminoan deal was for Sidious, not a faction membership.","bio":"Sifo-Dyas was a Human male Jedi Master who formerly served on the Jedi High Council in the years prior to the Clone Wars. Gifted with the power of foresight, Sifo-Dyas experienced a vision of a great war that would ravage the galaxy, which was rejected and led to his dismissal from the High Council. After secretly contacting the Kaminoans to raise an army, the Sith Lord Darth Sidious ordered his apprentice, Count Dooku, to assume control of the project. After being dispatched to Oba Diah on Chancellor Valorum\u0027s orders to conduct clandestine negotiations with the Pyke Syndicate, the Pykes shot Sifo-Dyas\u0027s shuttle down on Count Dooku\u0027s orders, killing Sifo-Dyas and allowing the Sith to assume full control over the project."},{"b":17,"c":"REP_SINUBE","f":"REP","n":"Tera Sinube","v":"Tera Sinube","p":"tera sinube","e":"JO","t":"named canon era_prequel jedi male","w":"Cosian Jedi Master on the High Council; canon Clone Wars TV.","bio":"Tera Sinube was a Cosian male Jedi Master who served the Jedi Order during the final years of the Galactic Republic. Prior to the Naboo Crisis, Sinube served on the Jedi High Couhcil and oversaw a Jedi Temple outpost on the planet Derra before retiring from both positions by the outbreak of the Clone Wars. During the Clone Wars, Sinube assisted Ahsoka Tano in locating her missing lightsaber after it was stolen by a pickpocket and later sold to the criminal Cassie Cryar. After recovering Tano\u0027s lightsaber, Sinube requested that Ahsoka pass on the lessons learned from their adventure."},{"b":17,"c":"REP_SIRI","f":"REP","n":"Siri Tachi","v":"Siri Tachi|Siri Tachi","p":"siri tachi","e":"JO","t":"named canon era_prequel jedi female","w":"Jedi Master killed at Geonosis; canon (Attack of the Clones), also Clone Wars TV.","bio":"Siri Tachi was a Human Female Jedi Master who was active prior to the outbreak of the Clone Wars. A stubborn individual, Siri grew up alongside Obi-Wan Kenobi, with the two developing strong feelings for each other. Despite this, both rose in the ranks of the Jedi Order, with Siri taking on a Padawan, Ferus Olin, who would be Anakin Skywalker\u0027s rival for a short time. After the Battle of Geonosis, Siri was fatally shot by the bounty hunter Magus while attempting to protect Talesan Fry. Obi-Wan and Siri expressed their love for each other before she succumbed to her injuries and died."},{"b":17,"c":"REP_SISTER","f":"REP","n":"Sister","v":"Sister","p":"generic","e":"","t":"generic canon era_prequel male non_sensitive","w":"Generic clone trooper of the 7th Sky Corps; canon Clone Wars. Not checked on Wookieepedia (no access, fandom returned 402).","bio":"Sister was a Clone Trooper who served in the 7th Sky Corps during the Clone Wars."},{"b":17,"c":"REP_SORA","f":"REP","n":"Sora Bulq","v":"Sora Bulq","p":"sora bulq","e":"JO CIS","t":"named canon era_prequel fallen_jedi male","w":"[corrigé] Weequay Jedi Master who fell and became one of Dooku\u0027s Dark Acolytes (Sith-aligned); canon Clone Wars TV.","bio":"Sora Bulq was a Weequay male Jedi Master who was a member of the Jedi Order during the final years of the Galactic Republic. Considered by many Jedi to be one of the greatest duelists of the order, Sora gained the attention of Mace Windu, who recruited him in an effort to best refine his form, Vaapad. Unfortunately, Sora grew corrupted by the form and in the early days of the Clone Wars, fell to the Dark Side, becoming one of Dooku\u0027s Dark Acolytes. By the final year of the war, Sora\u0027s damage to the order and the Republic itself took its toll, and in a final duel against Quinlan Vos, who rejected the dark side himself, struck down Sora in a final duel."},{"b":17,"c":"REP_STASS","f":"REP","n":"Stass Allie","v":"Stass Allie","p":"stass allie","e":"JO","t":"named canon era_prequel jedi female","w":"Tholothian Jedi Master who led the 91st Mobile Corps; canon Clone Wars TV.","bio":"Stass Allie was a Tholothian female Jedi Master who served in the Jedi Order during the final years of the Galactic Republic. As one of the two hundred Jedi dispatched to Geonosis in order to rescue Padme Amidala, Obi-Wan Kenobi, and Anakin Skywalker, Stass would survive the battle and go on to lead the 91st Mobile Corps alongside Adi Gallia and Mace Windu. While on a routine speederbike patrol with Commander Neyo, Neyo received the order to execute Order 66. Neyo and his squadmate quickly flanked Allie and destroyed her bike, killing Allie in the process."},{"b":17,"c":"REP_STONE","f":"REP","n":"Commander Stone","v":"Commander Stone","p":"commander stone","e":"","t":"named canon era_prequel male non_sensitive","w":"Coruscant Guard clone commander (CC-5869) in the Florrum episodes; canon Clone Wars TV. Republic service only.","bio":"Commander Stone was a Clone Commander and member of the Coruscant Guard under Commander Fox during the Clone Wars. Stone, along with Senator Kharrus and Representive Jar Jar Binks, were dispatched to Florrum to negotiate trading Count Dooku in exchange for giving Hondo\u0027s pirates a large shipment of spice."},{"b":17,"c":"REP_TARADOS","f":"REP","n":"Tarados Gon","v":"Tarados Gon","p":"tarados gon","e":"JO","t":"named legends era_prequel jedi male","w":"Klatooinian Jedi Knight at Geonosis. Legends by my recollection, not verified (no Wookieepedia access).","bio":"Tarados Gon was a Klatooinian male Jedi Knight just prior to the outbreak of the Clone Wars. One of the 200 Jedi sent to Geonosis to rescue Obi-Wan Kenobi, Anakin Skywalker, and Padm  Amidala, Tarados was able to survive the brutal onslaught within the arena. After being evacuated alongside Eeth Koth and Sora Bulq, their LAAT gunship was shot down. While Eeth Koth and Sora Bulq were able to survive, Tarados was not so fortunate, and was killed."},{"b":17,"c":"REP_TECH","f":"REP","n":"Tech","v":"Tech","p":"tech","e":"","t":"named canon era_prequel era_imperial male non_sensitive","w":"Bad Batch clone commando; canon (The Bad Batch). Mercenary work after Order 66 has no matching faction code.","bio":"Tech was a Human male Clone Commando who was a member of the Bad Batch during the Clone Wars. Like all members of the Bad Batch, Tech was genetically mutated, and had heightened abilities with engineering and computer hacking. The Bad Batch was called in to assist during the Battle of Anaxes, during which they, along with Captain Rex and Anakin Skywalker, worked a rescue mission to save the ARC Trooper Echo from his imprisonment. After Order 66 was issued, Tech along with the rest of the Bad Batch took up mercenary work."},{"b":17,"c":"REP_TEMPLE_GUARD","f":"REP","n":"Jedi Temple Guard","v":"Jedi Temple Guard","p":"generic","e":"JO","t":"generic canon era_prequel jedi","w":"Jedi Temple Guards, Jedi-trained sentinels of the Jedi Temple; canon (Revenge of the Sith).","bio":"The role of Jedi Temple Guard was an ancient, honored heritage within the hallowed halls of the Jedi Temple. Anonymous sentinels plucked from the ranks of the Jedi as part of a Knight\u0027s ongoing commitment to the Order. A Jedi Temple Guard would disappear inside the formal robes and identity-concealing masks, the ultimate expression of emotional detachment required in service to a higher calling. Temple Guards carried imposing lightsaber pikes, thick, double-bladed weapons that produced a rare and distinctive yellow blade. "},{"b":17,"c":"REP_THIRE","f":"REP","n":"Commander Thire","v":"Commander Thire","p":"commander thire","e":"GE","t":"named canon era_prequel era_imperial male non_sensitive","w":"Coruscant Guard clone shock trooper (CC-4477); canon Clone Wars TV. GE added for his post-Order 66 Imperial service per archivum.wiki mirror.","bio":"Thire was a Clone Trooper Lieutenant, and later Commander of the Elite Shock Troopers of the Coruscant Guard during the Clone Wars. On a mission to Rugosa, Thire joined Grand Master Yoda on a mission to discuss an alliance with the Toydarian King Katuunko. Demoralized, Yoda counseled Thire, explaining to him the importance to fight another day. After Yoda and Sidious\u0027s vicious duel in the Senate Chamber, Thire reported to Palpatine that Yoda\u0027s body could not be found. Which the Sith Lord immediately demanded they double their search."},{"b":17,"c":"REP_THORN","f":"REP","n":"Commander Thorn","v":"Commander Thorn","p":"commander thorn","e":"","t":"named canon era_prequel male non_sensitive","w":"Clone Shock Trooper commander at Scipio; canon Clone Wars TV. Republic only.","bio":"Commander Thorn was a Clone Commander and Clone Shock Trooper during the Clone Wars. Thorn, along with a detachment of Shock Troopers, accompanied Padm  Amidala to Scipio to oversee Rush Clovis\u0027s takeover of the Intergalactic Banking Clan\u0027s banks. After the takeover was complete, Dooku launched an assault on Scipio, and in the ensuing battle, Thorn was the last clone to be gunned down after being surrounded by the droid army."},{"b":17,"c":"REP_TILLS","f":"REP","n":"Senator Tills","v":"Senator Tills","p":"meena tills","e":"","t":"named canon era_prequel female non_sensitive","w":"Mon Calamari Senator of the Republic; canon Clone Wars TV. Republic only.","bio":"Senator Meena Tills was a Mon Calamari female who served as Senator of Mon Calamari during the Clone Wars."},{"b":17,"c":"REP_TIPLAR","f":"REP","n":"Tiplar","v":"Tiplar","p":"tiplar","e":"JO","t":"named canon era_prequel jedi female","w":"Mikkian Jedi Master, twin of Tiplee; fought at Ringo Vinda in Clone Wars TV.","bio":"Tiplar was a Mikkian female Jedi Master during the Clone Wars. Tiplar, along with her twin sister and fellow Jedi Master Tiplee, fought alongside Anakin Skywalker and the 501st Legion during the Battle of Ringo Vinda. During the battle, Clone Trooper Tup\u0027s inhibitor chip malfunctioned, forcing him to activate Clone Protocol 66 ahead of schedule. Without a chance to react, Tup shot Tiplar dead, costing the Republic the battle, and making Tiplar the first victim of Order 66."},{"b":17,"c":"REP_TIPLEE","f":"REP","n":"Tiplee","v":"Tiplee","p":"tiplee","e":"JO","t":"named canon era_prequel jedi female","w":"Mikkian Jedi Master, twin of Tiplar; fought at Ringo Vinda in Clone Wars TV.","bio":"Tiplee was a Mikkian female Jedi Master during the Clone Wars. Tiplee, along with her twin sister and fellow Jedi Master Tiplar, fought alongside Anakin Skywalker and the 501st Legion during the Battle of Ringo Vinda. During the battle, Clone Trooper Tup\u0027s inhibiator chip malfunctioned, forcing him to murder her twin sister. Later on in the war, Tiplee led an assault on Vizsla Keep 09, where Maul was hiding. During the battle, Tiplee was struck down by Count Dooku, who had briefly allied with Maul."},{"b":17,"c":"REP_TRAINEE","f":"REP","n":"Clone Cadet","v":"Clone Cadet","p":"generic","e":"","t":"generic canon era_prequel male non_sensitive","w":"Generic clone cadet in training on Kamino; canon Clone Wars.","bio":"Clone Cadets were young Clone Troopers that were still in training on Kamino during the Clone Wars. Upon passing their many tests, cadets graduated to serve the Grand Army of the Republic."},{"b":17,"c":"REP_TRAINING_DROID","f":"REP","n":"Training Droid","v":"Training Droid","p":"generic","e":"","t":"generic canon era_prequel non_sensitive","w":"Generic Jedi Temple training droid. Canon/media not verified.","bio":"Within the Jedi Temple were a number of droids designed to simulate the combat styles of Jedi and Sith throughout galactic history. Padawans and Jedi Knights alike would often spar against these droids if their peers were unavailable or unwilling, allowing them to keep their skills with the blade sharp."},{"b":17,"c":"REP_TRAUMA","f":"REP","n":"Commander Trauma","v":"Commander Trauma","p":"commander trauma","e":"","t":"named canon era_prequel male non_sensitive","w":"Advanced Recon Force clone commander under Jedi Master Halsey; canon Clone Wars TV.","bio":"Commander Trauma was a Clone Commander and Advanced Recon Force Trooper who served under Jedi Master Halsey during the Clone Wars. On the planet Devaron at the Temple of Eedit, Trauma, along with his Jedi general, was killed during the battle when Savage Opress entered the fray, cutting down all Republic forces and Separatist forces that got in his way."},{"b":17,"c":"REP_TSUI","f":"REP","n":"Tsui Choi","v":"Tsui Choi","p":"tsui choi","e":"JO","t":"named legends era_prequel jedi male","w":"Aleena Jedi Master at the Conclave of Kessel. Legends by my recollection, not verified (no Wookieepedia access).","bio":"Tsui Choi was an Aleena male Jedi Master during the final years of the Galactic Republic. Having served during the entirely of the Clone Wars, when Order 66 was issued, Tsui Choi survived his attackers. Tsui Choi was present during the Conclave on Kessel, a trap designed to kill the Sith Lord, Darth Vader. One of the final casualties, Tsui Choi was gunned down by the Stormtroopers of the 501st legion."},{"b":17,"c":"REP_TUP","f":"REP","n":"Tup","v":"Tup|Tup (Phase I)","p":"tup","e":"","t":"named canon era_prequel male non_sensitive","w":"Clone trooper of the 501st Torrent Company; canon Clone Wars TV (Umbara, Ringo Vinda). Republic only.","bio":"Tup was a Clone Trooper of the 501st Legion\u0027s Torrent Company under Captain Rex during the Clone Wars. During the Battle of Umbara, Tup, along with his brothers, served with Jedi general Pong Krell. After attempting to arrest Krell for his war crimes, Tup used himself as bait to draw Krell to be strung up by a Vixus tentacle. During the Battle of Ringo Vinda, Tup\u0027s bio-chip began to malfunction, and forced him to execute Order 66 prematurely and killed Jedi general Tiplar. After his chip was removed, Tup died."},{"b":17,"c":"REP_TYPHO","f":"REP","n":"Gregar Typho","v":"Gregar Typho","p":"gregar typho","e":"","t":"named canon era_prequel male non_sensitive","w":"Naboo Security captain and Padme Amidala\u0027s bodyguard; canon (Attack of the Clones / Revenge of the Sith). Naboo security is not a faction code.","bio":"Gregar Typho was a human male and a captain of the Royal Naboo Security Forces before and during the Clone Wars. Typho followed in suite of his Uncle, Quarsh Panaka, who was a Naboo Royal Security Forces captain during the Invasion of Naboo. He served as Senator Padm  Amidala\u0027s head of security before and throughout the Clone Wars, aiding Amidala during the Blue Shadow Virus crisis on Naboo and remained as her personal bodyguard up until the end of the war."},{"b":17,"c":"REP_VALORUM","f":"REP","n":"Finis Valorum","v":"Finis Valorum","p":"finis valorum","e":"","t":"named canon era_prequel male non_sensitive","w":"Supreme Chancellor of the Republic before Palpatine; canon (The Phantom Menace). Republic only.","bio":"Finis Valorum was a Human male who served as Supreme Chancellor of the Republic prior to and during the Naboo Crisis. Seeking to end the Trade Federation\u0027s blockade over Naboo, Valorum called for a special session in the Senate in the hopes of resolving the conflict. Unfortunately, his efforts failed, and infuriated Padm  Amidala and Senator Palpatine. Calling for a Vote of No Confidence against him, Valorum was quickly removed from office, with Senator Palpatine elected to take his place."},{"b":17,"c":"REP_VERGERE","f":"REP","n":"Vergere","v":"Vergere","p":"vergere","e":"JO YV","t":"named legends era_prequel era_new_republic redeemed female","w":"Fosh Jedi Knight who lived among the Yuuzhan Vong and worked with them, then redeemed; Legends (New Jedi Order novels).","bio":"Vergere was a Fosh female Jedi Knight who was active with the Galactic Republic several years prior to the outbreak of the Clone Wars. A rogue student, Vergere took it upon herself to learn as much as she could, including knowledge that was forbidden to her. In the following decades, Vergere lived among the Vong, and re-emerged as the Vong invaded the galaxy. Though committing multiple crimes, including capturing and torturing Jacen Solo, Vergere was redeemed to the light and was later killed during the Battle of Ebaq 9."},{"b":17,"c":"REP_VOOLVIF","f":"REP","n":"Voolvif Monn","v":"Voolvif Monn","p":"voolvif monn","e":"JO","t":"named legends era_prequel jedi male","w":"Shistavanen Jedi Master and Clone Wars general; Legends per archivum.wiki mirror. Media is a best guess.","bio":"Voolvif Monn was a Shistavanen male Jedi Master who served the Jedi Order during the Clone Wars. Considered an isolationist, Voolvif rarely, if ever, partook in gatherings with his peers, taking the Jedi\u0027s rule of isolation and seclusion to an extreme. During the Clone Wars, Voolvif served the as a General in the Grand Army of the Republic, serving on multiple fronts during the war, seeing victory in many."},{"b":17,"c":"REP_WAXER","f":"REP","n":"Waxer","v":"Waxer","p":"waxer","e":"","t":"named canon era_prequel male non_sensitive","w":"Ghost Company clone of the 212th Attack Battalion; canon Clone Wars TV. Republic only.","bio":"Waxer was a Clone Trooper of the 212th Attack Battalion and member of Ghost Company during the Clone Wars. Waxer, along with Boil, took part in the Battle of Ryloth, where he met a young Twi\u0027lek girl, Numa, whom he painted on his helmet to remember her. During the Battle of Umbara, the 212th and 501st Legion were fooled into attacking each other. Waxer was wounded during the battle, and after revealing Pong Krell gave the order, Waxer succumbed to his injuries and died."},{"b":17,"c":"REP_WHIE","f":"REP","n":"Whie Malreaux","v":"Whie Malreaux","p":"whie malreaux","e":"JO","t":"named canon era_prequel jedi male","w":"Jedi Padawan killed by Vader in Revenge of the Sith (film, canon); Legends background via archivum.wiki mirror.","bio":"Whie Malreuux was a Human male Jedi Padawan who served in the Jedi Order during the final years of the Galactic Republic. During the night of Operation: Knightfall, Whie and fellow Padawan Bene sparred together in the Room of a Thousand Fountains, until being confronted by the newly christened Darth Vader. Whie, along with Bene and Jedi Battlemaster Cin Drallig faced off against the Sith Lord. However, none of them were a match for Skywalker, and all three were slain."},{"b":17,"c":"REP_WRECKER","f":"REP","n":"Wrecker","v":"Wrecker","p":"wrecker","e":"","t":"named canon era_prequel era_imperial male non_sensitive","w":"Bad Batch clone commando; canon (The Bad Batch). Mercenary work after Order 66 has no matching faction code.","bio":"Wrecker was a Human male Clone Commando who was a member of the Bad Batch during the Clone Wars. Like all members of the Bad Batch, Wrecker was genetically mutated, and had highly advanced strength, making him capable of resisting blaster fire and was able to lift a crashed LAAT Gunship with minimal effort. The Bad Batch was called in to assist during the Battle of Anaxes, during which they, along with Captain Rex and Anakin Skywalker, worked a rescue mission to save the ARC Trooper Echo from his imprisonment. After Order 66 was issued, Wrecker along with the rest of the Bad Batch took up mercenary work."},{"b":17,"c":"REP_X1","f":"REP","n":"X1","v":"X1","p":"x1","e":"GE","t":"named legends era_prequel era_imperial male non_sensitive","w":"Clone of Falen Grey; Legends. Served as an Imperial stormtrooper per archivum.wiki mirror.","bio":"X1 was a Clone of Falen Grey who fought in the Grand Army of the Republic during the Clone Wars. Initially stationed on Tatooine, X1 and his brother, X2 came under the command of Jedi Master Ferroda, and by the end of the war, joined Ferroda on Ord Mantell. When Order 66 was ordered, X1 and his brother carried out the order. Ultimately, X2 was the one to carry out the order and slew Ferroda. X1 and his brother would join the Empire\u0027s ranks as Stormtroopers, until X2 decided to defect from the Empire. X1 would go on to kill his donor, Falon Grey and mortally wounded X2. X1 would go on to serve the Empire for many years."},{"b":17,"c":"REP_X2","f":"REP","n":"X2","v":"X2","p":"x2","e":"GE REB JO","t":"named legends era_prequel era_imperial redeemed male","w":"Clone of Falen Grey; Legends. Imperial stormtrooper who defected to the Rebel Alliance, later a Jedi per archivum.wiki mirror.","bio":"X2 was a Clone of Falen Grey who fought in the Grand Army of the Republic during the Clone Wars. Initially stationed on Tatooine, X2 and his brother, X1 came under the command of Jedi Master Ferroda, and by the end of the war, joined Ferroda on Ord Mantell. When Order 66 was ordered, X2 and his brother, X1 carried out the order. Ultimately, X2 was the one to carry out the order and slew Ferroda. X2 would come to regret his actions and wanted nothing to do with the Empire, defecting and later being recruited into the alliance by Rahm Kota."},{"b":17,"c":"REP_YADDLE","f":"REP","n":"Yaddle","v":"Yaddle","p":"yaddle","e":"JO","t":"named canon era_prequel jedi female","w":"Jedi Council member in The Phantom Menace; canon film.","bio":"Yaddle was a female of an unknown species who was a member of the Jedi High Council prior to the Clone Wars. During the Invasion of Naboo, Yaddle was present as the young Anakin Skywalker was brought by Qui-Gon Jinn and Obi-Wan Kenobi. Before the Clone Wars erupted across the galaxy, Yaddle stepped down from the High Council and was less active in the affairs of the Jedi."},{"b":17,"c":"REP_YARAEL","f":"REP","n":"Yarael Poof","v":"Yarael Poof","p":"yarael poof","e":"JO","t":"named canon era_prequel jedi male","w":"Quermian Jedi Council member in The Phantom Menace; canon film.","bio":"Yarael Poof was a Quermian male Jedi Master and member of the Jedi High Council during the Naboo Crisis. During the crisis, Yarael was present during the young Anakin Skywalker\u0027s test, witnessing the youth prove his force sensitivity. Yarael eventually died sometime before the Battle of Geonosis, his seat on the Council being taken by Jedi Master Coleman Trebor."},{"b":17,"c":"REP_YODA","f":"REP","n":"Yoda","v":"Yoda","p":"yoda","e":"JO","t":"named canon era_prequel era_imperial jedi male","w":"Jedi Grandmaster; canon film. Only Jedi Order added as an extra.","bio":"Yoda was a male member of the Jedi High Council and Grandmaster of the Jedi Order. Born to a mysterious species, Yoda was brought into the Jedi Order at a young age, and by age 100, earned the title of Jedi Master. After the Clone Wars ended and Order 66 was issued, Yoda fought Sidious in the Senate tower but lost. Exiled on Dagobah, Yoda waited 20 years for Luke Skywalker to seek him out for training. After Luke returned to Dagobah one year later, Yoda, at the age of 900, passed away, becoming one with the Force."},{"b":17,"c":"REP_YULAREN","f":"REP","n":"Wullf Yularen","v":"Wullf Yularen","p":"wullf yularen","e":"GE","t":"named canon era_prequel era_imperial male non_sensitive","w":"Republic admiral who became an Imperial colonel and died at Yavin; canon Clone Wars and Rebels TV.","bio":"Wullf Yularen was a Human male admiral of the Galactic Republic Navy during the Clone Wars. Overseeing a number of battles, often led by Anakin Skywalker, Yularen was regarded by his peers as a crisp, efficient veteran naval officer. He held a sacred respect for the chain of command, a trait which made him assist his Jedi General in any way he could. After the Clone Wars, Yularen was promoted to colonel in the Galactic Empire. Yularen was killed during the Battle of Yavin when the Death Star was destroyed."},{"b":17,"c":"REP_ZAO","f":"REP","n":"Zao","v":"Zao","p":"zao","e":"JO","t":"named legends era_prequel jedi male","w":"Blind Veknoid Jedi Master who refused official missions; Legends per archivum.wiki mirror. Media is a best guess.","bio":"Zao was a blind, elderly male Veknoid Jedi Master, as well as an accomplished chef, who served the Jedi Order during the final years of the Galactic Republic. He did not accept missions from the Jedi High Council, he only wished to follow the will of the Force as he traveled the galaxy. When the Clone Wars began he partook in the Right Of Denial and refused to fight in the war. Due to this, he survived the early stages of the Jedi Purge. He was last seen looking for a lost Jedi youngling who had ran away."},{"b":17,"c":"RES_BB8","f":"RES","n":"BB-8","v":"BB-8","p":"bb-8","e":"","t":"named canon era_sequel non_sensitive","w":"BB-series astromech droid of the Resistance; canon (The Force Awakens). No other faction.","bio":"BB-8 was a BB-series astromech droid who worked with Poe Dameron and the Resistance during the First Order-Resistance War. Tasked by Poe Dameron to store a map to Luke Skywalker\u0027s location on Ahch-To, BB-8 fell in with Rey and later the defected stormtrooper Finn. The three managed to escape Jakku and were ultimately successful in bringing the map to General Leia Organa. BB-8 later worked with Poe Dameron to neutralize a First Order Dreadnought, and continued to work with Poe during the hunt for the former Emperor Palpatine, acting as Poe\u0027s onboard astromech in Poe\u0027s X-wing during the final battle over Exegol."},{"b":17,"c":"RES_FINN","f":"RES","n":"Finn","v":"Finn|Finn (Resistance Hero)|FN-2187","p":"finn","e":"FO","t":"named canon era_sequel male non_sensitive","w":"FN-2187, former First Order stormtrooper who joined the Resistance; canon film.","bio":"Finn, or FN-2187, was a Human male Stormtrooper who fought with the Resistance during the First Order-Resistance Conflict. A former Stormtrooper for the First Order, Finn became disillusioned with the First Order. Rescuing Poe Dameron from custody, the pair escaped with the two separating on Jakku. After meeting Rey, the pair escaped from Jakku and helped the Resistance destroy Starkiller Base. After Starkiller Base was destroyed, Finn, along with Rose Tico, travelled to Canto Bight to track down a master codebreaker. After Palpatine\u0027s return, Finn assisted Poe and Rey with tracking a Sith Wayfinder and fought in the Battle of Exegol."},{"b":17,"c":"RES_HAN_ST","f":"RES","n":"Han Solo","v":"Han Solo","p":"han solo","e":"REB","t":"named canon era_imperial era_sequel male non_sensitive","w":"Rebel Alliance hero in the Original Trilogy, Resistance in the sequels; canon film.","bio":"Han Solo was a Human male smuggler during the First Order-Resistance Conflict. After the Battle of Endor, Han and Leia had one son, whom they named Ben. After Ben fell to the dark side, Han and Leia seperated, and Han went back to his smuggling work until meeting up with Rey, Finn, and BB-8. On Starkiller Base, Han reunited with his son, and tried to bring him home. After a brief emotional struggle, Ben thrust his Lightsaber through his father\u0027s chest. With his last breath, Han stroked his son\u0027s cheek lovingly, before falling to his death. Han\u0027s memory remained in his son\u0027s psyche, and appeared to Kylo after his duel with Rey on Kef Bir."},{"b":17,"c":"RES_LANDO_ST","f":"RES","n":"Lando Calrissian","v":"Lando Calrissian","p":"lando calrissian","e":"REB","t":"named canon era_imperial era_sequel male non_sensitive","w":"Rebel Alliance ally in the Original Trilogy, later led the Citizens\u0027 Fleet in the sequels; canon film.","bio":"By the First Order-Resistance War, Lando retired on the desert world of Pasaana. During Rey\u0027s hunt for the Sith wayfinder that would lead her and the Resistance to Exegol. Lando offered a clue to help Rey and her group, but declined to assist further. Eventually, Calrissian pulled together the Citizen\u0027s Fleet, a collection of pilots and starships from across the galaxy in the Battle of Exegol, helping turn the tide of the battle and eventually helped the Resistance achieve their final victory against the rebirthed Emperor Palpatine and the Sith Eternal."},{"b":17,"c":"RES_LEIA_ST","f":"RES","n":"Leia Organa Solo","v":"Leia Organa Solo","p":"leia organa solo","e":"REB NR","t":"named canon era_imperial era_new_republic era_sequel female non_sensitive","w":"Rebel leader, New Republic senator, then Resistance General; canon film.","bio":"General Leia Organa was a Human female General of the Resistance during the First Order-Resistance Conflict. After the Battle of Endor, Han and Leia had one son, whom they named Ben. Sometime after sending Ben to be trained by Luke, Ben fell to the dark side, causing Han and Leia to separate. Leia felt Han\u0027s death through the Force, and later bid Rey goodbye when she left to search for Luke Skywalker. After the Resistance evacuated Crait, Leia assured Rey they had what they needed to rebel against the First Order. On Ajan Kloss, Leia used what strength she had left to help guide her son back to the light, ending her own life."},{"b":17,"c":"RES_LUKE_ST","f":"RES","n":"Luke Skywalker","v":"Luke Skywalker|Luke Skywalker (Illusion)","p":"luke skywalker","e":"REB JO","t":"named canon era_imperial era_sequel jedi male","w":"Rebel Alliance pilot and Jedi Master who founded a new Jedi Order in the sequels; canon film.","bio":"Luke Skywalker was a Human male exiled Jedi Master during the First Order-Resistance Conflict. Having failed at training a new generation of Jedi and feeling guilty, Luke exiled himself to planet Ahch-To, hoping to die and end the Jedi Order. When he was approached by Rey, asking him to train her, he refused, but later relented and began training her. After Rey departed, Luke confronted Kylo Ren on Crait, projecting himself through the Force. The effort however proved fatal and Luke passed away, finally at peace. After Rey discovered her lineage as a Palpatine, Luke announced his mistake to exile himself and encouraged her to face Palpatine."},{"b":17,"c":"RES_POE","f":"RES","n":"Poe Dameron","v":"Poe Dameron","p":"poe dameron","e":"","t":"named canon era_sequel male non_sensitive","w":"Resistance pilot and leader; canon film. No other faction.","bio":"Poe Dameron was a Human male pilot who fought with the Resistance during the First Order-Resistance Conflict. Captured by the First Order, Poe Dameron was rescued from custody by FN-2187, whom Poe later gave the name Finn. Separated from Finn, Poe later made his way back to the Resistance and led the assault on Starkiller Base, destroying it. After helping the Resistance evacuate D\u0027Qar, Poe found himself at odds with Vice Admiral Holdo. Later, Poe led a defense against the First Order on Crait, and later escaped. After Palpatine\u0027s return, Poe led the Resistance during the Battle of Exegol."},{"b":17,"c":"RES_R2KT","f":"RES","n":"R2-KT","v":"R2-KT","p":"r2-kt","e":"REP","t":"named canon era_prequel era_sequel non_sensitive","w":"Republic Navy astromech in the Clone Wars, later Resistance droid in The Force Awakens; canon. Legends Imperial service not included.","bio":"R2-KT was an R2-series astromech droid who served in the Republic Navy during the Clone Wars, and later the Resistance during the First Order-Resistance War."},{"b":17,"c":"RES_RESIST_TROOP","f":"RES","n":"Resistance Trooper","v":"Resistance Trooper","p":"generic","e":"","t":"generic canon era_sequel non_sensitive","w":"Generic Resistance ground trooper; canon film.","bio":"The Resistance Trooper was the primary ground force of the Resistance\u0027s fledgling military against the First Order."},{"b":17,"c":"RES_REY","f":"RES","n":"Rey","v":"Rey|Rey (Jedi Training)|Rey (Jedi)|Rey Skywalker|Rey Palpatine","p":"rey skywalker","e":"JO","t":"named canon era_sequel jedi female","w":"Jedi trained by Luke Skywalker, Resistance fighter; canon film.","bio":"Rey was a Human female scavenger who fought with the Resistance during the First Order-Resistance War. A gifted individual, Rey made a living as a scavenger on Jakku. Rey eventually found the Lightsaber of Anakin Skywalker, which she trained with on Ahch-To with Luke Skywalker. After learning why Ben Solo fell, she attempted to redeem him, but her efforts failed. After learning the truth of her lineage as Palpatine\u0027s granddaughter, Rey confronted Palpatine on Exegol, and with the spirits of the Jedi empowering her, Rey struck down her grandfather. On Tatooine, Rey rejected her lineage and adopted the name Skywalker as her own."},{"b":17,"c":"RES_ROSE","f":"RES","n":"Rose Tico","v":"Rose Tico","p":"rose tico","e":"","t":"named canon era_sequel female non_sensitive","w":"Resistance technician and officer; canon film. No other faction.","bio":"Rose Tico was a Human female who worked as a technician aboard the Resistance\u0027s flagship, the Raddus, during the First Order-Resistance War. After the resistance evacuated their former base on D\u0027Qar, Rose was tasked with stunning and imprisoning any deserts that attempted to leave the ship as the First Order fleet followed closely behind. After learning of the First Order\u0027s hyperspace tracking technology, Rose worked with Finn to locate a master codebreaker on Cantonica. Though their mission was ultimately a failure as the codebreaker they recruited betrayed them, her actions led Finn toward joining the Resistance permanently. On the salt-covered world of Crait, Rose worked with the Resistance in an effort to take out a battering ram cannon the First Order had deployed to destroy the shield door protecting the base. Though Finn sought to sacrifice himself to destroy the cannon, Rose instead crashed her speeder into his, severely injuring her but saving Finn\u0027s life. A year later, Rose continued her work with the Resistance helping to coordinate Rey, Finn, and Poe Dameron\u0027s mission to locate a way to Exegol to destroy the rebirthed Emperor Palpatine."},{"b":17,"c":"REV_REVAN_REBORN","f":"REV","n":"Revan Reborn","v":"Revan Reborn","p":"revan","e":"DRSE SO","t":"named legends era_ancient fallen_jedi sith male","w":"Revan after the Foundry, leading the Revanite cult against Vitiate; Legends (KotOR). DRSE is Revan\u0027s own Sith Empire; SO for Sith affiliation.","bio":"After his defeat on the Foundry, Revan attempted to die and become one with the Force. However, due to the centuries of torture by the Sith Emperor Vitiate and the Dread Masters, Revan\u0027s being split in two, with his light half dying, and his darker half remaining. Revan took control of the Revanite cult, and under his command, hatched a plan to destroy Vitiate on Yavin IV. Though his efforts ultimately caused the return of Vitiate, Revan had no chance to succeed in his vendetta. Coming to terms, Revan found it within himself to merge with his lighter half, and allowed himself to finally die."},{"b":17,"c":"REV_REVANITE1","f":"REV","n":"Revanite Pursuer","v
