nth (Book of Boba Fett). No extra faction.","bio":"Malakili was a Human male who was Jabba\u0027s rancor Pateesa\u0027s caretaker during the Galactic Civil War. After Pateesa was killed by Luke Skywalker, Malakili wept for the rancor. After Jabba\u0027s death, Malakili was one of the last to leave Jabba\u0027s Palace and considered suicide. However, he was rescued by Cobb Vanth, the marshall of Freetown, who offered him work and, in Malakili\u0027s eyes, purpose again to work with the towns Rontos."},{"b":9,"c":"HC_Nizuc","f":"HC","n":"Nizuc Bek","v":"Nizuc Bek","p":"nizuc bek","e":"","t":"named canon era_imperial male non_sensitive","w":"Empty bio. Wookieepedia-mirror search: human male bodyguard hired by Jabba in Return of the Jedi (Max Rebo band protection). Already HC; no extra faction.","bio":""},{"b":9,"c":"HC_PONDA","f":"HC","n":"Ponda Baba","v":"Ponda Baba","p":"ponda baba","e":"CRIM","t":"named canon era_imperial male non_sensitive","w":"[corrigé] Aqualish thug who worked with Evazan, a Crimson Dawn associate per bio, so CD applies.","bio":"Ponda Baba was an Aqualish male thug who, along with his partner, Cornelius Evazan, smuggled spice for Jabba the Hutt around the time of the Galactic Civil War. Before the Battle of Yavin, Ponda, bored and drunk, attempted to start a fight with the young Luke Skywalker, egged on by Evazan. Luke was saved from the pair by Obi-wan Kenobi, who cut off Ponda Baba\u0027s arm. Evazan attempted to reattach Ponda\u0027s arm, but the procedure nearly killed him."},{"b":9,"c":"HC_REBO","f":"HC","n":"Max Rebo","v":"Max Rebo","p":"max rebo","e":"","t":"named canon era_imperial male non_sensitive","w":"Musician hired by Jabba per bio. No extra faction.","bio":"Max Rebo was an Ortolan male who worked as a musician during the reign of the Galactic Empire. Rebo was often hired by Jabba the Hutt along with his band to provide entertainment for his court. After Jabba\u0027s death, Rebo eventually found work in the Mos Espa cantina known as the Sanctuary."},{"b":9,"c":"HC_REELO","f":"HC","n":"Reelo Baruk","v":"Reelo Baruk","p":"reelo baruk","e":"","t":"named legends era_new_republic male non_sensitive","w":"Rodian kingpin of Nar Shaddaa (Jedi Knight II). Already HC; no extra faction.","bio":"Reelo Baruk was a Rodian male who served as one of Jabba the Hutt\u0027s employees during the Galactic Civil War, and later on kingpin of Nar Shaddaa. During the Empire Reborn crisis, Reelo did business with the Dark Jedi Desann, supplying him with troops to take over Cloud City\u0027s carbonite freezing chambers. He was tracked down by Kyle Katarn, seeking answers as to Desann\u0027s whereabouts, later freeing Lando Calrissian. Aboard Lando\u0027s ship, the Lady Luck, Reelo and a small army of his thugs attempted to destroy the vessel, but all were killed by Katarn."},{"b":9,"c":"HC_RODIAN","f":"HC","n":"Rodian","v":"Rodian|Rodian","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Rodian species. No extra faction.","bio":"Rodians were a reptillian humanoid species hailing from the planet Rodia. Highly recognizable due to characteristics in facial structure and skin pigment, Rodians were infamous for their violent culture, which sprang from the difficulties of life in the jungles of their homeworld. Though they were often relegated to the fringes of galactic society as bounty hunters or criminal henchmen, Rodians were not merely simple-minded thugs. The Rodian people managed to produce artists, merchants, and politicians."},{"b":9,"c":"HC_RODIAN2","f":"HC","n":"Rodian (Female)","v":"Rodian (Female)","p":"generic","e":"","t":"generic canon era_imperial female non_sensitive","w":"Generic female Rodian. No extra faction.","bio":"Rodians were a reptillian humanoid species hailing from the planet Rodia. Highly recognizable due to characteristics in facial structure and skin pigment, Rodians were infamous for their violent culture, which sprang from the difficulties of life in the jungles of their homeworld. Though they were often relegated to the fringes of galactic society as bounty hunters or criminal henchmen, Rodians were not merely simple-minded thugs. The Rodian people managed to produce artists, merchants, and politicians."},{"b":9,"c":"HC_SAELT","f":"HC","n":"Saelt-Marae","v":"Saelt-Marae","p":"saelt-marae","e":"","t":"named canon era_imperial male non_sensitive","w":"Yarkora member of Jabba\u0027s court per bio. No extra faction.","bio":"Saelt-Marae was a Yarkora male who was a member of Jabba the Hutt\u0027s court during the Galactic Civil War."},{"b":9,"c":"HC_SALACIOUS","f":"HC","n":"Salacious Crumb","v":"Salacious Crumb","p":"salacious b. crumb","e":"","t":"named canon era_imperial male non_sensitive","w":"Kowakian monkey-lizard jester in Jabba\u0027s court per bio. No extra faction.","bio":"Salacious B. Crumb was a Kowakian Monkey Lizard male who worked as a jester for Jabba the Hutt during the Galactic Civil War. Often resting near Jabba\u0027s tail, he often expressed his laughter during Jabba\u0027s cruel antics toward those unfortunate enough to be made a victim by him. During the botched execution of Luke Skywalker, Salacious attempted to take revenge of C-3PO by chewing one of his eyes out, but was stopped by R2-D2. Salacious was ultimately killed when Jabba\u0027s sail barge exploded."},{"b":9,"c":"HC_TRANDOSHAN","f":"HC","n":"Trandoshan","v":"Trandoshan|Trandoshan","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Trandoshan hunter species. No extra faction.","bio":"Trandoshans were a lizard-like species hailing from the planet Trandosha. The born-rivals of Wookiees, Trandoshans were fierce hunters, often hunting Wookiees for sport, collecting Wookiee pelts as trophies. Trandoshans lived for the thrill of the hunt, with their young taking a rite of passage, hunting dangerous prey on the moon Wasskah."},{"b":9,"c":"HC_WEEQUAY","f":"HC","n":"Weequay","v":"Weequay","p":"generic","e":"","t":"generic canon era_imperial non_sensitive","w":"Generic Weequay species. No extra faction.","bio":"Weequays were a humanoid species hailing from the planet Sriluur. Their home was a harsh desert planet, leading to the Weequay\u0027s tanned skin tone and rough, sandy, wrinkled skin. Their eyes were dark and slightly recessed into their skull."},{"b":9,"c":"HR_GEODE","f":"HR","n":"Geode","v":"Geode","p":"geode","e":"","t":"named canon era_high_republic male non_sensitive","w":"Vintian navigator of the Vessel in The High Republic (Into the Dark). Wookieepedia-mirror search used. No extra faction.","bio":"Geode was a Male Vintan navigator onboard the starship Vessel during the High Republic. Geode helped transport a group of four Jedi to the dedication of the Starlight Beacon. During the journey Geode helped the group survive a raid by Drengir and Nihil and personally saved the life of one of the Jedi Padawans onboard. Later, Geode would help transport two more Jedi to the Starlight Beacon."},{"b":9,"c":"HR_JECKI","f":"HR","n":"Jecki Lon","v":"Jecki Lon","p":"jecki lon","e":"JO","t":"named canon era_high_republic jedi female","w":"Jedi Padawan of Sol per bio (Theelin-Human hybrid), so JO applies.","bio":"Jecki Lon was a Female Theelin-Human hybrid Jedi Padawan born in 150 BBY during the High Republic and was the apprentice of Jedi Master Sol. Lon and Sol joined the Jedi\u0027s efforts to capture Osha, a murder suspect that had alledgedly killed Jedi Master Indara. Lon was present when Sol cornered Osha on the planet Carlac and helped him detain her. Lon and Sol were called to investigate the burglary of a Jedi Temple on the planet Olega by an individual matching Osha\u0027s description. Upon investigating further, the Jedi learned that a youngling had been responsible for letting an individual who appeared to be Osha into the temple. Lon and the other Jedi tracked Mae down and attempted to apprehend her, but she eventually escaped. Lon and Sol would eventually search for Mae on the planet Jhofar where Lon was eventually ambushed and killed by Mae\u0027s master, a Sith Lord known only as the Stranger."},{"b":9,"c":"HR_YORD","f":"HR","n":"Yord Fandar","v":"Yord Fandar","p":"yord fandar","e":"JO","t":"named canon era_high_republic jedi male","w":"Jedi Knight of the High Republic per bio, so JO applies.","bio":"Yord Fandar was a Male Human Jedi Knight during the High Republic. Upon reaching the rank of Jedi Knight, Fandar took the Zygerrian Tasi Lowa as his Padawan and shortly after the two Jedi were tasked with hunting down a murder suspect named Osha who was accused of killing Jedi Master Indara on Ueda. Fandar knew Osha from her time as a Jedi Padawan before she left the order and convinced her to accompany himself and his Padawan to Coruscant under arrest. After Osha escaped custody on Coruscant during a prison break, Fandar followed her to Carlac and aprehended her once again. It was at this time that Fandar was recruited by Jedi Master Sol to help hunt down Osha\u0027s twin sister, Mae, on the planet Khofar. It was there that Fandar was ambushed by a Sith Lord known as the Stranger and sebsequently killed after a short duel."},{"b":9,"c":"INF_AHSOKA_GENERAL","f":"INF","n":"Ahsoka Tano (General)","v":"Ahsoka Tano (General)","p":"ahsoka tano","e":"JO REP","t":"named noncanon era_prequel jedi female","w":"Alternate-reality Ahsoka in clone armor, serving with the Republic clones (bio). JO and REP.","bio":"In an alternate reality, Ahsoka Tano donned her own set of Clone armor, customized to her liking to honor the Clones she served with."},{"b":9,"c":"INF_AHSOKA_INFINITIES","f":"INF","n":"Ahsoka Tano (Sith Apprentice)","v":"Ahsoka Tano (Sith Apprentice)","p":"ahsoka tano","e":"SO","t":"named noncanon era_prequel sith fallen_jedi female","w":"Sith apprentice sworn to Anakin after her banishment (bio), so SO.","bio":"After her banishment from the Jedi Order, Anakin Skywalker sought out Ahsoka Tano, claiming to have experienced the same persecution she did. With no one else to turn to, and with Anakin\u0027s goading, Ahsoka gave into her rage and struck down Barriss Offee during the night of Operation: Knightfall. Swearing allegiance to Anakin, Ahsoka swore that she would serve him faithfully, provided he succeeded in killing the Sith pre-dating him."},{"b":9,"c":"INF_ANAKIN_INFINITIES","f":"INF","n":"Anakin Skywalker (Dark Lord)","v":"Anakin Skywalker (Dark Lord)","p":"anakin skywalker","e":"SO","t":"named noncanon era_prequel sith fallen_jedi male","w":"Dark Lord Anakin who swore to Palpatine (bio), so SO.","bio":"Forced to watch and do nothing as Darth Maul murdered Padme Amidala right in front of him, Anakin lashed out in anger, only to be brushed aside by the Sith Lord. Offered a chance at revenge by Darth Sidious, Anakin swore allegiance to Palpatine. As the years passed, Anakin dove deeply into the arts of the Dark Side, and would later rob Qui-Gon Jinn\u0027s lightsaber from his tomb within the Jedi Temple during Operation: Knightfall, as a token to help him focus his anger. Within the same hangar where his life changed, Anakin bled the crystal red, his training complete. "},{"b":9,"c":"INF_ASMODEUS","f":"INF","n":"Asmodeus","v":"Asmodeus|Inquisitor Asmodeus|Pash Fairchild","p":"pash fairchild","e":"GE SE","t":"named noncanon era_imperial force_user male","w":"Inquisitor for the Emperor who later served the Sith Eternal (bio), so GE and SE. Identity taken from the variant alias \"Pash Fairchild\" and is unverified. Wookieepedia has no Thirteenth Brother page.","bio":"Otherwise known as the 13th Brother, Asmodeus was an Inquisitor for the Emperor who claimed to have emerged from the fabled World between Worlds. Due to his knowledge of future events, he was able to survive the Emperor\u0027s Purge of the Inquisitorius, The Battle of Endor and eventually serve what would become the Sith Eternal several decades later. It is rumored he was a force sensitive Imperial Pilot prior to his emergence from the World between Worlds."},{"b":9,"c":"INF_AWEC","f":"INF","n":"Shruk","v":"Shruk","p":"sharr eck","e":"JO","t":"named noncanon era_new_republic jedi male","w":"Shruk, trained as a Jedi at the Dantooine Order until 31 ABY (bio), so JO applies.","bio":"Sharr \u0027Shruk\u0027 Eck was a Human Male from Jakku born in 19ABY. Orphaned at an early age, he was trained as an apprentice Droid mechanic by the Toydarian Watberg until 30ABY when he met Dark Forces \u0027DF42\u0027 squad and the Grey Jedi Din Resto, who took Shruk to the Jedi Order on Dantooine. Shruk trained as a Jedi until 31ABY, when the Order collapsed after they were defeated by the Imperial Alliance. In 35ABY he went to search for his childhood friend Wonc Kcey the Wookiee, and rescued him from Trandoshan Slavers. In 37ABY Shruk and Wonc were part of the attempt to hunt down the last surviving Sith, Darth Thorn."},{"b":9,"c":"INF_BASIL","f":"INF","n":"Ermaxis Raygon","v":"Ermaxis Raygon","p":"ermaxis raygon","e":"JO SO","t":"named noncanon force_user male","w":"Grey Jedi who served both the Jedi Order and the Sith at some point (bio). Weakly supported; no Wookieepedia page found, so this proposal is low confidence.","bio":"Ermaxis Raygon was a human Grey Jedi who\u0027s activity in the galactic history was unknown. His history can be confusing due to the lack of proper documentation and rumors. What is known about him was that he served the Jedi Order and the Sith at some time in his life but left due to a change in beliefs. His methods of problem solving were erratic from debate and negotiation to blunt violence. Ermaxis was known to study both light and dark sides of the force in a pursuit to balance his command of the force. Another confirmed fact about him is that he loved music and would play the bass guitar, indulging in various styles of music from Dusk to Tatooine Blues to Herglic Rage-Metal to Marcan Fuzz. It was rumored that he left known space and ventured off into the unknown regions but where he disappeared to is unknown."},{"b":9,"c":"INF_BATTLEDROID","f":"INF","n":"Concept Battle Droid","v":"Concept Battle Droid","p":"generic","e":"CIS","t":"generic noncanon era_prequel non_sensitive","w":"Concept B1 battle droid, a Separatist unit, so CIS.","bio":"The initial concept of the B1-series Battle Droid prior to mass-production."},{"b":9,"c":"INF_BEACHTROOPER","f":"INF","n":"Beachtrooper","v":"Beachtrooper","p":"generic","e":"GE","t":"generic noncanon era_imperial non_sensitive","w":"Stormtrooper variant serving the Empire (bio), so GE.","bio":"Beach Troopers were Stormtroopers that were often found lounging in baths, spas, and other luxury areas, seemingly off-duty, though forced to conceal their identity with a standard Stormtrooper helmet. Though they appeared to be more laidback and lazy than the average Stormtrooper, the Beach Trooper was never unarmed, and would spring into action immediately if any threat arose as they lounged."},{"b":9,"c":"INF_CREMISI","f":"INF","n":"Cremisi Ordo","v":"Cremisi Ordo","p":"cremisi ordo","e":"MANDO MNC","t":"named noncanon era_new_republic male non_sensitive","w":"Mandalorian of Clan Ordo wearing neo-crusader armor (bio), so MANDO and MNC.","bio":"Cremisi Ordo was a male human Mandalorian during the waning days of the Imperial Era and during the reign of the New Republic. Being raised by Clan Ordo being a descendant of a once presitgious clan of Mandalorian. The clans philosophies differed from their fellow mandalorians, Cremisi was raised to see the Jedi as respectable warriors and worthy adversaries as opposed to mortal enemies. Something that his clan referred to as the “Vizsla Doctrine” which Clan Ordo disagreed with. He would take his armor and combine it with a set of ancestral neo-crusader armor and modify it to meet up with modern mandalorian standards. A lightsaber would later be inherited by Cremisi, being taken from a criminal who killed a Jedi in the years after the clone wars, using it in his memory and honor. During the Purge of Mandalore, he would take up odd jobs as a mercenary and bounty hunter, making a decent living for his own survival. In the aftermath of the galactic civil war, Ordo would return to his people to fight the empire, reuniting lost members of Clan Ordo and take the role of leader his own clan."},{"b":9,"c":"INF_DARK_STARKILLER","f":"INF","n":"Dark Apprentice","v":"Dark Apprentice|Dark Apprentice (Jedi Hunter)","p":"galen marek","e":"GE SO","t":"named noncanon era_imperial sith male","w":"Clone of Galen Marek who served as the Dark Apprentice for the Empire and Vader (bio). Sith, so GE and SO.","bio":"The Dark Apprentice was a Clone of Galen Marek who was bred at some point during the Galactic Civil War. Unlike all clones before him, the Apprentice learned to overcome the memories of his predecessor and developed as the perfect clone of Galen Marek. In an alternate reality, the Apprentice struck down an imperfect clone of Galen Marek who attempted to kill Vader out of revenge for Juno Eclipse\u0027s death. Years later, the Apprentice was dispatched to Endor to neutralize the threat to the Death Star. He was successful, killing Han Solo, Chewbacca, and a Jedi-trained Leia in the process. "},{"b":9,"c":"INF_DARTH_JARJAR","f":"INF","n":"Darth Jar Jar","v":"Darth Jar Jar","p":"jar jar binks","e":"SO","t":"named noncanon era_prequel sith male","w":"Infinities theory of Jar Jar as a secret Sith ally of Sidious (bio), so SO.","bio":"Though it was widely believed that Darth Sidious succeeded with his plot to take control of the galaxy on his own by manipulating countless individuals to do his bidding, it was theorized that the seemingly innocent senate representative Jar Jar Binks secretly worked alongside Sidious to make his plans come to fruition while also putting on the guise of a clumsy Gungan of little importance. Whether this was true and the disguise worked in Jar Jar\u0027s favor, allowing him to help Sidious overthrow the Republic and destroy the Jedi Knights, it was ultimately impossible to confirm or deny that Darth Jar Jar was the key behind all that occurred during the final years of the Galactic Republic."},{"b":10,"c":"INF_GALEN_INFINITIES","f":"INF","n":"Galen Marek (Ceremonial Jedi)","v":"Galen Marek (Ceremonial Jedi)|Galen Marek (Sith Assassin)|Galen Marek (General)|Galen Marek (Hooded Combat Gear)|Galen Marek (Utility Gear)","p":"galen marek","e":"JO SO GE","t":"named noncanon era_imperial fallen_jedi male","w":"Infinities alt-reality Galen Marek. Ceremonial Jedi variant counts as JO; Sith Assassin variant served Palpatine (GE, SO). Wookieepedia not checked.","bio":"During his journey, Galen Marek acquired multiple different uniforms, such as a set of Clone Wars utility gear, a uniform used by the ancient guardians of the Jedi, a set of Sith Assassin robes, as well as a set of Jedi Robes intended to honor Jedi who gave the ultimate sacrifice in service to the galaxy."},{"b":10,"c":"INF_HEDERA","f":"INF","n":"Hedera","v":"Hedera","p":"hedera","e":"NS","t":"named noncanon era_imperial force_user female","w":"Former Jedi youngling turned con artist, possessed by a Nightsister spirit at the end of the bio (NS). Fan/Infinities character; no Wookieepedia entry checked.","bio":"A youngling force sensitive escaped from the Jedi temple during the purge, Hedera grew of age in the lower levels of Coruscant never having actually escaped the planet. In adulthood she became a grifter and con-woman using her force sensitivity to her advantage until garnering the attention of the Inquisitorious. Chasing her all the way to Dathomir, Hedera slew her pursuer and was possessed by the spirit of a long dead Nightsister as thanks for the retribution. Her gifts continue to grow as the magik inside her slowly corrupts her mind."},{"b":10,"c":"INF_LEIA_INFINITIES","f":"INF","n":"Leia Organa (Jedi Knight)","v":"Leia Organa (Jedi Knight)","p":"leia organa","e":"REB","t":"named noncanon era_imperial jedi female","w":"Alternate-reality Leia trained as a Jedi Knight; Rebel Alliance leader (REB). Not a Jedi Order member in canon sense, so JO left out.","bio":"In an alternate reality where Luke Skywalker met his demise on Hoth, Leia Organa was trained in the ways of the Force and was able to fulfill her destiny as a Jedi Knight. During the Battle of Endor, Leia proceeded into the heart of the Shield Generator bunker to set the explosive charges, but was confronted by the Dark Apprentice before she was able to proceed. Leia engaged the apprentice in a vicious duel, utilizing the bunker\u0027s many systems to no avail. High atop the bunker, Leia met her demise as the apprentice impaled her with a lightsaber, killing her and securing the Empire\u0027s victory over Endor."},{"b":10,"c":"INF_LINKEN","f":"INF","n":"Linken Anderson","v":"Linken Anderson","p":"linken anderson","e":"JO","t":"named noncanon era_old_republic jedi male","w":"Jedi Temple member and diplomat who left the Order before the Eternal Empire; Jedi Order membership (JO) is significant.","bio":"Linken Anderson was an Echani-Zabrak male who participated in the Cold War and Second Great Galactic War. Though known by some as a master swordsman, Linken often stayed away from the front lines, instead focusing his efforts on diplomacy, and entertaining the youth of the Jedi Temple with his comedic antics, stories, and occasional simulations depicting potential scenarios they might come face to face with on the battlefield. Before the Eternal Empire rose to power, Linken left the Jedi Order and pursued a farmer\u0027s life on Naboo."},{"b":10,"c":"INF_LOOMIS","f":"INF","n":"Loomis","v":"Loomis","p":"loomis","e":"JO","t":"named noncanon era_prequel jedi male","w":"Jedi Knight serving as a Temple Guard during Order 66 era; Jedi Order (JO) membership. Twi\u0027lek per bio.","bio":"Loomis was a Twi\u0027lek male Jedi Knight who served as a Jedi Temple Guard during the final years of the Galactic Republic. Appointed as one of Shakkra Kien\u0027s personal guards, Loomis, along with fellow guardsman Sarek accompanied Shakkra to the temple\u0027s beacon room after Shakkra correctly deduced Darth Vader\u0027s primary objective as being the beacon. Laying a trap for the Sith Lord, Loomis and his fellow guards engaged Vader in a vicious battle, during which Loomis was slain and Vader ultimately emerged victorious."},{"b":10,"c":"INF_MAASTA","f":"INF","n":"Zeldrin","v":"Zeldrin","p":"zeldrin","e":"GE SO","t":"named noncanon era_imperial sith male","w":"Dark-side adept trained by Palpatine and used in assassination missions against the Rebellion; Empire (GE) and Sith (SO) membership.","bio":"Zeldrin was a Human male who was an adept in the Dark side of the force, Born in 18 BBY on Byss to unknown parents. He would be handed over to the recently anointed Emperor Palpatine to be trained in the ways of the Dark side. He would take part in assassination missions against the Rebellion. He would bear witness to the destruction of the Eclipse and the third Death of Emperor Palpatine at Da Soocha. Afterwards he would return to Byss for a brief time before that planet was destroyed too. Left with no purpose he was left to wander the galaxy, leaving the Empire and the Dark side behind."},{"b":10,"c":"INF_MAUL_INFINITIES","f":"INF","n":"Darth Maul (Sith Master)","v":"Darth Maul (Sith Master)","p":"darth maul","e":"SO CIS","t":"named noncanon era_prequel sith male","w":"Sith Lord who served as Separatist Council security on Mustafar (CIS); Sith Order (SO) membership.","bio":"Darth Maul fashioned himself a set of armor to offer himself some protection during the Clone Wars, inspired by a Sith Warrior\u0027s armor during the years of the Ancient Sith. During his duel with Count Dooku, while successful in defeating Dooku and striking him down, Maul\u0027s lightsaber was destroyed, and he created a new black-colored curved hilt, inspired by Dooku\u0027s own. By the end of the Clone Wars, Darth Maul was stationed on Mustafar, providing security for the Separatist Council."},{"b":10,"c":"INF_MAUL_OW","f":"INF","n":"Darth Maul (Old Wounds)","v":"Darth Maul (Old Wounds)","p":"darth maul","e":"SO","t":"named noncanon era_imperial sith male","w":"Alt-reality Maul hunting Kenobi on Tatooine; Sith Order (SO) membership. No significant Empire service stated, so GE left out.","bio":"In an alternate reality, Maul obsessively tracked Obi-Wan Kenobi across the galaxy, from Kamino to Geonosis to Mustafar, and eventually Tatooine. Luring Kenobi out on Tatooine by tracking down Luke Skywalker, Obi-Wan confronted his old rival. Though initially concerned of the Empire\u0027s involvement, Maul assured Kenobi nobody but him knew. Accepting Maul\u0027s challenge, Kenobi engaged the former Sith, eventually bringing Maul to his knees, but upon Kenobi\u0027s hesitation to execute him, Owen instead took the shot, ending Maul\u0027s life."},{"b":10,"c":"INF_MAX","f":"INF","n":"Max","v":"Max","p":"max","e":"","t":"named noncanon era_new_republic male non_sensitive","w":"Bunny-species civilian who helped Kyle Katarn in Baron\u0027s Hed; a brief helper, not a faction member.","bio":"Max was a Bunny male who resided in Baron\u0027s Hed during the early years of the New Republic. During Kyle Katarn\u0027s quest for the Valley of the Jedi, Max met Kyle after Max\u0027s companion left the house to head to the market. The pair worked together to help Kyle get through the city until the pair parted ways after Kyle located a secret entrance to reach the main palace."},{"b":10,"c":"INF_OOTYR","f":"INF","n":"Ootyr","v":"Ootyr","p":"ootyr","e":"HC","t":"named noncanon era_imperial male non_sensitive","w":"Rodian smuggler working for Jabba the Hutt\u0027s criminal empire (HC).","bio":"Ootyr was a Rodian male smuggler who worked for Jabba the Hutt\u0027s criminal empire, transporting spice and other contraband for the Hutt crime lord."},{"b":10,"c":"INF_PALPATINE_INFINITIES","f":"INF","n":"Darth Sidious (Crazed)","v":"Darth Sidious (Crazed)","p":"sheev palpatine","e":"CIS GE SO","t":"named noncanon era_prequel sith male","w":"Alternate-reality Palpatine: Sith Lord running the Republic and the Separatists (CIS), later Emperor (GE), Sith Order (SO).","bio":"Aboard the Invisible Hand, with Dooku at his mercy, Palpatine prepared to goad Anakin into striking him down, but with Qui-Gon\u0027s training, Anakin resisted the temptation and spared Dooku\u0027s life. The act of mercy drove Palpatine mad, and lashed out at Anakin, but ended up escaping with Dooku close behind. Executing Order 66, Palpatine launched an all out assault on the Jedi Temple. Outside the Temple, Palpatine struck down Qui-Gon Jinn and viciously dueled Anakin, truly afraid of the chosen one. However, Anakin was able to overcome his attachments and struck down Palpatine as a true Jedi."},{"b":10,"c":"INF_QUIGON_INFINITIES","f":"INF","n":"Qui-Gon Jinn (Old)","v":"Qui-Gon Jinn (Old)|Qui-Gon Jinn (Ghost)","p":"qui-gon jinn","e":"JO","t":"named noncanon era_prequel jedi male","w":"Jedi Master who trained Anakin in the Jedi Temple; Jedi Order (JO) membership.","bio":"Qui-Gon took on Anakin Skywalker as his Padawan Learner and trained him for years within the Jedi Temple. After Anakin saved his life during Operation: Knightfall, Qui-Gon commanded Anakin to allow him to face Dooku, knowing what may happen, and explaining to Anakin that it\u0027s not his responsibility to save every life, but only those he could, citing that the death of his mother was not his fault, regardless of Anakin\u0027s guilt. After a brutal duel against Dooku, Qui-Gon was struck down by a crazed Darth Sidious. However, remembering Qui-Gon\u0027s lesson, Anakin was able to strike down Palpatine not out of anger, but as a true Jedi."},{"b":10,"c":"INF_R0_GR","f":"INF","n":"R0-GR","v":"R0-GR","p":"r0-gr","e":"","t":"named noncanon era_imperial non_sensitive","w":"Named B1 battle droid serving the Freemakers under the Empire. Freemakers affiliation not verified; no extra faction proposed.","bio":"R0-GR was a B1-series Battle Droid who served the Freemakers during the reign of the Empire."},{"b":10,"c":"INF_REBEL_FRIEND","f":"INF","n":"Rebel Friend","v":"Rebel Friend","p":"generic","e":"REB","t":"generic noncanon era_imperial non_sensitive","w":"Unnamed Rebel who helped Captain Antilles escort C-3PO and R2-D2 (REB), a one-off cameo.","bio":"During the attack on the Tantive IV, a lone Rebel assisted Captain Antilles in escorting C-3PO and R2-D2 to their escape pod."},{"b":10,"c":"INF_REY_SOLANA","f":"INF","n":"Rey Solana","v":"Rey Solana","p":"rey","e":"RES JO","t":"named noncanon era_sequel jedi female","w":"Alt-reality Rey, who adopted the Solana name; Resistance (RES) member and Jedi trained by Luke (JO).","bio":"After the revelation from Kylo Ren that she was never descended from anyone worthy of note, Rey fully adopted her family name Solana. On the long-forgotten world of Mortis, Rey would confront Kylo Ren one final time, and determine the fate of the galaxy once and for all."},{"b":10,"c":"INF_RORIK","f":"INF","n":"Rorik Jyll","v":"Rorik Jyll","p":"rorik jyll","e":"REP JO MANDO REB","t":"named noncanon era_imperial jedi male","w":"Jedi who fought with Titan Squad clones in the Clone Wars (REP), then Mandalorian Clan Bralor (MANDO), Rebellion (REB) and Luke\u0027s Jedi Order (JO).","bio":"Rorik Jyll of Clan Bralor was a Jedi Knight of the Old Republic in the last couple of decades before the rise of the Empire. Before the Clone Wars he rarely stayed at the Jedi Temple, traveling the galaxy and helping the people. During the Clone Wars, he was assigned to the Clone Commando Titan Squad and fought along side the clones and mercenary Yeira Tul. When Order 66 was given, Titan Squad, Rorik and Yeira fled and became Mandalorians of Clan Bralor. He and Yeira married and lived in Mandalorian space until one year before the Battle of Yavin in which they joined the Rebellion. When Luke Skywalker started his new Jedi Order, Rorik joined but never stayed at the Jedi Praxeum for long. Rorik mainly travels the galaxy and fight the Remnant while occasionally helping the Order as a warrior and protector."},{"b":10,"c":"INF_SAREK","f":"INF","n":"Sarek","v":"Sarek","p":"sarek","e":"JO","t":"named noncanon era_prequel jedi male","w":"Kel\u0027Dor Jedi Knight and Temple Guard; Jedi Order (JO) membership.","bio":"Sarek was a Kel\u0027Dor male Jedi Knight who served as a Jedi Temple Guard during the final years of the Galactic Republic. Appointed as one of Shakkra Kien\u0027s personal guards, Sarek, along with fellow guardsman Loomis accompanied Shakkra to the temple\u0027s beacon room after Shakkra correctly deduced Darth Vader\u0027s primary objective as being the beacon. Laying a trap for the Sith Lord, Sarek and his fellow guards engaged Vader in a vicious battle, during which Sarek was slain and Vader ultimately emerged victorious."},{"b":10,"c":"INF_SHAKKRA","f":"INF","n":"Shakkra Kien","v":"Shakkra Kien","p":"shakkra kien","e":"JO","t":"named noncanon era_prequel jedi male","w":"Chagrian Jedi Master and Guardian Overseer of the Jedi Temple; Jedi Order (JO) membership.","bio":"Shakkra Kien was a Chagrian male Jedi Master who served as the Guardian Overseer of the Jedi Temple during the final years of the Galactic Republic. During the night of Operation: Knightfall, Shakkra coordinated the Jedi Temple Guard in an effort to neutralize the newly christened Darth Vader\u0027s attack on the Jedi Temple. Mid-way through the assault, Shakkra correctly deduced that Vader was after the temple\u0027s beacon, and attempt to lay a trap for the Sith Lord. Confronting Vader in the Beacon room along with fellow guardsmen Sarek and Loomis, the three engaged Vader in a vicious battle, where Vader emerged victorious and slew the three guards."},{"b":10,"c":"INF_STARKILLER_INF","f":"INF","n":"Lord Starkiller","v":"Lord Starkiller|Lord Starkiller (Tatooine)|Sith Stalker|Cybernetic Reconstruction|Inquisitor Starkiller","p":"galen marek","e":"SO GE","t":"named noncanon era_imperial sith male","w":"Lord Starkiller as Palpatine\u0027s Sith Assassin in the alt-reality (SO, GE); same person as the Galen Marek entry.","bio":"Lord Starkiller as a Human Male Sith Lord who in an alternate reality, served as Emperor Palpatine\u0027s Sith Assassin during the Galactic Civil War. Once Galen Marek, Galen gave into his anger to strike down Vader. However, after an attempt to strike down Palpatine, Palpatine easily deflected Marek\u0027s attack and subdued him. Awakening on an operating table, Marek was told by Palpatine he would do his bidding and later be cast aside. With no choice, Starkiller served Palpatine as he hunted the plans for the Death Star on Tatooine, and years later led the assault on Echo Base, corrupting Luke Skywalker to the dark side in the process. "},{"b":10,"c":"INF_STREET","f":"INF","n":"Stridus Firon","v":"Stridus Firon","p":"stridus firon","e":"JO","t":"named noncanon era_prequel jedi male","w":"Jedi Knight and Jedi Sentinel in the Republic-era Jedi Order (JO). Wookieepedia not checked.","bio":"Stridus Firon was a Human male Jedi Knight and Jedi Sentinel who served in the Jedi Order during the final years of the Galactic Republic."},{"b":10,"c":"INF_UKERIN","f":"INF","n":"Lord Ukerin","v":"Lord Ukerin","p":"kelron duriami","e":"JO SO ASE","t":"named noncanon era_ancient fallen_jedi sith male","w":"Former Jedi Master Kelron Duriami who became Sith Lord Ukerin during the Great Galactic War (JO origin, SO, ASE).","bio":"Lord Ukerin was a Zabrak male Sith Lord who lived during the time of the Great Galactic War. Once the Jedi Master Kelron Duriami, Kelron left the order to pursue the destruction of an ancient Sith artifact said to corrupt anything to the dark side. Though Kelron was successful, the dark energy of the artifact overtook him, causing him to lose all sense of the light side and his sanity. Calling himself Lord Ukerin, Ukerin turned to taking joy in murder and manipulating others. Tracked down by his Padawan, Ukerin was locked away for millenia, unable to do anything but plot his vengeance and watch the events of Galactic History unfold."},{"b":10,"c":"INF_VADER_INFINITIES","f":"INF","n":"Anakin Skywalker (Redeemed)","v":"Anakin Skywalker (Redeemed)|Anakin Skywalker (Redeemed)","p":"anakin skywalker","e":"JO GE SO","t":"named noncanon era_imperial redeemed male","w":"Redeemed alt-reality Vader who returns as a Jedi Knight (JO); served the Empire (GE) and was Sith (SO) before redemption.","bio":"In an alternate reality, Darth Vader survived the second Death Star after Emperor Palpatine escaped prior to the battle station\u0027s destruction. Donning a set of armor appropriate for his return as a Jedi Knight, Anakin Skywalker vowed to find Palpatine and end him once and for all."},{"b":10,"c":"INF_VALERIA","f":"INF","n":"Valeria","v":"Valeria|Valeria","p":"valeria","e":"JO TOR","t":"named noncanon era_old_republic jedi female","w":"Former Dromund Kaas slave (formerly Ranna) taken as Padawan by Jedi Master Otec (JO); Old Republic era character (TOR). Wookieepedia not checked.","bio":"Valeria, formerly named as Ranna is born as a slave on Dromund Kaas when her parents were slaved and her homeworld was invaded by the Sith Empire. When she turns 11 age she was taken and separated from her parents, her twin sister by Darth Veranus. Her suffering got worse under torment of Veranus for 3 years. Then during an Uprising on Balmorra supported by the Republic, she was rescued by Jedi Master Otec, He discovered that she\u0027s strong in the Force and he took her as his Padawan. For the first time in her whole life Ranna was shown kindness. The Jedi healed her wounds on Tython, she was seeing Master Otec like a father. For 5 years, her Jedi Training was accelerating faster than normal, it was almost a certainty that soon she would become a Jedi Knight until the Jedi Council learned that Darth Veranus had survived. The Council assigned Otec to assemble a strike team but he also asked Ranna to join the strike team, because he wanted to show everyone that she can overcome her past and they departed. When they found Darth Veranus, he was far stronger than they thought, he killed most of the strike team, wounded Master Otec and made Ranna suffer by making her watch their deaths, that drove her insane and she attacked Veranus, Ranna tortured Veranus to death and the Dark Side had claimed her. The Dark Council was impressed that a single Padawan killed a Darth. One of the members, Darth Rav took Ranna as his apprentice and gave her the title of Lord Valeria."},{"b":10,"c":"INF_VOIID","f":"INF","n":"Darth Voiid","v":"Darth Voiid","p":"darth voiid","e":"SO","t":"named noncanon sith male","w":"Sith Lord who trained acolytes through simulations; Sith Order (SO). Era not specified in bio.","bio":"Darth Voiid was a Human male Sith Lord who was active a some point in Galactic History. Voiid was known for his cold and strict demeanor, easily weeding out the unworthy acolytes from those who showed promise. Voiid\u0027s speciality lay in creating lethal simulations to test the upcoming acolytes in deadly trials based on historical records."},{"b":10,"c":"INF_YAO","f":"INF","n":"Yao G","v":"Yao G","p":"yao g","e":"JO","t":"named noncanon jedi male","w":"Jedi Master who created historical simulations; Jedi Order (JO) membership.","bio":"Yao G was a Human male Jedi Master who lived at some point in Galactic History. During his time serving the Jedi Order, Yao often created simulations pitting historical figures against each other in order to further his understanding of the truth behind legends."},{"b":10,"c":"IR_ALORA","f":"IR","n":"Alora","v":"Alora|Alora (Taspir)","p":"alora","e":"SO","t":"named legends era_new_republic dark_jedi female","w":"Twi\u0027lek Dark Jedi of the Disciples of Ragnos (Tavion\u0027s apprentice); Sith Order (SO) as Ragnos cult. Jedi Academy era.","bio":"Alora was a Twi\u0027lek female Dark Jedi and part of the Disciples of Ragnos. As Tavion\u0027s apprentice, Alora was only second in command to her master, overseeing a number of missions for the cult, including stealing Luke Skywalker\u0027s records to learn of locations strong in the Force. During Jaden Korr\u0027s mission to Taspir III, Alora urged Jaden to strike down Rosh, who had fallen to the dark side. When Korr refused, an enraged Alora engaged him in a duel, only to be struck down by the Jedi Knight."},{"b":10,"c":"IR_BOC","f":"IR","n":"Boc Aseca","v":"Boc Aseca","p":"boc aseca","e":"SO","t":"named legends era_new_republic dark_jedi male","w":"Twi\u0027lek Dark Jedi who served Jerec in the hunt for the Valley of the Jedi; Sith Order (SO) as a Dark Jedi.","bio":"Boc Aseca was a Twi\u0027lek male Dark Jedi who served under Jerec during his hunt for the Valley of the Jedi. Discovered as a force-sensitive by Anoon Bondara, Bondara was killed almost immediately after Boc\u0027s birth. When years had passed and Boc was re-discovered, he was deemed too old, causing Boc to feel cheated out of his destiny. Falling to the dark side and joining Jerec\u0027s cause, Boc made himself known as the most sadistic and cruel out of the remaining Dark Jedi. Within the Valley of the Jedi, Boc engaged Kyle Katarn in a ferocious duel, but was slain."},{"b":10,"c":"IR_BRAKISS","f":"IR","n":"Brakiss","v":"Brakiss","p":"brakiss","e":"GE","t":"named legends era_new_republic force_user male","w":"Former Imperial Inquisitorius member (GE); later spy in the New Jedi Order, not a Jedi member.","bio":"Brakiss was a Male Human from the planet Msst. Brakiss was taken by the Empire as a young boy and trained as a member of the Imperial Inquisitorius. After the Battle of Endor, Brakiss was largely removed from galactic events until he was sent to infiltrate the New Jedi Order, posing as a student. Brakiss made every effort to appear as a conventional student at the Jedi Praxeum and even helped the Order defeat the spirit of Exar Kun. However, Luke Skywalker, the Grand Master of the Order, knew that Brakiss was a spy and decided to put him to the test. Brakiss was forced to face his innermost conflicts, but could not bear the trial and instead fled, filled with anger toward Skywalker. Brakiss became dissastisfied with both the Jedi and the Empire and eventually met Dolph, a fallen Jedi who now called himeslf Kueller. Together, the two created a plot to implant bombs in droids manufactured on the planet Telti which would then be shipped all across the galaxy. After a period of time, the two activated the bombs, killing millions. Through a series of events, R2-D2 successfully deactivated all of the bombs and used a droid army to drive Brakiss from the planet. After Kueller\u0027s death at the hands of Leia Organa Solo, Brakiss joined with a group of Imperial Warlords in the Deep Core and founded the Second Imperium. Brakiss began recruiting potential candidates for training at his Shadow Academy, hoping to build a force to rival Skywalker\u0027s Jedi Order. Brakiss would eventually kidnap Jacen and Jaina Solo as well as their friend Lowbacca, forcing them to train at his Shadow Academy, however, the trio managed to escape with the help of Skywalker and Tenel Ka Djo. Brakiss was soon contacted by Emperor Palpatine and began receiving orders from him, though the Emperor refused to grant him an audience. Finally, Palpatine ordered Brakiss and his forces to attack the Jedi Praxeum on Yavin IV. With zeal, Brakiss attacked, only to be bested in a duel with Skywalker. Brakiss retreated back to the Shadow Academy in the midst of the battle and cut through the Royal Guards that barred him from Palpatine. However, Brakiss soon discovered that the Royal Guards had deceived him and that Palpatine had never given him orders: it was the Royal Guards themselves all along. Having killed three of the four remaining guards, one managed to escape from the Academy and activated the self-destruct code, destroying the Academy and killing everyone inside of it, including Brakiss."},{"b":10,"c":"IR_CULTIST","f":"IR","n":"Cultist","v":"Cultist|Cultist (Saber)|Cultist (Grip)|Cultist (Lightning)|Cultist (Drain)","p":"generic","e":"SO","t":"generic legends era_new_republic force_user","w":"Disciples of Ragnos cultist Force user serving Tavion; Sith cult membership (SO).","bio":"Disciples of Ragnos cultists were the obedient followers of Tavion Axmis during her quest to resurrect Marka Ragnos, the ancient Sith Lord. Like Reborn, Cultists were artifically granted command over the Force, but were noticeably weaker than their Reborn cousins. Cultists specialized in their own styles of fighting, some wielded a Lightsaber whereas others only ever used the Force in combat. When Tavion was defeated and the Scepter destroyed, the Cultists all lost their connection to the Force."},{"b":10,"c":"IR_DARKTROOPER","f":"IR","n":"Experimental Dark Trooper","v":"Experimental Dark Trooper","p":"generic","e":"","t":"generic canon era_new_republic non_sensitive","w":"Dark Trooper droid unit of Moff Gideon\u0027s Imperial Remnant in The Mandalorian; IR already assigned.","bio":"The Dark Trooper was an experimental droid unit developed by Moff Gideon\u0027s Imperial Remnant in the years following the Galactic Civil War. The Dark Troopers were stationed aboard Gideon\u0027s cruiser, used only for special assignments and guard duty during emergency situations. Their armor plating was thick enough to provide total protection against blaster fire, and with significant difficulty, Din Djarin managed to defeat one. After capturing Gideon and his cruiser\u0027s bridge, a platoon of troopers threatened to kill Djarin and his companions. With the timely arrival of Luke Skywalker, all of the Dark Troopers were destroyed."},{"b":10,"c":"IR_DESANN","f":"IR","n":"Desann","v":"Desann","p":"desann","e":"SO","t":"named legends era_new_republic dark_jedi male","w":"Chistori Dark Jedi who led the Imperial Remnant\u0027s Reborn army; Sith Order (SO) as a Dark Jedi.","bio":"Desann was a Chistori male Dark Jedi who led the Imperial Remnant. An outcast of his own people, Desann was brought to the Jedi Academy at a young age. Desann trained at the academy, being welcomed for the first time in years, until he grew cold, and struck down a fellow student. Believing the Jedi to be weak, Desann fell to the dark side, seeking out the Valley of the Jedi to create an army of obedient Dark Jedi. During his assault on Yavin IV, Desann was confronted by Kyle Katarn, who struck him down."},{"b":10,"c":"IR_ENOCH","f":"IR","n":"Enoch","v":"Enoch","p":"enoch","e":"GE","t":"named canon era_new_republic male non_sensitive","w":"Night Trooper captain under Thrawn in canon Rebels/Ahsoka; served the Empire (GE). Wookieepedia search returned no page.","bio":"Enoch was a Human male who served as Captain of Grand Admiral Thrawn\u0027s Guard—specifically leading the Night Troopers—during Thrawn\u0027s exile on the extragalactic planet Peridea. During the Battle of Lothal, Thrawn\u0027s Star Destroyer, the Chimaera, was captured by a pod of purrgil summoned by Jedi Ezra Bridger, transporting Thrawn and his forces to Peridea. Years later, Enoch oversaw the transfer of mysterious cargo—believed to be tied to Nightsister magic—from the catacombs of the Dathomiri fortress to the Chimaera. Once the transfer was complete, Enoch coordinated efforts to delay Ahsoka Tano, Ezra Bridger, and Sabine Wren from reaching the Chimaera, deploying starfighters and ground troops to stall their advance"},{"b":10,"c":"IR_GALAK","f":"IR","n":"Galak Fyyar","v":"Galak Fyyar|Galak Fyyar (Cortosis Armor)","p":"galak fyyar","e":"GE","t":"named legends era_new_republic male non_sensitive","w":"Admiral of Lord Hethrir\u0027s Empire Reborn (Imperial Remnant, GE); also aligned with Desann. Per archivum.wiki mirror.","bio":"Galak Fyyar was an Admiral of the Empire Reborn under the Dark Jedi Desann. A scientist seeking new ways to destroy Jedi, Galak invented new technologies allowing ordinary beings to be artifically given the power of the Force, as well as creating armor layered with Cortosis that would resist Lightsabers. On his flagship, the Doomgiver, Galak confronted Kyle Katarn, wearing a special Cortosis suit. This would not protect him, as Kyle defeated Galak, and his armor exploded, disintegrating him."},{"b":10,"c":"IR_GIDEON","f":"IR","n":"Moff Gideon","v":"Moff Gideon|Moff Gideon (Dark Trooper)","p":"moff gideon","e":"GE","t":"named canon era_new_republic male non_sensitive","w":"Moff of the Galactic Empire who led his own Imperial Remnant (GE) in The Mandalorian.","bio":"Gideon was a Human male Moff in the Galactic Empire and leader of his own Imperial Remnant in the years following the end of the Galactic Civil War. Taking an interest in the young force sensitive, Grogu, Gideon hired bounty hunter Din Djarin, who took the contract and broke it, Gideon used all resources at his disposal to track down the child. Capturing the youth on Tython, Gideon performed his experiment before a strike team lead by Djarin boarded his vessel. After engaging Djarin in a duel, Gideon was defeated and lost the Darksaber to Djarin, causing complications betwene himself and Bo-Katan Kryze, who wanted the Darksaber for herself."},{"b":10,"c":"IR_GORC","f":"IR","n":"Gorc","v":"Gorc","p":"gorc","e":"SO","t":"named legends era_new_republic dark_jedi male","w":"Gamorrean Dark Jedi who served Jerec (SO as Dark Jedi).","bio":"Gorc was a mutated Gamorrean male Dark Jedi who served under Jerec during his quest to locate the Valley of the Jedi. Mutated by the resulting of Sith Alchemy performed by Palpatine\u0027s machine, the Cronal, Gorc and another test subject, Pic, shared a symbiotic link to each other, and through their connection were dubbed the Brothers of the Sith. After Palpatine\u0027s defeat and Jerec began his quest, Gorc and Pic were stationed aboard the Sulon Star to deactivate the informant droid 8t-88. Confronted by Kyle Katarn, the pair dueled the aspiring Jedi. Gorc was slain in the ensuing battle."},{"b":10,"c":"IR_HAZARDTROOPER","f":"IR","n":"Hazard Trooper","v":"Hazard Trooper","p":"generic","e":"GE","t":"generic legends era_imperial non_sensitive","w":"Specialized Stormtroopers of the Imperial program (GE). Canon status not verified.","bio":"Hazard Troopers were specialized Stormtroopers that wore very heavy armor capable of protecting them against extreme weather conditions as well as complete immunity to ordinary blasterfire. Given the bulky nature of the armor, Stormtroopers selected for the program were forced to undergo surgery to replace all of their major limbs with cybernetics."},{"b":10,"c":"IR_IMP_PRAETORIAN","f":"IR","n":"Praetorian Guard","v":"Praetorian Guard","p":"generic","e":"GE","t":"generic canon era_new_republic non_sensitive","w":"Elite guard of Moff Gideon and the Shadow Council, in The Mandalorian; Empire (GE) membership.","bio":"The Praetorian Guards were the elite guard of Moff Gideon and the Shadow Council. During the Battle for Mandalore, Gideon utilized his group in an effort to stop the united Mandalorians from taking back their homeworld, which resulted in the death of Paz Vizsla. Three of the guards were killed by Din Djarin during his rescue of Grogu. The guards would later inspire the creation of the First Order\u0027s Praetorian Guards, whose purpose was to protect Supreme Leader Snoke at all costs."},{"b":10,"c":"IR_JEREC","f":"IR","n":"Jerec","v":"Jerec","p":"jerec","e":"GE SO","t":"named legends era_new_republic dark_jedi male","w":"Former Inquisitorius member (GE) who led Dark Jedi hunting the Valley of the Jedi (SO).","bio":"Jerec was a Miraluka male Dark Jedi who hunted for the Valley of the Jedi at some point after the Battle of Endor. Once a member of the Empire\u0027s Inquisitorious, after Palpatine\u0027s death, Jerec took control of a portion of the Imperial Remnant and led his forces on a hunt for the Valley of the Jedi. Locating the valley through Morgan Katarn\u0027s map and Qu Rahn\u0027s interrogation, Jerec located the Valley and attempted to absorb its power. His efforts however were thwarted by Kyle Katarn, a mercenary-turned-Jedi, who struck his followers down and later himself."},{"b":10,"c":"IR_JORUUS","f":"IR","n":"Joruus C\u0027Baoth","v":"Joruus C\u0027Baoth","p":"joruus c\u0027baoth","e":"GE SO","t":"named legends era_new_republic dark_jedi male","w":"Clone of Jorus C\u0027Baoth, Dark Jedi allied with Thrawn\u0027s Empire (GE) and Sith aspirations (SO).","bio":"Joruus C\u0027Baoth was a Clone of Jedi Master Jorus C\u0027Baoth who was bred at some point prior to the Thrawn Campaign. Discovered on Wayland, Thrawn recruited the crazed Dark Jedi to his cause to destroy the New Republic, utilizing his rare ability of Battle Meditation. However, Joruus had other plans, as he desired to seize control of the Empire himself by luring Luke Skywalker to the dark side of the Force. His plans never came to fruition as Thrawn had him imprisoned in Mount Tantiss, and was later killed by the combined efforts of Luke Skywalker and Mara Jade."},{"b":10,"c":"IR_JUGGERTROOPER","f":"IR","n":"Juggernaut Pilot","v":"Juggernaut Pilot","p":"generic","e":"GE","t":"generic canon era_new_republic non_sensitive","w":"Juggernaut Pilot Stormtroopers of the Imperial Remnant in The Mandalorian (GE).","bio":"Juggernaut Pilots were Stormtroopers who specialized in operating the HCVw A9.2 Juggernaut Transports. During his mission to find Grogu after his capture by Moff Gideon, Din Djarin and former imperial Migs Mayfeld disguised themselves as pilots in order to infiltrate a Remnant base on Morak."},{"b":10,"c":"IR_LUMIYA","f":"IR","n":"Lumiya","v":"Lumiya|Lumiya","p":"lumiya","e":"GE SO","t":"named legends era_new_republic sith female","w":"Former Emperor\u0027s Hand (GE) who proclaimed herself Dark Lord of the Sith (SO).","bio":"Lumiya was a Human Female who proclaimed herself as Dark Lord of the Sith at some point after Emperor Palpatine\u0027s demise. Initially serving the Empire as an Emperor\u0027s Hand, Lumiya swore revenge against Luke Skywalker after the Battle of Endor. While at odds with Luke, Lumiya eventually manipulated Jacen Solo to the Dark Side of the Force and slowly built herself a fleet to strike at the New Republic. After Jacen Solo\u0027s corruption to the dark side, Lumiya faced Luke and accepted her defeat and death."},{"b":10,"c":"IR_MARK1","f":"IR","n":"Mark I Droid","v":"Mark I Droid","p":"generic","e":"","t":"generic legends era_new_republic non_sensitive","w":"Assault droid walker model used in the Empire Reborn campaign. Model, not a named individual.","bio":"The Mark I Droid Walker was a model of assault droid used by the Imperial Remnant during the Empire Reborn campaign."},{"b":10,"c":"IR_MARK2","f":"IR","n":"Mark II Droid","v":"Mark II Droid","p":"generic","e":"","t":"generic legends era_new_republic non_sensitive","w":"Small security droid model used aboard the Doomgiver. Model, not a named individual.","bio":"Mark II Droids were small droids used by Galak Fyyar aboard his ship, the Doomgiver to provide an additional layer of security."},{"b":10,"c":"IR_MARK3","f":"IR","n":"Mark III Droid","v":"Mark III Droid","p":"generic","e":"","t":"generic legends era_new_republic non_sensitive","w":"Prototype droid model conceptualized by Galak Fyyar, never mass-produced.","bio":"Mark III Droids were a prototype droid initially conceptualized by Galak Fyyar for the Imperial Remnant. However, the droid was never mass-produced."},{"b":10,"c":"IR_MAW","f":"IR","n":"Maw","v":"Maw","p":"maw","e":"SO","t":"named legends era_new_republic dark_jedi male","w":"Boltrunian Dark Jedi who served Jerec (SO as Dark Jedi).","bio":"Maw was a Boltrunian male Dark Jedi who served under Jerec during his hunt for the Valley of the Jedi. After Qu Rahn\u0027s capture by Jerec, Rahn made one last stand against the Dark Jedi and attacked, bisecting Maw at the waist. Though learning to overcome his disability, Maw\u0027s skill in combat would not be put to the test until engaging in a duel against Kyle Katarn. Katarn easily bested Maw, and Maw caused Katarn to strike him down in anger as he taunted Katarn about his father\u0027s death."},{"b":10,"c":"IR_NILES","f":"IR","n":"Niles Ferrier","v":"Niles Ferrier","p":"niles ferrier","e":"CRIM","t":"named canon era_new_republic male non_sensitive","w":"[corrigé] Ship thief and spy working for Grand Admiral Thrawn (GE). Not a Thrawn officer, so only GE proposed. Wookieepedia mirror via search.","bio":"Niles Ferrier was a Human male ship thief who worked as a spy for Grand Admiral Thrawn during the Thrawn Crisis. After learning of a job from Thrawn who claimed he would pay well for any warships delivered to him, Niles took up the offer, stealing three ships from the Cavrilhu Pirates. Niles continued to work with Thrawn, delivering him Captain Hoffner, who knew where the Katana Fleet, a fleet consisting of two hundred Republic-era heavy cruisers, was located. After attempting to destroy the Smuggler\u0027s Alliace by framing Talon Karrde for the initial Imperial attack, Niles\u0027s attempt failed miserably, and while attempting to escape in his personal ship was shot down and killed."},{"b":10,"c":"IR_PIC","f":"IR","n":"Pic","v":"Pic","p":"pic","e":"SO","t":"named legends era_new_republic dark_jedi male","w":"Kowakian Dark Jedi, Brother of the Sith with Gorc, who served Jerec (SO).","bio":"Picaroon C. Boodle, later known as Pic, was a mutated Kowakian Monkey-Lizard male who served under Jerec during his quest to locate the Valley of the Jedi. Mutated by the resulting of Sith Alchemy performed by Palpatine\u0027s machine, the Cronal, Pic and another test subject, Gorc, shared a symbiotic link to each other, and through their connection were dubbed the Brothers of the Sith. After Palpatine\u0027s defeat and Jerec began his quest, Gorc and Pic were stationed aboard the Sulon Star to deactivate the informant droid 8t-88. Confronted by Kyle Katarn, the pair dueled the aspiring Jedi. Pic was slain in the ensuing battle."},{"b":10,"c":"IR_RAPTOR","f":"IR","n":"Raptor Trooper","v":"Raptor Trooper","p":"generic","e":"GE","t":"generic legends era_new_republic non_sensitive","w":"Elite military unit of Warlord Zsinj, an Imperial warlord (GE).","bio":"The Raptors were the elite military unit formed by Warlord Zsinj during Zsinj\u0027s brief conquest of the galaxy in the years following the Battle of Endor. Trained and conditioned to be loyal to Zsinj, the Raptors were the only ones that Zsinj ever trusted."},{"b":10,"c":"IR_RAX","f":"IR","n":"Rax Joris","v":"Rax Joris","p":"rax joris","e":"GE SO","t":"named legends era_new_republic male non_sensitive","w":"Imperial Army officer serving the Disciples of Ragnos under Tavion (GE, SO). Voiced in Jedi Academy per archivum.wiki.","bio":"Rax Joris was a Human male Imperial Army officer that served the Disciples of Ragnos under Tavion Axmis. After the Battle of Endor, Rax created a prison complex on the planet Dosunn where occasionaly, when boredom struck, would release his prisoners and hunt them across his facility. When Jaden Korr arrived on the planet, Rax captured the Jedi and, like his prisoners, set him free. However, his plan backfired, as Jaden confronted Rax in the hangar where his ship was parked, and after a vicious firefight, killed Rax."},{"b":10,"c":"IR_REBORN","f":"IR","n":"Reborn","v":"Reborn|Reborn Acrobat|Reborn Force User|Reborn Fencer|Reborn Boss|Reborn Elite","p":"generic","e":"SO","t":"generic legends era_new_republic dark_jedi","w":"Dark Jedi ground troops of Desann who served the Disciples of Ragnos (SO as Dark Jedi).","bio":"Reborn were the primary Dark Jedi ground troops led by Desann during his campaign to destroy the Yavin IV Jedi Academy. After Desann learned where the Valley of the Jedi was located, Desann had his minions absorb the Valley\u0027s power, combined with the Artusian Crystals, Desann\u0027s reborn had command of the Force itself. After Desann was defeated, many Reborn were imprisoned, others escaped and later joined the Disciples of Ragnos, led by Desann\u0027s apprentice, Tavion."},{"b":11,"c":"IR_REBORN_MASTER","f":"IR","n":"Reborn Master","v":"Reborn Master","p":"generic","e":"SO","t":"generic legends era_new_republic dark_jedi","w":"Reborn fought as Disciples of Ragnos (Sith revival cult, SO) under Tavion; no other faction.","bio":"Of the Reborn that joined with Tavion Axmis, few earned the distinction of being called masters. Some masters, like Vil and Dasariah Kothos, opted to specialize in solely using the dark side, whereas others would use their lightsabers in combat, able to compete against many Jedi Knights."},{"b":11,"c":"IR_REBORN_NEW","f":"IR","n":"Reborn Cultist","v":"Reborn Cultist","p":"generic","e":"SO","t":"generic legends era_new_republic dark_jedi","w":"Reborn cultists followed Tavion and the Disciples of Ragnos (SO) in the attempt to revive Marka Ragnos.","bio":"Many Reborn found themselves joining with Tavion Axmis and the Disciples of Ragnos in an effort to resurrect Marka Ragnos. With the power of the Valley of the Jedi within them, the Reborn became more prominent as Tavion\u0027s campaign came to a conclusion, utilizing more deadly attacks and force powers than their cultist cousins."},{"b":11,"c":"IR_SABOTEUR","f":"IR","n":"Saboteur","v":"Saboteur","p":"generic","e":"SO","t":"generic legends era_new_republic non_sensitive","w":"Disciples of Ragnos troops (SO); not Force users, so no force tag. Media not verified.","bio":"Saboteurs were a type of soldier used by the Disciples of Ragnos. Equipped with tough armor and personal cloaking generators, Saboteurs lay in wait for their enemies to approach, ambushing them when the time was right."},{"b":11,"c":"IR_SARISS","f":"IR","n":"Sariss","v":"Sariss","p":"sariss","e":"","t":"named legends era_new_republic dark_jedi female","w":"Dark Jedi serving Jerec; Jerec\u0027s group has no code in the list, so no extra faction.","bio":"Sariss was a Human female Dark Jedi who served under Jerec during his hunt for the Valley of the Jedi. Regarded as the most deadly out of those who followed Jerec, Sariss served him faithfully, including overseeing the extraction of the map to the Valley of the Jedi from Morgan Katarn\u0027s old home. When Kyle Katarn resisted the dark side, Sariss attempted to carry out Katarn\u0027s execution, but was thwarted by Yun. Using Yun\u0027s lightsaber, Kyle engaged Sariss in a vicious duel, of which he emerged triumphant, striking her down."},{"b":11,"c":"IR_SHADOWSPAWN","f":"IR","n":"Lord Shadowspawn","v":"Lord Shadowspawn","p":"cronal","e":"GE","t":"named legends era_imperial sith male","w":"Prophet of the Dark Side and Director of Imperial Intelligence for the Empire (GE); later Warlord of the IR. Media not verified (no search run).","bio":"Lord Shadowspawn, otherwise known as Cronal, was a Human male who formerly served as a Prophet of the Dark Side for the Galactic Empre later-turned Warlord during the Galactic Civil War. Gifted with Darksight, a form of future manipulation, he served as an Emperor’s Hand and later as Director of Imperial Intelligence, operating almost entirely through holograms and proxies while his real body withered under the strain of dark-side corruption. As Blackhole, he created Sithspawn monstrosities, manipulated Imperial politics, and engineered elaborate schemes involving Luke Skywalker, whom he viewed as both a threat and a potential vessel for his own consciousness. After the fall of the Empire, Cronal resurfaced as Lord Shadowspawn, leading a brutal splinter faction from his base on Mindor. Using mind-controlled pawns and shadow stormtroopers, he waged a devastating campaign against the New Republic, culminating in the Battle of Mindor, where Luke Skywalker ultimately defeated him. Though Cronal briefly survived through dark side and technological means, his mind and body were shattered, and his later years were spent in fragmented attempts at alchemical art rather than coherent conquest."},{"b":11,"c":"IR_SHADOWTROOPER","f":"IR","n":"Shadowtrooper","v":"Shadowtrooper","p":"generic","e":"","t":"generic legends era_new_republic dark_jedi","w":"Desann\u0027s Dark Jedi troops; no extra faction.","bio":"Shadowtroopers were Dark Jedi that served Desann in his mission to destroy the Jedi Academy on Yavin IV. Similar to Reborn, Shadowtroopers were infused with the power of the Force by the Valley of the Jedi. Equipped with a special armor made from Cortosis, Shadowtroopers were tough to defeat in Lightsaber combat. Many shadowtroopers were slain by Kyle Katarn and other Jedi, but with more effort than their Reborn cousins."},{"b":11,"c":"IR_TAVION","f":"IR","n":"Tavion Axmis","v":"Tavion Axmis|Tavion Axmis (Cult Leader)|Tavion Axmis (Possessed)","p":"tavion axmis","e":"SO","t":"named legends era_new_republic dark_jedi female","w":"Led the Disciples of Ragnos (SO) and was Desann\u0027s apprentice.","bio":"Tavion Axmis was a Human female Dark Jedi who led the Disciples of Ragnos. As Desann\u0027s apprentice, Tavion assisted her master in finding the Valley of the Jedi. After facing Katarn in a duel on Cloud City, defeated and terrified of dying, Tavion revealed to Kyle that Jan was alive, prompting him to spare her life. After Desann was killed, Tavion became obsessed with resurrecting Marka Ragnos, an ancient Sith Lord. On Korriban, Tavion attempted to resurrect the Sith, but was killed by Jaden Korr, Kyle\u0027s apprentice, after Marka Ragnos possessed her."},{"b":11,"c":"IR_WEIR","f":"IR","n":"General Weir","v":"General Weir","p":"weir","e":"GE","t":"named legends era_imperial male non_sensitive","w":"Imperial general during the Galactic Civil War (GE), before his post-Endor warlord campaign. Media not verified (no search run).","bio":"Weir was a Human male who served as a general in the Galactic Empire during the Galactic Civil War. Following the Battle of Endor and Palpatine\u0027s demise, Weir launched a small campaign using his forces from his Imperial Outpost on Tralus, threatening Coronet City and capturing and torturing to death Ten Numb. Weir was captured by Wedge Antilles and was later imprisoned for his crimes."},{"b":11,"c":"IR_WORKER","f":"IR","n":"Imperial Worker","v":"Imperial Worker","p":"generic","e":"GE","t":"generic legends era_imperial non_sensitive","w":"Imperial engineer corps (GE).","bio":"Imperial Workers were an engineer corps used by the Galactic Empire that wore hazardous environment suits as the conditions they had to work in were often dangerous."},{"b":11,"c":"IR_X1_EMPIRE","f":"IR","n":"X1","v":"X1|X1 (Imperial Commando)","p":"x1","e":"GE","t":"named legends era_imperial sith male","w":"Clone of Falon Grey who served the Empire (GE) until proclaiming himself a Sith Lord. Media not verified (no search run).","bio":"X1 was a clone of Jedi Knight Falon Grey who served the Republic during the Clone Wars and later the Empire in the Galactic Civil War. A force sensitive clone, X1 and X2 fought in the Clone Wars and later served the Empire in the early years of its rule. After being dispatched to Dantooine to hunt down Falon Grey, X2 defected, with X1 remaining with the Empire. After Palpatine\u0027s death, X1 proclaimed himself a Sith Lord and attempted to raise up a clone army. His efforts were thwarted by X2, who bested him in combat, and accidentally killed himself with his own lightsaber."},{"b":11,"c":"IR_YUN","f":"IR","n":"Yun","v":"Yun","p":"yun","e":"","t":"named legends era_new_republic dark_jedi male","w":"Jerec\u0027s Dark Jedi; no extra faction.","bio":"Yun was an Epicanthix male Dark Jedi who served under Jerec during his hunt for the Valley of the Jedi. As the newest addition to Jerec\u0027s cause, Yun felt eager to prove himself to Jerec. Having never seen a Jedi prior to Kyle Katarn, Yun eagerly engaged Katarn within Barons Hed Palace. However, he was defeated but spared by Kyle. As thoughts of doubt ran through his mind, he made the ultimate sacrifice by blocking Sariss\u0027s blow against Katarn, sacrificing himself in the process. Katarn would go on to use Yun\u0027s lightsaber during the remainder of his quest."},{"b":11,"c":"IR_ZSINJ","f":"IR","n":"Warlord Zsinj","v":"Warlord Zsinj","p":"zsinj","e":"GE","t":"named legends era_new_republic male non_sensitive","w":"Former Imperial admiral (GE) who became a warlord after Endor.","bio":"Zsinj was a Human male who served as an Admiral of the Galactic Empire and later Warlord of his own Empire in the years following the Battle of Endor. After the formation of the New Republic, Zsinj, alongside multiple other high-ranking imperials, went rogue and attempted to form his own Empire, making enemies of both the New Republic and the Imperial Remnant. Zsinj was regarded as the most successful of the warlords of his time due to his control of a third of the known galaxy. Ultimately, during the hunt for Zsinj over Dathomir, Zsinj was ultimately defeated and killed by Han Solo and the Millenium Falcon."},{"b":11,"c":"JO_CAL","f":"JO","n":"Cal Kestis","v":"Cal Kestis|Cal Kestis (Scrapper)|Cal Kestis (Inquisitor)","p":"cal kestis","e":"REB","t":"named canon era_imperial jedi male","w":"[corrigé] Jedi Knight of the JO line; no significant extra faction (Inquisitor and Scrapper variants are disguises or past jobs).","bio":"Cal Kestis was a Human male Jedi Knight who was a part of the Jedi Order until its eventual collapse. Traumatized by his master\u0027s death, Cal found work as a scrapper on the planet Bracca for five years. After revealing his force abilities accidentally to a probe droid to save his friend Prauf. After being marked by the Empire, Kestis was rescue by Cere Junda and Greez Dritus. The group began a mission to locate a holocron containing a list of Force Sensitive children. Travelling across the galaxy, Cal relearned his lost force abilities and was able to recover the Holocron, and in an effort to protect the lives of the children, destroyed the Holocron. Five years later, Cal worked once again with Cere Junda and the Hidden Path to locate a way to a long-forgotten planet Tanalorr. Though successful in locating the compass to the planet, all of his efforts seemed to be in vain as the Hidden Path and Cere Junda were all slain after the former Jedi and Imperial spy Bode Akuna informed the Empire of the organization\u0027s location."},{"b":11,"c":"JO_jedi_youngling","f":"JO","n":"Jedi Youngling","v":"Jedi Youngling (Male)|Jedi Youngling (Female)|Jedi Youngling (Togruta)|Jedi Youngling (Alien Species 1)|Jedi Youngling (Alien Species 2)|Jedi Youngling (Random)","p":"generic","e":"","t":"generic canon era_prequel jedi","w":"Generic Jedi younglings; no extra faction.","bio":"Jedi younglings, also known as Jedi initiates, were Force-sensitive children who were trained in the ways of the Jedi. Prior to beginning training as Padawan leaders, younglings would undergo a series of tests known as the Initiate Trials, as well as The Gathering, when they would create their own Lightsabers after retrieving their crystals from the planet Ilum."},{"b":11,"c":"JO_KAZDAN","f":"JO","n":"Kazdan Paratus","v":"Kazdan Paratus","p":"kazdan paratus","e":"","t":"named legends era_imperial jedi male","w":"Aleena Jedi Master who went insane on Raxus Prime; no extra faction.","bio":"Kazdan Paratus was an Aleena male Jedi Master who took refuge on Raxus Prime after the rise of the Empire. During the knight of the Siege of the Jedi Temple, Kazdan fled the temple in terror and eventually found his way on Raxus Prime. Overcome with grief from his actions, Kazdan attempted to reconstruct the order using scrap, eventually succeeding in creating a replica of the Jedi Temple on Raxus Prime\u0027s surface. Utilizing his own army of droids controlled by the Force, Kazdan obsessively defended his temple from intruders, including Drexl Roosh\u0027s scrappers. Discovered by Darth Vader, he dispatched his secret apprentice, Galen Marek, to eradicate the insane Jedi. Confronting Paratus within his replica Council chamber, Starkiller and Paratus engaged in a vicious duel, with Paratus using the replicas of the former Jedi Council in an effort to overwhelm the apprentice, which were easily dispatced which caused Kazdan even more anguish. Ultimately, Kazdan was killed by Starkiller, and as he lay dying, apologized to the Council for failing them again."},{"b":11,"c":"JO_KENTO","f":"JO","n":"Kento Marek","v":"Kento Marek","p":"kento marek","e":"","t":"named legends era_imperial fallen_jedi male","w":"Left the Jedi Order to live with Mallie on Kashyyyk; no extra faction.","bio":"Kento Marek was a Human male Jedi Knight who resided on Kashyyyk during the final years of the Galactic Republic and shortly after the rise of the Empire. During the Clone Wars, Kento became acquainted with another Jedi named Mallie. Their relationship eventually culminated into love, with the two eventually leaving the Jedi Order and settling on Kashyyyk where they had a son, Galen Marek. Around a year after the Empire\u0027s formation, Darth Vader was dispatched to Kashyyyk to hunt down and execute Kento. After hiding his son, Kento engaged Vader in a brutal duel with Vader as the victor. At Vader\u0027s mercy, Vader inquired as to who the other presence nearby was, which Kento attempted to dismiss until Galen revealed himself, pulling Vader\u0027s saber out of his hand. After noticing Galen, Vader crushed Kento\u0027s neck with the Force, killing him, and taking Galen with him to be trained as his apprentice. Kento would later appear to Galen on Kashyyyk and the Jedi Temple, expressing regret for his fate. At some point before his death, Kento recorded a message to Galen within the Jedi Temple\u0027s Great Holocron, which led Galen to take his own Jedi Trial."},{"b":11,"c":"JO_SWTOR_Jedi","f":"JO","n":"Old Republic Jedi","v":"Old Republic Jedi","p":"generic","e":"TOR","t":"generic legends era_old_republic jedi","w":"Jedi serving the Old Republic (TOR).","bio":"Jedi were a group of Force sensitives that practiced the Light Side of the Force and acted as peacekeepers for the Republic for thousands of years. Despite their command over the Force, the Jedi refused to take direct control of any situation, electing to only intervene when absolutely necessary. This drew controversy from the Republic\u0027s citizens, as the Jedi would take commanding roles during wartime, despite their supposed pacifism."},{"b":11,"c":"JO_TYTHON_DROID","f":"JO","n":"Tythonian War Droid","v":"Tythonian War Droid","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Jedi-built training and war droid on Tython; no extra faction.","bio":"The Tythonian War Droid was a type of droid designed by the earliest members of the Jedi Order who settled on Tython. By the time the Jedi Order resettled on Tython during the Cold War, the Droids were often found in the Ruins of Kaleth, attacking any intruder who dared to venture into the area, including Jedi. Droids of a similar design were often used by the Jedi Order as training droids, honing the skills of any Jedi who wished to test themselves."},{"b":11,"c":"MANDO_ARMORER","f":"MANDO","n":"The Armorer","v":"The Armorer","p":"the armorer","e":"","t":"named canon era_new_republic female non_sensitive","w":"Armorer of the Children of the Watch; no extra faction.","bio":"The Armorer was a female Mandalorian who forged and maintained weapons and armor for the Children of the Watch.  After the Empire\u0027s purge of Mandalore, she lived among a small tribe of her people living in hiding on Nevarro.  After the covert was attacked, The Armorer gathered the armor from the fallen and began the long and painful journey to salvage it and try to form a new covert elsewhere.  With the help of Paz Vizsla she succeeded, re-settling on the Glavis Ringworld, eventually working with Bo-Katan Kryze and Din Djarin to retake Mandalore itself."},{"b":11,"c":"MANDO_BO_KATAN","f":"MANDO","n":"Bo-Katan Kryze","v":"Bo-Katan Kryze|Bo-Katan Kryze","p":"bo-katan kryze","e":"DW","t":"named canon era_prequel era_imperial era_new_republic female non_sensitive","w":"Member of Death Watch (DW) during the Clone Wars and Civil War; later Mandalore.","bio":"Bo-Katan Kryze was a Human female Mandalorian and member of Death Watch during the Clone Wars and Galactic Civil War. The sister of Satine Kryze, Bo-Katan joined Death Watch, infuriated with her sister\u0027s approach to Mandalorian culture. After Pre Vizsla was killed by Maul, Bo-Katan and other members of Death Watch left the movement behind, fighting against Maul and the Shadow Collective. During the Galactic Civil War, Sabine Wren presented Bo-Katan with the Darksaber, which she accepted, taking the role of Mandalore. However, by the time of the New Republic, Bo-Katan lost the Darksaber to Moff Gideon, and swore revenge against him. Working with Din Djarin and the Children of the Watch, Bo-Katan reclaimed the Darksaber and helped lead the Children of the Watch and her band of Mandalorians to retake Mandalore when it was thought to be lost forever."},{"b":11,"c":"MANDO_DIN","f":"MANDO","n":"Din Djarin","v":"Din Djarin|Din Djarin (Pre-Beskar)","p":"din djarin","e":"BH","t":"named canon era_new_republic male non_sensitive","w":"Worked as a bounty hunter (BH) before taking up the Child.","bio":"Din Djarin was a Human Male Mandalorian who worked as a Bounty Hunter during the early years of the New Republic. Hired by a mysterious client, Djarin was sent to retrieve an asset which turned out to be a child of a strange species. After turning in his bounty, Djarin had a change of heart and took it upon himself to protect the child. While in hiding, Djarin eventually found himself at odds with Moff Gideon, who desired the child for his own purposes. Tasked by the Armorer, Djarin was bound to the child as a clan of two, and was to return him to the Jedi. After a long journey, Djarin entrusted Grogu in the care of Luke Skywalker."},{"b":11,"c":"MANDO_FENN","f":"MANDO","n":"Fenn Rau","v":"Fenn Rau","p":"fenn rau","e":"GE REB","t":"named canon era_imperial male non_sensitive","w":"Served the Empire as Protector of Concord Dawn (GE), then joined the Rebels (REB).","bio":"Fenn Rau was a Human Male Mandalorian who served as Protector of Concord Dawn in the years prior to the Galactic Civil War. Loyal to Mandalore and its people, Fenn Rau aligned himself with the Empire to ensure his people\u0027s protection. However, the Rebels of Phoenix Squadron, were able to capture him and gained access to Concord Dawn\u0027s hyperlane. With the remaining protectors killed by the Empre, Fenn Rau aligned himself with the fledgling Rebel Alliance and helped assist them in the Battle of Atollon. With the Darksaber recovered, Fenn Rau would later pledge allegiance to Bo Katan as the Darksaber came into her possession."},{"b":11,"c":"MANDO_HEAVY","f":"MANDO","n":"Heavy Mandalorian","v":"Heavy Mandalorian","p":"generic","e":"","t":"generic legends era_old_republic non_sensitive","w":"Generic Mandalorian heavy; no extra faction.","bio":"Mandalorians were a culture of elite, highly trained warriors spanning all throughout galactic history. The Mandalorian culture revolved around seeking honor and glory through war and other conflicts. Many Mandalorians took up mercenary work, often working as bounty hunters which often caused their clients to pay a high price. While the Mandalorians were often split into multiple clans, at times fighting each other, the Mandalorian\u0027s sole ruler was known as Mandalore."},{"b":11,"c":"MANDO_INDOMITABLE","f":"MANDO","n":"Mandalore the Indomitable","v":"Mandalore the Indomitable","p":"mandalore the indomitable","e":"","t":"named legends era_ancient male non_sensitive","w":"Taung Mandalore during the Great Sith War; fought the Krath but no matching code, so no extra faction.","bio":"Mandalore the Indomitable was a Male Taung who led the Mandalorians during the Great Sith War. In the early reign of the Indomitable\u0027s reign, the Mandalorians conducted a series of campaigns against several worlds. However, the Indomitable soon began searching for worthy enemies against which to wage war. Sometime later the Indomitable heard of Ulic Qel-Droma\u0027s Krth cult and their exploits. Seeing an opportunity to strike at what he believed to be an overstretched but formidable foe, the Indomitable led his forces in a series of attacks against the Krath. After the Mandalorians destroyed a carbonite smelting plant over one of the planets in the Empress Teta System, Ulic Qel-Droma challenged the Indomitable to a duel with the condition that the Indomitable and the Mandalorians would swear fealty to him if he was victorious. The Indomitable accepted and the two leaders fought on the planet Kuar in a fierce battle in which the Indomitable was ultimately defeated. As a result, the Mandalorians and even the Indomitable himself were bound to follow Qel-Droma and his Sith Master, Exar Kun. In a massive attack against the Galactic Republic, Qel-Droma brought his forces, including the Mandalorians, to bear against the Republic shipyards above the planet Foerost. Due to the Indomitable\u0027s leadership and the strength of the Mandalorians, the Republic forces stationed there were quickly overwhelmed and Qel-Droma gained the command of the entire fleet of ships docked there. After his victory, Qel-Droma contacted Kun and presented the option of invading Coruscant directly. Kun was initially against the idea, telling Qel-Droma to wait for additional reinforcements, but the Indomitable convinced the Sith Lord that an immediate attack was viable. With Kun\u0027s permission, Qel-Droma and his forces moved to invade Coruscant while the Repulic was busy chasing a false lead they had planted that pointed towards the planet Kemplex Nine. The combined forces of Qel-Droma\
